# Migrated from tests/string_slice_static_ascii.rs -- all 7 #[test]
# functions, as 10 case blocks:
#
#   - `run`, `json_check`, `json_browser_bundle_tsx`: 1:1 with their source
#     tests.
#   - `browser_bundle_js`/`ts`/`jsx`/`tsx`: sibling [[case]] blocks (not a
#     [matrix] axis -- see repeat_static_ascii.toml's header) for
#     `browser_bundle_accepts_..._across_source_classes`'s 4-extension loop.
#   - `check_gates_dynamic_bound`/`non_ascii_receiver`/`non_finite_bound`:
#     the 3 E5506 fail-closed gate tests, 1:1 with their source tests. Each
#     also asserts `errors[0]["message"].contains("String.prototype.slice")`;
#     since `json` is exact-match only, each asserts the full exact message
#     text (obtained by running the built `kali` binary) -- see
#     case_static_ascii.toml's header for why that is not a weakening.
#
# [source] uses one "main.<ext>" file per extension, shared by every case
# that needs that extension, plus one distinct file per gate case.

[source]
"main.js" = '''
console.log("hello".slice());
console.log("hello".slice(1));
console.log("hello".slice(1, 4));
console.log("hello".slice(1.5, 4.9));
console.log("hello".slice(-4, -1));
console.log("hello".slice(4, 1));
console.log(Object.freeze("hello").slice(Object.freeze(1.5), 4.9));
'''
"main.ts" = '''
console.log("hello".slice());
console.log("hello".slice(1));
console.log("hello".slice(1, 4));
console.log("hello".slice(1.5, 4.9));
console.log("hello".slice(-4, -1));
console.log("hello".slice(4, 1));
console.log(Object.freeze("hello").slice(Object.freeze(1.5), 4.9));
'''
"main.jsx" = '''
console.log("hello".slice());
console.log("hello".slice(1));
console.log("hello".slice(1, 4));
console.log("hello".slice(1.5, 4.9));
console.log("hello".slice(-4, -1));
console.log("hello".slice(4, 1));
console.log(Object.freeze("hello").slice(Object.freeze(1.5), 4.9));
'''
"main.tsx" = '''
console.log("hello".slice());
console.log("hello".slice(1));
console.log("hello".slice(1, 4));
console.log("hello".slice(1.5, 4.9));
console.log("hello".slice(-4, -1));
console.log("hello".slice(4, 1));
console.log(Object.freeze("hello").slice(Object.freeze(1.5), 4.9));
'''
"dynamic_bound.js" = "function cut(start) { return 'hello'.slice(start); }\n"
"non_ascii_receiver.js" = "console.log('héllo'.slice(1));\n"
"non_finite_bound.js" = "console.log('hello'.slice(1 / 0));\n"

[[case]]
name = "run"
rationale = "`.slice()` on a static ASCII literal folds at compile time, including fractional (truncated), negative, and out-of-order bounds, and a frozen receiver."
args = ["run", "main.js"]
exit = "success"
stdout = "hello\nello\nell\nell\nell\n\nell\n"

[[case]]
name = "json_check"
rationale = "Same fold, asserting the JSON output envelope from `check` rather than `run`'s stdout."
args = ["--output", "json", "check", "main.ts"]
exit = "success"
json.schemaVersion = 1
json.command = "check"
json.success = true
json.errors = []

[[case]]
name = "browser_bundle_js"
rationale = "The static-ASCII slice fold holds across every supported source class, not just plain JS -- js source."
args = ["build", "--api", "browser", "--bundle", "main.js"]
exit = "success"

[[case]]
name = "browser_bundle_ts"
rationale = "The static-ASCII slice fold holds across every supported source class, not just plain JS -- ts source."
args = ["build", "--api", "browser", "--bundle", "main.ts"]
exit = "success"

[[case]]
name = "browser_bundle_jsx"
rationale = "The static-ASCII slice fold holds across every supported source class, not just plain JS -- jsx source."
args = ["build", "--api", "browser", "--bundle", "main.jsx"]
exit = "success"

[[case]]
name = "browser_bundle_tsx"
rationale = "The static-ASCII slice fold holds across every supported source class, not just plain JS -- tsx source."
args = ["build", "--api", "browser", "--bundle", "main.tsx"]
exit = "success"

[[case]]
name = "json_browser_bundle_tsx"
rationale = "Same tsx browser bundle, asserting the JSON output envelope rather than a bare success exit."
args = ["--output", "json", "build", "--api", "browser", "--bundle", "main.tsx"]
exit = "success"
json.schemaVersion = 1
json.command = "build"
json.success = true
json.errors = []

[[case]]
name = "check_gates_dynamic_string_slice_bound"
rationale = "`.slice()` only folds for statically-known bounds; a dynamic start bound must fail closed with E5506."
args = ["--output", "json", "check", "dynamic_bound.js"]
exit = "failure"
json.success = false
json.errors.0.code = "E5506"
json.errors.0.message = "String.prototype.slice is unavailable unless the receiver is a statically-known ASCII string literal and the start/end bounds are statically-known finite numeric literals in the current direct-runtime path; use explicit ASCII literals or the later compatibility path"

[[case]]
name = "check_gates_non_ascii_static_string_slice_receiver"
rationale = "The static-fold path requires an ASCII string literal receiver; a non-ASCII receiver ('héllo') must fail closed with E5506."
args = ["--output", "json", "check", "non_ascii_receiver.js"]
exit = "failure"
json.success = false
json.errors.0.code = "E5506"
json.errors.0.message = "String.prototype.slice is unavailable unless the receiver is a statically-known ASCII string literal and the start/end bounds are statically-known finite numeric literals in the current direct-runtime path; use explicit ASCII literals or the later compatibility path"

[[case]]
name = "check_gates_non_finite_string_slice_bound"
rationale = "The static-fold path requires finite numeric bounds; a non-finite bound (1 / 0) must fail closed with E5506."
args = ["--output", "json", "check", "non_finite_bound.js"]
exit = "failure"
json.success = false
json.errors.0.code = "E5506"
json.errors.0.message = "String.prototype.slice is unavailable unless the receiver is a statically-known ASCII string literal and the start/end bounds are statically-known finite numeric literals in the current direct-runtime path; use explicit ASCII literals or the later compatibility path"
