# Migrated from tests/string_split_static_ascii.rs -- all 7 #[test]
# functions, as 10 case blocks:
#
#   - `run`, `json_check`, `json_browser_bundle_tsx`: 1:1 with their source
#     tests.
#   - `browser_bundle_js`/`ts`/`jsx`/`tsx`: sibling [[case]] blocks (not a
#     [matrix] axis -- see repeat_static_ascii.toml's header) for
#     `browser_bundle_accepts_..._across_source_classes`'s 4-extension loop.
#   - `check_gates_dynamic_separator`/`non_ascii_receiver`/`negative_limit`:
#     the 3 E5506 fail-closed gate tests, 1:1 with their source tests. Each
#     also asserts `errors[0]["message"].contains("String.prototype.split")`;
#     since `json` is exact-match only, each asserts the full exact message
#     text (obtained by running the built `kali` binary) -- see
#     case_static_ascii.toml's header for why that is not a weakening.
#
# [source] uses one "main.<ext>" file per extension, shared by every case
# that needs that extension, plus one distinct file per gate case.

[source]
"main.js" = '''
const whole = "abc".split();
console.log(whole.length);
console.log(whole[0]);
const comma = "a,b,c".split(",");
console.log(comma.length);
console.log(comma[1]);
const chars = Object.freeze("abc").split(Object.freeze(""), Object.freeze(2));
console.log(chars.length);
console.log(chars[0]);
'''
"main.ts" = '''
const whole = "abc".split();
console.log(whole.length);
console.log(whole[0]);
const comma = "a,b,c".split(",");
console.log(comma.length);
console.log(comma[1]);
const chars = Object.freeze("abc").split(Object.freeze(""), Object.freeze(2));
console.log(chars.length);
console.log(chars[0]);
'''
"main.jsx" = '''
const whole = "abc".split();
console.log(whole.length);
console.log(whole[0]);
const comma = "a,b,c".split(",");
console.log(comma.length);
console.log(comma[1]);
const chars = Object.freeze("abc").split(Object.freeze(""), Object.freeze(2));
console.log(chars.length);
console.log(chars[0]);
'''
"main.tsx" = '''
const whole = "abc".split();
console.log(whole.length);
console.log(whole[0]);
const comma = "a,b,c".split(",");
console.log(comma.length);
console.log(comma[1]);
const chars = Object.freeze("abc").split(Object.freeze(""), Object.freeze(2));
console.log(chars.length);
console.log(chars[0]);
'''
"dynamic_separator.js" = "function split(separator) { return 'a,b'.split(separator); }\n"
"non_ascii_receiver.js" = "console.log('á,b'.split(','));\n"
"negative_limit.js" = "console.log('a,b'.split(',', -1));\n"

[[case]]
name = "run"
rationale = "`.split()` on a static ASCII literal folds at compile time, including the no-separator, separator, limit, and frozen-receiver/separator/limit forms, asserting indexed access into the resulting array."
args = ["run", "main.js"]
exit = "success"
stdout = "1\nabc\n3\nb\n2\na\n"

[[case]]
name = "json_check"
rationale = "Same fold, asserting the JSON output envelope from `check` rather than `run`'s stdout."
args = ["--output", "json", "check", "main.ts"]
exit = "success"
json.schemaVersion = 1
json.command = "check"
json.success = true
json.errors = []

[[case]]
name = "browser_bundle_js"
rationale = "The static-ASCII split fold holds across every supported source class, not just plain JS -- js source."
args = ["build", "--api", "browser", "--bundle", "main.js"]
exit = "success"

[[case]]
name = "browser_bundle_ts"
rationale = "The static-ASCII split fold holds across every supported source class, not just plain JS -- ts source."
args = ["build", "--api", "browser", "--bundle", "main.ts"]
exit = "success"

[[case]]
name = "browser_bundle_jsx"
rationale = "The static-ASCII split fold holds across every supported source class, not just plain JS -- jsx source."
args = ["build", "--api", "browser", "--bundle", "main.jsx"]
exit = "success"

[[case]]
name = "browser_bundle_tsx"
rationale = "The static-ASCII split fold holds across every supported source class, not just plain JS -- tsx source."
args = ["build", "--api", "browser", "--bundle", "main.tsx"]
exit = "success"

[[case]]
name = "json_browser_bundle_tsx"
rationale = "Same tsx browser bundle, asserting the JSON output envelope rather than a bare success exit."
args = ["--output", "json", "build", "--api", "browser", "--bundle", "main.tsx"]
exit = "success"
json.schemaVersion = 1
json.command = "build"
json.success = true
json.errors = []

[[case]]
name = "check_gates_dynamic_string_split_separator"
rationale = "`.split()` only folds for a statically-known separator; a dynamic separator must fail closed with E5506."
args = ["--output", "json", "check", "dynamic_separator.js"]
exit = "failure"
json.success = false
json.errors.0.code = "E5506"
json.errors.0.message = "String.prototype.split is unavailable unless the receiver is a statically-known ASCII string literal, the optional separator is a statically-known ASCII string literal, and the optional limit is a statically-known integer from 0 through 1024 in the current direct-runtime path; use explicit ASCII literals or the later compatibility path"

[[case]]
name = "check_gates_non_ascii_static_string_split_receiver"
rationale = "The static-fold path requires an ASCII string literal receiver; a non-ASCII receiver ('á,b') must fail closed with E5506."
args = ["--output", "json", "check", "non_ascii_receiver.js"]
exit = "failure"
json.success = false
json.errors.0.code = "E5506"
json.errors.0.message = "String.prototype.split is unavailable unless the receiver is a statically-known ASCII string literal, the optional separator is a statically-known ASCII string literal, and the optional limit is a statically-known integer from 0 through 1024 in the current direct-runtime path; use explicit ASCII literals or the later compatibility path"

[[case]]
name = "check_gates_string_split_negative_limit"
rationale = "The static-fold path only accepts a limit from 0 through 1024; a negative limit must fail closed with E5506."
args = ["--output", "json", "check", "negative_limit.js"]
exit = "failure"
json.success = false
json.errors.0.code = "E5506"
json.errors.0.message = "String.prototype.split is unavailable unless the receiver is a statically-known ASCII string literal, the optional separator is a statically-known ASCII string literal, and the optional limit is a statically-known integer from 0 through 1024 in the current direct-runtime path; use explicit ASCII literals or the later compatibility path"
