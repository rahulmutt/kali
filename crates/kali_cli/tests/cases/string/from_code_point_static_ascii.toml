"main.tsx" = '''
console.log(String.fromCodePoint());
console.log(Object.freeze(globalThis.String.fromCodePoint)());
console.log(String.fromCodePoint(72, 105));
console.log(globalThis.String.fromCodePoint(79, 75));
console.log(globalThis["String"]["fromCodePoint"](65));
console.log(globalThis["String"]['fromCodePoint'](67));
console.log(Object.freeze(globalThis['String'])["fromCodePoint"](68));
const fromCodePoint = Object.freeze(String.fromCodePoint);
const message = fromCodePoint(66, Object.freeze(121), 101);
console.log(message);
'''
"dynamic_argument.js" = "function make(code) { return String.fromCodePoint(code); }\n"
"non_ascii_argument.js" = "console.log(String.fromCodePoint(233));\n"
"fractional_argument.js" = "console.log(String.fromCodePoint(65.5));\n"

[[case]]
name = "run"
rationale = "`String.fromCodePoint()` on statically-known ASCII code points folds at compile time, including the frozen-function-reference and bracket-access call forms."
args = ["run", "main.js"]
exit = "success"
stdout = "\n\nHi\nOK\nA\nC\nD\nBye\n"

[[case]]
name = "json_check"
rationale = "Same fold, asserting the JSON output envelope from `check` rather than `run`'s stdout."
args = ["--output", "json", "check", "main.ts"]
exit = "success"
json.schemaVersion = 1
json.command = "check"
json.success = true
json.errors = []

[[case]]
name = "browser_bundle_js"
rationale = "The static-ASCII fromCodePoint fold holds across every supported source class, not just plain JS -- js source."
args = ["build", "--api", "browser", "--bundle", "main.js"]
exit = "success"

[[case]]
name = "browser_bundle_ts"
rationale = "The static-ASCII fromCodePoint fold holds across every supported source class, not just plain JS -- ts source."
args = ["build", "--api", "browser", "--bundle", "main.ts"]
exit = "success"

[[case]]
name = "browser_bundle_jsx"
rationale = "The static-ASCII fromCodePoint fold holds across every supported source class, not just plain JS -- jsx source."
args = ["build", "--api", "browser", "--bundle", "main.jsx"]
exit = "success"

[[case]]
name = "browser_bundle_tsx"
rationale = "The static-ASCII fromCodePoint fold holds across every supported source class, not just plain JS -- tsx source."
args = ["build", "--api", "browser", "--bundle", "main.tsx"]
exit = "success"

[[case]]
name = "json_browser_bundle_tsx"
rationale = "Same tsx browser bundle, asserting the JSON output envelope rather than a bare success exit."
args = ["--output", "json", "build", "--api", "browser", "--bundle", "main.tsx"]
exit = "success"
json.schemaVersion = 1
json.command = "build"
json.success = true
json.errors = []

[[case]]
name = "check_gates_string_from_code_point_dynamic_argument"
rationale = "`String.fromCodePoint()` only folds for statically-known arguments; a dynamic argument must fail closed with E5506."
args = ["--output", "json", "check", "dynamic_argument.js"]
exit = "failure"
json.success = false
json.errors.0.code = "E5506"
json.errors.0.message = "String.fromCodePoint is unavailable unless every argument is a statically-known ASCII integer code unit from 0 through 127 in the current direct-runtime path; use explicit ASCII integer literals or the later compatibility path"

[[case]]
name = "check_gates_string_from_code_point_non_ascii_argument"
rationale = "The static-fold path requires every argument to be an ASCII code point; a non-ASCII code point (233) must fail closed with E5506."
args = ["--output", "json", "check", "non_ascii_argument.js"]
exit = "failure"
json.success = false
json.errors.0.code = "E5506"
json.errors.0.message = "String.fromCodePoint is unavailable unless every argument is a statically-known ASCII integer code unit from 0 through 127 in the current direct-runtime path; use explicit ASCII integer literals or the later compatibility path"

[[case]]
name = "check_gates_string_from_code_point_fractional_argument"
rationale = "The static-fold path requires an integer argument; a fractional code point (65.5) must fail closed with E5506."
args = ["--output", "json", "check", "fractional_argument.js"]
exit = "failure"
json.success = false
json.errors.0.code = "E5506"
json.errors.0.message = "String.fromCodePoint is unavailable unless every argument is a statically-known ASCII integer code unit from 0 through 127 in the current direct-runtime path; use explicit ASCII integer literals or the later compatibility path"
