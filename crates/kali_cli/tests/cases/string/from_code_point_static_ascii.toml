# Migrated from tests/string_from_code_point_static_ascii.rs -- all 7
# #[test] functions, as 10 case blocks:
#
#   - `run`, `json_check`, `json_browser_bundle_tsx`: 1:1 with their source
#     tests.
#   - `browser_bundle_js`/`ts`/`jsx`/`tsx`: sibling [[case]] blocks (not a
#     [matrix] axis -- see repeat_static_ascii.toml's header) for
#     `browser_bundle_accepts_..._across_source_classes`'s 4-extension loop.
#   - `check_gates_dynamic_argument`/`non_ascii_argument`/
#     `fractional_argument`: the 3 E5506 fail-closed gate tests, 1:1 with
#     their source tests. Each also asserts
#     `errors[0]["message"].contains("String.fromCodePoint")`; since `json`
#     is exact-match only, each asserts the full exact message text
#     (obtained by running the built `kali` binary) -- see
#     case_static_ascii.toml's header for why that is not a weakening.
#
# [source] uses one "main.<ext>" file per extension, shared by every case
# that needs that extension, plus one distinct file per gate case.

[source]
"main.js" = '''
console.log(String.fromCodePoint());
console.log(Object.freeze(globalThis.String.fromCodePoint)());
console.log(String.fromCodePoint(72, 105));
console.log(globalThis.String.fromCodePoint(79, 75));
console.log(globalThis["String"]["fromCodePoint"](65));
console.log(globalThis["String"]['fromCodePoint'](67));
console.log(Object.freeze(globalThis['String'])["fromCodePoint"](68));
const fromCodePoint = Object.freeze(String.fromCodePoint);
const message = fromCodePoint(66, Object.freeze(121), 101);
console.log(message);
'''
"main.ts" = '''
console.log(String.fromCodePoint());
console.log(Object.freeze(globalThis.String.fromCodePoint)());
console.log(String.fromCodePoint(72, 105));
console.log(globalThis.String.fromCodePoint(79, 75));
console.log(globalThis["String"]["fromCodePoint"](65));
console.log(globalThis["String"]['fromCodePoint'](67));
console.log(Object.freeze(globalThis['String'])["fromCodePoint"](68));
const fromCodePoint = Object.freeze(String.fromCodePoint);
const message = fromCodePoint(66, Object.freeze(121), 101);
console.log(message);
'''
"main.jsx" = '''
console.log(String.fromCodePoint());
console.log(Object.freeze(globalThis.String.fromCodePoint)());
console.log(String.fromCodePoint(72, 105));
console.log(globalThis.String.fromCodePoint(79, 75));
console.log(globalThis["String"]["fromCodePoint"](65));
console.log(globalThis["String"]['fromCodePoint'](67));
console.log(Object.freeze(globalThis['String'])["fromCodePoint"](68));
const fromCodePoint = Object.freeze(String.fromCodePoint);
const message = fromCodePoint(66, Object.freeze(121), 101);
