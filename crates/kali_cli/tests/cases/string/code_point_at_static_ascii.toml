# Migrated from tests/string_code_point_at_static_ascii.rs -- all 7
# #[test] functions, as 10 case blocks:
#
#   - `run`, `json_check`, `json_browser_bundle_tsx`: 1:1 with their source
#     tests.
#   - `browser_bundle_js`/`ts`/`jsx`/`tsx`: sibling [[case]] blocks (not a
#     [matrix] axis -- see repeat_static_ascii.toml's header) for
#     `browser_bundle_accepts_..._across_source_classes`'s 4-extension loop.
#   - `check_gates_extra_arguments`/`non_ascii_receiver`/`dynamic_index`:
#     the 3 E5506 fail-closed gate tests, 1:1 with their source tests; none
#     assert a message substring, only the E5506 code.
#
# [source] uses one "main.<ext>" file per extension, shared by every case
# that needs that extension, plus one distinct file per gate case.

[source]
"main.js" = '''
console.log("ABC".codePointAt());
console.log("ABC".codePointAt(1));
console.log("ABC".codePointAt(3));
console.log("ABC".codePointAt(-1));
console.log(Object.freeze("ABC").codePointAt(Object.freeze(2)));
const missing = "ABC".codePointAt(99);
console.log(missing);
'''
"main.ts" = '''
console.log("ABC".codePointAt());
console.log("ABC".codePointAt(1));
console.log("ABC".codePointAt(3));
console.log("ABC".codePointAt(-1));
console.log(Object.freeze("ABC").codePointAt(Object.freeze(2)));
const missing = "ABC".codePointAt(99);
console.log(missing);
'''
"main.jsx" = '''
console.log("ABC".codePointAt());
console.log("ABC".codePointAt(1));
console.log("ABC".codePointAt(3));
console.log("ABC".codePointAt(-1));
console.log(Object.freeze("ABC").codePointAt(Object.freeze(2)));
const missing = "ABC".codePointAt(99);
console.log(missing);
'''
"main.tsx" = '''
console.log("ABC".codePointAt());
console.log("ABC".codePointAt(1));
console.log("ABC".codePointAt(3));
console.log("ABC".codePointAt(-1));
console.log(Object.freeze("ABC").codePointAt(Object.freeze(2)));
const missing = "ABC".codePointAt(99);
console.log(missing);
'''
"extra_arguments.js" = "console.log('ABC'.codePointAt(0, 1));\n"
"non_ascii_receiver.js" = "console.log('é'.codePointAt(0));\n"
"dynamic_index.js" = "function code(index) { return 'ABC'.codePointAt(index); }\n"

[[case]]
name = "run"
rationale = "`.codePointAt()` on a static ASCII literal folds at compile time, including the out-of-range and frozen-receiver cases."
args = ["run", "main.js"]
exit = "success"
stdout = "65\n66\nundefined\nundefined\n67\nundefined\n"

[[case]]
name = "json_check"
rationale = "Same fold, asserting the JSON output envelope from `check` rather than `run`'s stdout."
args = ["--output", "json", "check", "main.ts"]
exit = "success"
json.schemaVersion = 1
json.command = "check"
json.success = true
json.errors = []

[[case]]
name = "browser_bundle_js"
rationale = "The static-ASCII code-point-at fold holds across every supported source class, not just plain JS -- js source."
args = ["build", "--api", "browser", "--bundle", "main.js"]
exit = "success"

[[case]]
name = "browser_bundle_ts"
rationale = "The static-ASCII code-point-at fold holds across every supported source class, not just plain JS -- ts source."
args = ["build", "--api", "browser", "--bundle", "main.ts"]
exit = "success"

[[case]]
name = "browser_bundle_jsx"
rationale = "The static-ASCII code-point-at fold holds across every supported source class, not just plain JS -- jsx source."
args = ["build", "--api", "browser", "--bundle", "main.jsx"]
exit = "success"

[[case]]
name = "browser_bundle_tsx"
rationale = "The static-ASCII code-point-at fold holds across every supported source class, not just plain JS -- tsx source."
args = ["build", "--api", "browser", "--bundle", "main.tsx"]
exit = "success"

[[case]]
name = "json_browser_bundle_tsx"
rationale = "Same tsx browser bundle, asserting the JSON output envelope rather than a bare success exit."
args = ["--output", "json", "build", "--api", "browser", "--bundle", "main.tsx"]
exit = "success"
json.schemaVersion = 1
json.command = "build"
json.success = true
json.errors = []

[[case]]
name = "check_gates_string_code_point_at_extra_arguments"
rationale = "`.codePointAt()` only folds for a single statically-known argument; an extra argument must fail closed with E5506."
args = ["--output", "json", "check", "extra_arguments.js"]
exit = "failure"
json.success = false
json.errors.0.code = "E5506"

[[case]]
name = "check_gates_non_ascii_static_string_code_point_at_receiver"
rationale = "The static-fold path requires an ASCII string literal receiver; a non-ASCII receiver ('é') must fail closed with E5506."
args = ["--output", "json", "check", "non_ascii_receiver.js"]
exit = "failure"
json.success = false
json.errors.0.code = "E5506"

[[case]]
name = "check_gates_dynamic_string_code_point_at_index"
rationale = "`.codePointAt()` only folds for a statically-known index; a dynamic index must fail closed with E5506."
args = ["--output", "json", "check", "dynamic_index.js"]
exit = "failure"
json.success = false
json.errors.0.code = "E5506"
