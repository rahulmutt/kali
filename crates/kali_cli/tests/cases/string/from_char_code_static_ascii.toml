# Migrated from tests/string_from_char_code_static_ascii.rs -- all 7
# #[test] functions, as 10 case blocks:
#
#   - `run`, `json_check`, `json_browser_bundle_tsx`: 1:1 with their source
#     tests.
#   - `browser_bundle_js`/`ts`/`jsx`/`tsx`: sibling [[case]] blocks (not a
#     [matrix] axis -- see repeat_static_ascii.toml's header) for
#     `browser_bundle_accepts_..._across_source_classes`'s 4-extension loop.
#   - `check_gates_dynamic_argument`/`non_ascii_argument`/
#     `fractional_argument`: the 3 E5506 fail-closed gate tests, 1:1 with
#     their source tests.
#
# DISCLOSURE: the 3 gate cases below (`check_gates_string_from_char_code_
# dynamic_argument`/`non_ascii_argument`/`fractional_argument`, each via a
# `json.errors.0.message = "..."` assertion) deliberately assert MORE than
# their source `#[test]` fn did -- the original `assert_check_gates_unsupported_
# string_from_char_code` helper only checked `json["success"] == false` and
# `json["errors"][0]["code"] == "E5506"`, never the message text. Do not
# read this as audit-driven noise and strip it back to match the source
# 1:1: this was originally added as a workaround for a real
# scripts/audit-case-migration.py bug (its JSON_KEY regex swept the whole
# old .rs file, including JS fixture text, so `globalThis["String"]
# ["fromCharCode"]` in the `run` fixture below registered two phantom
# "String"/"fromCharCode" JSON-path claims that no case file could ever
# satisfy short of fabricating an assertion) -- that bug is now fixed
# (JSON_KEY no longer reads inside raw-string spans, see
# scripts/audit-case-migration.py's `_blank_raw_strings`), so the workaround
# is no longer *required* to pass the audit. It is being kept anyway,
# deliberately: this branch has twice shipped a fail-closed test that
# degraded to asserting "some E5506" (see Task 17, which exists to close
# that failure mode structurally), and pinning the full exact diagnostic
# text -- verified genuine, not fabricated, by running the built `kali`
# binary against each gate case's exact source, and cross-checked against
# the format string at crates/kali_types/src/static_analysis/string.rs:275
# -- is the discipline this branch wants going forward. A future reader
# should treat this as intentional over-assertion, not something to prune
# back to the letter of the source test.
#
# [source] uses one "main.<ext>" file per extension, shared by every case
# that needs that extension, plus one distinct file per gate case.

[source]
"main.js" = '''
console.log(String.fromCharCode());
console.log(Object.freeze(globalThis.String.fromCharCode)());
console.log(String.fromCharCode(72, 105));
console.log(globalThis.String.fromCharCode(79, 75));
console.log(globalThis["String"]["fromCharCode"](65));
console.log(globalThis["String"]['fromCharCode'](67));
console.log(Object.freeze(globalThis['String'])["fromCharCode"](68));
const fromCharCode = Object.freeze(String.fromCharCode);
const message = fromCharCode(66, Object.freeze(121), 101);
console.log(message);
'''
"main.ts" = '''
console.log(String.fromCharCode());
console.log(Object.freeze(globalThis.String.fromCharCode)());
console.log(String.fromCharCode(72, 105));
console.log(globalThis.String.fromCharCode(79, 75));
console.log(globalThis["String"]["fromCharCode"](65));
console.log(globalThis["String"]['fromCharCode'](67));
console.log(Object.freeze(globalThis['String'])["fromCharCode"](68));
const fromCharCode = Object.freeze(String.fromCharCode);
const message = fromCharCode(66, Object.freeze(121), 101);
console.log(message);
'''
"main.jsx" = '''
console.log(String.fromCharCode());
console.log(Object.freeze(globalThis.String.fromCharCode)());
console.log(String.fromCharCode(72, 105));
console.log(globalThis.String.fromCharCode(79, 75));
console.log(globalThis["String"]["fromCharCode"](65));
console.log(globalThis["String"]['fromCharCode'](67));
console.log(Object.freeze(globalThis['String'])["fromCharCode"](68));
const fromCharCode = Object.freeze(String.fromCharCode);
const message = fromCharCode(66, Object.freeze(121), 101);
console.log(message);
'''
"main.tsx" = '''
console.log(String.fromCharCode());
console.log(Object.freeze(globalThis.String.fromCharCode)());
console.log(String.fromCharCode(72, 105));
console.log(globalThis.String.fromCharCode(79, 75));
console.log(globalThis["String"]["fromCharCode"](65));
console.log(globalThis["String"]['fromCharCode'](67));
console.log(Object.freeze(globalThis['String'])["fromCharCode"](68));
const fromCharCode = Object.freeze(String.fromCharCode);
const message = fromCharCode(66, Object.freeze(121), 101);
console.log(message);
'''
"dynamic_argument.js" = "function make(code) { return String.fromCharCode(code); }\n"
"non_ascii_argument.js" = "console.log(String.fromCharCode(233));\n"
"fractional_argument.js" = "console.log(String.fromCharCode(65.5));\n"

[[case]]
name = "run"
rationale = "`String.fromCharCode()` on statically-known ASCII code units folds at compile time, including the frozen-function-reference and bracket-access call forms."
args = ["run", "main.js"]
exit = "success"
stdout = "\n\nHi\nOK\nA\nC\nD\nBye\n"

[[case]]
name = "json_check"
rationale = "Same fold, asserting the JSON output envelope from `check` rather than `run`'s stdout."
args = ["--output", "json", "check", "main.ts"]
exit = "success"
json.schemaVersion = 1
json.command = "check"
json.success = true
json.errors = []

[[case]]
name = "browser_bundle_js"
rationale = "The static-ASCII fromCharCode fold holds across every supported source class, not just plain JS -- js source."
args = ["build", "--api", "browser", "--bundle", "main.js"]
exit = "success"

[[case]]
name = "browser_bundle_ts"
rationale = "The static-ASCII fromCharCode fold holds across every supported source class, not just plain JS -- ts source."
args = ["build", "--api", "browser", "--bundle", "main.ts"]
exit = "success"

[[case]]
name = "browser_bundle_jsx"
rationale = "The static-ASCII fromCharCode fold holds across every supported source class, not just plain JS -- jsx source."
args = ["build", "--api", "browser", "--bundle", "main.jsx"]
exit = "success"

[[case]]
name = "browser_bundle_tsx"
rationale = "The static-ASCII fromCharCode fold holds across every supported source class, not just plain JS -- tsx source."
args = ["build", "--api", "browser", "--bundle", "main.tsx"]
exit = "success"

[[case]]
name = "json_browser_bundle_tsx"
rationale = "Same tsx browser bundle, asserting the JSON output envelope rather than a bare success exit."
args = ["--output", "json", "build", "--api", "browser", "--bundle", "main.tsx"]
exit = "success"
json.schemaVersion = 1
json.command = "build"
json.success = true
json.errors = []

[[case]]
name = "check_gates_string_from_char_code_dynamic_argument"
rationale = "`String.fromCharCode()` only folds for statically-known arguments; a dynamic argument must fail closed with E5506."
args = ["--output", "json", "check", "dynamic_argument.js"]
exit = "failure"
json.success = false
json.errors.0.code = "E5506"
json.errors.0.message = "String.fromCharCode is unavailable unless every argument is a statically-known ASCII integer code unit from 0 through 127 in the current direct-runtime path; use explicit ASCII integer literals or the later compatibility path"

[[case]]
name = "check_gates_string_from_char_code_non_ascii_argument"
rationale = "The static-fold path requires every argument to be an ASCII code unit; a non-ASCII code unit (233) must fail closed with E5506."
args = ["--output", "json", "check", "non_ascii_argument.js"]
exit = "failure"
json.success = false
json.errors.0.code = "E5506"
json.errors.0.message = "String.fromCharCode is unavailable unless every argument is a statically-known ASCII integer code unit from 0 through 127 in the current direct-runtime path; use explicit ASCII integer literals or the later compatibility path"

[[case]]
name = "check_gates_string_from_char_code_fractional_argument"
rationale = "The static-fold path requires an integer argument; a fractional code unit (65.5) must fail closed with E5506."
args = ["--output", "json", "check", "fractional_argument.js"]
exit = "failure"
json.success = false
json.errors.0.code = "E5506"
json.errors.0.message = "String.fromCharCode is unavailable unless every argument is a statically-known ASCII integer code unit from 0 through 127 in the current direct-runtime path; use explicit ASCII integer literals or the later compatibility path"
