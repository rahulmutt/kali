# Migrated from tests/string_relational_static_ascii.rs -- all 4 #[test]
# functions, as 7 case blocks:
#
#   - `run`, `json_check`, `json_browser_bundle_tsx`: 1:1 with their source
#     tests.
#   - `browser_bundle_js`/`ts`/`jsx`/`tsx`: sibling [[case]] blocks (not a
#     [matrix] axis -- see repeat_static_ascii.toml's header) for
#     `browser_bundle_accepts_..._across_source_classes`'s 4-extension loop.
#
# No gate tests exist in this file -- string relational operators (`<`,
# `<=`, `>`, `>=`) have no unsupported-argument shape to gate on.

[source]
"main.js" = '''
const frozenLeft = Object.freeze("alpha");
console.log("alpha" < "beta");
console.log("beta" < "alpha");
console.log("alpha" <= "alpha");
console.log("beta" > "alpha");
console.log("alpha" >= "beta");
console.log(frozenLeft < Object.freeze("beta"));
'''
"main.ts" = '''
const frozenLeft = Object.freeze("alpha");
console.log("alpha" < "beta");
console.log("beta" < "alpha");
console.log("alpha" <= "alpha");
console.log("beta" > "alpha");
console.log("alpha" >= "beta");
console.log(frozenLeft < Object.freeze("beta"));
'''
"main.jsx" = '''
const frozenLeft = Object.freeze("alpha");
console.log("alpha" < "beta");
console.log("beta" < "alpha");
console.log("alpha" <= "alpha");
console.log("beta" > "alpha");
console.log("alpha" >= "beta");
console.log(frozenLeft < Object.freeze("beta"));
'''
"main.tsx" = '''
const frozenLeft = Object.freeze("alpha");
console.log("alpha" < "beta");
console.log("beta" < "alpha");
console.log("alpha" <= "alpha");
console.log("beta" > "alpha");
console.log("alpha" >= "beta");
console.log(frozenLeft < Object.freeze("beta"));
'''

[[case]]
name = "run"
rationale = "String relational operators on static ASCII literals fold at compile time, including a frozen left-hand operand."
args = ["run", "main.js"]
exit = "success"
stdout = "true\nfalse\ntrue\ntrue\nfalse\ntrue\n"

[[case]]
name = "json_check"
rationale = "Same fold, asserting the JSON output envelope from `check` rather than `run`'s stdout."
args = ["--output", "json", "check", "main.ts"]
exit = "success"
json.schemaVersion = 1
json.command = "check"
json.success = true
json.errors = []

[[case]]
name = "browser_bundle_js"
rationale = "The static-ASCII relational-operator fold holds across every supported source class, not just plain JS -- js source."
args = ["build", "--api", "browser", "--bundle", "main.js"]
exit = "success"

[[case]]
name = "browser_bundle_ts"
rationale = "The static-ASCII relational-operator fold holds across every supported source class, not just plain JS -- ts source."
args = ["build", "--api", "browser", "--bundle", "main.ts"]
exit = "success"

[[case]]
name = "browser_bundle_jsx"
rationale = "The static-ASCII relational-operator fold holds across every supported source class, not just plain JS -- jsx source."
args = ["build", "--api", "browser", "--bundle", "main.jsx"]
exit = "success"

[[case]]
name = "browser_bundle_tsx"
rationale = "The static-ASCII relational-operator fold holds across every supported source class, not just plain JS -- tsx source."
args = ["build", "--api", "browser", "--bundle", "main.tsx"]
exit = "success"

[[case]]
name = "json_browser_bundle_tsx"
rationale = "Same tsx browser bundle, asserting the JSON output envelope rather than a bare success exit."
args = ["--output", "json", "build", "--api", "browser", "--bundle", "main.tsx"]
exit = "success"
json.schemaVersion = 1
json.command = "build"
json.success = true
json.errors = []
