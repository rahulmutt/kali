# Migrated from tests/string_concat_static_ascii.rs -- all 8 #[test]
# functions, as 11 case blocks:
#
#   - `run`, `json_check`, `json_browser_bundle_tsx`: 1:1 with their source
#     tests.
#   - `browser_bundle_js`/`ts`/`jsx`/`tsx`: sibling [[case]] blocks (not a
#     [matrix] axis -- see repeat_static_ascii.toml's header) for
#     `browser_bundle_accepts_..._across_source_classes`'s 4-extension loop.
#   - `check_gates_dynamic_operand`/`dynamic_receiver`/`non_ascii_receiver`/
#     `non_ascii_operand`: the 4 E5506 fail-closed gate tests, 1:1 with their
#     source tests. Each also asserts `errors[0]["message"].contains(
#     "String.prototype.concat")`; since `json` is exact-match only, each
#     asserts the full exact message text (obtained by running the built
#     `kali` binary), strictly stronger than the original substring claim --
#     see case_static_ascii.toml's header for why that is not a weakening.
#
# [source] uses one "main.<ext>" file per extension, shared by every case
# that needs that extension, plus one distinct file per gate case.

[source]
"main.js" = '''
const suffix = 'llo';
console.log('he'.concat('llo'));
console.log('he'.concat('l', 'lo'));
console.log('hello'.concat());
console.log(Object.freeze('he').concat(Object.freeze(suffix)));
console.log('he'["concat"]('llo'));
'''
"main.ts" = '''
const suffix = 'llo';
console.log('he'.concat('llo'));
console.log('he'.concat('l', 'lo'));
console.log('hello'.concat());
console.log(Object.freeze('he').concat(Object.freeze(suffix)));
console.log('he'["concat"]('llo'));
'''
"main.jsx" = '''
const suffix = 'llo';
console.log('he'.concat('llo'));
console.log('he'.concat('l', 'lo'));
console.log('hello'.concat());
console.log(Object.freeze('he').concat(Object.freeze(suffix)));
console.log('he'["concat"]('llo'));
'''
"main.tsx" = '''
const suffix = 'llo';
console.log('he'.concat('llo'));
console.log('he'.concat('l', 'lo'));
console.log('hello'.concat());
console.log(Object.freeze('he').concat(Object.freeze(suffix)));
console.log('he'["concat"]('llo'));
'''
"dynamic_operand.js" = "function join(suffix) { return 'he'.concat(suffix); }\n"
"dynamic_receiver.js" = "function join(value) { return value.concat('llo'); }\n"
"non_ascii_receiver.js" = "console.log('hé'.concat('llo'));\n"
"non_ascii_operand.js" = "console.log('he'.concat('lló'));\n"

[[case]]
name = "run"
rationale = "`.concat()` on static ASCII literals folds at compile time, including the multi-argument, no-argument, frozen-receiver, and bracket-call-syntax forms."
args = ["run", "main.js"]
exit = "success"
stdout = "hello\nhello\nhello\nhello\nhello\n"

[[case]]
name = "json_check"
rationale = "Same fold, asserting the JSON output envelope from `check` rather than `run`'s stdout."
args = ["--output", "json", "check", "main.ts"]
exit = "success"
json.schemaVersion = 1
json.command = "check"
json.success = true
json.errors = []

[[case]]
name = "browser_bundle_js"
rationale = "The static-ASCII concat fold holds across every supported source class, not just plain JS -- js source."
args = ["build", "--api", "browser", "--bundle", "main.js"]
exit = "success"

[[case]]
name = "browser_bundle_ts"
rationale = "The static-ASCII concat fold holds across every supported source class, not just plain JS -- ts source."
args = ["build", "--api", "browser", "--bundle", "main.ts"]
exit = "success"

[[case]]
name = "browser_bundle_jsx"
rationale = "The static-ASCII concat fold holds across every supported source class, not just plain JS -- jsx source."
args = ["build", "--api", "browser", "--bundle", "main.jsx"]
exit = "success"

[[case]]
name = "browser_bundle_tsx"
rationale = "The static-ASCII concat fold holds across every supported source class, not just plain JS -- tsx source."
args = ["build", "--api", "browser", "--bundle", "main.tsx"]
exit = "success"

[[case]]
name = "json_browser_bundle_tsx"
rationale = "Same tsx browser bundle, asserting the JSON output envelope rather than a bare success exit."
args = ["--output", "json", "build", "--api", "browser", "--bundle", "main.tsx"]
exit = "success"
json.schemaVersion = 1
json.command = "build"
json.success = true
json.errors = []

[[case]]
name = "check_gates_string_concat_dynamic_operand"
rationale = "`.concat()` only folds when every operand is statically-known ASCII; a dynamic operand must fail closed with E5506."
args = ["--output", "json", "check", "dynamic_operand.js"]
exit = "failure"
json.success = false
json.errors.0.code = "E5506"
json.errors.0.message = "String.prototype.concat is unavailable unless the receiver and all operands are statically-known ASCII string literals in the current direct-runtime path; use explicit ASCII literals or the later compatibility path"

[[case]]
name = "check_gates_string_concat_dynamic_receiver"
rationale = "A receiver whose value is not statically known cannot be folded and must fail closed with E5506."
args = ["--output", "json", "check", "dynamic_receiver.js"]
exit = "failure"
json.success = false
json.errors.0.code = "E5506"
json.errors.0.message = "String.prototype.concat is unavailable unless the receiver and all operands are statically-known ASCII string literals in the current direct-runtime path; use explicit ASCII literals or the later compatibility path"

[[case]]
name = "check_gates_non_ascii_static_string_concat_receiver"
rationale = "The static-fold path requires an ASCII string literal receiver; a non-ASCII receiver ('hé') must fail closed with E5506."
args = ["--output", "json", "check", "non_ascii_receiver.js"]
exit = "failure"
json.success = false
json.errors.0.code = "E5506"
json.errors.0.message = "String.prototype.concat is unavailable unless the receiver and all operands are statically-known ASCII string literals in the current direct-runtime path; use explicit ASCII literals or the later compatibility path"

[[case]]
name = "check_gates_non_ascii_static_string_concat_operand"
rationale = "The static-fold path also requires every operand to be ASCII; a non-ASCII operand ('lló') must fail closed with E5506."
args = ["--output", "json", "check", "non_ascii_operand.js"]
exit = "failure"
json.success = false
json.errors.0.code = "E5506"
json.errors.0.message = "String.prototype.concat is unavailable unless the receiver and all operands are statically-known ASCII string literals in the current direct-runtime path; use explicit ASCII literals or the later compatibility path"
