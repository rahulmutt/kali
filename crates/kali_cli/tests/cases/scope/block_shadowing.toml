[[case]]
name = "sibling_blocks_may_bind_the_same_name_at_different_types"
rationale = """R-10. node v26.10.0 prints `1 then s`. At `6345f082b` kali refused at exit 1 (probe `bs_sibling`, REFUSES): error[E5506]: binding `a` in `f` is used as both a string and a number."""
args = ["run", "sibling.js"]
exit = "success"
stdout = "1\ns\n"

