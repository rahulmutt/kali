[source]
"top_if.js" = """let x=1; if(true){ let x=2; console.log(x); } console.log(x);
"""
"top_block_const.js" = """const x=1; { const x=2; console.log(x); } console.log(x);
"""
"fn_if.js" = """function f(){ let x=1; if(true){ let x=2; console.log(x); } return x; } console.log(f());
"""
"fn_param.js" = """function f(c){ { const c=7; console.log(c); } return c; } console.log(f(2));
"""
"for_let.js" = """let i=100; for(let i=0;i<2;i++){ console.log(i); } console.log(i);
"""
"for_body.js" = """let s=0; const v=9; for(let i=0;i<2;i++){ const v=i*10; s+=v; } console.log(s, v);
"""
"while_shadow.js" = """let n=3; let k=0; while(k<2){ let n=k; k++; } console.log(n);
"""
"arr_shadow.js" = """const a=[1,2,3]; { const a=[9]; console.log(a.length); } console.log(a.length);
"""
"nested_fn.js" = """let x=1; { let x=2; function g(){ return x; } console.log(g()); } console.log(x);
"""
"closure_outer.js" = """let x=1; function g(){ return x; } { let x=2; console.log(g()); }
"""
"sibling.js" = """function f(){ { let a=1; console.log(a); } { let a="s"; console.log(a); } } f();
"""
"samefn.js" = """function a(){ function h(){ return 1; } return h(); } function b(){ function h(){ return 2; } return h(); } console.log(a(), b());
"""
"blockfn.js" = """{ function h(){ return 1; } console.log(h()); } { function h(){ return 2; } console.log(h()); }
"""
"inner_capture.js" = """function m(){ let x=1; function g(){ { let x=2; } return x; } return g(); } console.log(m());
"""
"var_sibling.js" = """function f(){ { var v=1; } { let v=2; } return v; } console.log(f());
"""
"top_if.ts" = """let x = 1; if (true) { let x = 2; console.log(x); } console.log(x);
"""
"dup_in_block.js" = """let x = 1; { let x = 2; let x = 3; }
"""
"shadow_refusal.js" = """let s = 1; { let s = "a"; s = 1; console.log(s); } console.log(s);
"""

[[case]]
name = "a_block_let_does_not_change_the_module_binding"
rationale = """R-10. node v26.10.0 prints `2 then 1`. At `6345f082b` kali printed `2 then 2` at exit 0 (probe `bs_top_if`, SILENT)."""
args = ["run", "top_if.js"]
exit = "success"
stdout = "2\n1\n"

