[[case]]
name = "a_typed_block_shadow_runs_like_node"
rationale = """R-10, TypeScript source (no annotations: `let x: number` fails with E3100 at both `6345f082b` and head). node v26.10.0 (type-stripped) prints `2` then `1`. At `6345f082b` the same program as `top_if.js` printed `2` then `2` (probe `bs_top_if`, SILENT)."""
args = ["run", "top_if.ts"]
exit = "success"
stdout = "2\n1\n"

[[case]]
name = "check_accepts_a_block_shadow"
rationale = """`check` runs analyze_source_file, so the rename pass must not turn a valid shadow into a diagnostic."""
args = ["check", "top_if.js"]
exit = "success"

[[case]]
name = "check_accepts_same_named_functions_in_different_functions"
rationale = """At `6345f082b` `run` of this program failed to load its WASM module (probe `bs_samefn`, OTHER); `check` must accept it."""
args = ["check", "samefn.js"]
exit = "success"

[[case]]
name = "a_redeclaration_in_a_block_names_the_binding_as_written"
rationale = """The rename leaves same-scope duplicates for the resolver; E3101 names `x`, never `x{b0}`."""
args = ["check", "dup_in_block.js"]
exit = "failure"
stderr_contains = ["E3101", "'x'"]
stderr_absent = ["{b"]

[[case]]
name = "a_refusal_on_a_renamed_binding_names_it_as_written"
rationale = """The block's `s` is renamed `s{b0}`; the mixed string/number refusal must name `s`, never `s{b0}` (verified: with the display mapping disabled the message reads "binding `s{b0}` at module scope"). node v26.10.0 prints `1` then `1`. At `6345f082b` kali refused with E5506 naming `s` (the block's `s` and the module's `s` were one binding); the brief's `s + 1` variant failed with E3200 there (probe `bs_r_str_shadow`, OTHER) and now runs."""
args = ["run", "shadow_refusal.js"]
exit = "failure"
stderr_contains = ["E5506", "binding `s` at module scope"]
stderr_absent = ["{b"]
