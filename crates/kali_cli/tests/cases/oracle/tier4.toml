# ---------------------------------------------------------------------------
# THE ONE RUNNER COLLISION IN THIS FILE, AND WHY THE CONSTANT BELOW EXISTS.
#
# R-30's concat/template lane needs the register's own template-hole fragment,
# `` `${1<2}` ``. JavaScript's template-hole syntax and the case runner's
# `${...}` substitution syntax are the same three characters, so a `[source]`
# body containing `${1<2}` is read by the runner as a placeholder reference and
# the whole file fails to expand with
# `unresolved placeholder `${1<2}``. That is the runner working as designed --
# `expand::substitute` errors on any survivor precisely so a `${...}` can never
# silently reach a comparison -- and there is no escape form.
#
# The fragment is NOT dropped: dropping it would reduce the register's repro,
# and this lane's whole claim is a boundary over operand kinds of which the
# template hole is one. Instead the collision is resolved with a constant that
# substitutes to its own reference, which works because `expand::substitute`
# is SINGLE-PASS over the bindings -- a documented property, stated in
# `model.rs`'s `referenced_placeholders` doc comment ("`substitute` is
# single-pass over `file.constants`, so `A = "x"` / `B = "${A}"` leaves a
# literal `${A}` in the output"). So `${1<2}` in a source body is replaced by
# the four-character text `${1<2}`, the emitted `.js` file carries the
# register's fragment character for character, and nothing is re-scanned.
#
# It is a workaround, and it is written down here rather than left to be
# rediscovered. The constant is referenced (twice, by the two `r30d` sources),
# so the dead-constant guard is satisfied. If the runner ever grows a real
# escape form, replace this and delete this block.
#
# VERIFIED, because a green case would NOT have proved it. If the substitution
# had collapsed `${1<2}` to the text `1<2`, the emitted line would be
# `console.log(`1<2`)`, which prints the string `1<2` on BOTH engines and would
# still classify FIXED -- the workaround failing would have looked exactly like
# the workaround working. So it was checked directly at `61aa9043b3` by forcing
# a mismatch report out of the `r30d` module-scope case and reading node's
# captured stdout: line 2 is `true`, not `1<2`. The template hole reached node
# intact.
#
# This is not scaffolding and is not listed as such below: it adds nothing to
# any program and changes no character of one. It exists so that the emitted
# `.js` matches the register's fragment exactly.

[constants]
"1<2" = "${1<2}"

