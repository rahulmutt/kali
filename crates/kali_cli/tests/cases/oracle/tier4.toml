[[case]]
name = "r33a_console_warn_prefix_module_scope"
kind = "oracle"
register_entry = "R-33"
program = "r33a_module.js"
verdict = "silent"
observe = "stderr"
rationale = """R-33, `console.warn` lane, module scope. SINK: `console.warn("hi")`, which is the whole of the entry. The program is its `Repro` verbatim and complete -- as of `61c2d48ea9` (2026-07-29), "`console.warn("hi");` -> node `hi`, kali `[warn] hi` (exit 0)". Nothing was added.

OBSERVED STREAM: `stderr`. R-33's damage renders on stderr -- `console.warn` writes there on both engines -- so stderr is the stream that carries the observation, and `observe = "stderr"` is how the case says so. R-33 is the ONLY entry in either the tier-3 or the tier-4 file that needs it, and it needs it on BOTH of its lanes: `observe = "stderr"` is set on FOUR cases -- this one, its in-function twin, and the two `console.error` control cases, which render on stderr for the same reason. Every case outside R-33 leaves `observe` unset and compares stdout, which is where every other entry in both files renders. (An earlier draft of this paragraph said this was the only lane that set it and that every other case in the file left it unset. Both were wrong, and they were wrong because they were written before the sweep that found the control lane; they are corrected here rather than quietly, because this rationale is the file's designated warning to the next author and a warning that misstates its own file is worth less than none.)

Expected verdict set from the register's recorded status: as of `61c2d48ea9`, §0.2's row reads "**SILENT/WARN**" with the note "prefix persists; `console.error` correct". Both engines exit 0 and their output differs, which is SILENT.

RE-MEASURED 2026-08-15 at `61aa9043b3` against node v26.7.0: SILENT, matching the register -- no reconciliation. kali exits 0 printing nothing to stdout and `[warn] hi` to stderr; node exits 0 printing nothing to stdout and `hi` to stderr. The prefix is still there, in both scopes, exactly as recorded.

WHY THIS CASE READ `fixed` BEFORE `observe` EXISTED, PRESERVED AS A WARNING. When first authored this case had no way to name its stream, so it compared stdout like every other case: two EMPTY stdouts and two zero exits, which `classify` calls FIXED. The measurement was correct about what it compared and told a lie about the entry -- a green case for a live defect, which would have retired R-33 from the damage set and from the ranking when §0.2 was regenerated from these verdicts. The instrument, not the entry, was the thing that had moved. The fix was to teach `classify` which stream carries the observation (`ObservedStream` in `crates/kali_blast_radius/src/verdict.rs`, `observe` in the case format) rather than to record `fixed` with a prose warning attached to it, because a warning only works on a reader who reads it.

THE GENERAL LESSON FOR THE NEXT AUTHOR. Before writing an oracle case, ask which stream the register's own repro renders its divergence on. If it is not stdout, `observe` must say so -- otherwise the case compares two empty strings, passes, and asserts nothing. `console.warn` and `console.error` are the two sinks in this corpus that do this; there may be others in entries nobody has authored yet.

WHAT THIS DOES NOT ESTABLISH. It compares whole stderr streams, so it shows the two engines' stderr differs -- it does not isolate WHICH bytes differ, and the class alone would not distinguish the `[warn] ` prefix from any other stderr divergence. That the difference is exactly the prefix is the hand observation quoted above. An oracle step permits no process-output assertion, so pinning the bytes needs an ordinary `run` case elsewhere in `crates/kali_cli/tests/cases/`; that is still worth having and is still not done here."""

