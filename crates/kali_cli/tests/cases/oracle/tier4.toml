THE BYTES WERE PINNED AFTER ALL, by the fix rather than by this case. The paragraph above asks for an ordinary `run` case to isolate WHICH stderr bytes differ, because a whole-stream comparison cannot. That gap is now closed from the other side: four assertions outside this corpus now compare `stderr` for exact equality, and ALL FOUR required the prefixed bytes beforehand -- so all four had to be edited by the fix, and none of them was a check the corrected output could have slipped past. Three of the four additionally went from `contains` to exact equality. Read against `62b11a78c3~1` -- and these are that revision's line numbers, not HEAD's -- each of `crates/kali_cli/tests/runtime_smoke/test.rs:11179-11180`, `crates/kali_cli/tests/runtime_smoke/run.rs:11009-11010` and `crates/kali_cli/tests/runtime_smoke/run.rs:12801-12802` carried BOTH `assert!(stderr.contains("err"))` and `assert!(stderr.contains("[warn] warn"))`, and each pair was collapsed into a single `assert_eq!(stderr, "err\\nwarn\\n")`, which is stronger because it also pins that nothing ELSE reaches the stream. (At HEAD the three collapsed assertions sit at `test.rs:11179`, `run.rs:11009` and `run.rs:12800`; an earlier draft of this sentence mixed the two revisions' numbering, citing HEAD's `:12800` inside a pre-fix reading where the pair is at `:12801-12802`.) The fourth, `crates/kali_runtime/src/execute_tests/host_env.rs:32`, was already exact -- it read `assert_eq!(outcome.stderr, "2\\n[warn] 3\\n")` and now reads `"2\\n3\\n"` -- so it was UPDATED rather than strengthened. Either way the return of the prefix now fails on the exact bytes, not merely on a stream difference."""

