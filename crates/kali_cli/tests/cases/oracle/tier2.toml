[[case]]
name = "r06a_object_declarator_initializer_module_scope"
kind = "oracle"
register_entry = "R-06"
program = "r06a_module.js"
verdict = "fixed"
rationale = """R-06, DECLARATOR-INIT lane, module scope. A `var`-declared object literal with one numeric-literal field, read back through a dot member. This is §2's headline `Repro` line for R-06, `var o={f:7}; console.log(o.f);`, verbatim -- a complete runnable program as the register states it, with nothing added.

Expected verdict set from the register's recorded status: as of `61c2d48ea9`, §2's R-06 carries `STATUS -- objects-half CLOSED 2026-07-24` (branch `r06-object-init-materialization`, `acf7c5c2c`..`3146b9653`) and §0.2's row opens with "object *declarator init* FIXED", so FIXED.

RE-MEASURED 2026-08-15 at `2a49fa1f3f` against node v26.7.0: FIXED, unchanged -- no reconciliation. kali prints `7` at exit 0 with empty stderr; node prints `7` at exit 0. Under the defect this printed `0` at exit 0, which would classify SILENT; that is what this case will report if the materialization fix is ever backed out, and it will name R-06 because `register_entry` says so.

This case measures the ONE lane the register calls closed. R-06 has three lanes and the other two -- `R-06-R2` reassignment and `R-06-R3` arrays -- are separate cases in this file and both still measure SILENT. A reader must not take this green as R-06 being fixed."""

