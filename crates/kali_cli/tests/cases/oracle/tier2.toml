# ---------------------------------------------------------------------------
# THE TWELVE ENTRIES, AND THE THIRTY-FOUR CASES.
#
# Every entry is measured in BOTH scopes -- module scope and in-function --
# because top-level and in-function are different programs in kali and several
# known defects appear at one scope only. NO SCOPE IS MOOT FOR ANY ENTRY IN
# THIS HALF, so there are no exemptions to name: all twelve carry both.
#
# Five entries carry MORE than two cases, because the register records more
# than one class or more than one labelled repro for them. A single case cannot
# hold two classes, and collapsing a multi-lane entry to one lane would record a
# verdict the register itself does not claim.
#
#   entry  lane                       module-scope case      in-function case
#   -----  -------------------------  ---------------------  ------------------
#   R-06   declarator init            r06a_..._module_scope  r06a_..._in_function
#   R-06   R-06-R2 reassignment       r06b_..._module_scope  r06b_..._in_function
#   R-06   R-06-R3 arrays             r06c_..._module_scope  r06c_..._in_function
#   R-07   --                         r07_..._module_scope   r07_..._in_function
#   R-08   `===` half                 r08eq_..._module_scope r08eq_..._in_function
#   R-08   `??` half                  r08nc_..._module_scope r08nc_..._in_function
#   R-09   silent (exit 0) form       r09s_..._module_scope  r09s_..._in_function
#   R-09   hang form                  r09h_..._module_scope  r09h_..._in_function
#   R-10   --                         r10_..._module_scope   r10_..._in_function
#   R-11   --                         r11_..._module_scope   r11_..._in_function
#   R-12   --                         r12_..._module_scope   r12_..._in_function
