kind = "oracle"
register_entry = "R-06"
program = "r06b_module.js"
verdict = "silent"
rationale = """R-06, `R-06-R2` REASSIGNMENT lane, module scope. A `var` object literal that is then reassigned a WHOLE new object literal, read back through a dot member. As of `61c2d48ea9`, §2 states this residual as `var o={f:1}; o={f:2}; o.f` -> `0` (node `2`), and calls it "a distinct mechanism from the declarator init" -- the object-literal-RHS assignment store, which the objects-half fix did not touch.

SCAFFOLDING: the register states the residual as an expression fragment ending in `o.f` with an arrow to the value. The only addition is the `console.log(…)` that makes that read observable. No value, name or operator was changed.

Expected verdict set from the register's recorded status: as of `61c2d48ea9`, §0.2's row says "R-06-R2 reassignment still SILENT" and §2's residual records both engines at exit 0 with no diagnostic -- SILENT.

RE-MEASURED 2026-08-15 at `2a49fa1f3f` against node v26.7.0: SILENT, unchanged -- no reconciliation. kali prints `0` at exit 0 with empty stderr; node prints `2` at exit 0. The reassignment store still vanishes, and it vanishes QUIETLY: the value read back is a plausible number, not a diagnostic.

This case measures the `var` spelling only. As of `61c2d48ea9` the register re-measured the `let` spelling on `372a3f440` and recorded it IDENTICAL (`let o={a:6}; o={a:9}; o.a` -> `0`, node `9`), concluding "`var` and `let` are one lane here, not two"; that is the register's observation, not this case's, and this case does not re-establish it."""

