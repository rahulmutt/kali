# say so in their rationale, name the class superseded, and give the date, commit
# and node version of the re-measurement. No case in the second pass moved, so
# none of them names a superseded class. A future red run therefore means the
# entry has moved AGAIN since 2026-08-15 -- data for the next regeneration of
