# WHERE THE PROGRAMS COME FROM, AND WHAT SCAFFOLDING WAS ADDED.
#
# Every `[source]` below is the register entry's OWN minimal repro from §2 as of
# `61c2d48ea9` (2026-07-29), copied verbatim. Every register quotation and
# citation in this file is anchored to that same commit, so none of them can rot
# when the register is next edited. ONE program in this file is NOT a register
# repro -- `r21fl_*.js`, which changes one token of one -- and it says so in its
# own rationale, in this list, and in the R-21 note further down.
#
# EIGHT kinds of scaffolding were added, all disclosed again in the individual
# rationales:
#
# 1. THE MISSING SCOPE. Where the register states its repro at module scope, the
#    `*_function.js` twin is that repro UNCHANGED inside `function main() { … }`
#    with a trailing `main();`. Where the register states its repro INSIDE a
#    function (R-09's silent form `p28b.js`, R-12's `al.js`), the
#    `*_module.js` twin is that repro's body lifted out of its wrapper and
#    nothing else -- the mirror-image operation. Nothing inside is edited: not a
#    declaration, not a log, not a keyword.
# 2. A `console.log` ON A BARE EXPRESSION. Several repros are stated as
#    expression fragments with an arrow to the value (`var o={f:1}; o={f:2};
#    o.f` -> `0`). The only addition is the `console.log(…)` that makes the read
#    observable; no value, name or operator was changed. Named in each case. It
#    applies to TWO of R-06's three lanes -- `R-06-R2` and `R-06-R3`; `r06a`'s
#    repro already carries its own `console.log` and needed nothing -- and also
#    to R-17's two bullets (register:1858, register:1861 are bare concat
#    expressions), R-19's `.toString()` lane, R-21's arithmetic lane and all
#    three of its absent-read lanes, and R-28's value half.
# 3. R-09's HANG FORM is stated as a bare `for` statement with no `s`
#    declaration and no log. The scaffolding added (`let s = 0`, a
#    `console.log("s=" + s)`, and the `function t() { … } t()` its sibling repro
#    uses) is character-identical to what `oracle/classifier_ground_truth.toml`
#    added for the same fragment, so the two files measure the same program.
# 4. R-07 USES TWO DIFFERENT REGISTER REPROS, one per scope, rather than one
#    repro and a wrapper. §2 states Repro A ("classic swap") as in-function and
#    Repro B ("stale read") as top level, so each scope gets the register's own
#    repro for that scope and NEITHER is wrapped or unwrapped. That is a
#    stronger provenance than manufacturing the missing scope would have been.
# 5. TWO FRAGMENTS COMBINED INTO ONE PROGRAM, where the register states them
#    over an identical binding or as one bullet: R-17's `.join()` and
#    element-read consumers over one `const a=["p","q"]`; R-19's four
#    `.toString()` spellings; and R-21's concat bullet (two fragments) and
#    void-return bullet (two consumers over the register's one `function f(){}`).
#    Nothing was renamed, re-valued or reordered. R-21's BINDING bullet is the
#    one place this was tried and had to be abandoned: its two fragments both
#    declare `x`, and kali rejects the concatenation `error[E3101]: duplicate
#    binding 'x'`, so that bullet is two lanes instead.
# 6. A DECLARATOR SUBSTITUTED, where the register itself states the lane by its
#    declarator. R-47's `var` and `const` lanes are §2's own repro with `let`
#    replaced by the declarator whose class that lane names; R-53's `const` lane
#    is what §2 calls "the byte-identical fixture with `for (const v of
#    [1,2,3])`". In both entries the register states a class for each declarator,
#    so the substitution is the register's own construct rather than a variant
#    invented here.
# 7. A BINDING BORROWED FROM THE ENTRY'S OWN REPRO. R-25's `console.log([...a])`
#    residual is stated presupposing an `a`; the `const a=[1,2];` that precedes
#    it is lifted from the same entry's `Repro` line, not written fresh.
# 8. THE ONE PROGRAM THAT IS NOT A REGISTER REPRO: `r21fl_*.js` is §2's own
#    absent-field repro with the RECEIVER'S DECLARATOR changed from `const` to
#    `let` and nothing else. It exists to locate a fail-closed lane §0.1's
#    amendment asserts and §0.2's row denies; see the R-21 note further down.
#    Its own rationale says in as many words that it is not verbatim.
#
# NO REPRO WAS REDUCED. Where the register calls a half of a repro load-bearing,
# that half is here:
#   - R-09's silent form keeps `i++` inside the `continue` guard and the full
#     `i < 6` bound. The register's arithmetic trace -- node visits
#     `0,1,(2->3 skipped),4,5` => 10, kali visits `0,1,(2->3),3,4,5` => 13 --
#     only holds for that exact loop, and a shortened bound would still be red
#     while no longer matching the mechanism this file cites.
#   - R-06-R3 keeps BOTH element reads (`a[0]` and `a[1]`), which is how §2's
#     Detail line states it.
#   - R-08's `??` lane keeps all four operand kinds of the register's own
#     re-verified illustration set (`let`, `var`, parameter, call return),
#     including their inline comments, because the entry's severity claim is
#     that this is `??`'s ORDINARY usage rather than one shape.
#   - R-13 keeps the write repro's `.b` read-back, which the register chose
#     precisely because the dot lane is known good -- reading back through `o[k]`
#     would have confounded the write half with the read half.
#   - R-17 keeps both the `.join()` and the element-read consumers of the SAME
#     `const a=["p","q"]` binding, which is how §2 states them.
#   - R-18 keeps all FOUR lines of `p20_lit_or.js`. §2's own claim is that cases
#     1 and 2 leak a handle AND that "case 3 additionally has the truthiness
#     backwards" -- two different defects in one repro -- and case 4 is the
#     correct control that shows it is not `&&` as a whole. One line would have
#     measured one of the three.
#   - R-19's `.toString()` lane keeps all four spellings §2 lists under "Same for
#     the method form" (`(42)`, `(1.5)`, a `var`-bound number, a `var`-bound
#     string), because the entry's claim for that lane is TOTALITY.
#   - R-24 keeps the `isFrozen` read as well as the write read-back, and keeps
#     the bind-then-freeze order. §2's PROBE CAVEAT is explicit that the
#     freeze-in-the-initializer spelling HIDES the defect, so reordering those
#     two statements would have turned a red measurement green for an unrelated
#     reason.
#   - R-25's fold lane keeps both the `.length` read and the index read, which is
#     how §2 states the repro and which matches §0.2's "(idx/len)" naming.
#   - R-27 keeps the `bump()` call and the `n` counter. §2's finding is not only
#     that the sequence value is lost but that "the side effect fires exactly
#     once"; dropping `n` would have lost half of it.
#   - R-53's `var` and `let` lanes keep the per-iteration `console.log` AND the
#     running sum. §2 says the correct trip count with a wrong bound value is
#     precisely what makes this Tier 2 rather than Tier 1, and only the
#     per-iteration log shows the trip count.
