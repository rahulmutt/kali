# ---------------------------------------------------------------------------
# HOW TO READ A RED RUN HERE.
#
# Each `verdict` below is the class this task MEASURED at HEAD. The two cases
# whose measured class differs from the register's say so in their rationale,
# name the class superseded, and give the date, commit and node version of the
# re-measurement. A future red run therefore means the entry has moved AGAIN
# since 2026-08-15 -- data for the next regeneration of §0.2, not a defect in
# the case.
#
# The sibling `oracle/classifier_ground_truth.toml` pins all eight verdict
# classes against constructs whose behaviour is independently known. If cases
# here go red at the same time as cases there, read that file first: a
# mislabelling classifier invalidates every verdict in this one.
#
# ---------------------------------------------------------------------------
# COST NOTE FOR R-09's HANG LANE.
#
# `r09h_*` runs kali until its fuel guard trips with `E4003`. Unlike R-52's
# runaway in `tier1.toml` this one prints NOTHING while it spins -- the loop
# body has no log -- so there is no stdout volume to worry about, and the trap
# is instruction-counted rather than wall-clock: it fires in well under a second
# on both scopes. The default 30s oracle budget is never approached and no
# `timeout_ms` is needed.

