#   §0.2. §0.2's R-21 row says SILENT for every form; §0.1's 2026-07-29 amendment
#   says this lane fails closed. The expected class for that row is the
#   amendment's. See the note immediately below.
#
# The two scopes agreed on the class for EVERY entry and every lane in this pass
# -- twenty-eight pairs, twenty-eight agreements. For EIGHT entries that
# agreement is a genuinely NEW observation rather than a confirmation, because as
# of `61c2d48ea9` the register has no in-function measurement of them to inherit:
#
#   R-18, R-20, R-22, R-23, R-25  `Verification: sweep-only-top-level-only`
#   R-24                          `CONFIRMED-BY-CONTROLLER`, no `Scopes` line
#   R-28                          `sweep-only (top level; … both scopes are
#                                 EXPECTED)` -- expected is not measured
#   R-53                          `CONFIRMED-BY-CONTROLLER`, no `Scopes` line
#
# R-21 is a partial ninth: its Verification line reads "both scopes for D-A-6 and
# D-C-7; top level only for D-D-12's out-of-bounds cases and D-A-11", so the
# out-of-bounds lane's in-function agreement is new while the binding, concat and
# void-return lanes' is a confirmation. The remaining five -- R-19 ("in every
# scope"), R-26 ("both scopes, plus via bindings and parameters"), R-27 ("top
# level + one in-function sighting"), R-47 (`Scopes affected: both`, with its own
# in-function witness) and R-48 (`Scopes affected: both, measured`) -- were
# already recorded in both scopes and this pass confirms them. Every in-function
# case whose class had to be assumed rather than inherited says so in its own
# rationale.
#
# ---------------------------------------------------------------------------
# R-21: WHAT THE FLAGGED "ALREADY MOVED" LANE ACTUALLY IS.
#
# The plan flagged R-21 as an entry that has already moved and told this author
# to expect a reconciliation. There is a real disagreement inside the register,
# but it does NOT move the entry's own repro, and the reconciliation is a
# discriminator rather than a changed verdict. As of `61c2d48ea9`:
#
#   - §0.2's R-21 row records SILENT and says "all forms (`null`/`undefined`/
#     absent field/void call/template) render `0`/`false`".
#   - §0.1's 2026-07-29 amendment says the opposite for one of those forms: "at
#     least one has already moved -- R-21's absent-field lane (`o.b` for
#     undeclared `b`) now **fails closed** `E5506 unknown field 'b' on
#     fixed-shape object` at `64438bf0ef`, where §0.2 still records it SILENT."
#     The amendment does not state the receiver's declarator.
#
# Measured at `36f9c814a2` against node v26.7.0, BOTH are right about different
# programs, and the discriminator is THE RECEIVER'S DECLARATOR KIND:
#
#   const o={a:1}; console.log("z="+o.z);   ->  kali `z=0` exit 0   SILENT
#   let   o={a:1}; console.log("z="+o.z);   ->  kali E5506 exit 1   FAIL_CLOSED
