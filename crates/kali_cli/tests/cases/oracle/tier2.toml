# it is still SILENT -- so §0.2's row is correct for the register's own repro and
# the entry has NOT moved on it. `r21f_*` measures that. `r21fl_*` is the same
# program with `const` replaced by `let` and nothing else, and it pins the
# fail-closed lane the amendment describes. It is the only source in this file
# that is not a register repro; it is here because reporting "the amendment's
# claim could not be located" would have been worse than measuring it with one
# disclosed token changed.
#
# A §0.2 regenerated from these measurements should split R-21's absent-field
# form by receiver declarator rather than record one class for it.
#
# ---------------------------------------------------------------------------
# HOW TO READ A RED RUN HERE.
