#   R-53   `var` loop variable   module     silent          silent       same
#   R-53   `var` loop variable   function   silent          silent       same
#   R-53   `let` loop variable   module     silent          silent       same
#   R-53   `let` loop variable   function   silent          silent       same
#   R-53   `const` loop variable module     fixed           fixed        same
#   R-53   `const` loop variable function   fixed           fixed        same
#
