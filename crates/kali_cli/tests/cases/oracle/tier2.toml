rationale = """R-06, `R-06-R2` REASSIGNMENT lane, module scope. A `var` object literal that is then reassigned a WHOLE new object literal, read back through a dot member. As of `61c2d48ea9`, §2 states this residual as `var o={f:1}; o={f:2}; o.f` -> `0` (node `2`), and calls it "a distinct mechanism from the declarator init" -- the object-literal-RHS assignment store, which the objects-half fix did not touch.

SCAFFOLDING: the register states the residual as an expression fragment ending in `o.f` with an arrow to the value. The only addition is the `console.log(…)` that makes that read observable. No value, name or operator was changed.

