Expected verdict set from the register's recorded status: FIXED, as for the module scope. As of `61c2d48ea9`, §2's R-06 records `Scopes affected: both` and gives its own in-function witness `function g(){var o={f:7}; return o.f;} g()`, so the scopes were expected to agree.

RE-MEASURED 2026-08-15 at `2a49fa1f3f` against node v26.7.0: FIXED, unchanged -- no reconciliation. kali prints `7` at exit 0; node prints `7` at exit 0. Byte-identical to the module scope, so the entry's `Scopes affected: both` still holds -- both scopes are now correct on this lane rather than both wrong."""

[[case]]
