verdict = "fixed"
rationale = """R-04, module scope. A `console.log` with three arguments of which the middle one is a plain variable reference -- the register's "non-literal" trigger.

SOURCE PROVENANCE: R-04's §2 body has no labelled `Repro` block; it states the defect as a rule plus a bulleted boundary table. This program is the third position-independence bullet verbatim, `var x=3; console.log(1, x, 2)`, which is a complete runnable program as written. Nothing was added.

Expected verdict set from the register's recorded status: as of `61c2d48ea9`, that bullet records kali printing `1` against node's `1 3 2`, both at exit 0 -- SILENT.

RE-MEASURED 2026-08-15 at `c4f665e5f5` against node v26.7.0: FIXED, SUPERSEDING SILENT. kali prints `1 3 2` at exit 0; node prints `1 3 2` at exit 0. Both stdouts are byte-identical, which is FIXED. The arguments after the first are no longer dropped for this shape.

WHAT THIS CASE DOES AND DOES NOT ESTABLISH. It measures one bullet of R-04's boundary table -- a `var` reference in the middle position -- and nothing else. R-04's boundary is wide (five position shapes plus four sinks), and one FIXED cell is not a fixed entry. The other bullets were spot-checked by hand at this same commit and node version while reconciling this case, and all agreed with node (`console.log(1+1, 5)` -> `2 5`; `console.log(5, 1+1)` -> `5 2`; `var x=3; console.log(1, 2, x)` -> `1 2 3`; `console.log(1, 2+0, 3, 4+0)` -> `1 2 3 4`; `console.error`/`console.info` with a `var` -> `1 3`), but those are hand observations recorded here for the reader, not assertions this case makes. One residual divergence was seen and is NOT a dropped argument: `console.warn(1, x)` prints `[warn] 1 3` on kali against node's `1 3` -- a prefix, with all three arguments present, which as of `61c2d48ea9` the register's own R-04 body already showed in its `console.warn(1, x)` bullet. It is also a difference `classify` never sees, since `warn` goes to stderr and `classify` compares stdout only."""

