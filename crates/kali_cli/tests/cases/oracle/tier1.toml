# Tier 1 of the register's §2 -- "silently drops code or output" -- re-measured
# at HEAD.
#
# Spec: docs/superpowers/specs/2026-08-15-blast-radius-ranking-design.md §7.
# Register: docs/superpowers/followups/kali-silent-miscompile-register.md §2,
# `## Tier 1`, enumerated with the task brief's command.
#
# ---------------------------------------------------------------------------
# THE EIGHT ENTRIES, AND THE TWENTY CASES.
#
# Tier 1 holds EIGHT entries: R-01, R-02, R-03, R-04, R-05, R-49, R-51, R-52.
#
# Every entry is measured in BOTH scopes -- module scope and in-function --
# because top-level and in-function are different programs in kali and several
# known defects appear at one scope only. NO SCOPE IS MOOT FOR ANY ENTRY HERE,
# so there are no exemptions to name: all eight entries carry both.
#
# Seven entries therefore get two cases each. R-52 gets SIX, because as of
# `61c2d48ea9` its §2 body states THREE separately labelled repros (A, B, C)
# and assigns each a DIFFERENT severity in its own `Severity` line -- "Tier 1
# for Repro A ...,
# Tier 2 for Repro B ..., FL-INTERNAL for Repro C". Three declared classes
# cannot be measured by one case. Collapsing them to Repro A alone would have
# recorded a single verdict for an entry the register itself records as
# carrying three, so each lane gets its own pair.
#
#   entry  lane      module-scope case          in-function case
#   -----  --------  -------------------------  --------------------------
#   R-01   --        r01_..._module_scope       r01_..._in_function
#   R-02   --        r02_..._module_scope       r02_..._in_function
#   R-03   --        r03_..._module_scope       r03_..._in_function
#   R-04   --        r04_..._module_scope       r04_..._in_function
#   R-05   --        r05_..._module_scope       r05_..._in_function
#   R-49   --        r49_..._module_scope       r49_..._in_function
#   R-51   --        r51_..._module_scope       r51_..._in_function
#   R-52   Repro A   r52a_..._module_scope      r52a_..._in_function
#   R-52   Repro B   r52b_..._module_scope      r52b_..._in_function
#   R-52   Repro C   r52c_..._module_scope      r52c_..._in_function
#
# ---------------------------------------------------------------------------
# WHERE THE PROGRAMS COME FROM, AND WHAT SCAFFOLDING WAS ADDED.
#
# Every `[source]` below is the register entry's OWN minimal repro from §2 as
# of `61c2d48ea9` (2026-07-29), copied verbatim. The register's repro is the
# measurement's provenance; a repro invented here would measure a construct no
# entry ever recorded. Every register quotation and citation in this file is
# anchored to that same commit, so none of them can rot when the register is
# next edited.
#
# Two kinds of scaffolding were added, both disclosed in the case rationales:
#
# 1. THE IN-FUNCTION SCOPE. At that commit the register states its Tier-1
#    repros at module scope. Every `*_function.js` below is the SAME repro,
#    unchanged, wrapped
#    in `function main() { ... }` with a trailing `main();`. Nothing inside the
#    wrapper is edited -- not a declaration, not a log, not a keyword. That
#    wrapper is the whole of the in-function scope and is the only difference
#    between the two programs of a pair.
#
# 2. R-04 HAD NO LABELLED `Repro` BLOCK at that commit. Its §2 body stated the
#    defect as a rule plus a bulleted boundary table rather than as a named
#    repro. The third position-independence bullet,
#    `var x=3; console.log(1, x, 2)` -> `1` (node `1 3 2`), is a complete
#    runnable program on its own, so it is taken verbatim as that entry's
#    repro. Nothing was added to it at module scope.
#
# NO REPRO WAS REDUCED. Where the register at `61c2d48ea9` called a half of a
# repro load-bearing, that half is here:
#   - R-02 keeps `console.log("CALLEE RAN")` inside the callee -- its absence
#     from kali's output is what proves the callee is never invoked, as opposed
#     to invoked with its result discarded.
#   - R-05 keeps `console.log("RAN")` in the method body, for the same reason.
#   - R-51 keeps the `hits` counter and its log. The register said so in as
#     many words: "the side-effect counter is the load-bearing half of the
#     repro". `w=0` alone is the ordinary G2 shape, and only `hits=0` proves
#     the callee body never executed, which is what makes R-51 Tier 1.
#   - R-52's Repros B and C keep their per-iteration `console.log("iter=" + i)`.
#     The register recorded that B's final sums AGREE on both engines (`s=10`),
#     so "a fixture asserting only the final value would have scored this cell
#     CORRECT. The `iter=` lines are the whole evidence."
#
# ---------------------------------------------------------------------------
# WHAT THE RE-MEASUREMENT FOUND, 2026-08-15, commit `c4f665e5f5`, node v26.7.0.
#
# Twelve of the twenty cases came back a different class from the one the
# register recorded. Every one of them is reconciled in its own rationale with
# the class it superseded. Summary:
#
#   entry  lane  scope      register class   measured class   moved?
#   -----  ----  ---------  ---------------  ---------------  ------
#   R-01   --    module     silent           fail_closed      MOVED
#   R-01   --    function   silent           fail_closed      MOVED
#   R-02   --    module     silent           fail_closed      MOVED
#   R-02   --    function   silent           fail_closed      MOVED
#   R-03   --    module     silent           fail_closed      MOVED
#   R-03   --    function   silent           fail_closed      MOVED
#   R-04   --    module     silent           fixed            MOVED
#   R-04   --    function   silent           fixed            MOVED
#   R-05   --    module     silent           fail_closed      MOVED
#   R-05   --    function   silent           fail_closed      MOVED
#   R-49   --    module     fixed            fail_closed      MOVED
#   R-49   --    function   fixed            fail_closed      MOVED
#   R-51   --    module     silent           silent           same
#   R-51   --    function   silent           silent           same
#   R-52   A     module     silent           silent           same
#   R-52   A     function   silent           silent           same
#   R-52   B     module     silent           silent           same
#   R-52   B     function   silent           silent           same
#   R-52   C     module     fl_internal      fl_internal      same
#   R-52   C     function   fl_internal      fl_internal      same
#
# The two scopes agreed on the class for EVERY entry and lane. Three entries
# (R-03, R-05, R-51) had no in-function observation in the register at all --
# `sweep-only-top-level-only`, or no scope note -- so that agreement is a new
# measurement, not a confirmation of an old one.
#
# R-49 needs the most care and its module-scope rationale spells it out: the
# reparenting defect has NOT returned. Its repro is refused before it executes,
# by the switch allowlist, because the repro's discriminant is a parameter. The
# class at the `kali run` layer is FAIL_CLOSED even though the parser-layer
# defect stays closed.
#
# ---------------------------------------------------------------------------
# HOW TO READ A RED RUN HERE.
#
# Each `verdict` below is the class this task MEASURED at HEAD, and every case
# whose measured class differs from the class the register recorded says so in
# its rationale, names the class it superseded, and gives the date, commit and
# node version of the re-measurement. A future red run therefore means the
# entry has moved AGAIN since 2026-08-15 -- which is data for the next
# regeneration of §0.2, not a defect in the case.
#
# The sibling `oracle/classifier_ground_truth.toml` was written to pin all
# eight verdict classes against constructs whose behaviour is independently
# known. If cases here go red at the same time as cases there, read that file
# first: a mislabelling classifier invalidates every verdict in this one.
#
# ---------------------------------------------------------------------------
# COST NOTE FOR R-52's REPRO C.
#
# Repro C is a runaway loop that kali runs until its fuel guard trips. It emits
# ~1.4M lines (~16MB) of stdout at module scope and ~0.5M lines (~6MB)
# in-function before `E4003`, in under three seconds per run, deterministically
# (verified: two runs byte-identical on both scopes). The runner captures each
# side twice, so these two cases are by far the most expensive in the
# directory, and a future MISMATCH on them will dump that stdout into the
# failure report. That is the price of measuring the lane the register records
# as FL-INTERNAL; the volume is the defect's own output and cannot be trimmed
# without reducing the repro.

