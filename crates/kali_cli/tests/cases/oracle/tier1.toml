verdict = "fail_closed"
rationale = """R-02, module scope. A named function aliased into a `var` and called through the alias. `console.log("CALLEE RAN")` inside the callee is kept because its absence is what proves the callee is never invoked at all, as opposed to invoked with its result discarded.

Expected verdict set from the register's recorded status: as of `61c2d48ea9`, §2's R-02 records node printing `CALLEE RAN` then `r=5` at exit 0 against kali printing `r=0` at exit 0 -- both exit 0, stdout differs, which is SILENT.

RE-MEASURED 2026-08-15 at `c4f665e5f5` against node v26.7.0: FAIL_CLOSED, SUPERSEDING SILENT. kali exits 1 with empty stdout; stderr carries `warning[E3100]: undefined identifier 'boom' reached codegen and was lowered through a zero placeholder compatibility fallback` and then `error[E5506]: calling 'g' is unavailable in the current phase: the callee does not resolve to a compiled function, so this is a call through a first-class function value, which kali cannot lower (no closure representation, no function table, no indirect call). Lowering it would silently evaluate the call to 0 without running the callee — failing closed instead`. node prints `CALLEE RAN` then `r=5` at exit 0. `E5506` is inside the documented `E55xx` range, so this classifies FAIL_CLOSED; the leading `warning[E3100]` does not affect the class, because `first_error_code` scans for `error[`, and it would not change it if it did, since the run exits nonzero either way. As of `61c2d48ea9` the register's own mechanism note called for exactly this shape -- "an allowlist at the call-lowering choke point (emit only for statically-resolved callees or admitted closure lanes, `E5506` otherwise)" -- and the emitted diagnostic names the silent-`0` lowering it declines to perform. For this construct the entry has left the silent cell: kali's stdout is empty, so there is no plausible-looking `r=0` for a reader to trust."""

