[source]
"decl-only.js" = """console.log("A");
const f = (x) => x;
console.log("B");
"""
"call-arrow.js" = """const h = (x) => x + 1;
console.log(h(41));
console.log("after");
"""
"block-arrow.js" = """const bump = () => { console.log("bump"); return 2; };
console.log(Math.atan2(0, 1, bump()));
console.log("after");
"""
"enum-preamble.js" = """const obj = { "a": 1, "b": 2 };
const keys = Object.keys(obj);
const consumeArray = (items, value) => items[0] + items[1] + value;
const arrayLiteralFirst = consumeArray([1n, 2n], 1n);
console.log(keys.length);
"""
"enum-preamble-no-args.js" = """const obj = { "a": 1, "b": 2 };
const keys = Object.keys(obj);
const consumeArray = (items, value) => items[0] + items[1] + value;
console.log(keys.length);
"""

[[case]]
name = "run_executes_statements_after_const_expression_bodied_arrow_declaration"
rationale = """Migrated from closure_return_isolation.rs. Declaring an expression-bodied arrow must not truncate the statements after it. Exact `assert_eq!` on stdout, so an exact `stdout` pin (ruling 3, clause 1)."""
args = ["run", "decl-only.js"]
exit = "success"
stdout = "A\nB\n"

[[case]]
name = "run_calls_const_expression_bodied_arrow_via_binding"
rationale = """Migrated from closure_return_isolation.rs. The arrow must be callable through its binding and must not truncate what follows. Exact `assert_eq!` on stdout, so an exact `stdout` pin."""
args = ["run", "call-arrow.js"]
exit = "success"
stdout = "42\nafter\n"

[[case]]
name = "run_executes_block_bodied_arrow_body_at_call_time_not_declaration"
rationale = """Migrated from closure_return_isolation.rs. Class-2 shape: the trailing argument must be evaluated (printing "bump")
at the Math.atan2 call, then the fold result 0 prints, then execution
continues. node ground truth: bump, 0, after.

Exact `assert_eq!` on stdout, so an exact `stdout` pin."""
args = ["run", "block-arrow.js"]
exit = "success"
stdout = "bump\n0\nafter\n"

[[case]]
name = "array_literal_argument_to_a_user_function_is_rejected"
rationale = """Migrated from closure_return_isolation.rs. Class-4/5 shape: the consumeArray declaration/calls must not truncate
the top-level enumeration logs. node ground truth: 2.

Flipped pin (soundness batch 1): `consumeArray([1n, 2n], 1n)` — an
array literal passed to a user function — is now rejected fail-closed
(E5506): the callee used to read zero placeholders, a silent
miscompile. The original return-escape regression (arrow declarations
truncating the enclosing function) stays covered by the argument-free
variant below, which must keep running to completion.

RULE 5 SPLIT: this is the FIRST of the two independent programs `run_object_enumeration_survives_const_arrow_preamble` runs. Its own claims are `!status.success()` and `stderr.contains("E5506")` -- no stdout claim, so none is written (rule 2)."""
args = ["run", "enum-preamble.js"]
exit = "failure"
stderr_contains = ["E5506"]

[[case]]
name = "object_enumeration_survives_const_arrow_preamble_without_arguments"
rationale = """Migrated from closure_return_isolation.rs. Return-escape coverage without the rejected argument shape: the arrow
preamble must not truncate the following top-level statements.

RULE 5 SPLIT: the SECOND of the two independent programs `run_object_enumeration_survives_const_arrow_preamble` runs. Exact `assert_eq!` on stdout, so an exact `stdout` pin."""
args = ["run", "enum-preamble-no-args.js"]
exit = "success"
stdout = "2\n"
