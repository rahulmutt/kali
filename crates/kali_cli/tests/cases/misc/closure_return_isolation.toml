# Migrated from tests/closure_return_isolation.rs.
#   SOURCE REF: b7f2ed5d5644fff14b03b5266fcc7f26b13ac925
#
# Const-bound arrows must compile as standalone wasm functions, so an arrow declaration
# cannot emit a `return` into the enclosing function and truncate it.
#
# Regression tests for the const-bound-arrow return-escape miscompile
# (baseline classes 2/4/5): declaring an arrow whose body contains a return
# (explicit, or the implicit return synthesized for an expression body) used
# to emit a real wasm `return` into the ENCLOSING function, silently
# truncating execution with exit 0. Arrows must instead compile as
# standalone wasm functions — the lane named functions and unnamed function
# expressions already ride.
#
# FILE-WIDE PROSE (rule 12). The paragraph above is the source's `//!` module doc: it
# describes the whole file rather than any one helper, so it lives in this header.
# Per-test prose lives in the rationale of the case it belongs to, per U6.
#
# MATRIX DECLINED. 5 source helper invocation(s) == 5 case(s) x 1 -- no axis every case
# varies over uniformly (rule 7, U1). FOUR source `#[test]` fns become FIVE `[[case]]`
# siblings, and the extra one is rule 5, not a fold:
# `run_object_enumeration_survives_const_arrow_preamble` runs TWO independent programs and
# makes independent assertions about each (one rejected, one required to run to
# completion), so it splits into two named siblings. Rule 6's 1:1 direction -- never FOLD
# two fns into one case -- is untouched.
#
# `[source]` KEYS ARE THE SOURCE'S OWN. This source already gives every program a distinct
# filename, so no U5 rename was needed and no `# EXTRA-OK:` declaration is required for
# them.
#
# U2 CHECK, RUN RATHER THAN ASSUMED. `[source]` is one flat FILE-WIDE map that `expand()`
# clones into every trial, so a fixture a sibling case needs is present in this case's
# trial too. Measured, with a known positive first, because a green that was never made
# red is not evidence:
#
#   * a sandbox policy file present in the working directory but NOT named on argv is inert. Control: the same deny-everything policy PASSED as `--sandbox` turns `console.log(1)` into `error[E9007]: inferred effect 'Console.Write' is not permitted by the active policy`, rc=5; the same three files present as `policy.json` / `tiny.policy.json` / `kali.policy.json` and not passed leave `kali run m.ts` printing `1`, rc=0.
#   * a sibling `*.test.*` fixture is inert BECAUSE every case names its program explicitly on argv, exactly as the source did. Control: a bare `kali test` in a directory holding `main.test.js` and `other.test.js` discovers both and prints `ok 2`; `kali test main.test.js` in that same directory prints `ok 1`.
#   * `kali.json` IS auto-discovered as a manifest and would not be inert. No fixture in this batch is named `kali.json`; recorded because the next batch's author cannot tell from the tree that the name is special.
#
# No fixture here is one whose mere PRESENCE or ABSENCE is a case's point, which is the
# shape U2 exists to stop.
#
# CONSEQUENCE FOR THE GATES -- `comment_coverage.py` IS EXPECTED-RED (rc=1) ON THIS PAIR
# [classes: per-case, file-wide]. The checker asks whether every source comment line
# appears in EVERY case's rationale, and it reports two different things that way:
#
#   * PER-CASE ATTRIBUTION (`from N/M cases` lines). A comment attached to one `#[test]` fn belongs in the rationale of the case that fn produced and nowhere else. U6 says so and calls copying all of a file's comments into all of its cases "over-attribution ... forbidden, even though it turns the checker green".
#   * FILE-WIDE PROSE IN THE HEADER (`from ALL N cases` lines). The source's `//!` module doc, and any helper doc carried under ruling 6's exemption, describe the whole file rather than any one case, so rule 12 puts them in this file's `#` header -- which `comment_coverage.py` deliberately does not read as coverage. Every such line is prose that IS carried, in the one place the rule says it belongs.
#
# U6 anticipates the first exactly: "on such a file the checker's false `missing` must be
# documented in the header instead." That is what this paragraph is. THE CLASS LIST ABOVE
# IS GATED, not asserted: `gen_task19_batch2.check_gate_declarations` re-runs the checker
# and requires the classes its output actually contains to match the ones named here --
# the first version of this paragraph claimed every `MISSING` was per-test attribution,
# which was false on five of seven files, and nothing would have caught it. Reproduce
# with:
#
#   python3 tools/task-18-browser-pilot/comment_coverage.py \
#     crates/kali_cli/tests/closure_return_isolation.rs \
#     crates/kali_cli/tests/cases/misc/closure_return_isolation.toml
#
# CONSEQUENCE FOR THE GATES -- `check_rationale_fn_names.py` (U8) IS EXPECTED-RED (rc=1)
# ON THIS PAIR, AND IT CANNOT BE MADE GREEN WITHOUT BREAKING RULE 12. The gate requires
# every backticked fn-shaped identifier in this file to resolve against the source `.rs`'s
# own fn list. The ones it cannot resolve here are carried VERBATIM out of the source's
# own comments -- rule 12 requires the carry, U7 forbids rewording it -- and they are:
# `return`.
#
# REMEDY: a CLI-family entry in the gate's own known-identifier allowlist. These name
# items in other crates or in the Rust standard library, which this file's source never
# declares, so no amount of correct prose resolves them. The pilot flagged the same gap on
# `nullish/assign_reject.toml` and `misc/growable_array_fail_closed.toml`.
#
# THE NAMES AND THEIR CLASSIFICATION ARE DERIVED, not asserted:
# `gen_task19_batch2.u8_reason` re-runs the gate, reads back the identifiers it could not
# explain, and decides for each whether the source DEFINES it inside a fixture program.
# The first version of this paragraph said all of them named other-crate or
# standard-library items, which was false here and would have sent a reader to a remedy
# that could not work. Reproduce with:
#
#   python3 tools/task-18-browser-pilot/check_rationale_fn_names.py \
#     crates/kali_cli/tests/closure_return_isolation.rs \
#     crates/kali_cli/tests/cases/misc/closure_return_isolation.toml
