# Migrated from tests/number_predicates_runtime.rs.
#   SOURCE REF: b7f2ed5d5644fff14b03b5266fcc7f26b13ac925
#
# The supported `Number` predicate slice runs and tests identically in text and `--output
# json` mode.
#
# MATRIX DECLINED. 4 source helper invocation(s) == 4 case(s) x 1 -- no axis every case
# varies over uniformly (rule 7, U1). Two helpers x {plain, json} == four `#[test]` fns,
# each a distinct command line. A `[matrix]` over the output mode was DECLINED: `--output
# json` changes the ASSERTION SHAPE, not just an argv token.
#
# `[source]` KEYS ARE THE SOURCE'S OWN. `main.js` and `smoke.test.js` are the filenames
# the source writes and they do not collide, so no U5 rename was needed.
#
# U2 CHECK, RUN RATHER THAN ASSUMED. `[source]` is one flat FILE-WIDE map that `expand()`
# clones into every trial, so a fixture a sibling case needs is present in this case's
# trial too. Measured, with a known positive first, because a green that was never made
# red is not evidence:
#
#   * a sandbox policy file present in the working directory but NOT named on argv is inert. Control: the same deny-everything policy PASSED as `--sandbox` turns `console.log(1)` into `error[E9007]: inferred effect 'Console.Write' is not permitted by the active policy`, rc=5; the same three files present as `policy.json` / `tiny.policy.json` / `kali.policy.json` and not passed leave `kali run m.ts` printing `1`, rc=0.
#   * a sibling `*.test.*` fixture is inert BECAUSE every case names its program explicitly on argv, exactly as the source did. Control: a bare `kali test` in a directory holding `main.test.js` and `other.test.js` discovers both and prints `ok 2`; `kali test main.test.js` in that same directory prints `ok 1`.
#   * `kali.json` IS auto-discovered as a manifest and would not be inert. No fixture in this batch is named `kali.json`; recorded because the next batch's author cannot tell from the tree that the name is special.
#
# No fixture here is one whose mere PRESENCE or ABSENCE is a case's point, which is the
# shape U2 exists to stop.
#
# RULE 13 -- CROSS-CRATE HELPER DOCS, CARRIED, AND THE CHAIN IS DERIVED RATHER THAN
# ENUMERATED. The fixtures are built one level removed inside `kali_common` and the case
# reproduces what those helpers computed, so ruling 6's test comes out the CARRY way, not
# the runner-infrastructure-exemption way. Which helpers that is was not decided here:
# `gen_task19_batch2.doc_chain` walks the call graph from each fixture builder and carries
# every documented fn it reaches, transitively, so a documented helper added upstream
# breaks the generator instead of quietly going uncarried. The first version of this batch
# enumerated the chain by hand and under-carried it -- two documented helpers, on this
# file and on both of the Number-predicate files -- which is exactly the failure a derived
# chain cannot have.
#
# ATTRIBUTION IS STILL PER HELPER (U6): the run-source CHAIN's docs go into the two `run`
# cases and the test-source CHAIN's into the two `test` cases, neither into the other
# pair. The two chains share a documented helper, which is why the same sentence appears
# on both sides -- that is the shared helper being carried twice, not one chain
# over-attributed.
#
# ASSERTION SHAPES. The text `run` branch asserts `assert_eq!(stdout.trim(), <exact>)`, an
# exact assertion modulo trailing whitespace, so it becomes an exact `stdout` pin. The
# json `run` branch's `assert_eq!(json["stdout"], <exact>)` is likewise exact and becomes
# an exact `json.stdout` pin. The text `test` branch's two `.contains` claims stay
# `stdout_contains` (ruling 3, clause 3). The json `test` branch pins the payload counters
# the source pins and no others.
#
# `json.errors = []`. The source asserts `json["errors"].as_array().is_empty()`; an empty
# TOML array compares equal to an empty JSON array element-for-element (the case runner's
# jsonpath value comparison), so this is the same claim, not a strengthening.
#
# CONSEQUENCE FOR THE GATES -- `comment_coverage.py` IS EXPECTED-RED (rc=2) ON THIS PAIR,
# AND THE RED IS THE GATE WORKING. The source carries no comment lines at all, so the
# checker's ruling-5 zero-line floor fires: without it a pair with nothing to check
# reports a vacuous green, which is the dangerous direction. Stated explicitly because *no
# prose* and *prose missed* are otherwise indistinguishable to a later reader. Reproduce
# with:
#
#   python3 tools/task-18-browser-pilot/comment_coverage.py \
#     crates/kali_cli/tests/number_predicates_runtime.rs \
#     crates/kali_cli/tests/cases/misc/number_predicates_runtime.toml
#
# CONSEQUENCE FOR THE GATES -- `check_fixtures.py` IS EXPECTED-RED (rc=2) ON THIS PAIR,
# AND THE RED IS THE GATE WORKING. It looks for fixture-shaped string LITERALS in the
# `.rs` and finds none, because both programs are built one level removed inside
# `kali_common` and exist as no literal in this source at all. rc=2 is its vacuity floor
# -- "found no fixtures to check", the dangerous direction -- and it is the correct
# answer: this pair's rule-9 fidelity is carried by the CAPTURE discipline instead (the
# fixture text is the byte-exact output of executing the real code, and
# `gen_task19_batch2.check_captured` re-checks each capture against this source before
# emitting it). Reproduce with:
#
#   python3 tools/task-18-browser-pilot/check_fixtures.py \
#     crates/kali_cli/tests/number_predicates_runtime.rs \
#     crates/kali_cli/tests/cases/misc/number_predicates_runtime.toml
#

