[source]
"fuel_runaway.ts" = """let i = 0;
while (true) {
  i = i + 1;
}
"""
"trees_64mb.ts" = """function bottomUpTree(depth) {
  if (depth > 0) {
    return { left: bottomUpTree(depth - 1), right: bottomUpTree(depth - 1) };
  }
  return { left: null, right: null };
}
function itemCheck(t) {
  if (t.left === null) {
    return 1;
  }
  return 1 + itemCheck(t.left) + itemCheck(t.right);
}
function main() {
  let check = 0;
  for (let i = 1; i <= 8000; i = i + 1) {
    const tree = bottomUpTree(8);
    check = check + itemCheck(tree);
  }
  console.log(check);
}
main();
"""
"policy.json" = """{
  "schemaVersion": 1,
  "effects": {
    "fileSystem": { "read": false, "write": false },
    "network": { "fetch": false, "connect": false, "listen": false, "maxConnections": null },
    "process": { "spawn": false, "envRead": false, "envWrite": false },
    "timer": { "schedule": false, "maxTimeoutMs": null, "maxActiveTimers": null },
    "eval": false,
    "random": false,
    "console": true
  },
  "resources": {
    "maxMemoryMB": null,
    "maxCpuTimeMs": 600000,
    "maxOpenFiles": null,
    "maxSpawnedProcesses": 0,
    "maxThreads": 0
  }
}"""
"stdout_before_trap.ts" = """console.log(777);
let i = 0;
while (true) {
  i = i + 1;
}
"""
"quiet_trap.ts" = """let i = 0;
while (true) {
  i = i + 1;
}
"""

[[case]]
name = "fuel_exhaustion_reports_e4003_with_actionable_message"
rationale = """Migrated from trap_diagnostics_runtime.rs. Runs forever; exhausts the 60M default fuel budget in well under a second.

The diagnostic must name the code, say what happened, and point at the knob that grants more compute; and it must NOT present as a bare runtime trap, which is the `stderr_absent` claim."""
args = ["run", "fuel_runaway.ts"]
exit = "failure"
stderr_contains = ["E4003", "CPU fuel budget exhausted", "resources.maxCpuTimeMs"]
stderr_absent = ["E4000"]

[[case]]
name = "deep_object_workload_is_correct_to_64mb_under_raised_fuel_policy"
rationale = """Migrated from trap_diagnostics_runtime.rs. 8000 iterations x itemCheck(depth-8 tree) = 8000 x 511

With `resources.maxCpuTimeMs` raised by a `--sandbox` policy the workload finishes; the source's exact `assert_eq!` on stdout becomes an exact `stdout` pin."""
args = ["run", "--sandbox", "policy.json", "trees_64mb.ts"]
exit = "success"
stdout = "4088000\n"

[[case]]
name = "stdout_emitted_before_a_trap_is_not_lost"
rationale = """Migrated from trap_diagnostics_runtime.rs. Output written before the trap must still be flushed to stdout, and the trap must still be reported on stderr. Both source claims are `.contains` against a field with a substring form, so both stay `*_contains` (ruling 3, clause 3)."""
args = ["run", "stdout_before_trap.ts"]
exit = "failure"
stdout_contains = ["777"]
stderr_contains = ["E4003"]

[[case]]
name = "quiet_run_still_reports_the_trap_diagnostic_on_stderr"
rationale = """Migrated from trap_diagnostics_runtime.rs. `--quiet` suppresses status text and output replay, not error output:
a trap must never become a silent nonzero exit."""
args = ["run", "--quiet", "quiet_trap.ts"]
exit = "failure"
stderr_contains = ["E4003"]
