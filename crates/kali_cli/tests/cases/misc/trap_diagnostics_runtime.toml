# Migrated from tests/trap_diagnostics_runtime.rs.
#   SOURCE REF: b7f2ed5d5644fff14b03b5266fcc7f26b13ac925
#
# A fuel-exhaustion trap reports E4003 with an actionable message, keeps pre-trap stdout,
# survives `--quiet`, and does not present as a bare E4000 runtime trap; a raised fuel
# budget lets a deep object workload finish correctly.
#
# MATRIX DECLINED. 4 source helper invocation(s) == 4 case(s) x 1 -- no axis every case
# varies over uniformly (rule 7, U1). Each `#[test]` fn runs a different command line.
#
# `[source]` KEYS ARE VARIANT-SUFFIXED (U5). The source wrote each of these programs to
# the same filename under a fresh directory per `#[test]`; `[source]` here is one
# file-wide namespace, so the four programs, which the source all wrote to `main.ts`,
# could not share one key -- the last body written would win and the other cases would
# silently run the wrong program. Each case owns a key named after it and passes that name
# as argv.
#
# U2 CHECK, RUN RATHER THAN ASSUMED. `[source]` is one flat FILE-WIDE map that `expand()`
# clones into every trial, so a fixture a sibling case needs is present in this case's
# trial too. Measured, with a known positive first, because a green that was never made
# red is not evidence:
#
#   * a sandbox policy file present in the working directory but NOT named on argv is inert. Control: the same deny-everything policy PASSED as `--sandbox` turns `console.log(1)` into `error[E9007]: inferred effect 'Console.Write' is not permitted by the active policy`, rc=5; the same three files present as `policy.json` / `tiny.policy.json` / `kali.policy.json` and not passed leave `kali run m.ts` printing `1`, rc=0.
#   * a sibling `*.test.*` fixture is inert BECAUSE every case names its program explicitly on argv, exactly as the source did. Control: a bare `kali test` in a directory holding `main.test.js` and `other.test.js` discovers both and prints `ok 2`; `kali test main.test.js` in that same directory prints `ok 1`.
#   * `kali.json` IS auto-discovered as a manifest and would not be inert. No fixture in this batch is named `kali.json`; recorded because the next batch's author cannot tell from the tree that the name is special.
#
# No fixture here is one whose mere PRESENCE or ABSENCE is a case's point, which is the
# shape U2 exists to stop.
#
# U13 -- A DUPLICATED FIXTURE BODY, AND WHY IT IS NOT HOISTED. `fuel_runaway.ts` and
# `quiet_trap.ts` carry BYTE-IDENTICAL program text: the source writes the same runaway
# loop under two labels. U13 says hoist a byte-identical shared body into `[constants]`;
# ruling 7 says decline when the shared text is an INLINE LITERAL rather than a declared
# source constant, because `check_fixtures.py` searches only `[source]` values and step
# `body`, so a hoisted body turns that gate red on a correct file. This is the
# inline-literal case, so the hoist is declined -- and U13's other half is honoured: the
# identity is asserted MECHANICALLY in `tools/migration/gen_task19_batch2.py`, which
# raises if the two literals ever stop being byte-identical, rather than being eyeballed.
#
# HELPER DOC CARRIED FROM THE SOURCE (rule 12). `unique_fixture_slug`
# (`trap_diagnostics_runtime.rs:12-19`) carries:
#
#   Build a process-wide-unique directory name for a test fixture.
#
#   Uniqueness must NOT depend on wall-clock resolution: tests run
#   multi-threaded, and on platforms with a coarse `SystemTime` clock (e.g.
#   macOS) two concurrent calls can observe the same `as_nanos()` value,
#   collide on the same temp dir, and clobber each other's fixture file. A
#   process-wide monotonic counter guarantees uniqueness independently of the
#   wall-clock's resolution.
#
# RULING 6 EXEMPTION, APPLIED TO A LOCAL HELPER DOC RATHER THAN A CROSS-CRATE ONE. The doc
# above describes how the Rust harness kept its own temp directories from colliding. The
# migrated case depends on nothing that helper computed: the case runner gives every trial
# its own `tempfile::tempdir()`, so the helper's job is now the runner's job -- which is
# ruling 6's own test for the exemption. Carried verbatim here so nothing is dropped (rule
# 12), and deliberately NOT replicated into every rationale, because attributing harness
# mechanics to every case is the over-attribution U6 forbids.
#
# ASSERTION SHAPES. `stderr.contains(...)` stays `stderr_contains` (ruling 3, clause 3);
# `!stderr.contains("E4000")` is an absence claim and becomes `stderr_absent`; the one
# exact `assert_eq!` on stdout becomes an exact `stdout` pin.
#
# EXTRA-OK: 'fuel_runaway.ts' -- U5 variant-suffixed `[source]` key surfaced as an argv token; it is a fixture FILENAME, not a claim about behaviour
# EXTRA-OK: 'quiet_trap.ts' -- U5 variant-suffixed `[source]` key surfaced as an argv token; it is a fixture FILENAME, not a claim about behaviour
# EXTRA-OK: 'stdout_before_trap.ts' -- U5 variant-suffixed `[source]` key surfaced as an argv token; it is a fixture FILENAME, not a claim about behaviour
# EXTRA-OK: 'trees_64mb.ts' -- U5 variant-suffixed `[source]` key surfaced as an argv token; it is a fixture FILENAME, not a claim about behaviour
#
# CONSEQUENCE FOR THE GATES -- `comment_coverage.py` IS EXPECTED-RED (rc=1) ON THIS PAIR
# [classes: per-case, file-wide]. The checker asks whether every source comment line
# appears in EVERY case's rationale, and it reports two different things that way:
#
#   * PER-CASE ATTRIBUTION (`from N/M cases` lines). A comment attached to one `#[test]` fn belongs in the rationale of the case that fn produced and nowhere else. U6 says so and calls copying all of a file's comments into all of its cases "over-attribution ... forbidden, even though it turns the checker green".
#   * FILE-WIDE PROSE IN THE HEADER (`from ALL N cases` lines). The source's `//!` module doc, and any helper doc carried under ruling 6's exemption, describe the whole file rather than any one case, so rule 12 puts them in this file's `#` header -- which `comment_coverage.py` deliberately does not read as coverage. Every such line is prose that IS carried, in the one place the rule says it belongs.
#
# U6 anticipates the first exactly: "on such a file the checker's false `missing` must be
# documented in the header instead." That is what this paragraph is. THE CLASS LIST ABOVE
# IS GATED, not asserted: `gen_task19_batch2.check_gate_declarations` re-runs the checker
# and requires the classes its output actually contains to match the ones named here --
# the first version of this paragraph claimed every `MISSING` was per-test attribution,
# which was false on five of seven files, and nothing would have caught it. Reproduce
# with:
#
#   python3 tools/task-18-browser-pilot/comment_coverage.py \
#     crates/kali_cli/tests/trap_diagnostics_runtime.rs \
#     crates/kali_cli/tests/cases/misc/trap_diagnostics_runtime.toml
#
# CONSEQUENCE FOR THE GATES -- `check_rationale_fn_names.py` (U8) IS EXPECTED-RED (rc=1)
# ON THIS PAIR, AND IT CANNOT BE MADE GREEN WITHOUT BREAKING RULE 12. The gate requires
# every backticked fn-shaped identifier in this file to resolve against the source `.rs`'s
# own fn list. The ones it cannot resolve here are carried VERBATIM out of the source's
# own comments -- rule 12 requires the carry, U7 forbids rewording it -- and they are:
# `as_nanos`.
#
# REMEDY: a CLI-family entry in the gate's own known-identifier allowlist. These name
# items in other crates or in the Rust standard library, which this file's source never
# declares, so no amount of correct prose resolves them. The pilot flagged the same gap on
