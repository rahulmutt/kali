  const o = [];
  o.push(10);
  o.push(20);
  o.push(30);
  const out = [];
  for (const v of o) {
    out.push(v);
  }
  console.log(out.length);
  for (const v of out) {
    console.log(v);
  }
}
main();
"""
"run_supports_growable_array_growth_across_realloc_boundary_in_js_and_ts_input.test.${ext}" = """
