#   SOURCE REF: b7f2ed5d5644fff14b03b5266fcc7f26b13ac925
#
# The frozen `Object.hasOwn` alias surface: `check` accepts it in all four input
# extensions, while `run` and `test` fail closed and loud because the fixture's own
# self-check throws.
#
# MATRIX DECLARED. 16 source helper invocation(s) == 4 case(s) x ext(4) == 4 x 4. FOUR of
# the source's five `#[test]` fns are migrated here; the fifth is a U4 trim-and-keep
# retention (see the paragraph below). Each of the four loops the same four input
# extensions, so 4 fns x 4 extensions == 16 invocations and every case varies over the
# extension uniformly (rule 7, U1). The `[source]` keys carry the axis, so a `js` trial
# materialises only `main.js` and `main.test.js`.
#
# U4 TRIM-AND-KEEP: THE FIFTH `#[test]` FN IS RETAINED HAND-WRITTEN, AND THE SPLIT IS
# DERIVED RATHER THAN CHOSEN. `assert_frozen_object_has_own` (`:79-131`, numbered against
# the pre-trim blob the retained file's own `PRE-TRIM REF:` names) asserts nothing beyond
# `output.status.success()` for any test in the file: its `if json_output` block and its
# `else if command == "run"` block are both UNREACHABLE, because its only caller passes
# `json_output = false` and `command = "check"`. Eleven literals the audit extracts from
# those blocks are therefore DEAD -- a value computed but never asserted, which rule 2
# forbids turning into a claim and rule 3 forbids shipping a red audit around. Controller
# ruling R1 sends an unreachable-code claim to a §5.11 retention.
#
# WHICH TESTS REACH IT -- the enumerating command, run before this sentence (ruling 13):
#
#   cd crates/kali_cli/tests && python3 - <<'EOF'
#   import re
#   t = open("object_has_own_frozen_js_input.rs").read()
#   for m in re.finditer(r"#\[test\]\s*\nfn ([a-z_0-9]+)\s*\([^)]*\)\s*\{(.*?)\n\}", t, re.S):
#       print(m.group(1), sorted(set(re.findall(
#           r"\b(assert_frozen_object_has_own(?:_fails_closed)?)\s*\(", m.group(2)))))
#   EOF
#
# EXACTLY ONE of the five reaches it --
# `check_accepts_frozen_object_has_own_in_js_ts_jsx_tsx_input`. The other four route
# through `assert_frozen_object_has_own_fails_closed`, a disjoint helper that shares no
# assertion with it. So U4's trim applies and its whole-file clause does NOT: whole-file
# retention is legitimate only when EVERY test reaches the construct, and here four of
# five do not. One test retained, four migrated, 16 trials.
#
# FIXTURE PROVENANCE (rules 8/9). Both programs are built by a `format!` whose
# placeholders are filled from FOUR `kali_common::` helpers. Neither text exists as a
# literal anywhere, so both were captured by EXECUTING the real code
# (`tools/migration/t19b2_captures.py` records the command); nothing was hand-substituted.
#
# RULE 13 -- CROSS-CRATE HELPER DOCS, CARRIED, AND THE CHAIN IS DERIVED RATHER THAN
# ENUMERATED. The fixtures are built one level removed inside `kali_common` and the case
# reproduces what those helpers computed, so ruling 6's test comes out the CARRY way, not
# the runner-infrastructure-exemption way. Which helpers that is was not decided here:
# `gen_task19_batch2.doc_chain` walks the call graph from each fixture builder and carries
# every documented fn it reaches, transitively, so a documented helper added upstream
# breaks the generator instead of quietly going uncarried. The first version of this batch
# enumerated the chain by hand and under-carried it -- two documented helpers, on this
# file and on both of the Number-predicate files -- which is exactly the failure a derived
# chain cannot have.
#
# U2 CHECK, RUN RATHER THAN ASSUMED. `[source]` is one flat FILE-WIDE map that `expand()`
# clones into every trial, so a fixture a sibling case needs is present in this case's
# trial too. Measured, with a known positive first, because a green that was never made
# red is not evidence:
#
#   * a sandbox policy file present in the working directory but NOT named on argv is inert. Control: the same deny-everything policy PASSED as `--sandbox` turns `console.log(1)` into `error[E9007]: inferred effect 'Console.Write' is not permitted by the active policy`, rc=5; the same three files present as `policy.json` / `tiny.policy.json` / `kali.policy.json` and not passed leave `kali run m.ts` printing `1`, rc=0.
#   * a sibling `*.test.*` fixture is inert BECAUSE every case names its program explicitly on argv, exactly as the source did. Control: a bare `kali test` in a directory holding `main.test.js` and `other.test.js` discovers both and prints `ok 2`; `kali test main.test.js` in that same directory prints `ok 1`.
#   * `kali.json` IS auto-discovered as a manifest and would not be inert. No fixture in this batch is named `kali.json`; recorded because the next batch's author cannot tell from the tree that the name is special.
#
# No fixture here is one whose mere PRESENCE or ABSENCE is a case's point, which is the
# shape U2 exists to stop.
#
# RULE 11 -- AN OR-SHAPED ASSERTION WHOSE STREAM DEPENDS ON THE OUTPUT MODE. The
# fail-closed helper accepts `stderr.contains("E4000") || stdout.contains("E4000")`.
# Resolved against the real binary, the answer is NOT the same for every case, and that is
# the finding: in text mode the code lands on STDERR and stdout carries none of it; under
# `--output json` the process writes NOTHING to stderr and the code appears inside the
# JSON envelope on STDOUT. Exactly one disjunct is true per case -- no ruling-17 tie --
# and each case pins the stream its own trial actually uses, verified uniform across all
# four extensions. The source's disjunction sentence is carried into every affected
# rationale.
#

