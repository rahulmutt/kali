# Migrated from tests/growable_array_fail_closed.rs.
#   SOURCE REF: ee0d086a82729d3938fcd4e822ed01f2507c68d7
#
# Stage 4 Task 6: out-of-scope growable-array shapes fail CLOSED (E5506),
# never a silent wrong answer. A growable-shape binding (`const o = []`) that
# is a `.push` receiver but cannot be promoted — because it escapes, is
# aliased, is pushed through a computed/optional-chain call, is captured by a
# closure, is mutated by a non-`push` method, is pushed with the wrong arity,
# or would carry an unsupported (float/object) element — must be rejected at
# compile time, not left on the pre-existing push-no-op lane whose length/
# index reads silently diverge from node.
#
# Modeled on `growable_array_core.rs` (kali_bin() helper, tempdir, `run`),
# asserting `!status.success()` + stderr contains `error[E5506]` for each.
#
# MATRIX ARITHMETIC — IT CLOSES EXACTLY, AND ONE SOURCE FN HAD TO MOVE OUT FOR
# IT TO (rule 7, U1).
#
# `assert_fail_closed_e5506` (`:23-51`) runs every source it is given twice,
# `for extension in ["js", "ts"]`, so `ext` is a real axis. Enumerating every
# helper invocation in the source, expanding every loop:
#
#   10 fns calling assert_fail_closed_e5506  x 2 extensions          = 20
#   multi_arg_console_log_with_growable_read_fails_closed:
#       2 sources x 2 extensions                                     =  4
#   malformed_push_call_reports_the_push_not_a_position:
#       2 sources x 1 extension (`smoke.test.js`, HARDCODED at :157) =  2
#                                                                     ----
#   total real invocations in growable_array_fail_closed.rs           = 26
#
# `[matrix]` is FILE-WIDE with no per-case opt-out (U1): every `[[case]]` is
# fanned by every axis. `malformed_push_call_reports_the_push_not_a_position`
# does NOT vary over `ext` — it hardcodes `.js` — so fanning it here would
# manufacture two `.ts` trials the source never ran, which is a rule-2
# invention as well as a rule-7 arithmetic break. It is therefore migrated to
# its own case file, `growable_array_fail_closed_push_diagnostics.toml`, which
# declares no matrix. The two files are one migration and are audited together.
#
#   this file:            12 cases x 2 (ext) = 24
#   push_diagnostics:      2 cases x 1       =  2
#                                             ----
#                                               26   == the source's 26. Closes.
#
# `[source]` keys are per-case and `${ext}`-suffixed (U5): `[source]` is one
# flat FILE-WIDE namespace cloned into every trial (U2), so twelve cases cannot
# share the source's single `smoke.test.{extension}` key. U2 CHECK, run rather
# than assumed: every program is standalone and references no sibling filename,
# so the other eleven fixtures being present in each trial is inert. No case
# here turns on a fixture's presence or absence.
#
# No `[source]` key contains a literal this source asserts (`error[E5506]`,
# `console output of multiple arguments`), so none of them can satisfy an audit
# claim by accident — see the channel documented in
# `cases/misc/bitwise_operators_runtime.toml`.
#
# CONSEQUENCE FOR THE GATES — `check_rationale_fn_names.py` IS EXPECTED-RED ON
# THIS FILE, AND THE RED IS RULE 12 DOING ITS JOB.
#
#   python3 tools/task-18-browser-pilot/check_rationale_fn_names.py \
#     crates/kali_cli/tests/growable_array_fail_closed.rs \
#     crates/kali_cli/tests/cases/misc/growable_array_fail_closed.toml
#   # -> UNEXPLAINED: `obj_fields_of`, `obj_literal_slots`,
#   #                 `obj_materialized`            ... rc=1
#
# All three are carried VERBATIM out of the source's own `///` doc comment on
# `object_identifier_push_fails_closed` (`:134-139`). They name compiler
# internals in other crates, not fns in `growable_array_fail_closed.rs`, so they
# cannot resolve against it. Removing them would violate rule 12; rewording them
# would violate U7. The sibling file
# `growable_array_fail_closed_push_diagnostics.toml` carries no such name and
# this gate is GREEN on it (rc=0) — so the red here is specific to the carried
# prose, not to the migration. Same disposition and same named fix as
# `cases/nullish/assign_reject.toml`: extend the script's known-identifier
# allowlist, in the instrument dispatch. NOT worked around, and NOT silenced.

