[constants]
dollar = "$"

[source]
"run_interpolates_float_expressions.ts" = """
console.log(`v: ${dollar}{7 / 2}`);
const x = 7 / 2;
console.log(`x=${dollar}{x}`);
"""
"run_interpolates_inside_functions.ts" = """
function show(v) {
  console.log(`p: ${dollar}{v}`);
}
show(9 / 2);
"""
"run_interpolates_ints_strings_and_adjacent_segments.ts" = """
console.log(`${dollar}{1}${dollar}{2}`);
console.log(`sum: ${dollar}{1 + 2}`);
console.log(`hi ${dollar}{"kali"}!`);
"""
"run_interpolates_string_variables.ts" = """
const name = "kali";
console.log(`hi ${dollar}{name}!`);
"""
"run_keeps_plain_templates_unchanged.ts" = """
console.log(`hello`);
"""
"run_rejects_escaped_interpolation_with_e2004.ts" = """
console.log(`cost: \\${dollar}{5}`);
"""

