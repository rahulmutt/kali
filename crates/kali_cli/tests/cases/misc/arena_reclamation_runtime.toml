"break_inside_arena_loop_is_sound.ts" = """
function mk(v) {
  return { a: v, b: v + 1 };
}
function main() {
  let sum = 0;
  for (let i = 0; i < 1000; i = i + 1) {
    const obj = mk(i);
    sum = sum + obj.a;
    if (i === 50) {
      break;
    }
  }
  const after = mk(999);
  console.log(sum + after.a + after.b);
}
main();
"""
"factory_functions_get_no_arena.ts" = """
function bottomUpTree(depth) {
  if (depth > 0) {
    return { left: bottomUpTree(depth - 1), right: bottomUpTree(depth - 1) };
  }
  return { left: null, right: null };
}
function itemCheck(t) {
  if (t.left === null) {
    return 1;
  }
  return 1 + itemCheck(t.left) + itemCheck(t.right);
}
function main() {
  let total = 0;
  for (let i = 0; i < 100; i = i + 1) {
    const tree = bottomUpTree(10);
    total = total + itemCheck(tree);
  }
  console.log(total);
}
main();
"""
"mini_binary_trees_output_exact.ts" = """
function bottomUpTree(depth) {
  if (depth > 0) {
    return { left: bottomUpTree(depth - 1), right: bottomUpTree(depth - 1) };
  }
  return { left: null, right: null };
}
function itemCheck(t) {
  if (t.left === null) {
    return 1;
  }
  return 1 + itemCheck(t.left) + itemCheck(t.right);
}
function main() {
  const minDepth = 4;
  const maxDepth = 8;
  const stretchDepth = maxDepth + 1;
  let total = itemCheck(bottomUpTree(stretchDepth));
  const longLivedTree = bottomUpTree(maxDepth);
  for (let depth = minDepth; depth <= maxDepth; depth = depth + 2) {
    const iterations = 1 << (maxDepth - depth + minDepth);
    let check = 0;
    for (let i = 1; i <= iterations; i = i + 1) {
      check = check + itemCheck(bottomUpTree(depth));
    }
    total = total + check;
  }
  total = total + itemCheck(longLivedTree);
  console.log(total);
}
main();
"""
"mixed_returned_and_scratch_function_is_sound.ts" = """
function make(seed) {
  const scratch = { a: seed, b: seed + 1, c: seed + 2, d: seed + 3, e: seed + 4, f: seed + 5 };
  const s = scratch.a + scratch.b + scratch.c + scratch.d + scratch.e + scratch.f;
  return { v: s };
}
function main() {
  let total = 0;
  for (let i = 0; i < 100; i = i + 1) {
    const r1 = make(i);
    const r2 = make(i + 1000);
    total = total + r1.v + r2.v;
  }
  console.log(total);
}
main();
"""
"mixed_scratch_and_returned_call_result_is_sound.ts" = """
function build(v) {
  return { v: v };
}
function make(seed) {
  const scratch = { a: seed, b: seed + 1, c: seed + 2, d: seed + 3, e: seed + 4, f: seed + 5 };
  const s = scratch.a + scratch.b + scratch.c + scratch.d + scratch.e + scratch.f;
  return build(s);
}
function main() {
  let total = 0;
  for (let i = 0; i < 100; i = i + 1) {
    const r1 = make(i);
    const r2 = make(i + 1000);
    total = total + r1.v + r2.v;
  }
  console.log(total);
}
main();
"""
"module_global_store_fails_closed.ts" = """
function mk(v) {
  return { a: v, b: v + 1 };
}
function store(arr, v) {
  arr[0] = mk(v);
}
function main() {
  const arr = [mk(0)];
  for (let i = 1; i <= 100; i = i + 1) {
    store(arr, i);
  }
  console.log(arr[0].a + arr[0].b);
}
main();
"""
"nested_arena_loops_correct.ts" = """
function mk(v) {
  return { a: v, b: 2 * v };
}
function main() {
  let total = 0;
  for (let outer = 0; outer < 50; outer = outer + 1) {
    let rowSum = 0;
    for (let inner = 0; inner < 200; inner = inner + 1) {
      const cell = mk(inner);
      rowSum = rowSum + cell.a + cell.b;
    }
    total = total + rowSum;
  }
  console.log(total);
}
main();
"""
"nested_arena_loops_with_inner_break_is_sound.ts" = """
function mk(v) {
  return { a: v, b: v + 1 };
}
function main() {
  let total = 0;
  for (let outer = 0; outer < 20; outer = outer + 1) {
    const outerObj = mk(outer);
    for (let inner = 0; inner < 30; inner = inner + 1) {
      const cell = mk(inner);
      if (inner === 10) {
        break;
      }
    }
    total = total + outerObj.a + outerObj.b;
  }
  console.log(total);
}
main();
"""
"recursive_function_arena_sound.ts" = """
function recurse(depth) {
  const scratch = { a: depth, b: depth * 2, c: depth * 3 };
  let sum = scratch.a + scratch.b + scratch.c;
  if (depth <= 0) {
    return sum;
  }
  return sum + recurse(depth - 1);
}
function main() {
  console.log(recurse(500));
}
main();
"""
"return_from_arena_loop_is_sound.ts" = """
function mk(v) {
  return { a: v, b: v * 2 };
}
function findFirstOver(limit) {
  for (let i = 0; i < 1000; i = i + 1) {
    const obj = mk(i);
    if (obj.a + obj.b > limit) {
      return i;
    }
  }
  return -1;
}
function main() {
  const found = findFirstOver(100);
  const after = mk(found);
  console.log(found + after.a + after.b);
}
main();
"""
"store_to_outer_fails_closed.ts" = """
function mk(v) {
  return { a: v, b: v + 1 };
}
function main() {
  let last = mk(0);
  for (let i = 1; i <= 100; i = i + 1) {
    last = mk(i);
  }
  console.log(last.a + last.b);
}
main();
"""

