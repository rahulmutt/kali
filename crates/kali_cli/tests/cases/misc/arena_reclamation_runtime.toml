name = "nested_arena_loops_with_inner_break_is_sound"
rationale = "Migrated 1:1 from `arena_reclamation_runtime.rs`'s `#[test] fn nested_arena_loops_with_inner_break_is_sound`. The source asserts the command succeeds. It asserts that stdout is exactly the pinned text, which mirrors the source's own exact assertion (ruling 3, clause 1). Regression pin for the break double-release bug (whole-branch review finding 1): an unlabeled `break` used to emit its OWN inline arena release in `emit_break_or_continue`, and that release's `Br` lands exactly where `emit_loop` already emits its own unconditional normal-exit release — so the same `ArenaFrame` was released twice.  The bug is invisible with a single arena'd loop (`break_inside_arena_loop_is_sound` above): with nothing enclosing it, the frame's saved page/cursor/limit are all zero, so a second `__arena_reset` walking an empty page list is a harmless no-op. It only corrupts state when the loop that breaks is NESTED inside an outer loop that has ALREADY allocated (a non-zero saved page) at the moment the inner loop opens: the inner frame's saved trio is then the OUTER arena's own live page/cursor/limit. The (buggy) inline release correctly recycles the inner loop's own pages and restores the trio to the outer arena's values — then falling through into `emit_loop`'s unconditional release runs `__arena_reset` A SECOND time, this time against the now-current (just-restored) OUTER arena, splicing the outer loop's still-live pages onto the free list out from under it: a corrupted free list / use-after-free, not merely \"the inner loop's own pages released twice\".  `outerObj` is allocated directly in the OUTER loop's body, OUTSIDE the inner loop, every outer iteration, so the outer arena's saved trio is always non-zero by the time the inner loop opens. The inner loop allocates its own `cell` objects and unconditionally breaks partway through, then `outerObj` is read back immediately after the inner loop closes, every outer iteration (20 of them, to give the corrupted free list many chances to alias a still-live page into a later allocation and clobber `outerObj`'s fields before they're read). outerObj = mk(outer) => a=outer, b=outer+1, so each iteration contributes 2*outer + 1; total = sum_{outer=0}^{19} (2*outer + 1) = 2*(0+1+...+19) + 20 = 2*190 + 20 = 400. Build a process-wide-unique directory name for a test fixture. Uniqueness must NOT depend on wall-clock resolution: tests run multi-threaded, and on platforms with a coarse `SystemTime` clock (e.g. macOS) two concurrent calls can observe the same `as_nanos()` value and collide on the same temp dir. A process-wide monotonic counter guarantees uniqueness independently of the wall-clock's resolution."
args = ["run", "nested_arena_loops_with_inner_break_is_sound.ts"]
exit = "success"
stdout = """
400
"""

