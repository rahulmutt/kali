*i + 6030) = 12*(99*100/2) + 100*6030       = 12*4950 + 603000 = 59400 + 603000 = 662400. Build a process-wide-unique directory name for a test fixture. Uniqueness must NOT depend on wall-clock resolution: tests run multi-threaded, and on platforms with a coarse `SystemTime` clock (e.g. macOS) two concurrent calls can observe the same `as_nanos()` value and collide on the same temp dir. A process-wide monotonic counter guarantees uniqueness independently of the wall-clock's resolution."
args = ["run", "mixed_returned_and_scratch_function_is_sound.ts"]
exit = "success"
stdout = """
662400
"""

