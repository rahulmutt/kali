  const parenthesizedFrozenCallableKeys = Object.freeze((globalThis.Reflect.ownKeys))(obj);
  let syncCount = 0;
  for (const key of Reflect.ownKeys(obj)) {
    syncCount += 1;
  }
  let sequenceCount = 0;
  for (const key of (0, Reflect.ownKeys(obj))) {
    sequenceCount += 1;
  }
  let mixedSequenceCount = 0;
