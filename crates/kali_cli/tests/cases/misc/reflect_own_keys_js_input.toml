# Migrated from tests/reflect_own_keys_js_input.rs.
#   SOURCE REF: b7f2ed5d5644fff14b03b5266fcc7f26b13ac925
#
# `Reflect.ownKeys` ordering holds across every supported spelling of the callable --
# dotted, bracketed, single-quoted, parenthesized and frozen -- under `check`, `run` and
# `test`.
#
# MATRIX DECLINED. 5 source helper invocation(s) == 5 case(s) x 1 -- no axis every case
# varies over uniformly (rule 7, U1). Each `#[test]` fn is a distinct command line over
# one of the two programs.
#
# `[source]` KEYS ARE THE SOURCE'S OWN. `main.js` and `main.test.js` are the filenames the
# source writes and they do not collide, so no U5 rename was needed.
#
# FIXTURE PROVENANCE (rules 8/9). The `run` program is built by a `format!` whose
# placeholder is filled from kali_common's reflect_own_keys_frozen_callable_source, so its
# text was captured by EXECUTING the real code rather than hand-substituted. The `test`
# program is a plain literal and was pulled from the `.rs` unchanged.
#
# RULE 13 -- ATTRIBUTION IS PER HELPER, NOT PER FILE (U6). The kali_common doc below is
# carried into the rationale of exactly the THREE cases whose fixture reaches that helper
# -- the ones that run `main.js`. The two `main.test.js` cases use a plain-literal fixture
# that never calls it, so the doc is deliberately absent from them; copying it into all
# five would be the over-attribution U6 forbids.
#
# U2 CHECK, RUN RATHER THAN ASSUMED. `[source]` is one flat FILE-WIDE map that `expand()`
# clones into every trial, so a fixture a sibling case needs is present in this case's
# trial too. Measured, with a known positive first, because a green that was never made
# red is not evidence:
#
#   * a sandbox policy file present in the working directory but NOT named on argv is inert. Control: the same deny-everything policy PASSED as `--sandbox` turns `console.log(1)` into `error[E9007]: inferred effect 'Console.Write' is not permitted by the active policy`, rc=5; the same three files present as `policy.json` / `tiny.policy.json` / `kali.policy.json` and not passed leave `kali run m.ts` printing `1`, rc=0.
#   * a sibling `*.test.*` fixture is inert BECAUSE every case names its program explicitly on argv, exactly as the source did. Control: a bare `kali test` in a directory holding `main.test.js` and `other.test.js` discovers both and prints `ok 2`; `kali test main.test.js` in that same directory prints `ok 1`.
#   * `kali.json` IS auto-discovered as a manifest and would not be inert. No fixture in this batch is named `kali.json`; recorded because the next batch's author cannot tell from the tree that the name is special.
#
# No fixture here is one whose mere PRESENCE or ABSENCE is a case's point, which is the
# shape U2 exists to stop.
#
# ASSERTION SHAPES. Every fn asserts `assert_eq!(status.code(), Some(0))`, which is an
# exact exit-code claim and becomes `exit = 0` rather than `exit = "success"`.
# `stdout.contains("reflect ownKeys ok")` stays `stdout_contains`; the same `.contains`
# taken against the JSON string leaf `json["stdout"]` becomes `json_count` with `at_least
# = 1`, per ruling 3's amended clause 4. The two exact `assert_eq!(json["stdout"], "")` /
# `(json["stderr"], "")` claims are exact and are pinned exactly.
#
# CONSEQUENCE FOR THE GATES -- `comment_coverage.py` IS EXPECTED-RED (rc=2) ON THIS PAIR,
# AND THE RED IS THE GATE WORKING. The source carries no comment lines at all, so the
# checker's ruling-5 zero-line floor fires: without it a pair with nothing to check
# reports a vacuous green, which is the dangerous direction. Stated explicitly because *no
# prose* and *prose missed* are otherwise indistinguishable to a later reader. Reproduce
# with:
#
#   python3 tools/task-18-browser-pilot/comment_coverage.py \
#     crates/kali_cli/tests/reflect_own_keys_js_input.rs \
#     crates/kali_cli/tests/cases/misc/reflect_own_keys_js_input.toml
#

