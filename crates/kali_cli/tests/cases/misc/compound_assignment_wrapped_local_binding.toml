# Migrated from tests/compound_assignment_wrapped_local_binding.rs.
#   SOURCE REF: ee0d086a82729d3938fcd4e822ed01f2507c68d7
#
# A parenthesis-wrapped local binding (`((value)) += 2`) is still a valid
# compound-assignment target, across `run` and `test`, `.js` and `.ts`, the text
# and `--output json` surfaces, and the browser-requested harness.
#
# The source carries no `//` or `///` comments of its own. An earlier version of
# this header turned that into "rules 12 and 13 have nothing to carry here",
# which is too blanket a sentence to be right by construction; the correction
# that replaced it went too far the other way, and BOTH errors are recorded here
# rather than quietly overwritten.
#
# `compound_assignment_wrapped_local_binding.rs:42` reaches one `///`-documented
# item in another crate — the constant `kali_runtime_contract::
# BROWSER_HARNESS_COMMAND_ENV` and its one-line doc, at
# `crates/kali_runtime_contract/src/browser/contract.rs:83-84`. Its value is the
# `KALI_BROWSER_BUNDLE_HARNESS_COMMAND` key the four browser-harness cases below
# set as `env`.
#
# THE DOC IS NOT CARRIED. Task 19's pilot carried it into the rationale of those
# four cases on ruling 6's dependency test. The controller adjudicated that
# reading against this file (Task 19 instruments, fix round 1) and it does not
# stand. Rule 13's own text is "a case produced through a helper CALL CHAIN
# carries every `///` doc comment on every HELPER in that chain"; a
# `pub const &str` is neither a helper nor in a call chain. The case reproduces
# the constant's VALUE — spelled literally in each browser-harness case's `env`
# — and rule 13 exists so that behaviour encoded in a helper is not lost. A
# const's prose doc is description; its behaviour IS its value, and the value is
# carried.
#
# `cases/browser/non_literal_iterator_sources_explicit_api.toml:164-178` reached
# the opposite conclusion first, for the same constant, and ENUMERATED shipped
# precedent before writing it (ruling 13's discipline). That file governs; this
# one was the deviation.
#
# THIS HEADER MAY NOT QUOTE THAT DOC SENTENCE, and the constraint is mechanical
# rather than stylistic. `gen_batch6b.py`'s `contract_doc_precedent()` gates the
# browser file's claim — no shipped case file that sets this env var carries the
# doc line — by scanning each case file's WHOLE TEXT for it, excluding only its
# own two files by stem. So a header that merely quotes the sentence to explain
# why it is not carried trips the same assertion a real carry does. Measured, not
# assumed: deleting the four rationale carries while leaving the sentence quoted
# here left `gen_batch6b.py` failing identically. The sentence is therefore named
# by symbol and by source line above, never reproduced. Reproduce the claim with:
#
#   grep -rl "KALI_BROWSER_BUNDLE_HARNESS_COMMAND" crates/kali_cli/tests/cases/
#   grep -rlF "$(sed -n '83s|^ *///  *||p' \
#     crates/kali_runtime_contract/src/browser/contract.rs)" \
#     crates/kali_cli/tests/cases/ | grep -v non_literal_iterator_sources
#
# The second command lists nothing. It reads the needle out of the contract crate
# rather than spelling it, for the same reason this header does not: a literal
# needle written here would make this file a member of its own enumeration and
# the answer would move by being written (ruling 11, and the `grep -v` is the
# browser header's version of the same problem).
#
# CONSEQUENCE FOR THE GATES: `comment_coverage.py` exits **2** on this pair —
# `0 non-divider comment lines checked against 10 cases`. That is ruling 5's
# zero-line floor firing exactly as designed, not a defect: the source has no
# comment lines of its own to check, and without the floor this pair would report
# a vacuous green. Reproduce with:
#
#   python3 tools/task-18-browser-pilot/comment_coverage.py \
#     crates/kali_cli/tests/compound_assignment_wrapped_local_binding.rs \
#     crates/kali_cli/tests/cases/misc/compound_assignment_wrapped_local_binding.toml
#   # -> rc=2
#
# Ten source `#[test]` fns become ten named `[[case]]` siblings, 1:1 per rule 6.
#
# MATRIX DECLINED, AND THE ARITHMETIC THAT DECLINES IT (rule 7). Every test
# calls one helper, `assert_wrapped_compound_assignment(command, filename,
# source, json_output, browser_harness)` (`:28-81`), so the candidate axes are
# its flags: command x extension x json_output x browser_harness. That product
# is 2 x 2 x 2 x 2 = 16, and the source makes 10 invocations, one per fn. 16 !=
# 10, so no `[matrix]` over those axes closes. The gap is not arbitrary — the
# source deliberately does not exercise six combinations (there is no
# `json_run` + `browser_harness` pair, no non-json `test` + `browser_harness`
# pair, and no `json_test` without `browser_harness`). Declaring the axes anyway
# would fan every case over combinations the source never ran, inventing six
# untested cells: a rule-2 invention as well as a rule-7 break. Named siblings
# instead. 10 real invocations == 10 cases x 1.
#
# `[source]` HAS FOUR KEYS FOR TEN CASES, AND THAT IS CORRECT. `[source]` is
# file-wide (U2), and here it does not need per-case disambiguation: the ten
# invocations run only four distinct (filename, program) pairs, and the cases
# that share one differ in ARGV, not in program text. `main.js` carries the
# `run` program for the plain, json and browser-harness `run` cases alike. U2's
# hazard is a fixture whose conditional presence is a case's point; nothing here
# turns on presence, and every program is standalone with no sibling reference.
#
# `exit = 0` RATHER THAN `exit = "success"`: the helper asserts BOTH
# `output.status.success()` (`:56`) and `assert_eq!(output.status.code(),
# Some(0))` (`:62`). The exact code claim is the stronger of the two and implies
# the other, so pinning it carries both (rule 1: an exact source assertion
# becomes an exact pin).
#
# NO `stdout` PIN ON THE SIX NON-JSON CASES (rule 2). The helper reads stdout
# only inside `if json_output` (`:64-80`); on the text path it asserts exit
# status and nothing else. The real binary does print `1\n` for the four `run`
# cases and `ok 1\n` for the two text `test` cases (captured live), and pinning
# either would be an assertion added because it is true rather than because the
# source made it. The four json cases pin exactly the fields the helper reads.
#
# `errors = []` is the direct form of the helper's
# `assert!(json["errors"].as_array().expect("errors array").is_empty())`:
# the case runner compares arrays element-wise AFTER a length check
# (`crates/kali_case_runner/src/jsonpath.rs`), so an empty-array expectation
# asserts emptiness rather than asserting nothing.

[source]
"main.js" = "let value = 1; ((value)) += 2; ((value)) -= 1; ((value)) *= 5; ((value)) /= 2; ((value)) %= 4; ((value)) **= 3; console.log(value);\n"
"main.ts" = "let value = 1; ((value)) += 2; ((value)) -= 1; ((value)) *= 5; ((value)) /= 2; ((value)) %= 4; ((value)) **= 3; console.log(value);\n"
"main.test.js" = """Kali.test('wrapped compound assignment', () => {
  let value = 1;
  ((value)) += 2;
  ((value)) -= 1;
  ((value)) *= 5;
  ((value)) /= 2;
  ((value)) %= 4;
  ((value)) **= 3;
  return value;
});
"""
"main.test.ts" = """Kali.test('wrapped compound assignment', () => {
  let value = 1;
  ((value)) += 2;
  ((value)) -= 1;
  ((value)) *= 5;
  ((value)) /= 2;
  ((value)) %= 4;
  ((value)) **= 3;
  return value;
});
"""

