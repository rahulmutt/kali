#
# The second half of one migration. `growable_array_fail_closed.rs`'s other
# eleven `#[test]` fns live in `cases/misc/growable_array_fail_closed.toml`;
# this file carries `malformed_push_call_reports_the_push_not_a_position`
# alone, and the two are audited together against the one source.
#
# WHY IT IS SPLIT OUT — U1, not preference. The sibling file declares
# `[matrix] ext = ["js", "ts"]`, because `assert_fail_closed_e5506` runs every
# source it is given under both extensions. `[matrix]` is FILE-WIDE and has no
# per-case opt-out (U1): every `[[case]]` in a file is fanned by the full
# cross-product. This source fn does NOT vary over that axis — it hardcodes
# `smoke.test.js` (`growable_array_fail_closed.rs:157`) and never builds a
# `.ts` command. Fanning it by `ext` would manufacture two `.ts` trials the
# source never ran: a rule-2 invention, and a rule-7 arithmetic break. A
# `[[case]]` cannot opt out of a file's matrix, so only a separate case file
# can carry it. The full arithmetic, and how the two files sum to the source's
# 26 real invocations, is stated in the sibling file's header.
#
# Rule 5 split: the source fn loops over two independent programs, so it
# becomes two named sibling cases rather than one folded case.
#
# NOTE — NO `stdout` PIN HERE, DELIBERATELY (rule 2). The ten cases that go
# through `assert_fail_closed_e5506` pin `stdout = ""`, because that helper
# asserts `stdout.is_empty()` (`:41-44`). This source fn does NOT: its loop body
# (`:156-178`) asserts only `!status.success()`, `stderr.contains("error[E5506]")`,
# `stderr.contains("has a \`.push\` call")`, and
# `!stderr.contains("appears in a position")`. Both programs do in fact produce
# empty stdout on the real binary (captured live), and pinning it here would be
# an assertion added because it is true rather than because the source made it —
# exactly what rule 2 forbids.
#
# The `!stderr.contains(...)` claim is carried by `stderr_absent`, which is its
# direct equivalent: a negated substring claim on the same stream.
#
# EXTRA-OK: 'malformed_push_object_literal_arg.test.js' -- U5 variant-suffixed `[source]` key, surfaced as an argv token; it is a fixture FILENAME, not a claim about behaviour. The source wrote every program to one `main.ts`/`smoke.test.{extension}` under a fresh dir per test, which a single file-wide `[source]` namespace cannot reproduce (U2), so the keys had to be renamed and argv had to follow
# EXTRA-OK: 'malformed_push_wrong_arity.test.js' -- U5 variant-suffixed `[source]` key, surfaced as an argv token; it is a fixture FILENAME, not a claim about behaviour. The source wrote every program to one `main.ts`/`smoke.test.{extension}` under a fresh dir per test, which a single file-wide `[source]` namespace cannot reproduce (U2), so the keys had to be renamed and argv had to follow
#
# CONSEQUENCE FOR THE GATES — `comment_coverage.py` IS EXPECTED-RED (rc=1) ON
# THIS PAIR, FOR U6's REASON. The checker asks whether every source comment line
# appears in every case's rationale; U6 says a comment belongs in the rationale
# of exactly the cases its producing helper reaches, and calls copying all of a
# file's comments into all of its cases "over-attribution ... forbidden, even
# though it turns the checker green". Every `MISSING` this reports is a
# per-test comment correctly attributed to its own case and correctly absent
# from its siblings. U6 anticipates this exactly: "on such a file the checker's
# false `missing` must be documented in the header instead." That is what this
# paragraph is. Reproduce with:
#
#   python3 tools/task-18-browser-pilot/comment_coverage.py \
#     crates/kali_cli/tests/growable_array_fail_closed.rs \
#     crates/kali_cli/tests/cases/misc/growable_array_fail_closed_push_diagnostics.toml
#   # -> rc=1, every line a per-test comment absent from its siblings

