present, `main`'s loop emits no save/zero-trio prologue and no `__arena_reset` call at all around the `call` loop). This is NOT optional set dressing — it is the whole point of this test: a plain `for` loop calling a scalar-returning function (no escaping store anywhere) was tried first and the escape/arena gate correctly granted THAT loop its own per-iteration arena (Task 6, interprocedural: nothing escapes the call, so the loop safely reclaims `scratchSum`'s internal allocations between calls without any Task-7 code running at all) — which made an early version of this test pass even against the pre-Task-7 codegen, defeating it as a TDD RED/GREEN pin. With the loop's own arena genuinely vetoed via `taint`, NOTHING but a Task-7 per-call function arena on `scratchSum` itself can reclaim its scratch, confirmed by re-running this exact fixture against the pre-Task-7 codegen and observing a real E4000 allocation-failure trap (see the task report).  Cumulative: 300 calls x ~64KB ~= 18.3MB, over 2x an 8MB memory cap — passes only if the per-call function arena actually reclaims between calls. (The fill and sum are folded into ONE loop over `buf`, not two, to keep the total instruction count in the same ballpark as the already-passing `per_iteration_loop_allocations_are_reclaimed` above rather than tripping the CPU-fuel guard instead of the memory cap.) scratchSum(seed) = sum_{i=0}^{7999} (seed+i) = 8000*seed + 31996000. total = sum_{call=0}^{299} scratchSum(call)       = 8000 * (0+...+299) + 300*31996000       = 8000*44850 + 9598800000 = 358800000 + 9598800000       = 9957600000. Build a process-wide-unique directory name for a test fixture. Uniqueness must NOT depend on wall-clock resolution: tests run multi-threaded, and on platforms with a coarse `SystemTime` clock (e.g. macOS) two concurrent calls can observe the same `as_nanos()` value and collide on the same temp dir. A process-wide monotonic counter guarantees uniqueness independently of the wall-clock's resolution."
