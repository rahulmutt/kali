[source]
"function_scratch_is_reclaimed.ts" = """
function taint(v) {
  return { v: v };
}
function scratchSum(seed) {
  const marker = { tag: seed };
  const buf = new Array(8000);
  let sum = 0;
  for (let i = 0; i < 8000; i = i + 1) {
    buf[i] = seed + i;
    sum = sum + buf[i];
  }
  return sum;
}
function main() {
  const taints = new Array(1);
  let total = 0;
  for (let call = 0; call < 300; call = call + 1) {
    taints[0] = taint(call);
    total = total + scratchSum(call);
  }
  console.log(total + taints[0].v - taints[0].v);
}
main();
"""
"per_iteration_loop_allocations_are_reclaimed.ts" = """
function mkRow() {
  return { a: 1, b: 2, c: 3, d: 4 };
}
function main() {
  let sum = 0;
  for (let round = 0; round < 400; round = round + 1) {
    let last = 0;
    for (let i = 0; i < 8000; i = i + 1) {
      const row = mkRow();
      last = row.a + row.d;
    }
    sum = sum + last;
  }
  console.log(sum);
}
main();
"""
"policy.json" = "${MEM8_POLICY_JSON}"
"spans_inside_arena_loop.ts" = """
function mkSpan(tag) {
  const marker = { tag: tag };
  const arr = new Array(20000);
  const t = tag + 0;
  arr[0] = t;
  arr[19999] = t * 2;
  return arr[0] + arr[19999];
}
function main() {
  let sum = 0;
  for (let i = 0; i < 200; i = i + 1) {
    sum = sum + mkSpan(i);
  }
  console.log(sum);
}
main();
"""

