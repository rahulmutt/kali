#
# CONSEQUENCE FOR THE GATES — `comment_coverage.py` IS EXPECTED-RED (rc=1) ON
# THIS PAIR, FOR U6's REASON. The checker asks whether every source comment line
# appears in every case's rationale; U6 says a comment belongs in the rationale
# of exactly the cases its producing helper reaches, and calls copying all of a
# file's comments into all of its cases "over-attribution ... forbidden, even
# though it turns the checker green". Every `MISSING` this reports is a
# per-test comment correctly attributed to its own case and correctly absent
# from its siblings. U6 anticipates this exactly: "on such a file the checker's
# false `missing` must be documented in the header instead." That is what this
# paragraph is. Reproduce with:
#
#   python3 tools/task-18-browser-pilot/comment_coverage.py \
#     crates/kali_cli/tests/bitwise_operators_runtime.rs \
#     crates/kali_cli/tests/cases/misc/bitwise_operators_runtime.toml
#   # -> rc=1, every line a per-test comment absent from its siblings

[constants]
PACK = "let byte = 0;\nfor (let i = 0; i < 8; i = i + 1) { byte = (byte << 1) | 1; }\n"

[source]
"shift_left_and_or_pack_bits.js" = "${PACK}console.log(\"\" + byte);"
"bw_and.js" = "${PACK}console.log(\"\" + (byte & 15));"
"bw_or.js" = "${PACK}console.log(\"\" + (byte | 256));"
"bw_xor.js" = "${PACK}console.log(\"\" + (byte ^ 255));"
"shift_right_arithmetic.js" = "${PACK}console.log(\"\" + (byte >> 4));"
"shift_right_arithmetic_negative.js" = "${PACK}let neg = 0 - byte;\nconsole.log(\"\" + (neg >> 1));"
"unsigned_shift_zero_extends.js" = "${PACK}let neg = 0 - byte;\nconsole.log(\"\" + (neg >>> 0));"
"bw_on_float_rejected.js" = "let x = 0.0;\nfor (let i = 0; i < 3; i = i + 1) { x = x + 1.5; }\nconsole.log(\"\" + (x & 1));"

[[case]]
name = "shift_left_and_or_pack_bits"
rationale = """Migrated from bitwise_operators_runtime.rs. Builds a runtime byte = 255 via loop-carried shift+or (mandelbrot's packing), defeating constant folding, then exercises each operator against it."""
args = ["run", "shift_left_and_or_pack_bits.js"]
exit = "success"
stdout = "255\n"

[[case]]
name = "bitwise_and"
rationale = """Migrated from bitwise_operators_runtime.rs. Builds a runtime byte = 255 via loop-carried shift+or (mandelbrot's packing), defeating constant folding, then exercises each operator against it."""
args = ["run", "bw_and.js"]
exit = "success"
stdout = "15\n"

[[case]]
name = "bitwise_or"
rationale = """Migrated from bitwise_operators_runtime.rs. Builds a runtime byte = 255 via loop-carried shift+or (mandelbrot's packing), defeating constant folding, then exercises each operator against it."""
args = ["run", "bw_or.js"]
exit = "success"
stdout = "511\n"

[[case]]
name = "bitwise_xor"
rationale = """Migrated from bitwise_operators_runtime.rs. Builds a runtime byte = 255 via loop-carried shift+or (mandelbrot's packing), defeating constant folding, then exercises each operator against it."""
args = ["run", "bw_xor.js"]
exit = "success"
stdout = "0\n"

[[case]]
name = "shift_right_arithmetic"
rationale = """Migrated from bitwise_operators_runtime.rs. Builds a runtime byte = 255 via loop-carried shift+or (mandelbrot's packing), defeating constant folding, then exercises each operator against it."""
args = ["run", "shift_right_arithmetic.js"]
exit = "success"
stdout = "15\n"

[[case]]
name = "shift_right_arithmetic_negative"
rationale = """Migrated from bitwise_operators_runtime.rs. Builds a runtime byte = 255 via loop-carried shift+or (mandelbrot's packing), defeating constant folding, then exercises each operator against it.

neg = -255 (runtime), -255 >> 1 = -128 (sign-preserving)"""
args = ["run", "shift_right_arithmetic_negative.js"]
exit = "success"
stdout = "-128\n"

[[case]]
name = "unsigned_shift_zero_extends"
rationale = """Migrated from bitwise_operators_runtime.rs. Builds a runtime byte = 255 via loop-carried shift+or (mandelbrot's packing), defeating constant folding, then exercises each operator against it.

-255 >>> 0 = 4294967041 (uint32)"""
args = ["run", "unsigned_shift_zero_extends.js"]
exit = "success"
stdout = "4294967041\n"

[[case]]
name = "bitwise_on_float_operand_is_rejected"
rationale = """Migrated from bitwise_operators_runtime.rs. x is f64 (seeded by 1.5), loop-derived so not folded; `x & 1` must reject.

The source accepts either of two outcomes: `out.contains("5506") || out.to_lowercase().contains("bitwise")`, taken against stdout and stderr concatenated. Resolved against the real binary per rule 11 and ruling 17: stdout is empty, stderr carries `error[E5506]: bitwise operator '&' on a floating-point operand is unavailable in the current phase; use integer operands or the later compatibility path`. Both disjuncts hold on that stream, so the first in source order is pinned (`5506` on stderr) and the second is disclosed rather than pinned — pinning every true disjunct would be a rule-2 invention, and the second disjunct is a case-insensitive claim the format has no key for."""
args = ["run", "bw_on_float_rejected.js"]
exit = "failure"
stderr_contains = ["5506"]
