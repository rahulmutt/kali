#   SOURCE REF: ee0d086a82729d3938fcd4e822ed01f2507c68d7
#
# Bitwise and shift operators against a runtime-packed byte, plus the
# fail-closed reject for a float operand.
#
# Eight source `#[test]` fns become eight named `[[case]]` siblings, one-to-one per
# rule 6. No `[matrix]`: seven cases run through `run_js` (which asserts
# success) and one through `run_js_expect_failure` (which asserts failure), and
# each pins a different stdout, so no axis is varied uniformly by all eight
# (rule 7). Declined-matrix arithmetic, recorded per rule 7: 8 helper
# invocations == 8 cases x 1 — no axis product to close.
#
# RULE 8 — THE `format!` FIXTURES WERE RESOLVED BY EXECUTION, NOT BY HAND.
# Seven of the eight sources are built as `format!("{PACK}...")`. Their resolved
# text was captured by compiling and running the real `format!` calls
# (`tools/migration/pilot_task19_dump_bitwise.rs`, copied verbatim from the source's
# `PACK` declaration and its eight `#[test]` bodies), never by hand-applying
# Rust's substitution rules. Note what that execution settled and a hand
# derivation would have got wrong: the resolved program has NO trailing newline
# after the final `console.log(...);` — `PACK` ends in `\n` but the appended
# text does not.
#
# U13 — `PACK` IS HOISTED INTO `[constants]`, AND THE TWO GATES DISAGREE ABOUT
# WHETHER THAT IS CORRECT. THE AUDIT WINS, BECAUSE RULE 3 SAYS IT IS ABSOLUTE.
#
# U13 requires a body duplicated across entries, or a long common prefix shared
# by two or more entries, to be hoisted and the identity asserted mechanically.
# `PACK`'s two lines are a byte-identical prefix of seven of the eight fixtures,
# so U13 applies. Controller ruling 7 declined exactly this hoist for
# `browser/`, on the ground that `check_fixtures.py` searches only `[source]`
# values and step `body`, so a hoisted body makes the rule-9 gate go red on a
# correct file.
#
# That ground was re-tested here rather than inherited, and the placements were
# run against BOTH gates:
#
#   A. PACK hoisted into [constants]   check_fixtures.py: RED    audit: GREEN
#   B. PACK inlined into [source]      check_fixtures.py: GREEN  audit: RED
#   C. PACK inlined into [source] AND
#      declared in [constants] with
#      nothing referencing it           check_fixtures.py: GREEN  audit: GREEN
#
# CORRECTION — AN EARLIER VERSION OF THIS HEADER SAID "there is no placement of
# `PACK` that satisfies both". THAT WAS FALSE, and placement C is why. It was
# found in review, and reproduced here: inline every fixture body, leave the
# `[constants] PACK` declaration in place referencing nothing, and both gates go
# green. `assertion_strings()` (`scripts/audit-case-migration.py:1359-1371`)
# ranges over every `[constants]` VALUE whether or not anything references it,
# and nothing rejects an unused constant.
#
# PLACEMENT C IS REJECTED ANYWAY, and the reason is not aesthetic. A dead
# `[constants]` entry is a false-green channel in the ABSOLUTE gate. Probed one
# layer up from a known positive, on `cases/nullish/assign_reject.toml`:
#
#   delete its real `stderr_contains = ["E5506"]`
#     -> AUDIT FAILED — 1 claim(s) absent: [contains literals] 'E5506'   rc=1
#   same deletion, plus `[constants] UNUSED_NOTE = "E5506"` referenced by nothing
#     -> AUDIT OK — every literal claim is present                       rc=0
#
# A genuinely dropped assertion is returned to green by a constant nothing uses.
# So placement C duplicates the fixture body (worse on U13) AND buys its second
# green with exactly the mechanism rule 4 forbids — "never force a false green".
# Placement A stands. The audit hole is NOT worked around here and NOT fixed
# here; it is routed to the instrument dispatch, because 60 more files will be
# audited against it.
#
# Inlined, `check_fixtures.py` reports `FIXTURE CHECK OK — every fixture program
# appears verbatim` (and prints `format!-built (segments matched)` for all
# seven), while the audit reports `AUDIT FAILED — 1 claim(s) absent: [rule
# constants] 'let byte = 0;\nfor (let i = 0; i < 8; ...'`. Hoisted, they swap.
#
# WHY THIS DIFFERS FROM `browser/`, which is the transferable part: in
# `browser/` the duplicated text was a bundle BODY — an inline literal the audit
# has no claim about, so declining the hoist cost nothing at the audit. Here
# `PACK` is a genuine source-level string constant, declared as `const PACK: &str`, which the
# audit extracts as a RULE CONSTANT claim, and the audit searches `[constants]` but
# deliberately NOT `[source]` (program text is not a claim). So the audit
# REQUIRES the hoist. Ruling 7's declination therefore does not transfer to a
# shared prefix that is a declared source constant; the discriminator is whether
# the duplicated text is a declared source constant (hoist is mandatory) or an
# inline literal
# (decline, per ruling 7).
#
# CONSEQUENCE FOR THE GATES: `check_fixtures.py` is EXPECTED-RED on this pair
# and the red is a false failure. Reproduce with:
#
#   python3 tools/task-18-browser-pilot/check_fixtures.py \
#     crates/kali_cli/tests/bitwise_operators_runtime.rs \
#     crates/kali_cli/tests/cases/misc/bitwise_operators_runtime.toml
#   # -> UNMATCHED: <inline literal ...> 'let byte = 0;\nfor (let i = 0; ...'
#
# It is a tool limitation with a named fix, not a property of the format:
# `check_fixtures.py` already carries `_substitute` (`:195`), an exact port of
# `expand.rs::substitute`, but applies it only in the `--argv-correspondence`
# arm (`:251`, `:266`). Resolving `${...}` into `[source]` BODIES before the
# verbatim search would make this pair green and would be strictly more correct,
# since it would compare what the runner actually writes to disk. Left for the
# instrument dispatch; not worked around here.
#
# The mechanical identity assertion ruling 7 makes mandatory is the substitution
# itself: `${PACK}` cannot differ between entries, because there is only one
# definition of it.
#
# `[source]` keys are variant-suffixed per U5. The source wrote every program to
# the same `main.js` under a fresh `tempdir()` per test; `[source]` here is one
# flat FILE-WIDE namespace cloned into every trial (U2), so eight cases cannot
# share one key. Every program is standalone and references no sibling
# filename, so the other seven being present in each trial is inert — the U2
# check, run rather than assumed.
#
# WHY FOUR KEYS ARE `bw_*` AND NOT `bitwise_*`: A `[source]` KEY MUST NOT
# CONTAIN A LITERAL THE SOURCE ASSERTS. This was found by running the audit, not
# by reasoning. The keys were first named after their cases — `bitwise_and.js`,
# `bitwise_or.js`, `bitwise_xor.js`, `bitwise_on_float_operand_is_rejected.js`.
# Every `[source]` key is also passed as an argv token, and `args` is a field
# `audit-case-migration.py` searches as an assertion surface (correctly: argv
# tokens are claims). The source's disjunction needle `bitwise` is a SUBSTRING of
# those four filenames, so the audit reported:
#
#   DISJUNCTION — ... the case files pin '5506', 'bitwise'.
#                     Every branch is pinned; nothing is suppressed
#
# — crediting this file with pinning a branch it does not pin. Renaming the four
# keys to `bw_*`, changing nothing else, flips it to the truthful:
#
#   DISJUNCTION — ... the case files pin '5506'.
#                     Unpinned and NOT reported missing: 'bitwise'
#
# Harmless here (the audit exits 0 either way and this arm is advisory), but the
# CHANNEL is not harmless: the audit's forward direction is "an old literal must
# appear somewhere in the new files," and a filename can satisfy it. The audit's
# own docstring reasons carefully about excluding prose homes — comments,
# `rationale`, `name`, `[source]` bodies — but `args` is deliberately INCLUDED,
# and U5's convention of naming a key after its case smuggles descriptive prose
# into argv.
#
# THE RULE, SCOPED — an earlier version of this header proposed the absolute
# form ("a `[source]` key may not contain any literal its source asserts"), and
# that form is UNENFORCEABLE: measured against the shipped corpus, **77 of 161**
# `cases/browser/*.toml` already violate it, nearly all of them because the key
# `smoke.test.${ext}` contains the asserted literal `test`. Adopting it would
# red-list most of a reviewed family for a collision that carries no risk, since
# `test` is independently carried by argv and by a `json` leaf in those files.
#
#   python3 - <<'PY'   # the enumerating command for 77/161
#   import glob,tomllib,os
#   def leaves(v,o):
#       if isinstance(v,str): o.add(v)
#       elif isinstance(v,dict):
#           for k,x in v.items(): o.add(k); leaves(x,o)
#       elif isinstance(v,list):
#           for x in v: leaves(x,o)
#   n=0
#   for p in glob.glob("crates/kali_cli/tests/cases/browser/*.toml"):
#       d=tomllib.load(open(p,"rb")); keys=list((d.get("source") or {}).keys())
#       lits=set()
#       for c in d.get("case",[]):
#           for s in (c.get("step") or [c]):
#               for k in ("stdout_contains","stderr_contains","stdout_absent","stderr_absent"):
#                   lits.update(s.get(k) or [])
#               for k in ("stdout","stderr"):
#                   if isinstance(s.get(k),str): lits.add(s[k])
#               if "json" in s: leaves(s["json"],lits)
#       if any(l and len(l)>1 and l in k for k in keys for l in lits): n+=1
#   print(n)
#   PY
#
# The enforceable form, which is what this file actually follows:
#
#   A LITERAL WHOSE ONLY CARRIER IS A FIXTURE NAME IS NOT PINNED. No `[source]`
#   key, `[constants]` value, or `env` value may be the SOLE place an asserted
#   literal appears — those three are the same channel, and `[constants]` and
#   `env` are strictly wider than `[source]` keys, because the audit searches
#   both as assertion surfaces and neither has to be referenced by anything to
#   be searched (see the dead-constant probe above).
#
# That is the version with teeth: it flags exactly the cases where the audit's
# green rests on a name rather than on a claim, and it leaves the 77 alone,
# because in every one of them the literal has a real carrier elsewhere. `bw_*`
# satisfies it either way; the rename stands, because `bitwise` had NO other
# carrier in this file — it is an unpinned disjunct — which is precisely the
# scoped rule's trigger.
#
# RULE 11 / RULING 17 — THE OR IN `bitwise_on_float_operand_is_rejected`.
# The source asserts a disjunction:
#
#   out.contains("5506") || out.to_lowercase().contains("bitwise")
#
# where `out` is `run_js_expect_failure`'s STDOUT AND STDERR CONCATENATED
# (`:43-45`). Rule 11 resolves an OR against the real binary. Ruling 17 governs
# what happens when more than one disjunct is true, which is the case here, and
# its procedure was followed:
#
#   1. Resolve the stream by observation. Captured live: stdout is EMPTY and
#      stderr carries `error[E5506]: bitwise operator '&' on a floating-point
#      operand is unavailable in the current phase; use integer operands or the
#      later compatibility path`. Unambiguous — the claim is a stderr claim.
#   2. Among disjuncts universally true on that stream, pin the FIRST IN SOURCE
#      ORDER. Both are true: the stream contains `5506`, and lowercased it
#      contains `bitwise`. First in source order is `out.contains("5506")`, so
#      `stderr_contains = ["5506"]` is the pin — the needle exactly as the
#      source spells it (`5506`, not `E5506`).
#   3. Disclose the other. The second disjunct,
#      `out.to_lowercase().contains("bitwise")`, also holds on the observed
#      stream. It is NOT pinned: pinning every true disjunct is a rule-2
#      invention, not the conservative choice (ruling 17). It is also the
#      disjunct the format could not carry faithfully in any case — it is a
#      CASE-INSENSITIVE substring claim, and there is no case-folding assertion
#      key. That is a second, independent reason it is disclosed rather than
#      pinned, and it is recorded here because it is a shape the browser family
#      never produced.
#
# EXTRA-OK: 'bw_and.js' -- U5 variant-suffixed `[source]` key, surfaced as an argv token; it is a fixture FILENAME, not a claim about behaviour. The source wrote every program to one `main.ts`/`smoke.test.{extension}` under a fresh dir per test, which a single file-wide `[source]` namespace cannot reproduce (U2), so the keys had to be renamed and argv had to follow
