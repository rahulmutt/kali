# Numeric-literal spellings node refuses with a SyntaxError. kali refuses
# each with E1100 from the lexer (see numeric_literal_grammar.toml).

[matrix]
bad = ["0x", "0b2", "0o8", "0xfg", "1__0", "1_", "0_1", "07.5", "042n", "1.5n"]

[source]
"bad.js" = "console.log(${bad});\n"

[[case]]
name = "a_malformed_numeric_literal_is_refused_with_e1100"
rationale = "node refuses each of these spellings with a SyntaxError, so kali must not run them. Before this project the prefixed ones failed with a misleading E3100 and `1.5n` reached the parser as a BigInt."
args = ["check", "bad.js"]
exit = "failure"
stderr_contains = ["E1100", "invalid numeric literal"]
