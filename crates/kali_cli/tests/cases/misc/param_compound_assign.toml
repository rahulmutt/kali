[[case]]
name = "mixed_scalar_and_indirect_edges_reject_param_compound"
rationale = """Migrated from param_compound_assign.rs, source `#[test]` fn `mixed_scalar_and_indirect_edges_reject_param_compound` -- one `[[case]]` per source `#[test]` fn (rule 6), and the `[source]` key is that fn's name so the mapping survives the source's deletion.

The source asserts `!out.status.success()`, pinned as `exit = "failure"`. It makes no claim about STDOUT, so none is written; its only stream claim is the stderr one below (rule 2: nothing is pinned merely because the trial happens to emit it). RULE 11 / RULING 17 -- AN OR-SHAPED ASSERTION, RESOLVED BY OBSERVATION. The source's own sentence is carried verbatim: `stderr.contains("E5506") || stderr.contains("not a provably scalar")`. The format has no disjunction, so the OR was resolved against the real binary. Observed on this cell: the stream is stderr and EVERY disjunct holds -- it emits `error[E5506]: compound assignment on binding 'p' is unavailable: it is not a provably scalar number or string (an array or object value has no compound-assignment lowering)`. Ruling 17 therefore applies: among disjuncts universally true on that stream, pin the FIRST IN SOURCE ORDER -- 'E5506' -- and disclose the others, which are 'not a provably scalar'. Pinning all of them would be a rule-2 invention: `A` and `A and B` are both stronger than `A or B`, but they are ordered, so pinning one is the strictly weaker and more faithful strengthening, and the source never asserted the second unconditionally.

POSITIVE-PROOF gate (fasta Spec 6 final-review follow-up). The `non_scalar_params`
array taint only sees a DIRECT array argument (a bare-identifier array binding
or a syntactic `[..]`/`new Array`). A param that receives an array through an
INDIRECT call shape keeps the DEFAULT `I64` repr — indistinguishable from a
genuine int param — and would pass a repr-only allowlist and miscompile. The
gate now admits a compound/update param ONLY when interprocedural flow
POSITIVELY proved it receives a scalar; every indirect array shape below is
left unproven and rejects. Each reproducer prints a wrong scalar + exit 0 on
the pre-fix binary (node disagrees); all must reject fail-closed.

Existential-laundering closure (Spec 7 Task 1): a scalar edge at one call
site must NOT admit a compound assign when ANOTHER edge passes an unproven
(indirect, non-syntactically-scalar) argument. `g()` is a call-result → the
`f(g())` edge is a veto → `f`'s `p += 1` must reject fail-closed (E5506),
even though `f(5)` is a scalar edge. Masked today (indirect delivery gives 0)
but must be structurally closed."""
args = ["run", "mixed_scalar_and_indirect_edges_reject_param_compound.ts"]
exit = "failure"
stderr_contains = ["E5506"]

