# MATRIX DECLINED. 4 source helper invocation(s) == 4 case(s) x 1. Named siblings, one `[[case]]` per real invocation (rule 5), so a failing trial names the source `#[test]` fn it came from. A `[matrix]` axis is not declared: `[matrix]` is FILE-WIDE (U1) and these files' cases do not all vary over one axis uniformly, so an axis would fan cases the source never ran (rule 2) and the arithmetic would not close (rule 7).
#
# U5 -- EVERY `[source]` KEY IS RENAMED, AND THE RENAME IS FORCED. `[source]` is one flat file-wide namespace and expand.rs clones the whole map into every trial (U2), but these sources write MANY DIFFERENT programs to the same filename. A bare `main.ts` reused across cases would give every trial the last body written and silently destroy the cases' discriminating power. Each key is therefore the source `#[test]` fn's own name plus the original suffix chain, so the fn name survives the source's deletion. The WHOLE suffix chain is kept (`.test.js`, not `.js`) because kali test dispatches on the `.test.` infix: U5 permits renaming an argv filename, not renaming one whose shape the tool reads.
#
# U13 -- THE HOIST IS DECLINED (ruling 7), and the duplication is asserted rather than eyeballed. check_fixtures.py's toml_program_texts reads `[source]` values verbatim and never resolves a `${NAME}` reference, so hoisting a shared body into `[constants]` makes the rule-9 fixture gate report UNMATCHED on a correct file. The property is the TOOL's, not the family's, which is what makes ruling 7 apply here as well as in `browser/`. check_duplication_is_the_sources_own requires the set of distinct rendered `[source]` bodies to equal the set of distinct fixture texts the extractor produced, so every byte-identical pair below is the SOURCE's own duplication and not the generator's.
#
# EVERY GATE THAT IS RED ON THIS PAIR, NAMED HERE WITH A REPRODUCTION THAT RUNS (ruling 9). All five of ruling 19's gates are run on every generator invocation and the list below is the generator's OWN output, not a second computation of the same thing -- so a gate that went green would fail this file rather than leave a stale claim, and a NEW red raises instead of shipping undeclared. The gates not listed are green.
