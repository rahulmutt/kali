# Migrated from tests/runtime_fasta_capstone.rs.
#   SOURCE REF: b7f2ed5d5644fff14b03b5266fcc7f26b13ac925
#
# The fasta capstone shell run under the node API surface with `N` supplied through
# `process.argv`, pinned against the node golden.
#
# MATRIX DECLINED. 1 source helper invocation(s) == 1 case(s) x 1 -- no axis every case
# varies over uniformly (rule 7, U1). The single `#[test]` fn is a single `kali run --api
# node ... -- 8` invocation.
#
# FIXTURE PROVENANCE (rules 8/9). `FASTA_CAPSTONE_SHELL` is a `const &str`, so its text is
# reproduced here byte-for-byte from the real declaration; the generator pulls it through
# a dump target that `include!`s the source rather than retyping it.
#
# ARGV. `--` separates kali's own arguments from the program's, and `8` is the `N` the
# source passes; `n = +process.argv[2]` reads it.
#
# `[constants]` HOIST, AND WHY IT IS MANDATORY HERE RATHER THAN DECLINED. The program
# under test is a declared source constant -- a Rust const item -- which
# `audit-case-migration.py` extracts as a `rule constants` claim that must appear on the
# surface `assertion_strings()` searches. That surface includes `[constants]` values and
# deliberately EXCLUDES `[source]` bodies, so with the body inlined the audit reports the
# constant absent and exits 1 -- and rule 3 makes the audit absolute. Both placements were
# run against both gates rather than either instruction being inherited:
#
#   placement                      check_fixtures.py   audit-case-migration.py
#   hoisted into `[constants]`     RED (UNMATCHED)     GREEN
#   inlined into `[source]`        GREEN               RED (rule constants absent)
#
# This is the pilot's bitwise_operators_runtime deadlock reproduced on a second family,
# and its derived discriminator is what decides it: HOIST when the shared text is a
# declared source constant (the audit requires it), DECLINE when it is an inline literal
# (ruling 7). There is no third placement that is not the one the instrument dispatch
# closed -- inlining the body AND leaving an unreferenced `[constants]` entry is now
# itself an `AUDIT FAILED`.
#
# CONSEQUENCE FOR THE GATES -- `check_fixtures.py` IS EXPECTED-RED (rc=1) ON THIS PAIR. It
# searches `[source]` values and step `body` verbatim, and this file's `[source]` value is
# `${FASTA_CAPSTONE_SHELL}`, resolved only at expansion time. The red is a fixable tool
# limitation, not a property of the format: `check_fixtures.py` already carries
# `_substitute`, an exact port of `expand.rs::substitute`, and applies it only in the
# `--argv-correspondence` arm. Reproduce with:
#
#   python3 tools/task-18-browser-pilot/check_fixtures.py \
#     crates/kali_cli/tests/runtime_fasta_capstone.rs \
#     crates/kali_cli/tests/cases/runtime/fasta_capstone.toml
#

[constants]
FASTA_CAPSTONE_SHELL = """var last = 42;
function rand(max) { last = (last * 3877 + 29573) % 139968; return max * last / 139968; }
function makeCumulative(table) {
  var prev = null;
  for (var c in table) {
    if (prev) table[c] = table[c] + table[prev];
    prev = c;
  }
}
function fastaRepeat(n, seq) {
  var seqi = 0;
  var lenOut = 60;
  while (n > 0) {
    if (n < lenOut) lenOut = n;
    if (seqi + lenOut < seq.length) {
      console.log(seq.substring(seqi, seqi + lenOut));
      seqi = seqi + lenOut;
    } else {
      console.log(seq.substring(seqi) + seq.substring(0, lenOut - (seq.length - seqi)));
      seqi = lenOut - (seq.length - seqi);
    }
    n = n - lenOut;
  }
}
function fastaRandom(n, table) {
  var line = new Array(60);
  makeCumulative(table);
  while (n > 0) {
    if (n < line.length) line = new Array(n);
    for (var i = 0; i < line.length; i = i + 1) {
      var r = rand(1);
      for (var c in table) { if (r < table[c]) break; }
      line[i] = c;
    }
    console.log(line.join(""));
    n = n - line.length;
  }
}
var ALU = "GGCCGGGCGCGGTGGCTCACGCCTGTAATCCCAGCACTTTGG" +
"GAGGCCGAGGCGGGCGGATCACCTGAGGTCAGGAGTTCGAGA" +
"CCAGCCTGGCCAACATGGTGAAACCCCGTCTCTACTAAAAAT" +
"ACAAAAATTAGCCGGGCGTGGTGGCGCGCGCCTGTAATCCCA" +
"GCTACTCGGGAGGCTGAGGCAGGAGAATCGCTTGAACCCGGG" +
"AGGCGGAGGTTGCAGTGAGCCGAGATCGCGCCACTGCACTCC" +
"AGCCTGGGCGACAGAGCGAGACTCCGTCTCAAAAAA";
var IUB = { a: 0.27, c: 0.12, g: 0.12, t: 0.27, B: 0.02, D: 0.02, H: 0.02, K: 0.02, M: 0.02, N: 0.02, R: 0.02, S: 0.02, V: 0.02, W: 0.02, Y: 0.02 };
var HomoSap = { a: 0.3029549426680, c: 0.1979883004921, g: 0.1975473066391, t: 0.3015094502008 };
var n = +process.argv[2];
console.log(">ONE Homo sapiens alu");
fastaRepeat(2 * n, ALU);
console.log(">TWO IUB ambiguity codes");
fastaRandom(3 * n, IUB);
console.log(">THREE Homo sapiens frequency");
fastaRandom(5 * n, HomoSap);
"""

[source]
"main.ts" = "${FASTA_CAPSTONE_SHELL}"

[[case]]
name = "full_fasta_shell_matches_node_at_small_n"
rationale = """Migrated from runtime_fasta_capstone.rs. The source's assertion is an exact `assert_eq!` on the whole stdout against a node-derived golden, so it becomes an exact `stdout` pin (ruling 3, clause 1).

The full fasta-node-1 shell (Ian Osgood's CLBG fasta, output layer +
process.argv/N — fasta Spec 5, Task 7 capstone). All three sections
(`fastaRepeat` over `ALU`, `fastaRandom` over `IUB`, `fastaRandom` over
`HomoSap`), the three section headers, and `n = +process.argv[2]`.

Uses ONLY the supported statement forms established in Tasks 1-6:
`x = x + y` / `x = x - y` instead of `+=`/`-=`, and explicit `i = i + 1`
instead of `i++`. This is numerically identical to the upstream program's
compound-assignment forms (see GOLDEN derivation below).

GOLDEN: derived by running FASTA_CAPSTONE_SHELL (with `+=`/`-=`/`i++`
restored for readability -- numerically identical to the `= a + b` /
`= a - b` / `i = i + 1` forms used above) under node v26.4.0 via a
temp .mjs file as `node <file> 8`, capturing its exact stdout.
Independently re-derived twice; both runs produced byte-identical
output (seed fixed at 42, so the shell is fully deterministic).

At N=8: fastaRepeat(16, ALU) emits one 16-char line (16 < ALU.length,
mid-string branch, no wrap). fastaRandom(24, IUB) and
fastaRandom(40, HomoSap) each emit one line (24 < 60 and 40 < 60, so
`line = new Array(n)` fires once and the while loop exits after a
single iteration -- no multi-line wraps at this small N)."""
args = ["run", "--api", "node", "main.ts", "--", "8"]
exit = "success"
stdout = ">ONE Homo sapiens alu\nGGCCGGGCGCGGTGGC\n>TWO IUB ambiguity codes\ncttBtatcatatgctaKggNcata\n>THREE Homo sapiens frequency\naatagctaaatcttgtgcttcgttagaagtctcgactacg\n"
