rationale = """`f` is called and also passed to `forEach`. `kali run` refuses at the callback call (a first-class function value); `kali check` admits the program, so check and run disagree here. Not measured at the baseline `068b29950` (no probe row). node v26.10.0 prints `2` then `done`."""
