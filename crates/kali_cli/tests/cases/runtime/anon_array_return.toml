rationale = """A control: a callback is never an array-return candidate. `kali run` refuses `xs.map(...)` as a first-class function value, as at `068b29950` (baseline-anon.tsv row `anon_map_callback_control`, REFUSES); node v26.10.0 prints `2`. `kali check` admits it."""
args = ["run", "map_callback_returning_array.js"]
exit = "failure"
stderr_contains = ["E5506", "calling 'map'"]
