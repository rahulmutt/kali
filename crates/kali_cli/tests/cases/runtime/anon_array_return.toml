[[case]]
name = "member_call_with_same_named_declaration_refuses_at_run"
rationale = """Followups §2 (docs/superpowers/followups/anon-array-return-discovered-defects.md): codegen lowers the member callee `o.f` to the top-level declaration `f`. At `068b29950` kali refused with `E5506` "no lane proves this receiver is an array"; at `cb63f9909` it printed `1` at exit 0 where node v26.10.0 prints `4`, because the caller side resolved the callee as the call is lowered and read `f`'s array. A member callee is not an array-return call (amendment A-10), so the read refuses through backstop 1 again. `kali check` exits 0 on this program (the backstop is codegen's), so there is no `check` twin. The member lowering itself is unfixed: `o.f()` with a scalar return still prints `7` (followups §2)."""
args = ["run", "member_call_same_named_declaration.js"]
exit = "failure"
stderr_contains = ["E5506", "indexed read", "no lane proves this receiver is an array"]

