[source]
"dump_two_distinct_shapes.ts" = """function dump(t){var s=0;for(var k in t){s=s+1;}return s;}
var A={a:1.0,b:2.0,c:3.0}; var B={x:1.0,y:2.0};
console.log(dump(A)); console.log(dump(B));
"""
"transitive_outer_inner_two_shapes.ts" = """function inner(t){var s=0;for(var k in t){s=s+1;}return s;}
function outer(t){return inner(t);}
var A={a:1.0,b:2.0,c:3.0}; var B={x:1.0,y:2.0};
console.log(outer(A)); console.log(outer(B));
"""
"nested_fn_decl_caller.ts" = """function outer(t){ function helper(){ return 1; } var s=0; for(var k in t){ s=s+1; } return s + helper(); }
var A={a:1.0,b:2.0,c:3.0}; var B={x:1.0,y:2.0};
console.log(outer(A)); console.log(outer(B));
"""
"ambiguous_conditional_merge.ts" = """function dump(t){var s=0;for(var k in t){s=s+1;}return s;}
var A={a:1.0,b:2.0,c:3.0}; var B={x:1.0,y:2.0}; var cond=1.0;
var o = cond ? A : B; console.log(dump(o));
"""

