"substring_two_arg_runtime_bounds_prints.ts" = """let a = "GGCCAATT";
let i = 2;
console.log(a.substring(i, i + 4));
"""
"substring_one_arg_and_concat_roundtrip.ts" = """function wrap(seq, i) { return seq.substring(i) + seq.substring(0, i); }
console.log(wrap("GGCCAATT", 6));
"""
"substring_swaps_and_clamps_bounds_like_js.ts" = """let a = "GGCCAATT";
let hi = 99;
let lo = 0 - 5;
console.log(a.substring(6, 2));
console.log(a.substring(lo, 3));
console.log(a.substring(4, hi));
"""
"chained_substring_prints.ts" = """let a = "GGCCAATT";
let i = 1;
console.log(a.substring(i).substring(i));
"""
"substring_on_non_ascii_receiver_is_rejected.ts" = """let a = "héllo";
let i = 1;
console.log(a.substring(i, 3));
"""
"substring_with_float_bound_is_rejected.ts" = """let a = "GGCC";
let f = 1 / 2;
console.log(a.substring(f, 3));
"""
"substring_result_equality_compares_content.ts" = """let a = "GGCC";
let i = 1;
let s = a.substring(0, i);
if (s == "G") { console.log(1); }
"""
"static_substring_fold_still_prints.ts" = """console.log("GGCCAATT".substring(2, 4));
"""
"string_param_length_prints.ts" = """function f(seq) { return seq.length; }
console.log(f("GGCCAATT"));
"""
"substring_result_length_prints.ts" = """let a = "GGCCAATT";
let i = 6;
let s = a.substring(i);
console.log(10 - s.length);
"""
"let_string_length_prints_directly.ts" = """let a = "GGCC";
console.log(a.length);
"""
"non_ascii_string_length_is_rejected.ts" = """let a = "héllo";
let b = a + "";
console.log(b.length);
"""
"static_non_ascii_literal_length_still_prints_utf16_count.ts" = """console.log("héllo".length);
"""
"array_length_still_prints.ts" = """const a = [1, 2, 3];
console.log(a.length);
"""
"storing_tainted_concat_into_element_is_rejected.ts" = """let x = "x";
let t = x + "y";
let arr = [0];
arr[0] = t;
if (arr[0] == "xy") { console.log(1); }
"""
"storing_substring_into_element_is_rejected.ts" = """let a = "GGCC";
let i = 1;
let arr = [0];
arr[0] = a.substring(0, i);
console.log(arr[0]);
"""
"storing_string_param_into_field_is_rejected.ts" = """function f(s) { let o = { v: 1 };
o.v = s;
return o.v; }
console.log(f("hi"));
"""
"array_literal_with_runtime_string_element_is_rejected.ts" = """function f(s) { let a = [s];
return a.length; }
console.log(f("hi"));
"""
"fill_with_runtime_string_is_rejected.ts" = """function f(s) { let a = [0, 0];
a.fill(s);
return a.length; }
console.log(f("hi"));
"""
"static_string_array_join_stays_green.ts" = """const a = ["x", "y"];
console.log(a.join(","));
"""
"fasta_repeat_shape_matches_node_byte_for_byte.ts" = """const ALU = "GGCCGGGCGCGGTGGCTCACGCCTGTAATCCCAGCACTTTGGGAGGCCGAGGCGGGCGGATCACCTGAGGTCAGGAGTTCGAGACCAGCCTGGCCAACATGGTGAAACCCCGTCTCTACTAAAAATACAAAAATTAGCCGGGCGTGGTGGCGCGCGCCTGTAATCCCAGCTACTCGGGAGGCTGAGGCAGGAGAATCGCTTGAACCCGGGAGGCGGAGGTTGCAGTGAGCCGAGATCGCGCCACTGCACTCCAGCCTGGGCGACAGAGCGAGACTCCGTCTCAAAAA";
function fastaRepeat(n, seq) {
  let seqi = 0;
  let lenOut = 60;
  while (n > 0) {
    if (n < lenOut) {
      lenOut = n;
    }
    if (seqi + lenOut < seq.length) {
      console.log(seq.substring(seqi, seqi + lenOut));
      seqi = seqi + lenOut;
    } else {
      let s = seq.substring(seqi);
      seqi = lenOut - s.length;
      console.log(s + seq.substring(0, seqi));
    }
    n = n - lenOut;
  }
}
fastaRepeat(200, ALU);
"""

