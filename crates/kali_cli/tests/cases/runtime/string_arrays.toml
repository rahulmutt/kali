"string_element_store_and_read_roundtrip.ts" = """function f(s) {
  const a = new Array(2);
  a[0] = s.substring(0, 2);
  a[1] = "!";
  console.log(a[0]);
  console.log(a[0] + a[1]);
}
f("hey");
"""
"string_element_read_feeds_length_and_substring.ts" = """function f(s) {
  const a = new Array(1);
  a[0] = s.substring(0, 2);
  console.log(a[0].length);
  console.log(a[0].substring(1, 2));
}
f("hey");
"""
"interned_literal_element_identity_equality_stays_green.ts" = """const a = new Array(1);
a[0] = "x";
if (a[0] == "x") {
  console.log(7);
}
"""
"tainted_element_equality_compares_content.ts" = """function f(s) {
  const a = new Array(1);
  a[0] = s + "y";
  if (a[0] == "xy") {
    console.log(1);
  }
}
f("x");
"""
"mixed_element_array_is_rejected.ts" = """const a = new Array(2);
a[0] = "x";
a[1] = 1;
console.log(a[0]);
"""
"object_field_string_store_still_rejected.ts" = """function f(s) {
  const o = { v: 0 };
  o.v = s;
}
f("x");
"""
"non_ascii_element_length_is_rejected.ts" = """const a = new Array(1);
a[0] = "héllo";
console.log(a[0].length);
"""
"array_alloc_reassignment_int_elements.ts" = """function g(n) {
  let a = new Array(60);
  if (n < 60) {
    a = new Array(n);
  }
  for (let i = 0; i < a.length; i = i + 1) {
    a[i] = i * 10;
  }
  console.log(a[1]);
  console.log(a.length);
}
g(3);
"""
"array_alloc_reassignment_string_elements.ts" = """function g(n, s) {
  let a = new Array(4);
  if (n < 4) {
    a = new Array(n);
  }
  for (let i = 0; i < a.length; i = i + 1) {
    a[i] = s.substring(0, 1);
  }
  console.log(a[0] + a[1]);
  console.log(a.length);
}
g(2, "xy");
"""
"array_to_array_binding_copy.ts" = """function g() {
  const b = new Array(2);
  b[0] = 5;
  b[1] = 6;
  let a = new Array(1);
  a = b;
  console.log(a[1]);
  console.log(a.length);
}
g();
"""
"scalar_reassignment_of_array_binding_is_rejected.ts" = """let a = new Array(2);
a[0] = 1;
a = 5;
console.log(a[0]);
"""
"string_store_into_call_result_captor_is_rejected.ts" = """function mk() {
  return new Array(2);
}
function f(s) {
  const c = mk();
  c[0] = s.substring(0, 1);
  console.log(c[0]);
}
f("xy");
"""
"reassigning_array_binding_to_literal_array_binding_is_rejected.ts" = """let b = [7, 8];
let a = new Array(2);
a = b;
console.log(a[0]);
"""
"element_read_of_returned_string_array_is_rejected.ts" = """function mk(s) {
  const a = new Array(2);
  a[0] = s.substring(0, 1);
  a[1] = s.substring(1, 2);
  return a;
}
function f(s) {
  const c = mk(s);
  console.log(c[0]);
}
f("xy");
"""

