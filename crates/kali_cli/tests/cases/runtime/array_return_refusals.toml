# Cases for the array-return project (spec
# docs/superpowers/specs/2026-10-02-array-return-design.md, sections 3.1, 3.4, 4.2).
#
# A returned array kali cannot make real refuses with E5506, under `kali check`
# and `kali run` alike (amendment A1). Each rationale records kali's `run`
# output at the baseline `368b5b5ea` (tools/array-return-probes/baseline.tsv)
# and node v26.10.0's.
#
# `[source]` keys are one file per program, because `[source]` is file-wide
# (see this directory's README).

[constants]
REFUSED = "is unavailable in the current phase"

[source]
"mixed_returns.js" = '''
function f(c) { if (c) { return [1]; } return 0; } function main() { const a = f(true); console.log(a[0]); } main();
'''
"falls_off_end.js" = '''
function f(c) { if (c) { return [1]; } } function main() { const a = f(true); console.log(a[0]); } main();
'''
"float_elements.js" = '''
function f() { return [1.5, 2.5]; } function main() { const a = f(); console.log(a[0]); } main();
'''
"string_literal_elements.js" = '''
function f() { return ["a", "b"]; } function main() { const a = f(); console.log(a[0]); } main();
'''
"boolean_elements.js" = '''
function f() { return [true, false]; } function main() { const a = f(); console.log(a[0]); } main();
'''
"nested_array_elements.js" = '''
function f() { return [[1], [2]]; } function main() { const a = f(); console.log(a[0][0]); } main();
'''
"float_fill_return.js" = '''
function f() { const a = new Array(2).fill(1.5); return a; } function main() { const b = f(); console.log(b[0]); } main();
'''
"string_fill_return.js" = '''
function mk() { const a = new Array(2).fill("x"); return a; } function main() { const c = mk(); console.log(c[0]); } main();
'''
"let_literal_return.js" = '''
function f() { let a = [1, 2, 3]; return a; } function main() { const b = f(); console.log(b[1]); } main();
'''
"s09_print_call_bound.js" = '''
function f() { return [1, 2, 3]; } function main() { const a = f(); console.log(a); } main();
'''
"s10_print_local.js" = '''
function main() { const a = new Array(3).fill(4); console.log(a); } main();
'''
"print_second_argument.js" = '''
function main() { const a = new Array(3).fill(4); console.log("a", a); } main();
'''
"index_on_scalar_call.js" = '''
function f() { return 3; } console.log("v=" + f()[0]);
'''

"element_array_returning_call.js" = '''
function g() { return [4, 5]; } function f() { return [g(), 6]; } const b = f(); console.log(b[0]);
'''
"element_allocation_binding.js" = '''
function f() { const a = new Array(2).fill(3); return [a, 1]; } const b = f(); console.log(b[0]);
'''
"element_object_binding.js" = '''
function f() { const o = { a: 1 }; return [o, 2]; } const b = f(); console.log(b[0]);
'''
"element_object_field_read.js" = '''
function f() { const o = { a: 1 }; return [o, 2]; } console.log(f()[0].a);
'''
"element_nan.js" = '''
function f() { return [NaN]; } const b = f(); console.log(b[0]);
'''
"element_infinity.js" = '''
function f() { return [Infinity]; } const b = f(); console.log(b[0]);
'''
"element_undefined.js" = '''
function f() { return [undefined]; } const b = f(); console.log(b[0]);
'''
"element_uninitialized_let.js" = '''
function f() { let u; return [u, 1]; } const b = f(); console.log(b[0]);
'''
"element_bigint_binding.js" = '''
function f() { const x = 1n; return [x]; } const b = f(); console.log(b[0]);
'''
"element_null_binding.js" = '''
function f() { const n = null; return [n]; } const b = f(); console.log(b[0]);
'''
"const_computed_reassigned_operand.js" = '''
function f() { let x = 1; const a = [x]; x = 2; return a; } const b = f(); console.log(b[0]);
'''
"const_computed_call_element.js" = '''
function t() { console.log("tick"); return 1; } function f() { const a = [t()]; console.log("between"); return a; } const b = f(); console.log(b[0]);
'''
[[case]]
name = "mixed_array_and_scalar_returns_refuses_at_check"
rationale = """At `368b5b5ea` kali printed `0` at exit 0 where node v26.10.0 prints `1`. A function returning an array on one path and a scalar on another has no single return repr, so it refuses (spec §3.1)."""
args = ["check", "mixed_returns.js"]
exit = "failure"
stderr_contains = ["E5506", "returning an array from `f`", "${REFUSED}", "it mixes array and non-array returns"]

[[case]]
name = "mixed_array_and_scalar_returns_refuses_at_run"
rationale = """The `run` twin of the case above (amendment A1: check and run refuse the same programs)."""
args = ["run", "mixed_returns.js"]
exit = "failure"
stderr_contains = ["E5506", "returning an array from `f`", "${REFUSED}", "it mixes array and non-array returns"]

[[case]]
name = "array_return_that_can_fall_off_the_end_refuses_at_check"
