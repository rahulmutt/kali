[[case]]
name = "allocation_returned_directly_computes"
rationale = """`return new Array(n)` lowers to a text-less one-child `Value` (the `new` wrapper) that `is_array_literal` cannot tell from `[x]`; the return arm must not materialize it as a one-element literal (s08_direct_fill pins the `.fill` form). Measured at `4ec806e59` (pre-Task-7): kali refused with `error[E5506]: computed member access 'o[k]' is unavailable ...` (exit non-zero). node v26.10.0 prints `6,4`. Spec §3.2-3.3."""
args = ["run", "allocation_returned_directly.js"]
exit = "success"
stdout = "6,4\n"
