# Cases for the array-return project (spec
# docs/superpowers/specs/2026-10-02-array-return-design.md, sections 3.2-3.3, 4.2).
#
# A function that returns an I64-element array on every path hands its caller a
# real runtime array. Every `_computes` case prints node v26.10.0's exact output;
# each rationale records kali's output at the baseline `368b5b5ea`
# (tools/array-return-probes/baseline.tsv) or, where the probe set has no row,
# at `1ade1cbfa` (post-inference, pre-codegen).
#
# `[source]` keys are one file per program (see this directory's README).

[source]
"passed_on.js" = '''
function f() { return [1, 2, 3]; } function g(x) { return x[1]; } console.log(g(f()));
'''
"call_arg_direct.js" = '''
function f() { return [3, 4]; } function g(x) { return x.length; } console.log(g(f()));
'''
"const_literal_binding_return.js" = '''
function f() { const a = [1, 2, 3]; return a; } function g(x) { return x[1]; } console.log(g(f()));
'''
"allocation_returned_from_inside_a_loop.js" = '''
function f() { for (let i = 0; i < 3; i++) { const a = new Array(2).fill(i); if (i === 2) { return a; } } return new Array(1).fill(0); }
function g(x) { return x[0]; }
console.log(g(f()));
'''
"parenthesized_literal_return.js" = '''
function f() { return ([1, 2, 3]); } function g(x) { return x[1]; } console.log(g(f()));
'''
"as_wrapped_literal_return.ts" = '''
function f(): number[] { return [1, 2, 3] as number[]; } function g(x: number[]): number { return x[1]; } console.log(g(f()));
'''
"s01_direct_index.js" = '''
function f() { return [1, 2, 3]; } console.log("r=" + f()[0]);
'''
"s02_bound_module.js" = '''
function f() { return [1, 2, 3]; } const a = f(); console.log(a[0] + "," + a[2]);
'''
"s03_bound_in_main.js" = '''
function f() { return [1, 2, 3]; } function main() { const a = f(); console.log(a[0] + "," + a[2]); } main();
'''
"s04_fill_binding_return.js" = '''
function mk() { const a = new Array(3).fill(4); return a; } const b = mk(); console.log(b[1]);
'''
"s05_param_pass_through.js" = '''
function f(x) { return x; } const a = f(new Array(3).fill(1)); console.log(a[0]);
'''
"s06_loop_filled.js" = '''
function f(n) { const a = new Array(n).fill(0); for (let i = 0; i < n; i++) a[i] = i * i; return a; } function main() { const a = f(4); console.log(a[3]); } main();
'''
"s07_store_then_return.js" = '''
function f() { const a = new Array(3); a[0] = 7; return a; } function main() { const b = f(); console.log(b[0]); } main();
'''
"s08_direct_fill.js" = '''
function f() { return new Array(3).fill(2); } function main() { console.log(f()[0]); } main();
'''
"dyn_index.js" = '''
function f() { return [1, 2, 3]; } function main() { const a = f(); let i = 2; console.log(a[i]); } main();
'''
"bound_length.js" = '''
function f() { return [1, 2, 3]; } const a = f(); console.log(a.length);
'''
"direct_length.js" = '''
function f() { return [4, 5]; } console.log(f().length);
'''
"bound_passed_on.js" = '''
function f() { return [1, 2, 3]; } function g(x) { return x[2]; } function main() { const a = f(); console.log(g(a)); } main();
'''
"mutate_call_bound.js" = '''
function f() { return [1, 2, 3]; } function main() { const a = f(); a[1] = 9; console.log(a[1]); } main();
'''
"recursion.js" = '''
function f(n) { if (n === 0) { return [7, 8]; } return f(n - 1); } console.log(f(3)[1]);
'''
"empty_literal.js" = '''
function f() { return []; } function main() { const a = f(); console.log(a.length); } main();
'''
"computed_elements.js" = '''
function f(x) { return [x, x * 2, x + 1]; } function main() { const a = f(5); console.log(a[0] + "," + a[1] + "," + a[2]); } main();
'''
"nested_decl.js" = '''
function main() { function f() { return [1, 2, 3]; } const a = f(); console.log(a[0] + "," + a[2]); } main();
'''
"if_else_both_return.js" = '''
function f(c) { if (c) { return [1]; } else { return [2]; } } function main() { const a = f(false); console.log(a[0]); } main();
'''
"r14_register_in_function.js" = '''
function main() {
  function f() { return [1, 2, 3]; }
  console.log("r=" + f()[0]);
}
main();
'''
"allocation_returned_directly.js" = '''
function g() { return new Array(4); } function main() { const a = g(); a[1] = 6; console.log(a[1] + "," + a.length); } main();
'''
"async_direct_index.js" = '''
async function f() { return [1, 2, 3]; } console.log(f()[0]);
'''

"head_typeof_subscripted_param.js" = '''
function head(v) { if (typeof v === "number") { return v; } return v[0]; } console.log(head(5));
'''
"head_array_fed_param_or_number.js" = '''
function head(v, n) { if (n === 0) { return v; } return v[0] + n; } console.log(head(new Array(3).fill(5), 1));
'''
[[case]]
name = "a_returned_literal_passed_on_computes"
rationale = """At `368b5b5ea` kali printed `0` at exit 0 where node v26.10.0 prints `2`: the literal was never allocated (emit_aggregate_literal pushed 0). Spec §3.2."""
args = ["run", "passed_on.js"]
exit = "success"
stdout = "2\n"

