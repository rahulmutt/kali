[[case]]
name = "allocation_returned_directly_computes"
rationale = """`return new Array(n)` lowers to a text-less one-child `Value` (the `new` wrapper) that `is_array_literal` cannot tell from `[x]`; the return arm must not materialize it as a one-element literal (s08_direct_fill pins the `.fill` form). Measured at `4ec806e59` (pre-Task-7): kali refused with `error[E5506]: computed member access 'o[k]' is unavailable ...` (exit non-zero). node v26.10.0 prints `6,4`. Spec §3.2-3.3."""
args = ["run", "allocation_returned_directly.js"]
exit = "success"
stdout = "6,4\n"

[[case]]
name = "async_function_stays_off_the_array_return_lane"
rationale = """Ruling R12: an `async` declaration is not an array-return candidate (its call yields a Promise) and is never tainted, so `f()[0]` stays on its PRE-EXISTING lane. That lane is SILENT-WRONG: kali prints `0` at exit 0 where node v26.10.0 prints `undefined`. This pins the pre-existing lane, not a correct result; it is filed for followup. At `4ec806e59` kali printed the same `0`; at `22350647b`, before this ruling, the array-return lane read the literal and printed `1`. RE-PINNED 2026-10-02 by the array-return project (spec docs/superpowers/specs/2026-10-02-array-return-design.md, section 3.3 backstop 1, measured in section 4.1): at `fefe62c60` kali printed `0` at exit 0 where node v26.10.0 prints `undefined`; the pre-existing lane was the numeric-index fallback, which now refuses with E5506 instead of pushing `0`."""
args = ["run", "async_direct_index.js"]
exit = "failure"
stdout = ""
stderr_contains = ["E5506", "no lane proves this receiver is an array"]

[[case]]
name = "async_function_stays_off_the_array_return_lane_checks"
rationale = """Ruling R12's `check` half: `kali check` admits this program. RE-PINNED 2026-10-02 by the array-return project (spec docs/superpowers/specs/2026-10-02-array-return-design.md, section 3.3 backstop 1, measured in section 4.1): `kali run` now refuses it with E5506 at codegen (the numeric-index fallback), which `check` does not reach, so check and run DISAGREE on this program; node v26.10.0 prints `undefined`. The disagreement is filed for followup with the async lane itself."""
args = ["check", "async_direct_index.js"]
exit = "success"

[[case]]
name = "subscripted_param_returned_beside_a_scalar_refuses_at_check"
rationale = """A param subscripted in its body counts as a runtime array, so `return v` beside a scalar return taints `head` MIXED, and it refuses. node v26.10.0 prints `5`. The refusal is kept on purpose (final-review fix wave; the proposed ruling R17 was reversed): with no taint, kali took the pre-existing lane and printed `0` at exit 0, because `typeof v === "number"` is false for a param kali treats as an array (followups §18). The program took that silent lane before the project too, when no MIXED taint existed."""
args = ["check", "head_typeof_subscripted_param.js"]
exit = "failure"
stderr_contains = ["E5506", "returning an array from `head`", "it mixes array and non-array returns"]

[[case]]
name = "subscripted_param_returned_beside_a_scalar_refuses_at_run"
rationale = """The `run` twin of the case above (amendment A1: check and run refuse the same programs)."""
args = ["run", "head_typeof_subscripted_param.js"]
exit = "failure"
stdout = ""
stderr_contains = ["E5506", "returning an array from `head`", "it mixes array and non-array returns"]

[[case]]
name = "array_fed_param_returned_beside_a_scalar_still_refuses"
rationale = """Every call passes `new Array(3).fill(5)`, so `v` is array-fed and `return v` is array-shaped: `head` is tainted MIXED and refuses, where node v26.10.0 prints `6`. Unchanged from `2724509b8`, where kali refused the same way. A control with no array-shaped return prints `6`, so this program most likely printed `6` before the project (followups §18)."""
args = ["run", "head_array_fed_param_or_number.js"]
exit = "failure"
stdout = ""
stderr_contains = ["E5506", "returning an array from `head`", "it mixes array and non-array returns"]
