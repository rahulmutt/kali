#
# A for-in-key VALUE nested inside a value-forwarding expression (ternary arm, sequence, paren, cast) must be caught structurally at EVERY sink — the reject helper recurses through forwarding wrappers to the identifier leaves. Each of these leaks the raw ordinal (`0`) pre-fix; node prints `a`.
#
# --------------------------------------------------------------------------- Task 6: fail-closed matrix. Every out-of-scope for..in shape must FAIL CLOSED (non-zero exit / E5506), never miscompile. ---------------------------------------------------------------------------
#
# --------------------------------------------------------------------------- Task 6 (controller handoff H2): a for-in-key/alias identifier used as a while / for / do-while condition or a ternary TEST lowers via default `!= 0` truthiness (`-1` null sentinel reads TRUTHY) with NO diagnostic — a fail-OPEN in the same class as the `!`/`&&`/`||` rejects but in loop/ternary test positions. fasta uses NONE of these, so reject fail-closed (E5506). `if (last)` (makeCumulative) must STILL compile (it is an `if`, lowered `>= 0`), and a normal while/for/ternary on a NON-for-in binding too. ---------------------------------------------------------------------------
#
# MATRIX DECLINED. 50 source helper invocation(s) == 50 case(s) x 1. Named siblings, one `[[case]]` per real invocation (rule 5), so a failing trial names the source `#[test]` fn it came from. A `[matrix]` axis is not declared: `[matrix]` is FILE-WIDE (U1) and these files' cases do not all vary over one axis uniformly, so an axis would fan cases the source never ran (rule 2) and the arithmetic would not close (rule 7).
#
# U5 -- EVERY `[source]` KEY IS RENAMED, AND THE RENAME IS FORCED. `[source]` is one flat file-wide namespace and expand.rs clones the whole map into every trial (U2), but these sources write MANY DIFFERENT programs to the same filename. A bare `main.ts` reused across cases would give every trial the last body written and silently destroy the cases' discriminating power. Each key is therefore the source `#[test]` fn's own name plus the original suffix chain, so the fn name survives the source's deletion. The WHOLE suffix chain is kept (`.test.js`, not `.js`) because kali test dispatches on the `.test.` infix: U5 permits renaming an argv filename, not renaming one whose shape the tool reads.
#
# U13 -- THE HOIST IS DECLINED (ruling 7), and the duplication is asserted rather than eyeballed. check_fixtures.py's toml_program_texts reads `[source]` values verbatim and never resolves a `${NAME}` reference, so hoisting a shared body into `[constants]` makes the rule-9 fixture gate report UNMATCHED on a correct file. The property is the TOOL's, not the family's, which is what makes ruling 7 apply here as well as in `browser/`. check_duplication_is_the_sources_own requires the set of distinct rendered `[source]` bodies to equal the set of distinct fixture texts the extractor produced, so every byte-identical pair below is the SOURCE's own duplication and not the generator's.
#
# RULE 10 -- A GENUINE JS TEMPLATE LITERAL IS ENCODED, NOT ALTERED. One fixture in this file carries a real `${...}` interpolation. expand.rs's substitute() hard-fails on any `${...}` it cannot resolve, so `[constants] dollar = "$"` is declared and every real `${` is spelled `${dollar}{`. The program text the trial writes to disk is byte-identical to the source's -- this is an encoding of rule 9, not an exception to it. The escape is applied only to the surfaces expand substitutes; rationale is cloned unsubstituted, so a carried source comment mentioning `${` is left exactly as the source wrote it (rule 12).
#
