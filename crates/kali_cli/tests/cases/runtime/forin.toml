"for_in_key_stored_into_string_array_element_is_fail_closed.ts" = """function collect(t) {
  let out = new Array(3);
  out[0] = "x"; out[1] = "y"; out[2] = "z";
  let i = 0;
  for (var c in t) { out[i] = c; i = i + 1; }
  return out.join(",");
}
const t = { a: 0.3, c: 0.6, g: 0.95 };
console.log(collect(t));
"""
"forin_key_stored_into_string_array_after_break_then_joined.ts" = """function build(t) {
  var line = new Array(3);
  for (var i = 0; i < 3; i = i + 1) {
    var r = i;
    for (var c in t) { if (r < 1) break; r = r - 1; }
    line[i] = c;
  }
  return line.join("");
}
const t = { a: 1.0, c: 2.0, g: 3.0 };
console.log(build(t));
"""
