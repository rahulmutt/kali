[source]
"for_in_over_fixed_shape_object_iterates_once_per_field.ts" = """const table = { a: 1, c: 2, g: 3 };
let count = 0;
for (var c in table) {
  count = count + 1;
}
console.log(count);
"""
"for_in_computed_key_read_write_doubles_each_field.ts" = """const t = { a: 0.25, c: 0.25, g: 0.5 };
function dbl(table) {
  for (var c in table) {
    table[c] = table[c] * 2;
  }
}
function sum(table) {
  let s = 0.0;
  for (var c in table) {
    s = s + table[c];
  }
  return s;
}
dbl(t);
console.log(sum(t));
"""
"make_cumulative_matches_node_byte_for_byte.ts" = """function makeCumulative(table) {
  var last = null;
  for (var c in table) {
    if (last) table[c] += table[last];
    last = c;
  }
}
function dump(table) {
  for (var c in table) { console.log(table[c]); }
}
const t = { a: 0.2, c: 0.3, g: 0.5 };
makeCumulative(t);
dump(t);
"""
"transitive_forin_key_alias_two_levels_matches_node.ts" = """function doubleEach(table) {
  var last = null;
  var y = null;
  for (var c in table) {
    last = c;
    y = last;
    if (y) table[c] += table[y];
  }
}
function dump(table) {
  for (var c in table) { console.log(table[c]); }
}
const t = { a: 0.2, c: 0.3, g: 0.5 };
doubleEach(t);
dump(t);
"""
"forin_key_alias_under_not_is_rejected.ts" = """function f(table) {
  var last = null;
  for (var c in table) {
    last = c;
    if (!last) { console.log(1); }
  }
}
const t = { a: 1, c: 2, g: 3 };
f(t);
"""
