name = "an_allocation_sized_from_another_allocation_computes"
rationale = """CORRECTED FROM THE TASK-2 BRIEF: the brief's step 2 draft claimed this was already correct at `733cd26125` ("kali and node v26.8.2 both print `3`"), but that value was measured on the SPIKE build, not the baseline -- this is one of the six rationales task 2's step 1 exists to re-measure. Measured directly against `733cd26125`, kali prints `0` at exit 0 with no diagnostic where node v26.8.2 prints `3`. The size argument is itself an allocation-argument call (`f(new Array(3))`), so it suffers the identical zero-handle bug as every other `_computes` case in this file; it does not get special treatment just because it feeds a `new Array(...)` size position. It must become correct once allocations nest (spec section 3.3)."""
args = ["run", "arg_size_from_allocation.js"]
