rationale = """Anti-over-reject: the gate requires TWO-SIDED literal proof. Correct all-BigInt code whose operands are NOT bare literals (a `const` binding, a function parameter) must NOT trip E3202 — "recognizer can't prove BigInt" is not "proven non-BigInt". `const x = 7n; x / 2n` is exactly the regression an earlier one-sided `left != right` gate caused (it broke the bigint-*-chain benchmark fixtures); pin it closed. node prints `3n`; kali's runtime BigInt console format prints `3` (pre-existing, see Task 2)."""
