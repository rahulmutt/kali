[[case]]
name = "sync_scalar_capture_restore_survives_sibling_env_owner"
rationale = """Stage C (closures) C1 — synchronous scalar capture end-to-end.

A nested function that shares an enclosing scalar local with its owner must read and write the SAME storage cell as the owner (JS captures variables, not values). Before C1 the write path hard-failed E5506 and the read path silently produced `0`; these tests pin the sound behavior byte-for-byte against node.

Step 6 permanent re-mask pin for the epilogue/return RESTORE (not the per-call alloc, which the twice-called pin above already covers). `outer` owns an env; between two `inc()` calls it invokes a SIBLING function `sib` that ALSO owns an env — `sib`'s prologue clobbers `current_env`. Only a correct restore on `sib`'s exit puts `current_env` back to `outer`'s record, so the final `inc()` and the read of `c` address `outer`'s cell, not `sib`'s. A broken restore leaves `current_env` pointing at `sib`'s freed record and the program prints the wrong number. node prints 2."""
args = ["run", "sync_scalar_capture_restore_survives_sibling_env_owner.js"]
exit = "success"
stdout = "2\n"

[[case]]
name = "sync_heap_capture_reads_field"
rationale = """Stage C (closures) C1 — synchronous scalar capture end-to-end.

A nested function that shares an enclosing scalar local with its owner must read and write the SAME storage cell as the owner (JS captures variables, not values). Before C1 the write path hard-failed E5506 and the read path silently produced `0`; these tests pin the sound behavior byte-for-byte against node.

Stage C C2 (heap captures). A nested function captures an enclosing HEAP object and reads a field. The captured object must heap-materialize into the never-reset global region (owner-keyed lockstep promotion of the object env cell) and the capturer's member access must resolve the loaded pointer's shape (owner object-shape propagated into the capturer's repr namespace). Pre-C2: silent `0` (the object never materializes and `rd`'s `obj.n` has no object shape). node prints 1."""
args = ["run", "sync_heap_capture_reads_field.js"]
exit = "success"
stdout = "1\n"

[[case]]
name = "sync_heap_capture_field_write_visible_to_owner"
rationale = """Stage C (closures) C1 — synchronous scalar capture end-to-end.

A nested function that shares an enclosing scalar local with its owner must read and write the SAME storage cell as the owner (JS captures variables, not values). Before C1 the write path hard-failed E5506 and the read path silently produced `0`; these tests pin the sound behavior byte-for-byte against node.

Stage C C2 heap-write behavior pin (field write through the capture). A nested function writes a field of the captured object (`obj.n = 2`); the owner reads the mutation back. Both address the SAME env-cell pointer, so the write is visible — byte-parity with node (2). Documents that the C2 read plumbing also makes captured field WRITES correct (the base loads the shared pointer at both sites), not just reads."""
args = ["run", "sync_heap_capture_field_write_visible_to_owner.js"]
exit = "success"
stdout = "2\n"

[[case]]
name = "env_chain_grandparent_read"
rationale = """Stage C (closures) C1 — synchronous scalar capture end-to-end.

A nested function that shares an enclosing scalar local with its owner must read and write the SAME storage cell as the owner (JS captures variables, not values). Before C1 the write path hard-failed E5506 and the read path silently produced `0`; these tests pin the sound behavior byte-for-byte against node.

Stage C C2 (env chains, depth > 1). Grandparent read: `c` reads `a`'s `g` through an INTERMEDIATE `b` that owns no cell. `b` is transparent to the env chain (a no-cell function allocates no record and does not touch `current_env`, spec §3.4), so when `c` runs `current_env` still points at `a`'s record directly — env-walk depth 0. The MIR capture depth counts env-OWNING ancestors (only `a`), so it is 1, and the existing depth-1 access lane resolves it. Pre-C2: the read silently produced `0`. node prints 5."""
args = ["run", "env_chain_grandparent_read.js"]
exit = "success"
stdout = "5\n"

[[case]]
name = "env_chain_owning_capturer_parent_walk"
rationale = """Stage C (closures) C1 — synchronous scalar capture end-to-end.

A nested function that shares an enclosing scalar local with its owner must read and write the SAME storage cell as the owner (JS captures variables, not values). Before C1 the write path hard-failed E5506 and the read path silently produced `0`; these tests pin the sound behavior byte-for-byte against node.

Stage C C2 (env chains) — a GENUINE parent-pointer walk (env-walk depth 1). The capturer `c` OWNS a promotable env of its own (`k`, captured by `d`), so when `c` runs `current_env` is `c`'s OWN record, whose parent header points at `a`'s record (the intermediate `b` owns no cell and is transparent). To read `a`'s `g`, `c` must follow ONE parent link — `emit_env_base_addr` with depth 1. Pre-this-task the env-owning capturer fell through to baseline and `g` read as `0` (kali printed 10 = 0 + d()); the sound value is 5 + 10 = 15."""
args = ["run", "env_chain_owning_capturer_parent_walk.js"]
exit = "success"
stdout = "15\n"

[[case]]
