[[case]]
name = "sync_scalar_capture_write_is_visible_to_owner"
rationale = """Stage C (closures) C1 — synchronous scalar capture end-to-end.

A nested function that shares an enclosing scalar local with its owner must read and write the SAME storage cell as the owner (JS captures variables, not values). Before C1 the write path hard-failed E5506 and the read path silently produced `0`; these tests pin the sound behavior byte-for-byte against node.

Nested function mutates an enclosing scalar local; the enclosing scope reads the mutation back. Pre-C1: `c += 1` hard-fails E5506. node prints 2."""
args = ["run", "sync_scalar_capture_write_is_visible_to_owner.js"]
exit = "success"
stdout = "2\n"

[[case]]
name = "capture_gate_owner_f64_compound_assign_rejects_not_miscompiles"
rationale = """Stage C (closures) C1 — synchronous scalar capture end-to-end.

A nested function that shares an enclosing scalar local with its owner must read and write the SAME storage cell as the owner (JS captures variables, not values). Before C1 the write path hard-failed E5506 and the read path silently produced `0`; these tests pin the sound behavior byte-for-byte against node.

C1 review Finding 1 (owner-repr capture gate). The OWNER declares an `F64` scalar (`let c = 0.5`), so `lower.rs` does NOT promote it to an env cell (it stays an f64 WASM local). A nested `c += 1` must therefore be REJECTED, not silently routed to a phantom i64 env cell the owner never allocated. Before the fix the capturer gated on ITS OWN repr namespace — where the undeclared name `c` defaults to `I64` — and emitted a cell write the owner never read, printing `0.5` (node: `2.5`). The owner's F64 verdict now decides: E5506.

Assert the program is REJECTED with `E5506` (the reject-don't-miscompile contract) rather than silently producing a value."""
args = ["run", "capture_gate_owner_f64_compound_assign_rejects_not_miscompiles.js"]
exit = "failure"
stderr_contains = ["E5506"]

