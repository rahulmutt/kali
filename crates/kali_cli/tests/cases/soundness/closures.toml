# preserved in that one case's rationale). 1:1 to a case throughout (no fn
# bundles multiple independent programs -- verified by scanning every body
# for more than one run_kali/run_kali_test/assert_e5506(_test) call: none
# has more than one). No [matrix]: every case runs a distinct one-off JS
# program via `kali run <file>.js`, or a `*.test.js` fixture via `kali test`
# for the `run_kali_test`/`assert_e5506_test`-produced cases.
