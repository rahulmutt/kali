Finding 1, update-expression shape (`c++` on an owner-`F64` capture). Same divergence class as the compound-assign pin above — must reject, not write a phantom cell.

Assert the program is REJECTED with `E5506` (the reject-don't-miscompile contract) rather than silently producing a value."""
