name = "module_global_update_does_not_route_to_env_cell"
rationale = """Stage C (closures) C1 — synchronous scalar capture end-to-end.

A nested function that shares an enclosing scalar local with its owner must read and write the SAME storage cell as the owner (JS captures variables, not values). Before C1 the write path hard-failed E5506 and the read path silently produced `0`; these tests pin the sound behavior byte-for-byte against node.

C1 review Finding 2 (module-global precedence in the update path). A module-scope binding must never resolve depth-0 against `current_env` as if it were an env cell. `c++` on a module global has no dedicated lowering, so it is REJECTED (E5506) — the point is it does NOT silently write raw memory at `8 + offset`. The write path (`c += 1`) already routes to the module-global `GlobalSet` lane and is pinned below.

Assert the program is REJECTED with `E5506` (the reject-don't-miscompile contract) rather than silently producing a value."""
args = ["run", "module_global_update_does_not_route_to_env_cell.js"]
