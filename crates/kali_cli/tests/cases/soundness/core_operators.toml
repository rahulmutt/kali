# Migrated from tests/soundness_core_operators.rs -- all 11 #[test]
# functions, 1:1 to a case (no fn bundles multiple independent
# assertions; no [matrix] -- each case runs a distinct one-off TS
# program via `kali run <file>.ts`).
#
# The file's opening `//!` doc is prepended verbatim to every case's
# rationale. Two `// ---...---` section banners ("Defect 1: `&&` / `||`
# short-circuit", 6 cases; "Defect 2: boolean rendering in string
# position", 5 cases -- both well under the ~15-case threshold, so
# neither needs an additional `#` divider on its own, but one is
# rendered anyway per this batch's rule 12) bracket the file's two
# halves and are prepended to every case in their range. Every fn also
# carries its own direct `///` doc (0 uncommented cases).
#
# No [constants]: no `const NAME: &str` rule-literal declarations, no
# byte-identical fixture shared across #[test]s, no `${...}` template
# literal, no `format!`-built fixture text (the file's one `format!`
# call site builds a temp-directory path, never fixture text).
#
# `assert_stdout` compares RAW (untrimmed) stdout via `assert_eq!`
# directly -- no `.trim()` -- so `stdout` below is a direct copy of the
# literal. This file is one of two flagged for a `\`+newline` string
# continuation escape (61 occurrences, confirmed via grep) -- some
# continuation lines use `\x20` (a literal space) specifically to defeat
# the continuation whitespace-swallow rule; verified byte-for-byte
# against the real built kali binary for all 11 fixtures before pinning.

[source]
"short_circuit_skips_right_operand_in_condition_position.ts" = """let calls = 0;
function boom() { calls = calls + 1; return true; }
function f() {
  let trace = "";
  if (false && boom()) { trace = trace + "and-branch;"; }
  if (true || boom()) { trace = trace + "or-taken;"; }
  return "trace=" + trace + " calls=" + calls;
}
console.log(f());
"""
"short_circuit_in_function_body_with_taken_branch.ts" = """let n = 0;
function side() { n = n + 1; return 5; }
function f() {
  if (false && side()) { return "bad"; }
  let ok = true;
  if (ok && (1 === 1)) { return "ok n=" + n; }
  return "no";
}
console.log(f());
"""
"short_circuit_value_position_evaluates_right_operand_exactly_once.ts" = """let n = 0;
function bump() { n = n + 1; return 7; }
let a = false || bump();
let b = true && bump();
console.log(a);
console.log(b);
console.log(n);
"""
"short_circuit_const_binding_yields_right_operand_value.ts" = """function seven() { return 7; }
const a = false || seven();
const b = true && seven();
console.log(a);
console.log(b);
"""
"chained_logicals_short_circuit_after_first_decisive_operand.ts" = """let n = 0;
function t() { n = n + 1; return true; }
function ff() { n = n + 100; return false; }
function f() {
  let r = "";
  if (ff() && t() && t()) { r = r + "and;"; }
  if (t() || ff() || ff()) { r = r + "or;"; }
  return r + "n=" + n;
}
console.log(f());
"""
"nested_logicals_short_circuit.ts" = """let n = 0;
function hit(k) { n = n + k; return true; }
function f() {
  if (false && (hit(1) || hit(2))) { return "a"; }
  if (true || (hit(4) && hit(8))) { return "b n=" + n; }
  return "c";
}
console.log(f());
"""
"booleans_render_as_true_false_in_string_concatenation.ts" = """console.log(true);
console.log(false);
console.log("concat=" + false);
console.log(true + "=concat");
function f() { const t = true; return "in-fn=" + t; }
console.log(f());
"""
"comparison_results_render_as_true_false_in_concatenation.ts" = """console.log("eq=" + (1 === 1));
console.log("ne=" + (1 === 2));
console.log("lt=" + (1 < 2));
console.log("not=" + (!true));
"""
"booleans_render_as_true_false_in_string_compound_assignment.ts" = """function f() {
  let s = "";
  s = s + true;
  s = s + false;
  return s;
}
console.log(f());
"""
"dynamic_console_boolean_rendering_is_a_known_residual.ts" = """console.log(1 === 1);
console.log(1 === 2);
console.log(true && false);
console.log(false || true);
"""
"boolean_rendering_does_not_leak_into_numeric_lane.ts" = """console.log("sum=" + ((1 === 1) + (1 === 1)));
console.log("num=" + 1);
console.log("zero=" + 0);
"""

# --- Defect 1: `&&` / `||` short-circuit ---

[[case]]
name = "short_circuit_skips_right_operand_in_condition_position"
rationale = """Soundness pins for two core-operator silent miscompiles closed in the PR #16 merge-readiness batch:

1. `&&` / `||` did not short-circuit. The parser has no `LogicalExpression` node — `&&`/`||` are `BinaryExpression`s, and `emit_binary`'s shared operand pre-pass emitted BOTH operands unconditionally before combining them with a single `I64And`/`I64Or`. Branch OUTCOMES were correct (for 0/1 operands), so the defect was invisible in control-flow position and surfaced only as the right-hand operand's side effects running when JS says they must not: `if (false && boom())` still called `boom()`. The bitwise combine was also wrong in value position — `2 && 1` folded to `2 & 1 == 0` and JS's value-returning semantics (`a && b` yields `a` when `a` is falsy, else `b`) were not implemented at all. Fixed by excluding `&&`/`||` from the unconditional pre-emit and lowering each to a real `If`/`Else` over a scratch local, mirroring the `??` arm that already did this correctly.

2. Booleans rendered as `0`/`1` when stringified. `emit_as_string` (the `+` string-concat coercion) had a three-way string/float/`else`-is-an-int ladder with no boolean arm, so a boolean operand took `int_to_string` and `"concat=" + false` produced `concat=0`. `console.log(true)` on a LITERAL looked correct only because a separate static-render path keys on the literal text. Fixed by giving `emit_as_string` a boolean arm that selects between the interned `"true"`/`"false"` handles.

Scope note: the SIBLING choke point (`emit_console_argument`, the dynamic `console.log` path) has the identical defect and is deliberately left alone here — fixing it invalidates ~130 existing assertions that pin the `1`/`0` rendering, which is a mass re-pin wave rather than a contained fix. It is pinned as a known residual at the bottom of this file.

Every golden in this file was verified against node v26.

---- Defect 1: `&&` / `||` short-circuit ----

The minimal reported repro: a false `&&` LHS and a true `||` LHS must both skip their right-hand operand entirely, so `boom()` never runs. Pre-fix this printed `calls=2` — the branch outcomes were already right, only the side effects leaked."""
args = ["run", "short_circuit_skips_right_operand_in_condition_position.ts"]
exit = "success"
stdout = "trace=or-taken; calls=0\n"

