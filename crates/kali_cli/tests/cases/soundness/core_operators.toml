# CONSEQUENCE FOR THE GATES -- `audit-case-migration.py` IS EXPECTED-RED
# (rc=3) ON THIS PAIR. rc=3 is AUDIT INAPPLICABLE, not a dropped claim:
# the audit ran to completion over this pair and demanded ZERO claims of
# it, so it decided nothing either way. Measured, not assumed -- 11
# #[test] fns found, 0 claims demanded in either direction.
#
# WHY IT DEMANDS NOTHING, AND THE REASON IS NOT THE USUAL ONE. Unlike the
# exit-status-only pairs elsewhere in this family, this source DOES pin
# exact output: all 11 fns pass an expected-stdout string literal to
# `assert_stdout(src, expected)`. But the `assert_eq!` the audit reads is
# inside that helper and its operand there is the PARAMETER `expected`,
# not a literal, and the extractor does not follow a value from a call
# site into a helper. So the 11 literals are real claims this tool
# structurally cannot see -- rc=3 here means "undecidable by this gate",
# NOT "the source asserted nothing" and NOT "claim extraction is broken".
# The one argv token (`run`) is in the audit's BORING set and
# discriminates nothing. Same shape as the sibling `const_binding.toml`,
# which shares this file's `assert_stdout` idiom.
#
# Stated here because AUDIT OK over zero demanded claims and AUDIT OK
# over a covered pair are otherwise indistinguishable, and only one of
# them is evidence. What DOES cover this pair is the case runner: all 11
# of those literals are carried below as the 11 `stdout` pins, one per
# `[[case]]`, 11/11 -- so what the audit cannot check, the trials do.
#
# Reproduce (the source was deleted by dbb9bae7c2; its last content is
# the blob at that commit's parent):
#
#   git show c558031b35f33de6e02956adde93965e307e5a42:crates/kali_cli/tests/soundness_core_operators.rs > /tmp/src.rs
