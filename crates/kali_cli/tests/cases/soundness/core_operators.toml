# Migrated from tests/soundness_core_operators.rs -- all 11 #[test]
# functions, 1:1 to a case (no fn bundles multiple independent
# assertions; no [matrix] -- each case runs a distinct one-off TS
# program via `kali run <file>.ts`).
#
# The file's opening `//!` doc is prepended verbatim to every case's
# rationale. Two `// ---...---` section banners ("Defect 1: `&&` / `||`
# short-circuit", 6 cases; "Defect 2: boolean rendering in string
# position", 5 cases -- both well under the ~15-case threshold, so
# neither needs an additional `#` divider on its own, but one is
# rendered anyway per this batch's rule 12) bracket the file's two
# halves and are prepended to every case in their range. Every fn also
# carries its own direct `///` doc (0 uncommented cases).
#
# No [constants]: no `const NAME: &str` rule-literal declarations, no
# byte-identical fixture shared across #[test]s, no `${...}` template
