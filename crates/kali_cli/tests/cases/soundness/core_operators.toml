[[case]]
name = "dynamic_console_boolean_rendering_of_provable_shapes_is_fixed"
rationale = """Soundness pins for two core-operator silent miscompiles closed in the PR #16 merge-readiness batch:

1. `&&` / `||` did not short-circuit. The parser has no `LogicalExpression` node — `&&`/`||` are `BinaryExpression`s, and `emit_binary`'s shared operand pre-pass emitted BOTH operands unconditionally before combining them with a single `I64And`/`I64Or`. Branch OUTCOMES were correct (for 0/1 operands), so the defect was invisible in control-flow position and surfaced only as the right-hand operand's side effects running when JS says they must not: `if (false && boom())` still called `boom()`. The bitwise combine was also wrong in value position — `2 && 1` folded to `2 & 1 == 0` and JS's value-returning semantics (`a && b` yields `a` when `a` is falsy, else `b`) were not implemented at all. Fixed by excluding `&&`/`||` from the unconditional pre-emit and lowering each to a real `If`/`Else` over a scratch local, mirroring the `??` arm that already did this correctly.

2. Booleans rendered as `0`/`1` when stringified. `emit_as_string` (the `+` string-concat coercion) had a three-way string/float/`else`-is-an-int ladder with no boolean arm, so a boolean operand took `int_to_string` and `"concat=" + false` produced `concat=0`. `console.log(true)` on a LITERAL looked correct only because a separate static-render path keys on the literal text. Fixed by giving `emit_as_string` a boolean arm that selects between the interned `"true"`/`"false"` handles.

Scope note, AS OF THIS COMMIT: the SIBLING choke point (`emit_console_argument`, the dynamic `console.log` path) had the identical defect and was deliberately left alone here — fixing it would have invalidated ~130 existing assertions that pinned the `1`/`0` rendering, a mass re-pin wave rather than a contained fix. It was pinned as a known residual at the bottom of this file (see below for what has since happened to that pin).

Every golden in this file was verified against node v26.

---- Defect 2: boolean rendering in string position — UPDATE (console-render-unification, Task 5b) ----

This case originally documented the CURRENT-AT-THE-TIME (still-wrong) behavior of the sibling stringify choke point that PR #16 deliberately did not touch, so the residual was pinned and visible rather than forgotten: `emit_console_argument` had the same missing boolean arm as `emit_as_string`, so a boolean reaching `console.log` DYNAMICALLY printed `1`/`0` where node printed `true`/`false`.

The `console-render-unification` design subsequently deleted `emit_console_argument`'s hand-rolled body and routed BOTH console lanes through the one shared `emit_as_string` ladder (gated by a `StringSink` parameter, `Concat` vs `Console`), closing exactly the choke-point split this case's rationale predicted would need "the console.log wave" to land. All four values below are shapes the ladder can prove without a constant fold — an `===` comparison result and an `&&`/`||` result both carry a known Boolean shape at the point they reach `console.log` — so this case's own four assertions now render `true`/`false`, matching node, and the test is renamed to say so.

This is NOT the same as saying dynamic boolean rendering is unconditionally fixed. `kali_common::Repr` still has no `Boolean` variant at all (`crates/kali_common/src/repr.rs`): a PLAIN BINDING READ of a boolean (`var b = true; console.log(b)`) still prints `1`, because a bare local/global read emits `ValueShape::Unknown`, not `Boolean` — there is no `is_boolean_valued` repr consult mirroring the float lane's `is_float_valued`. That general defect remains open and is out of scope here; only the shapes the ladder can already prove (comparison results, `&&`/`||` results, literals, const-folded values) moved."""
args = ["run", "dynamic_console_boolean_rendering_of_provable_shapes_is_fixed.ts"]
exit = "success"
stdout = "true\nfalse\nfalse\ntrue\n"

