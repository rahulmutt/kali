rationale = """R-06 — read-only var/let object-literal materialization soundness pins. A read-only mutable object literal must read back its real field values (materialized allocation), not the silent-0 fold fallback. Shapes the materialized lane cannot store fail closed with E5506, never silent-0.

---- Unary-on-string pins (task review round 4, 2026-07-24) ----

The unary +/- arm of `object_field_value_is_safe_for_materialization` used to recurse into the GENERAL predicate, which admits `String` at the top level — so it wrongly admitted `+"hi"`/`-"3"` too. A materialized field has no string->number coercion (kali reads the raw string bytes as an integer), so `+"3"` happening to read back `3` is COINCIDENTAL, not proof of soundness; `+"hi"`/`+"0x10"`/`+"  5  "` read back garbage. The fix restricts the unary arm to a numeric-literal-only sub-check (`unary_numeric_literal_operand`) that never accepts a string at any depth — a string is admitted ONLY as a bare top-level field value, never underneath a unary operator.

Compile+run, assert fail-closed with E5506."""
args = ["run", "unary_plus_on_nonnumeric_string_fails_closed.js"]
exit = "failure"
stderr_contains = ["E5506"]

