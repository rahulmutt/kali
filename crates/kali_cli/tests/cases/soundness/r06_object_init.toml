name = "var_object_bool_field_reads_value"
rationale = """R-06 — read-only var/let object-literal materialization soundness pins. A read-only mutable object literal must read back its real field values (materialized allocation), not the silent-0 fold fallback. Shapes the materialized lane cannot store fail closed with E5506, never silent-0.

---- Green pins: read-only mutable object literals materialize correctly ----

R-06 Boolean-field residual (task review 2026-07-24): kali has no first-class runtime Boolean repr axis at all (`var b = true; console.log(b);` — NO object involved — already prints "1", not "true"), so a materialized object field can NEVER read a Boolean field back correctly. Read-materializing this binding would turn the pre-fix silent-`0` into a NEW nonzero-wrong value (silent `1`) — exactly what R-06 must never introduce. It fails closed (E5506) instead: honest over-deny beats a new silent-wrong value. A write-materialized Boolean field's pre-existing silent-`1` behavior (`var o={f:false}; o.f=true; console.log(o.f)` -> "1", unchanged) is a separate, out-of-scope, pre-existing bug this fix deliberately leaves untouched.

Compile+run, assert fail-closed with E5506."""
args = ["run", "var_object_bool_field_reads_value.js"]
exit = "failure"
stderr_contains = ["E5506"]

[[case]]
name = "bool_via_variable_fails_closed"
rationale = """R-06 — read-only var/let object-literal materialization soundness pins. A read-only mutable object literal must read back its real field values (materialized allocation), not the silent-0 fold fallback. Shapes the materialized lane cannot store fail closed with E5506, never silent-0.

---- Allowlist-at-the-choke pins (task review round 2, 2026-07-24) ----

The bare Boolean-LITERAL check above is a DENYLIST and leaks: a Boolean value reached via a variable, `!x`, or a comparison — or a BigInt literal — slips it, materializes, and reads back a NEW nonzero-wrong value (main was silent-0). These pins lock in the allowlist-at-the-choke fix (`object_field_value_is_safe_for_materialization`): only a numeric literal, a string literal, or unary `+`/`-` on one is admitted; every other field-value shape fails the WHOLE binding closed (E5506).

Compile+run, assert fail-closed with E5506."""
args = ["run", "bool_via_variable_fails_closed.js"]
exit = "failure"
stderr_contains = ["E5506"]

