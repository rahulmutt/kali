# Migrated from tests/soundness_r06_object_init.rs -- all 24 #[test] functions,
# 1:1 to a case (no fn bundles multiple independent programs; no [matrix] --
# every case runs a distinct one-off JS program via `kali run <file>.js`).
#
# The file's opening plain `//` header (4 lines, not a `//!` doc -- this file
# has no crate-doc comment) is prepended verbatim to every case's rationale.
# Six section banners (`// ---- Title ----`, some with a following paragraph,
# blank-line-separated from the #[test] they introduce) are prepended to every
# case in the fn-range they cover -- contiguous, non-overlapping, monotonic,
# verified programmatically; none exceeds 15 cases so none needs an additional
# `#` divider (rule: only sections over ~15 cases keep one). `run_ok`'s and
# `run_e5506`'s own `///` doc comments are claim prose and are appended to the
# rationale of every case the respective helper produced. A `//` comment
# sitting as the FIRST statement inside a fn body (before its first real
# statement) is a third attachment point, distinct from a banner or a direct
# `///` doc immediately above `#[test]` -- `var_object_bool_field_reads_value`
# is the one case of this in the file. `var_object_mixed_fields_read` carries
# its explanatory comment as an unusual FOURTH attachment point: text trailing
# the `#[ignore]` attribute itself (`#[ignore] // R-06-R4 (root cause
# corrected...): this is` continuing across 11 more indented `//` lines) --
# moved verbatim into that one case's rationale, and the case carries
# `ignore = true` to match the source's `#[ignore]`.
#
# No [constants]: no `const NAME: &str` rule-literal declarations, no
# byte-identical fixture shared across two different #[test]s, no `${...}`
# template literal in this file (all sources are plain non-template JS).
#
# `run_ok` trims stdout before comparing (`assert_eq!(run_ok(src), expected)`
# compares against a TRIMMED literal) -- so, per the pilot's precedent, every
# `run_ok`-based case's `stdout` field below is the untrimmed RAW stdout
# captured from the real built kali binary (verified equal to the trimmed
# literal after `.strip()`), which is the exact, complete process output --
# strictly stronger than the trimmed comparison it replaces, not a departure
# from source intent. `run_e5506` cases assert `exit = "failure"` and
# `stderr_contains = ["E5506"]` per the helper's own body.
#
# Two cases (`returned_object_member_read_no_worse`,
# `object_literal_reassignment_no_worse`) call bare `run()` and assert an OR
# of tolerated outcomes in the source ("stdout == X OR stdout == Y", or even
# "success with one of two stdouts, OR any non-success exit") -- a real
# disjunction the case format cannot express as a disjunction (same class as
# rule 11's OR-error-code case, here triggered by an explicit tolerance-OR
# instead). Both were run against the real built kali binary; each currently
# takes one specific, verified branch of its own tolerated set, and that exact
# branch is pinned here as `exit = "success"` plus the verified `stdout` --
# strictly stronger than the untranslated OR, per the same resolution rule 11
# uses for a disjoint error code, extended here to a disjoint stdout/exit
# shape. The source's full tolerance sentence is carried into both cases'
# rationale so a reader sees why the pin is narrower than what the source
# actually demanded.

