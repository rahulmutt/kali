# Migrated from tests/soundness_ab_repr_nested_bodies.rs -- all 4
# #[test] functions, 1:1 to a case (no fn bundles multiple independent
# assertions; no [matrix] -- each case runs a distinct one-off JS program
# via `kali run <file>.js`; the shared `run_kali` helper writes every
# fixture to `main.js`, matching this file's own JS -- not TS --
# convention).
#
# The file's opening `//!` doc is prepended verbatim to every case's
# rationale. Every one of the 4 #[test]s carries its own direct `///` doc
# (0 uncommented cases), including two embedded ```text fenced code
# blocks (B2, A1) preserved verbatim as part of the joined prose.
#
# No [constants]: no `const NAME: &str` rule-literal declarations, no
# byte-identical fixture shared across #[test]s, no `${...}` template
# literal, no `format!`-built fixture text (the file's helpers build no
# fixture text via `format!` at all -- `tempdir()` handles the temp
# directory).
#
# All four compare RAW (untrimmed) stdout via `assert_eq!` directly -- no
# `.trim()` -- so `stdout` below is a direct copy of the literal.

[source]
"b1_growable_push_in_function_expression_body.js" = "const f = function(){ let o=[]; o.push(1); o.push(2); console.log(o.join(\",\")); }; f();"
"b2_growable_length_and_index_in_block_arrow_body.js" = "const f=()=>{ let o=[]; o.push(7); o.push(8); console.log(o.length); console.log(o[0]); }; f();"
"a1_for_in_over_object_in_arrow_body.js" = "const f = () => { let o = {a:1, b:2}; for (let k in o) { console.log(k + \"=\" + o[k]); } }; f();"
"a2_string_local_concat_in_function_expression_body.js" = "const f = function(){ let s = \"hi\"; let g = s + \" there\"; console.log(g); console.log(\"x=\" + g); }; f();"

[[case]]
name = "b1_growable_push_in_function_expression_body"
rationale = """Stage AB: `repr_infer` must descend into function-expression / arrow bodies.

The whole-program repr-inference pass (`kali_types::repr_infer`) walks only statements and, historically, only descended into `FunctionDeclaration` bodies. Array/object/string bindings declared inside a `const f = () => {…}` or `= function () {…}` body were therefore invisible to the pass:

- **gap B (SILENT miscompile):** an array local in such a body never selected the growable-array lane, so `push`/`.length`/`.join` silently computed against an empty/placeholder array (`0`, not the real value). - **gap A (fail-closed E5506):** object-shape (`for..in`) and String-repr proofs for such bindings were unavailable, over-rejecting programs that `node` runs.

Every expected value below is cross-checked against `node` v26 (recorded inline). Class methods are OUT of scope (separate root cause).

B1 — SILENT→correct (growable push inside a `function () {…}` body).

`node`: `1,2`. Pre-fix kali silently printed `0` (the growable-array lane was never selected for `o`, so `push` did nothing observable)."""
args = ["run", "b1_growable_push_in_function_expression_body.js"]
exit = "success"
stdout = "1,2\n"

[[case]]
name = "b2_growable_length_and_index_in_block_arrow_body"
rationale = """Stage AB: `repr_infer` must descend into function-expression / arrow bodies.

The whole-program repr-inference pass (`kali_types::repr_infer`) walks only statements and, historically, only descended into `FunctionDeclaration` bodies. Array/object/string bindings declared inside a `const f = () => {…}` or `= function () {…}` body were therefore invisible to the pass:

- **gap B (SILENT miscompile):** an array local in such a body never selected the growable-array lane, so `push`/`.length`/`.join` silently computed against an empty/placeholder array (`0`, not the real value). - **gap A (fail-closed E5506):** object-shape (`for..in`) and String-repr proofs for such bindings were unavailable, over-rejecting programs that `node` runs.

Every expected value below is cross-checked against `node` v26 (recorded inline). Class methods are OUT of scope (separate root cause).

B2 — SILENT→correct (growable-array `.length` + indexing inside a block-bodied arrow). `const f = () => { … }` parses as a `FunctionExpression` with a `BlockStatement` body (see the parser note in the task brief). `node`: ```text 2 7 ``` Pre-fix kali silently printed `0` (twice): the arrow body was invisible to repr-inference, so `o` never selected the growable-array lane.

Deviation from the brief's verbatim `let o=[7,8]; …o.length` snippet, verified on a freshly built binary before substituting: a FIXED array literal's `.length`/index (`[7,8].length`, `[7,8][0]`) prints `0` at EVERY scope — module scope, a plain `function` declaration, and a fn-expr/arrow alike (a separate, pre-existing fixed-array-literal codegen gap unrelated to this pass; the descent cannot and does not change it). The GROWABLE lane, by contrast, is exactly what the descent enables: a push-fed array's `.length`/index is `0` at module scope (module `_start` is deliberately not growable-analyzed — see `infer_reprs`) and pre-fix `0` inside a fn-expr/arrow (body invisible), but CORRECT there post-fix. This shape therefore isolates the descent under test, which the fixed-literal shape cannot."""
args = ["run", "b2_growable_length_and_index_in_block_arrow_body.js"]
exit = "success"
stdout = "2\n7\n"

[[case]]
name = "a1_for_in_over_object_in_arrow_body"
rationale = """Stage AB: `repr_infer` must descend into function-expression / arrow bodies.

The whole-program repr-inference pass (`kali_types::repr_infer`) walks only statements and, historically, only descended into `FunctionDeclaration` bodies. Array/object/string bindings declared inside a `const f = () => {…}` or `= function () {…}` body were therefore invisible to the pass:

- **gap B (SILENT miscompile):** an array local in such a body never selected the growable-array lane, so `push`/`.length`/`.join` silently computed against an empty/placeholder array (`0`, not the real value). - **gap A (fail-closed E5506):** object-shape (`for..in`) and String-repr proofs for such bindings were unavailable, over-rejecting programs that `node` runs.

Every expected value below is cross-checked against `node` v26 (recorded inline). Class methods are OUT of scope (separate root cause).

A1 — fail-closed→correct (`for..in` over an object literal declared inside a block-bodied arrow, reading each value via `o[k]`). `node`: ```text a=1 b=2 ``` Pre-fix kali rejected with E5506 ("for..in is only supported over an object with a compile-time-known fixed shape") — the arrow body was invisible to repr-inference, so no object shape was recorded for `o`. Post-fix the shape IS inferred and the loop runs.

Deviation from the brief's `for (const k in o)`, verified on a freshly built binary: a `const` for-in key binding is rejected with a DIFFERENT, pre-existing codegen error ("for..in key binding 'k' has no reserved local") at EVERY scope — module, a `function` declaration, and a fn-expr/arrow alike — unrelated to this pass. `let k` (which reproduces the ORIGINAL E5506 shape-inference rejection pre-fix, then runs post-fix) isolates the descent under test."""
args = ["run", "a1_for_in_over_object_in_arrow_body.js"]
exit = "success"
stdout = "a=1\nb=2\n"

