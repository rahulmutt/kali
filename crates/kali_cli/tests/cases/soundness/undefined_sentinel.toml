# Migrated from tests/soundness_undefined_sentinel.rs -- all 3 #[test]
# functions, 1:1 to a case (no fn bundles multiple independent assertions;
# no [matrix] -- each case runs a distinct one-off TS program via
# `kali run <file>.ts`; the shared `run_source` helper writes every
# fixture to `main.ts`).
#
# Every fn is directly preceded by its own `//` comment (0 uncommented
# cases; no //! doc, no helper doc -- all three bodies are hand-inlined
# `assert!`/`assert_eq!` over `run_source`'s raw `Output`) -- moved
# verbatim into that case's rationale.
#
# No [constants]: no `const NAME: &str` rule-literal declarations, no
# byte-identical fixture shared across #[test]s, no `${...}` template
# literal, no `format!`-built fixture text (the file's one `format!` call
# site builds a temp-directory path, never fixture text).
#
# All three compare `.trim()`'d stdout against a literal -- per the
# pilot's precedent, `stdout` below is the untrimmed RAW stdout captured
# from the real built kali binary ("none\n" / "none\n" / "2\n", each
# verified equal to the trimmed literal after `.strip()`), strictly
# stronger than the trimmed comparison it replaces.

[source]
"forin_alias_undefined_reassign_reads_falsy.ts" = """const o = { a: 1, b: 2 };
let last = null;
for (let k in o) { last = k; }
last = undefined;
if (last) { console.log("some"); } else { console.log("none"); }
"""
"forin_alias_undefined_init_reads_falsy.ts" = """const o = { a: 1 };
let last = undefined;
for (let k in o) { if (false) { last = k; } }
if (last) { console.log("some"); } else { console.log("none"); }
"""
"forin_alias_nullish_assign_undefined_rhs_admits.ts" = """const o = { a: 1, b: 2 };
let last = null;
for (let k in o) { last = k; }
last ??= undefined;
console.log(o[last]);
"""

[[case]]
name = "forin_alias_undefined_reassign_reads_falsy"
rationale = """`last = undefined` on a for-in key alias must store the -1 null sentinel (matching `last = null`), NOT 0 — ordinal 0 is the FIRST KEY, so a 0 store flips `if (last)` from false to true. node prints "none".

NOTE: the for-in key binding uses `let k` rather than `const k` — a `const`-bound for-in key hits an unrelated pre-existing local-reservation gap ("for..in key binding 'k' has no reserved local", independent of this task's recognizer fix) and is not part of the admitted surface. `var`/`let` key bindings are the form used throughout the existing for-in-key test suite (see `crates/kali_cli/tests/runtime_forin.rs`)."""
args = ["run", "forin_alias_undefined_reassign_reads_falsy.ts"]
exit = "success"
stdout = "none\n"

[[case]]
name = "forin_alias_undefined_init_reads_falsy"
rationale = """Declarator form: `let last = undefined` (identifier, not null literal)."""
args = ["run", "forin_alias_undefined_init_reads_falsy.ts"]
exit = "success"
stdout = "none\n"

[[case]]
name = "forin_alias_nullish_assign_undefined_rhs_admits"
rationale = """With the recognizer twins unified, `??= undefined` no longer needs its disagreement reject: it stores the -1 sentinel exactly like `??= null`. node: last is "b" (non-nullish) after the loop, so `??=` does not fire and `o[last]` reads `o.b`. (Reads through the computed-index position `o[last]`, not a bare `console.log(last)`, which hits an unrelated pre-existing materialization restriction on `??=`-assigned aliases — see `console.log(table[last])` in `nullish_assign_reject.rs` for the same idiom.)"""
args = ["run", "forin_alias_nullish_assign_undefined_rhs_admits.ts"]
exit = "success"
stdout = "2\n"
