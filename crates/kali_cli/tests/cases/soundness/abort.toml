# Migrated from tests/soundness_abort.rs — 57 of the file's 58 #[test]
# functions become case blocks here (sibling [[case]] blocks throughout; no
# [matrix] — every case runs a distinct, one-off JS program via `kali run
# <file>.js`, matching the soundness/textcodec.toml precedent). The 58th,
# `acceptance_web_baseline_prefix_matches_node_byte_for_byte`, asserts kali's
# stdout is BYTE-FOR-BYTE IDENTICAL to a live `node <file>` invocation on the
# same fixture — a genuine dual-process comparison the case-runner format
# cannot express (a `cli` step always runs the fixed `kali` binary from
# `config.kali_bin`; there is no field to name a second program, and no
# code anywhere in kali_case_runner spawns two processes and diffs their
# output — confirmed against steps.rs/assertions.rs/model.rs). Kept
# hand-written per spec 5.11's "outliers" bucket, trimmed to just that one
# test plus the `node_output`/`kali_bin` helpers it needs; not deleted.
#
# Every comment in the source is moved into the rationale of the case(s) it
# explains, verbatim, following the same bottom-up method as the pilot's fix
# round 1: every `//`/`///` block sitting directly above a case-producing
# statement is prose that must land in some case's rationale, whether or not
# it carries `--- Title ---` decoration. Section paragraphs with a
# decorated banner and a body (Task 6, Task 8 wave 1, Task 8 round 2, Task 8
# t4-m1, Stage P5 T-new-D) are prepended to the rationale of EVERY case in
# the batch they introduce; Task 6's group (22 cases) also keeps its banner
# as a `#` divider since it exceeds ~15 cases (pilot review's guidance for
# staying navigable). Pure one-line dividers with no paragraph of their own
# (Task 4's) stay only as a `#` divider, carrying no claim of their own to
# move. The file's own opening `//!` doc (2 paragraphs) is prepended to
# every case. Each of the three helper functions' doc comments
# (`run_kali_run`, `run_kali_run_expect_error`, `assert_e5506_containing`)
# is appended to the rationale of every case that helper produced. 13 cases
# had no comment in the source at all (and inherit no shared-group
# paragraph either); their rationale is a plain factual restatement of the
# claim, matching Task 14/15's convention for uncommented tests.
#
# Every stdout/stderr/exit assertion below was captured by running the real
# built `kali` binary against the exact fixture text (never retyped from the
# source's own trimmed `assert_eq!`/`.contains()` expectations) — 0
# discrepancies across all 57 migrated assertions. `stderr_contains` lists
# only the needle(s) the source itself checked (usually just "E5506"; a few
# add a second lane-specific needle via `assert_e5506_containing`, or
# "instanceof" for the four `run_kali`-direct instanceof-trap cases) --
# never the full stderr text, so as not to add a claim the source did not
# make. No `#[test]` in this file bundles multiple independent programs, so
# no fn required sibling-splitting.
#
# [constants] used for exactly one purpose: `dollar = "$"`, so
# `abort_handle_template_interpolation_fails_closed`'s genuine JS template
# literal (`` `v=${c}` ``) can be spelled `${dollar}{c}` — expand.rs
# hard-fails on any unresolved `${...}`, so the literal form cannot appear
# in [source] directly (rule 9's documented workaround). No fixture body in
# this file is byte-identical to another's, so no fixture-sharing
# [constants] entries were needed (confirmed: 0 duplicate `let src = ...`
# bodies across the file's 57 migrated tests).

[constants]
dollar = "$"

