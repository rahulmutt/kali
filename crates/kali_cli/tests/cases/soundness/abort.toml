[[case]]
name = "abort_flips_nothing_visible_but_runs"
rationale = """Stage P3 (AbortController/AbortSignal lane) — Task 3: real `new AbortController()` lowering (8-byte global abort cell), `c.abort()` dispatch, the bare-identifier position gate, and capture allowlist entry 3.

The atomic core of the stage: the exclusion-list flip (`declarator_init_is_placeholder_construct`) lands with the real lowering, entry 3, and `.abort()` dispatch in one commit — intermediate states are unsound/red. These pins prove the visible-no-op-but-runs surface, the fail-closed reads (raw print / unknown method / `let`-declared), the sound deferred-capture-by-value case, and the b2 red-proof (plain objects still deny).

Calling `.abort()` on a controller flips no visible state in this program but the build still compiles and runs to completion.

Run `kali run`, assert it succeeded, and return stdout (caller trims)."""
args = ["run", "abort_flips_nothing_visible_but_runs.js"]
exit = "success"
stdout = """ok
"""

