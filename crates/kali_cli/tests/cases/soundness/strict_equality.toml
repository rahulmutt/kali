THE MECHANISM (the actual proof condition, not a list of shapes): `??` decides its branch at compile time, correctly, if and only if `static_equality_class` (`crates/kali_codegen/src/emit/equality.rs:228`) returns `Some(class)` for the left operand AND that class arms `??`'s check (`is_nullish_class`/`is_never_nullish`, `operators.rs:2181-2208`).

CORRECTED 2026-07-19 (third addendum round): an earlier restatement of this condition as "exactly two cases" (a literal, or a literal-terminated `const` chain) was itself an UNDER-claim, falsified on a freshly built binary — `(a < b) ?? 9` over two function PARAMETERS and `(a - a) ?? 9` over a `let`-bound float both agree with node, and neither operand is a literal or `const`-bound. Reading `equality.rs:228-329` end to end, `static_equality_class` returns `Some` for considerably more: a literal or literal-terminated `const` chain; an operand-INDEPENDENT operator form (`void`, `!`, `typeof`, `delete`, unary `-`/`~`, AND any relational or equality operator `< <= > >= == != === !== in instanceof`, which are always `Boolean` regardless of their operands — this is why the parameter example above is proven); a statically-folded CALL result; a bare global identifier (`undefined`, `NaN`, `Infinity`); or a REPR-BACKED proof that holds over a genuine runtime value with no literal or `const` in sight — an object shape, a bigint-literal-valued node, a float-valued node, a string-valued node, or a `Deno.env.get(...)` result (this is why the float example above is proven).

CORRECTED 2026-07-19 (round 4): there are THREE places `Some` does NOT mean "arms the gate", not one. `is_never_nullish` covers only `Number | BigInt | Boolean | String` and `is_nullish_class` only `Null | Undefined` (`equality.rs:140-152`), so besides `Some(EqClass::UntypedObjectField)` (a `base.field` read whose shape-table repr is the untyped `I64` default), `Some(EqClass::ObjectOrNull)` (an object-shaped operand) and `Some(EqClass::EnvGetResult)` (a `Deno.env.get(...)` result) are ALSO proven-but-non-arming. All three fall through to the runtime `i64.eqz` test exactly as if `static_equality_class` had returned `None`. The OUTCOME only diverges for `UntypedObjectField`, though: the zero-test is independently exact for a live object pointer (`ObjectOrNull`) and for `Deno.env.get`'s unset-`0` result (`EnvGetResult`), so no miscompile follows for those two — see the const-bound-member-read illustration in the next section for the one that does.

Anything else — any operand read back from a runtime storage slot that isn't one of the above (a plain `let`/`var`/parameter/call-return binding with no repr proof, or an untyped-`I64` object field) — returns `None` (or the non-arming `Some(UntypedObjectField)`) and falls through to the pre-existing `i64.eqz` bit-pattern test, which conflates a runtime `0`/`false` with nullish (`??` degrades to `||`).

The four shapes pinned below (`let`, `var`, a function parameter, a call's return value) are ILLUSTRATIONS of that rule, not the boundary itself — see the next section for further illustrations (a `const` whose initializer chain does NOT bottom out at a literal) that are equally uncovered for the identical reason. When the real fix (the `Repr::Boolean`/null axis) lands, every assertion in both sections must go RED — that is the intended signal to update these pins."""
