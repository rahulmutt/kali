[[case]]
name = "zero_is_not_strictly_equal_to_null_or_false"
rationale = """Soundness pins for the strict/loose equality and nullish-coalescing conflation closed in soundness batch 1 (Fix 4).

kali stores every value in an untyped i64 slot. `0`, `false`, `null` and `undefined` all lower to the bit pattern `0`, and `true` lowers to `1`, so the generic `i64.eq` lowering of `===` reported `0 === null`, `0 === false`, `null === undefined` and `1 === true` as `true` (node: `false` for all four). That is wrong CONTROL FLOW, not just a wrong printed value: every `if (x === null)` guard fired when `x` was `0`. The same raw-bit-pattern test made `??` treat `0` and `false` as nullish (`0 ?? 9` → `9`).

The fix classifies both operands into JS type classes at the comparison site (`static_equality_class`) and decides `===`/`!==`/`==`/`!=` by TYPE first. Where a `null` / `undefined` / boolean operand meets an operand whose class cannot be proven, the comparison fails closed with `E5506` rather than emitting a wrong boolean.

Every expected value in this file was captured from node v26.

The controller-verified repro."""
args = ["run", "zero_is_not_strictly_equal_to_null_or_false.ts"]
exit = "success"
stdout = "zero===null:false zero===false:false zero===0:true\n"

