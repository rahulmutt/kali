# Migrated from tests/soundness_param_truncation.rs -- all 10 #[test]
# functions, 1:1 to a case (no fn bundles multiple independent
# assertions; no [matrix] -- each case runs a distinct one-off TS
# program via `kali run <file>.ts`).
#
# The file's opening `//!` doc is prepended verbatim to every case's
# rationale. `assert_fails_closed`'s own `///` doc is claim prose,
# appended to the rationale of every one of the 7 cases that helper
# produced. `repro_default_param_does_not_silently_truncate_module`
# carries its own direct `///` doc PLUS a mid-body leading comment (lines
# 78-79, inside the `if out.status.success()` branch) -- both appended.
# `trailing_comma_param_still_runs` and `plain_params_still_run` each
# carry their own direct `///` doc (negative controls).
#
# No [constants]: no `const NAME: &str` rule-literal declarations, no
# byte-identical fixture shared across #[test]s, no `${...}` template
# literal, no `format!`-built fixture text (the file's one `format!`
# call site builds a temp-directory path, never fixture text).
#
# `repro_default_param_does_not_silently_truncate_module`'s body branches
# on `out.status.success()` in source (an unsupported-shape success would
# require the trailing statement to have run; a reject requires E5506) --
# verified against the real built kali binary: it takes the REJECT
# branch (exit failure, E5506, empty stdout), so `exit = "failure"` +
# `stdout = ""` + `stderr_contains = ["E5506"]` is pinned as the exact,
# currently-observed branch, per rule 11's disjunction-resolution
# principle. `assert_fails_closed(src, construct)` maps to `exit =
# "failure"` + `stderr_contains = ["E5506", construct]` (the helper
# checks the COMBINED stdout+stderr text for both, but every rejection
# here happens before any stdout is produced, verified empty for all
# seven, so `stderr_contains` alone is equivalent and, combined with the
# pinned `stdout = ""`, strictly stronger). `trailing_comma_param_still_runs`
# and `plain_params_still_run` both compare `.trim()`'d stdout against a
# literal -- per the pilot's precedent, `stdout` below is the untrimmed
# RAW stdout captured from the real built kali binary ("v=7\n" both
# times, each verified equal to the trimmed literal after `.strip()`).

[source]
"repro_default_param_does_not_silently_truncate_module.ts" = """function f(a) { return a; }
console.log("before=" + f(1));
function g(b = 5) { return b; }
console.log("after-should-print");
"""
"default_param_function_declaration_fails_closed.ts" = """function g(b = 5) { return b; }
console.log("after");
"""
"default_param_function_expression_fails_closed.ts" = """const g = function (b = 5) { return b; };
console.log("after");
"""
"default_param_arrow_fails_closed.ts" = """const g = (b = 5) => b;
console.log("after");
"""
"default_param_class_method_fails_closed.ts" = """class C { m(b = 5) { return b; } }
console.log("after");
"""
"rest_param_fails_closed.ts" = """function g(...r) { return 1; }
console.log("after");
"""
"object_destructured_param_fails_closed.ts" = """function g({ x }) { return x; }
console.log("after");
"""
"array_destructured_param_fails_closed.ts" = """function g([x]) { return x; }
console.log("after");
"""
"trailing_comma_param_still_runs.ts" = """function g(a,) { return a; }
console.log("v=" + g(7));
"""
"plain_params_still_run.ts" = """function g(a, b) { return a + b; }
console.log("v=" + g(3, 4));
"""

[[case]]
name = "repro_default_param_does_not_silently_truncate_module"
rationale = """End-to-end: an unsupported parameter shape must never silently truncate the module.

The defect: `function g(b = 5) { ... }` left the token stream parked on `=`, `parse_block_statement` advanced over it, and every remaining token in the file was absorbed into `g`'s body. The program exited 0 having silently skipped every statement after the declaration. Any fixture containing a default parameter had its self-checks vacuously "pass".

The invariant: an unsupported parameter shape fails closed (E5506, nonzero exit). It never produces a partial module with a zero exit code.

The controller's exact repro. `after-should-print` is the positive control: it appears ONLY after the default-param declaration, so an assertion on it is precisely an assertion that the module was not truncated. Under the old behavior this printed `before=1` and exited 0.

If default params are ever supported for real, the ONLY acceptable success is one that also ran the trailing statement."""
args = ["run", "repro_default_param_does_not_silently_truncate_module.ts"]
exit = "failure"
stdout = ""
stdout_absent = ["after-should-print"]
stderr_contains = ["E5506"]

[[case]]
name = "default_param_function_declaration_fails_closed"
rationale = """End-to-end: an unsupported parameter shape must never silently truncate the module.

The defect: `function g(b = 5) { ... }` left the token stream parked on `=`, `parse_block_statement` advanced over it, and every remaining token in the file was absorbed into `g`'s body. The program exited 0 having silently skipped every statement after the declaration. Any fixture containing a default parameter had its self-checks vacuously "pass".

The invariant: an unsupported parameter shape fails closed (E5506, nonzero exit). It never produces a partial module with a zero exit code.

The whole point of the test: a program using an unsupported parameter shape must NOT exit 0 with the post-declaration statements silently dropped. It must produce an E5506 naming the construct and a nonzero exit."""
args = ["run", "default_param_function_declaration_fails_closed.ts"]
exit = "failure"
stdout = ""
stderr_contains = ["E5506", "default parameter"]

