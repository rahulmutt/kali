# Cases for the unresolved-member-call project (spec
# docs/superpowers/specs/2026-10-03-unresolved-member-call-design.md).
#
# A member call whose receiver is a value this program built (an object
# literal, a string constant, an instance of a program class, or an alias,
# parameter or function result of one) and whose method resolves to nothing
# refuses with E5506 under `run`, and under `check` for the const
# object-literal and program-class receivers, instead of lowering to a silent
# `0`. Host receivers and inherited program methods keep node's output. Each
# rationale gives kali's `run` output at the baseline `6f042548f`
# (tools/array-return-probes/baseline-unres.tsv) and node v26.10.0's.
#
# `[source]` keys are one file per program, because `[source]` is file-wide.

[constants]
UNRES = "the receiver is a value this program built"

[source]
"objlit.js" = '''
const o={k:1}; console.log(o.zork(4));
'''
"strkey.js" = '''
const o={k:1}; console.log(o["zork"](4));
'''
"inmain.js" = '''
function main(){ const o={k:1}; console.log(o.zork()); } main();
'''
"inst.js" = '''
class C{ f(){return 1;} } const c=new C(); console.log(c.g());
'''
"inst_extends.js" = '''
class A{ f(){return 1;} } class B extends A{} const b=new B(); console.log(b.g());
'''
"deep.js" = '''
const o={a:{b:{}}}; console.log(o.a.b.zork());
'''
"str.js" = '''
const s="abc"; console.log(s.zork());
'''
"alias.js" = '''
const o={k:1}; const p=o; console.log(p.zork());
'''
"param.js" = '''
function g(x){ return x.zork(); } const o={k:1}; console.log(g(o));
'''
"fnres.js" = '''
function mk(){ return {k:1}; } const o=mk(); console.log(o.zork());
'''
"hasown.js" = '''
const o={k:1}; console.log(o.hasOwnProperty("k"));
'''
"call_push.js" = '''
const a=[1,2,3]; a.push.call(a, 4); console.log(a.length);
'''
"proto_pop.js" = '''
const a=[1,2,3]; Array.prototype.pop.call(a); console.log(a.length);
'''
"ok_extends.js" = '''
class A{ f(){return 4;} } class B extends A{} const b=new B(); console.log(b.f());
'''
"ok_et.js" = '''
class X extends EventTarget{} const x=new X(); x.addEventListener("t", ()=>{}); console.log("ok");
'''
"ok_usp.js" = '''
const u=new URLSearchParams("a=1"); u.append("b","2"); console.log(u.toString());
'''
"ok_host_let.js" = '''
let t=globalThis.performance; t.now(); console.log("ok");
'''
"ok_free_unused.js" = '''
performance.now(); console.log("ok");
'''
"ok_inst_method.js" = '''
class S { push(v){ return v+1; } } const s=new S(); console.log(s.push(1));
'''
"ok_this_host.js" = '''
class X extends EventTarget { fire(){ this.addEventListener("t", () => {}); return 1; } } const x = new X(); console.log(x.fire());
'''
"ok_this_host_ctor.js" = '''
class X extends EventTarget { constructor(){ super(); this.addEventListener("t", () => {}); } } const x = new X(); console.log("ok");
'''
"ok_this_host_classexpr.js" = '''
const K = class extends EventTarget { fire(){ this.addEventListener("t", () => {}); return 1; } }; const k = new K(); console.log(k.fire());
'''
"this_prog.js" = '''
class P { fire(){ this.zork(); return 1; } } const p = new P(); console.log(p.fire());
'''
"ok_classexpr_named.js" = '''
const K = class Foo extends EventTarget {}; const k = new K(); k.addEventListener("t", () => {}); console.log("ok");
'''
"ok_extends_member.js" = '''
class A {} A.Inner = class { g(){ return 7; } }; class B extends A.Inner {} const b = new B(); console.log(b.g());
'''
"generic_constraint.ts" = '''
class B<T extends EventTarget> { g(){ return 2; } }
const b = new B(); console.log(b.zork());
'''
"shadowed_host_class.js" = '''
class C extends EventTarget {} function main(){ const mk = () => ({k:1}); const C = mk; const o = C(); console.log(o.zork()); } main();
'''
"ok_computed_member.js" = '''
class C { ["foo"](){ return 1; } } const c = new C(); console.log(c.foo());
'''

