# Migrated from tests/soundness_url.rs -- 63 case blocks from the file's 59
# #[test] functions (sibling [[case]] blocks throughout; no [matrix] -- every
# case runs a distinct, one-off JS program via `kali run <file>.js`, matching
# the soundness/textcodec.toml precedent). 4 #[test] fns bundle multiple
# independent assertions over distinct one-off programs (not a loop over one
# program's output) and are split into sibling cases, the same pattern
# Task 14/15/16-batch1 use: `url_searchparams_composition_mutation_fails_closed`
# (a `for method_call in [...]` loop, 2 siblings), `url_binding_name_shadowing_
# fails_closed` (2 independent assertions, 2 siblings), `usp_get_in_condition_
# fails_closed` (a `for src in [...]` loop, 3 siblings), `url_binding_
# reassignment_fails_closed` (2 independent assertions, 2 siblings).
# 63 = 55 base 1:1 fns + (2+2+3+2) sibling cases from the 4 split fns.
#
# The file's 59th #[test], `acceptance_web_baseline_with_url_matches_node_
# byte_for_byte`, asserts kali's stdout is BYTE-FOR-BYTE IDENTICAL to a live
# `node <file>` invocation on the same fixture -- a genuine dual-process
# comparison the case-runner format cannot express (a `cli` step always runs
# the fixed `kali` binary from `config.kali_bin`; there is no field to name a
# second program, and no code anywhere in kali_case_runner spawns two
# processes and diffs their output). Kept hand-written per spec 5.11's
# "outliers" bucket, trimmed to just that test plus the `node_output`/
# `kali_bin` helpers it needs; not deleted (same treatment as
# soundness_abort.rs's sibling acceptance test).
#
# Every comment in the source is moved into the rationale of the case(s) it
# explains, verbatim, following the bottom-up method (every `//`/`///` block
# directly above a case-producing statement is prose that must land in some
# case's rationale, decorated or not). Section paragraphs with a banner AND a
# body (Task 6, Task 6 review-fix wave, Stage P5 T-new-D) are prepended to the
# rationale of every case in the batch they introduce; Task 6's group (15
# cases) also keeps its banner as a `#` divider since it is at the ~15-case
# threshold (pilot review's guidance for staying navigable). Pure dividers
# with no paragraph of their own (Task 4, Task 5, Task 8 fix wave, Task 7)
# stay only as a `#` divider. The file's own opening `//!` doc is prepended to
# every case. Each helper's doc comment (`run_kali_run`, `run_kali_run_expect_
# error`, `sink_src`, `assert_e5506_containing`) is appended to the rationale
# of every case that helper produced. 9 cases had no comment in the source at
# all (and inherit no shared-group paragraph either); their rationale is a
# plain factual restatement of the claim.
#
# Every stdout/stderr/exit assertion below was captured by running the real
# built `kali` binary against the exact fixture text -- 0 discrepancies across
# all 63 migrated assertions. `stderr_contains` lists only the needle(s) the
# source itself checked (usually just "E5506"; `usp_json_stringify_fails_
# closed` additionally checks the URL/USP-specific identifier-choke message,
# and the 5 `assert_e5506_containing` cases each check a second lane-specific
# needle) -- never the full stderr text.
#
# [constants] used for exactly one purpose: `dollar = "$"`, so
# `url_template_interp_fails_closed`'s genuine JS template literal
# (`` `v=${u}` ``) can be spelled `${dollar}{u}` (rule 9's documented
# workaround). No fixture body in this file is byte-identical to another's, so
# no fixture-sharing [constants] entries were needed (confirmed: 0 duplicate
# fixture bodies across the file's 63 migrated cases).

[constants]
dollar = "$"

