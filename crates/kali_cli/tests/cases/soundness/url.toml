`.set` returns undefined (WHATWG); `__usp_set` carries the live tagged store handle internally, but the call site drops it and renders the void-method placeholder `0` — the raw i64 handle must NEVER escape as an observable value (the Global Constraint). A leak would print a tagged handle integer >= 2^62 here, not `0`.

Run `kali run`, assert it succeeded, and return stdout (caller trims)."""
args = ["run", "usp_set_result_does_not_leak_the_store_handle.js"]
exit = "success"
stdout = """0
b
"""

