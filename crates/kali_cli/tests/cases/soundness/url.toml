Brief authored this with `String(count)`, but `String(x)` is fail-closed on this branch (the G6 value-builtin deny-set: `{String,Boolean,toString,split,JSON.stringify}` — a deliberate, shipped deny). The runtime int→string concat coercion `'' + count` is the equivalent SUPPORTED dynamic-string primitive: it produces the same runtime-computed string "7" (not a const-fold — `q.set`/`q.get` are runtime scans), preserving the test's intent (a dynamic value flows through `set` and `get` reflects it, and a duplicate-free single entry via `getAll(...).length == 1`). Verified byte-for-byte against `node`.

Run `kali run`, assert it succeeded, and return stdout (caller trims)."""
args = ["run", "usp_set_replaces_and_get_reflects_dynamic_value.js"]
exit = "success"
stdout = """7
1
"""

