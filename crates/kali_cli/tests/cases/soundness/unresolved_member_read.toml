[[case]]
name = "a_typeof_of_an_absent_field_refuses_under_run"
rationale = """At `28c97e4ed` kali printed `0` at exit 0 where node v26.10.0 prints `undefined` (spec §5 residue A-3: `typeof` is unsupported and lowers to a silent `0`). The read gate now refuses the absent-field read inside it, so the program no longer prints the wrong `0`."""
args = ["run", "typeof.js"]
exit = "failure"
stderr_contains = ["E5506", "${UNREAD}"]
stdout = ""

[[case]]
name = "a_member_read_on_a_shadowed_math_refuses_under_run"
rationale = """node v26.10.0 prints `undefined`. `let Math = {a:1}` shadows the global; `Math.b` refuses with E5506 through the fixed-shape gate (`unknown field 'b' on fixed-shape object`) at the baseline, not through the new read gate, so only the code is pinned."""
args = ["run", "shadow_math.js"]
exit = "failure"
stderr_contains = ["E5506"]
stdout = ""

[[case]]
name = "a_member_read_on_a_shadowed_math_refuses_under_check"
rationale = """As the `run` row: the fixed-shape gate refuses under `check` as well, so only the code is pinned."""
args = ["check", "shadow_math.js"]
exit = "failure"
stderr_contains = ["E5506"]
stdout = ""

[[case]]
name = "a_nested_read_on_an_object_literal_parameter_refuses_under_run"
rationale = """node v26.10.0 prints `1`. `f({a:{b:{c:1}}})` is refused by an earlier gate (an object literal passed directly as a call argument), not by the new read gate, so only the code is pinned; the nested parameter-rooted read of spec §6.3 is therefore not reached through this program."""
args = ["run", "nested.js"]
exit = "failure"
stderr_contains = ["E5506"]
stdout = ""

[[case]]
name = "a_nested_read_on_an_object_literal_parameter_refuses_under_check"
