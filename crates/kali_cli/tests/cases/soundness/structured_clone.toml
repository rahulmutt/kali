`object_field_is_growable_array` (crates/kali_codegen/src/emit/object.rs) lets downstream growable-array dispatch (push/join/length/index/for-of, Task 5) accept a `base.field` receiver, not only a named binding. This file's first test pins the pre-Task-5 (still-fail-closed) behavior: a `.join` call on an object field that holds a growable i64 array has no dispatch yet, so kali does not print the joined string. The test is `#[ignore]`d here (a deliberate deviation from the brief — see the Task 4 report) so the workspace gate stays 0-newly-red; Task 5 removes the `#[ignore]` once the dispatch lands.

Migration note: no `#[ignore]` attribute exists in the source as of this migration — the claim above is stale; this case is not ignored.

Stage P2 review RIDERS (R1, R2): named/field write-and-join asymmetries.

R2 positive control (allowlist's green side — reviewer-verified correct today, must NOT regress): a growable-field `join` with a STRING-binding separator round-trips, and an OMITTED separator (default ",") round-trips.

Run `kali run`, assert it succeeded, and return stdout (caller trims)."""
args = ["run", "growable_field_join_string_and_omitted_separator_stay_green_string_separator.js"]
exit = "success"
stdout = "1-2-3\n"

