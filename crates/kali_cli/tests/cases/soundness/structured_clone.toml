Task 6 (Lane 3): same-shape object identity. `q = p` is aliasing (same heap pointer); `r` is a separately-allocated same-shape object. `p === q` must be real pointer identity (true); `p === r` must be false (distinct allocations), proving the allow lane does real pointer comparison, not a blanket true.

DEVIATION FROM THE BRIEF, two orthogonal pre-existing limitations (documented; same pattern as Task 5's `object_array_field_push_join_length_round_trip`):

1. Multi-arg `console.log`: the brief's snippet used a single `console.log(p === q, p === r)`. `crates/kali_codegen/src/emit/ call.rs`'s dynamic console lane emits only the FIRST argument and silently drops the rest (see the "Stage 4 Task 6 re-review fix" comment there) — reproduces identically with plain scalars (`console.log(1 === 1, 1 === 2)` also prints a single `1`), unrelated to objects. This test uses one `console.log` per comparison instead.

2. Dynamic-boolean rendering: the brief asserted the output renders as `"true"`/`"false"` text like node. That holds ONLY for a compile-time-foldable literal (`console.log(true)` does print `"true"`, via `render_console_call`'s static lane) — a genuinely DYNAMIC boolean (the runtime lane `emit_console_argument`, which has no `ValueShape::Boolean` arm, only `Float`) prints the raw `1`/`0` i64 unconverted. This is general and pre-existing — plain scalar `let a=1,b=2; console.log(a===a); console.log(a===b);` also prints `1`/`0`, and `array_callback_number_predicates_runtime.rs` already pins this exact "1\\n0\\n..." convention as kali's accepted (if node-diverging) behavior for runtime-computed booleans. `p === q` and `p === r` are genuinely dynamic (real pointer identity, not a static fold — that IS the point of this test), so they hit this same pre-existing lane and print `1`/`0`. Fixing dynamic Boolean-to-text rendering is a general, separate, higher-blast-radius change (it would flip the expected output of every already-green test that prints a runtime comparison) — out of scope for Lane 3, which is about WHETHER the comparison is sound, not how its result is printed.

Run `kali run`, assert it succeeded, and return stdout (caller trims)."""
args = ["run", "same_shape_object_identity_alias_is_true.js"]
exit = "success"
stdout = "1\n0\n"

