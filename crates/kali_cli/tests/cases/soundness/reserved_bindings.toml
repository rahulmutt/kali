# functions become 5 cases: `reserved_word_binding_rejects` loops over
# THREE independent fixtures (`const if = 1;`, `let for = 2;`,
# `var function = 3;`), each an independent assertion per rule 5, so it
# is split into three siblings named for the reserved word each one pins
# (`reserved_word_binding_rejects_const_if` /
# `reserved_word_binding_rejects_let_for` /
# `reserved_word_binding_rejects_var_function`); the other two fns are
# 1:1. No [matrix] -- each case runs a distinct one-off TS program via
# `kali run <file>.ts`.
#
# The file's opening `//!` doc is prepended verbatim to every case's
# rationale. Every fn/loop is directly preceded by its own `//` comment
# (0 uncommented cases); the loop's single comment (lines 33-34) is
# shared by all three split siblings, matching what the source itself
# shares across the three loop iterations.
#
# No [constants]: no `const NAME: &str` rule-literal declarations, no
# byte-identical fixture shared across #[test]s, no `${...}` template
# literal, no `format!`-built fixture text (the file's one `format!` call
# site builds a temp-directory path, never fixture text).
#
# `reserved_word_binding_rejects`'s three iterations assert only
# `!out.status.success()` in source -- no stdout/stderr substring check --
# so only `exit = "failure"` is pinned per split case (rule 2).
# `contextual_keyword_bindings_still_work` and
# `full_binding_allowlist_binds_and_reads_back` both compare `.trim()`'d
# stdout against a literal -- per the pilot's precedent, `stdout` below is
# the untrimmed RAW stdout captured from the real built kali binary
# ("6\n" / "36\n", each verified equal to the trimmed literal after
# `.strip()`), strictly stronger than the trimmed comparison it replaces.

