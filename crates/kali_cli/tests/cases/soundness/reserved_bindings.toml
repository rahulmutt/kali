[[case]]
name = "full_binding_allowlist_binds_and_reads_back"
rationale = """Soundness pin: reserved words must reject as binding names.

`parse_variable_declarator` used to take ANY next token's value as the binding name, so `const if = 1` bound a variable literally named "if". Contextual keywords that are legal JS binding identifiers (e.g. `type`, `of`, `from`) must keep working.

Bind+read symmetry pin for the ENTIRE `is_binding_name_token` allowlist: every token legal in binding position must also read back as a plain identifier expression. The bind gate (statement.rs via call.rs allowlist) and the readback arms (primary.rs) are hand-mirrored — a token added to one side without the other silently miscompiles (readback falls into the primary catch-all and yields Identifier("unknown"), i.e. 0), so this pins all 8 tokens end-to-end with an exact sum only correct reads can produce."""
args = ["run", "full_binding_allowlist_binds_and_reads_back.ts"]
exit = "success"
stdout = "36\n"
