[[case]]
name = "reserved_word_binding_rejects_const_if"
rationale = """Soundness pin: reserved words must reject as binding names.

`parse_variable_declarator` used to take ANY next token's value as the binding name, so `const if = 1` bound a variable literally named "if". Contextual keywords that are legal JS binding identifiers (e.g. `type`, `of`, `from`) must keep working.

`parse_variable_declarator` took ANY next token's value as the binding name, so `const if = 1` bound a variable literally named "if"."""
args = ["run", "reserved_word_binding_rejects_const_if.ts"]
exit = "failure"

