# Migrated from tests/soundness_textcodec.rs -- all 174 #[test] functions,
# as 227 case blocks (sibling [[case]] blocks throughout; no [matrix] -- every
# case runs a distinct, one-off JS program via `kali run <file>.js`, so there is
# no shared extension/command axis for a file-level matrix to fan out; the
# concat_static.toml precedent documents the same non-uniformity reasoning).
#
# 159 #[test] fns map 1:1 to a case. 15 #[test] fns bundle multiple independent
# `run_ok`/`run_e5506`/`run_fail_closed`/`assert_fails_closed` calls -- each over
# its own one-off program, not a loop over one program's output -- and are split
# into that many sibling cases (`{fn_name}_{suffix}`), matching how Task 14/15
# already expand a `for x in [...]` loop into sibling cases: `string_call_proof_
# admits_scalars_and_proven_strings` (7), `string_call_proof_admits_the_scalar_
# shapes_the_parent_build_rendered` (10), `string_result_binding_is_a_real_proof_
# not_the_default_repr` (8, including its `for kind in ["const","let","var"]` loop
# expanded to 3 siblings), and 12 more with 2-7 sibling cases apiece.
#
# This file is the task's prose case: 319 `//`-comment lines record what each
# pin is FOR and why it still holds. Every comment that explains a specific
# case's claim is moved into that case's `rationale`, verbatim (reflowed from its
# hand-wrapped source lines into flowing paragraphs; list markers kept as lines).
# Several `// ...` comment blocks carry a shared paragraph of context for an
# entire batch of cases below them -- some decorated as a `--- Title ---`/
# `=== Title ===` banner (e.g. "C-1: TextDecoder constructor arguments are
# SEMANTIC ...", "T-new-D: the UNIFIED stale-provenance shadow guard ..."), and
# some plain undecorated `//` blocks sitting directly above a `#[test]` or at the
# very top of a function body before its first statement (e.g. "Fail-closed pins
# that must NOT regress now that the same lane is wider.", or T-new-F's own
# opening comment inside `string_result_binding_is_a_real_proof_not_the_default_
# repr`). A first pass here scanned only for the decorated form and silently
# dropped four of the undecorated ones -- caught by pilot review's fix round 1,
# which is why extraction here is bottom-up (every `//` block immediately above
# a case-producing statement, decorated or not) rather than banner-down (only
# blocks with `--- ---`/`=== ===` decoration). Either way, that shared paragraph
# is prepended to the `rationale` of EVERY case in the batch it introduces (not
# just the file, and not just one case), since it is exactly the kind of context
# the brief means by "prints on failure instead of sitting invisible in a
# comment". Banners with no accompanying paragraph (pure dividers, e.g. "---
# decode roundtrip (Task 4) ---") stay as a `#` comment marking the group below,
# matching this codebase's existing house style for structural section headers
# (see array/callback_find.toml's Group A/B/C comments) -- they carry no claim of
# their own to move.
#
# The file's own opening line ("Stage P5 -- String() coercion + TextEncoder/
# TextDecoder soundness pins.") is prepended to every case's `rationale`, and
# each of the 5 helper fns' (`run_ok`/`run_e5506`/`run_fail_closed`/
# `assert_fails_closed`/`assert_e5506_containing`) `///` doc comments is APPENDED
# to the `rationale` of every case that helper produced -- both were dropped in
# the original pass (fix round 1, Finding 2) and are claim prose, not boilerplate:
# `run_fail_closed`'s doc is the ONLY place the E3200-or-E5506 disjunction is
# explained per-case rather than paraphrased once in this header (see below); a
# maintainer hitting a bare `stderr_contains = ["E3200"]` mismatch now sees why
# either code was ever acceptable, not just that one was pinned.
#
# 27 of the earliest cases (before the file's first section banner) had no
# comment at all in the source; their `rationale` is a plain factual restatement
# of the claim (what is asserted, not an invented why), matching how uncommented
# tests were migrated in Task 14/15.
#
# Every stdout/stderr/exit assertion below was captured by running the actual
# built `kali` binary against the exact fixture text (not retyped from the
# source's trimmed `assert_eq!` expectation) -- `run_ok`'s helper trims stdout
# before comparing, so the untrimmed raw stdout (with its trailing newline(s))
# is what each case's `stdout` field pins here, which is the exact, complete
# process output, strictly stronger than the trimmed comparison it replaces.
#
# `run_fail_closed`'s helper accepts EITHER E3200 or E5506 (the value can carry a
# seeded `Repr::String`, so a numeric-sink rejection surfaces as E3200 -- the
# pre-existing "runtime string in a numeric position" mismatch -- rather than
# E5506). TOML's `stderr_contains` list is an AND, not an OR, so it cannot express
# that disjunction directly; each such case was run against the real binary to
# find which single code it actually emits, and that exact code is what is
# pinned here -- a real, verified, strictly stronger claim than the OR it
# replaces, not a weakening (see the task-16-batch1 report's pattern notes).
#
# [constants] used ONLY for two things (per the controller pre-check: this
# family has no `const NAME: &str` rule-literal declarations to preserve):
#   - `dollar = "$"`, so the two fixtures whose JS template literals contain a
#     literal `${...}` (`\`x${s}\``, `` `v=${g(1n)}` ``) can be spelled
#     `${dollar}{...}` -- expand.rs hard-fails on any unresolved `${...}`, so the
#     literal form cannot appear in [source] directly (rule 9's documented
#     workaround). The programs that were actually RUN to verify every assertion
#     in this file used the real, unescaped text; only the TOML encoding differs.
#   - 11 fixture bodies that are byte-identical across two or three DIFFERENT
#     #[test] fns in the source (e.g. a base pin and a later "boundary tripwire"
#     regression test over the identical shape) are factored into [constants] and
#     referenced by each of their case-specific filenames, per rule 6.
#
# `\u{XXXX}` audit-tool gap: this file's `string_call_proof_admits_scalars_and_
# proven_strings` non-ASCII case pins `assert_eq!(..., "6\nh\u{e9}llo")`. This
# file's matching case asserts the real, built-binary-verified stdout (the actual
# UTF-8 e-acute the program prints) -- correct, but `audit-case-migration.py`'s
# `unquote()` previously decoded only `\"`, `\n`, `\t`, `\\`, never a Rust
# `\u{XXXX}` escape, so it could not recognize the two spellings as the same
# claim and reported it missing. This branch's own precedent for a real claim the
# audit tool can't see is to fix the tool, not the case file or the constraint:
# commit ec895f8149 (this file's own base) added `json_null`-key recognition to
# audit-case-migration.py for exactly this reason, explicitly lifting the
# don't-touch-the-script rule for that one, narrow, verified-safe fix. Pilot
# review's fix round 1 applied the same standard here: `unquote()` now decodes
# `\u{XXXX}` too (see its doc comment in the script), after re-running the audit
# over the .rs/.toml pairs that were migrated at the time -- the case files at
# this file's own base, in the five directories named below, plus this one
# (restored read-only from git, never into the working tree):
#
#     git ls-tree -r --name-only ec895f8149 \
#         -- crates/kali_cli/tests/cases/{string,array,math,object,soundness}
#
# THE TWO COUNTS THAT USED TO SIT IN THIS SENTENCE ARE DELETED, NOT CORRECTED.
# It read "all 50 currently-migrated pairs ... all 50 pass, where 49 passed
# before". Both were exact when written and both describe a population that has
# grown in every batch since, because they count OTHER files: a count of the
# live corpus, invalidated by edits to files this one does not contain. Ruling
# 16 is directly on point -- a family-wide count has no gateable home inside a
# case file, so state the class and keep the enumerating command; ruling 15's
# third answer is why the integers go rather than get a fresh value, since the
# next batch's migrations would falsify a fresh one by construction and nothing
# here would fail when they did. The command above is pinned to an immutable ref
# and its output cannot move. The AUDIT SCRIPT is the live side of that
# measurement, so anyone re-deriving it must say which revision of
# `audit-case-migration.py` they ran. This file now audits clean with zero change
# to its own assertions.

[constants]
dollar = "$"
bool_render_body = "console.log(String(1n === 1n));"
string_zero_arg_body = "console.log(String());"
string_multi_arg_body = "console.log(String(1n, 2n));"
string_of_arrow_body = "console.log(String(() => 1n));"
decode_inline_unbound_roundtrip_body = "console.log(new TextDecoder().decode(new TextEncoder().encode('hi')));"
nested_encode_of_encode_body = "const e = new TextEncoder(); const b = e.encode(e.encode('hi')); console.log('x');"
encode_of_bare_string_call_i64_body = "const e = new TextEncoder(); const b = e.encode(String(42n)); console.log(b.byteLength);"
encode_of_bare_string_call_runtime_i64_body = "function f(x) { return x + 1n; } const v = f(41n); const e = new TextEncoder(); const b = e.encode(String(v)); console.log(b.byteLength);"
string_of_object_field_body = "const o = { s: 'hello' }; console.log(String(o.s));"
string_result_const_binding_body = "function g(y) { return String(y); } const s = g(1n); console.log(String(s));"
string_result_let_binding_body = "function g(y) { return String(y); } let s = g(1n); console.log(String(s));"

