The construction lane emits an opaque i64 host handle for a declarator-bound `new EventTarget()`, records the binding's provenance, and fails closed on every read that would leak the raw handle (spec §2.4). The addEventListener/dispatchEvent emit arms land in Task 4; until then a `t.addEventListener(...)` still takes the Stage C backstop.

Task 9 C-1 FINAL — DEFAULT-DENY over an allowlist at the shared deferred-callback choke point. A deferred callback restores captures through the OWNER's env-record pointer, but the owner frame and its arena are gone when the callback fires: only a BY-VALUE promoted scalar cell (a depth-1 i64 stored inline in the record) survives. Every other capture reads a placeholder in the deferred lane while node computes a real value. The earlier scalar-only DENYLIST leaked three whole classes — captured OBJECTS (repr I64 or `Object`), scalars laundered THROUGH an object field, and param-ALIAS locals — so the deny was flipped to an ALLOWLIST: everything is denied UNLESS it is a by-value scalar OR a provable zero-placeholder construct (`new AbortController()`). All four registration surfaces (setTimeout / setInterval / queueMicrotask / addEventListener) inherit it. The five param/string/float scalar pins below are now SUBSUMED by the default (they were the original denylist entries); the five object/alias pins that follow are the holes the allowlist flip closed (Task 9 C-1 final verification probes b2/b7/b2b/b5/b3).

Allowlist-flip closures (Task 9 C-1 final verification probes)

Each RUNS in node (a real value) and printed a placeholder 0 in kali before the flip; the scalar-only denylist ALLOWED every one of them. The allowlist now denies them E5506 (reject-don't-miscompile).

Probe b3 (=p36b): a param is aliased into a `let` (`let a = i`) and the alias is captured. node: "a=1"; kali pre-flip: "a=0". The alias is `is_scalar == false` with a NON-param name, so the old `function_param_names` consult (which only caught DIRECT param captures) missed it. Deny E5506.

Assert E5506 AND that the diagnostic names the expected capture class."""
