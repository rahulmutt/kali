[[case]]
name = "event_target_construction_in_declarator_compiles_and_runs"
rationale = """Stage D event-surface lane (Task 3) — `new EventTarget()` construction lane + handle-escape discipline.

The construction lane emits an opaque i64 host handle for a declarator-bound `new EventTarget()`, records the binding's provenance, and fails closed on every read that would leak the raw handle (spec §2.4). The addEventListener/dispatchEvent emit arms land in Task 4; until then a `t.addEventListener(...)` still takes the Stage C backstop.

Stage D event lane: `new EventTarget()` in a declarator compiles and the program runs (the handle is opaque; nothing observable yet). node v26.5.0: "done\\n"."""
args = ["run", "event_target_construction_in_declarator_compiles_and_runs.js"]
exit = "success"
stdout = """done
"""

[[case]]
name = "event_target_handle_escape_fails_closed"
rationale = """Stage D event-surface lane (Task 3) — `new EventTarget()` construction lane + handle-escape discipline.

The construction lane emits an opaque i64 host handle for a declarator-bound `new EventTarget()`, records the binding's provenance, and fails closed on every read that would leak the raw handle (spec §2.4). The addEventListener/dispatchEvent emit arms land in Task 4; until then a `t.addEventListener(...)` still takes the Stage C backstop.

Handle-escape discipline (spec §2.4): an EventTarget binding read outside the lane's allowed positions fails closed — the handle must never leak as a number (node prints `EventTarget {}`; kali would print the raw handle)."""
args = ["run", "event_target_handle_escape_fails_closed.js"]
exit = "failure"
stderr_contains = ["E5506"]

