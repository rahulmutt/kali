[[case]]
name = "multi_arg_runtime_float_prints_both"
rationale = """End-to-end: a multi-argument `console.*` call must never silently discard arguments.

The defect: the console lowering had two lanes. The STATIC lane (`render_console_call`) folds a call whose arguments are ALL compile-time renderable into one interned string joined with `" "` — so all-literal calls printed correctly. The DYNAMIC lane, taken as soon as ANY argument is not statically renderable, emitted argument 0, called the console import, and then emitted each remaining argument purely for side effects and `Drop`ped it. `console.log(5, "y=" + 6)` printed `5` and exited 0 — no diagnostic.

This is evidence-corrupting: fixtures self-check by logging several values on one line, so a vanished argument makes a check pass vacuously.

The invariant: NO SILENT OUTPUT LOSS. Every argument is printed, space-separated, or the call fails closed with an E5506 naming the construct. It is never dropped.

Known, still-open sibling defect (NOT fixed here, deliberately): a COMPUTED boolean renders as `1`/`0` rather than `true`/`false` — it needs a `Repr::Boolean` axis, and `soundness_abort.rs` ratifies `1`/`0` rendering in some paths. Tests below that involve a computed boolean pin kali's current `1` rendering and say so; the point they defend is that the argument is PRESENT, not how it renders.

Assert that `src` runs successfully and emits `expected` as a COMPLETE line on stdout.

Full-line equality is the whole point. A `contains`/prefix assertion passes when the tail of the line is dropped, which is exactly how this defect hid for so long: `assert!(stdout.contains("5"))` is satisfied by the broken output `5` as well as the correct `5 y=6`.

A runtime float argument alongside a literal — the float stringify seam has its own coercion path, so it gets its own case."""
args = ["run", "multi_arg_runtime_float_prints_both.ts"]
exit = "success"
stdout = "v 2.5\n"

[[case]]
name = "every_console_sink_prints_all_arguments_log"
rationale = """End-to-end: a multi-argument `console.*` call must never silently discard arguments.

The defect: the console lowering had two lanes. The STATIC lane (`render_console_call`) folds a call whose arguments are ALL compile-time renderable into one interned string joined with `" "` — so all-literal calls printed correctly. The DYNAMIC lane, taken as soon as ANY argument is not statically renderable, emitted argument 0, called the console import, and then emitted each remaining argument purely for side effects and `Drop`ped it. `console.log(5, "y=" + 6)` printed `5` and exited 0 — no diagnostic.

This is evidence-corrupting: fixtures self-check by logging several values on one line, so a vanished argument makes a check pass vacuously.

The invariant: NO SILENT OUTPUT LOSS. Every argument is printed, space-separated, or the call fails closed with an E5506 naming the construct. It is never dropped.

Known, still-open sibling defect (NOT fixed here, deliberately): a COMPUTED boolean renders as `1`/`0` rather than `true`/`false` — it needs a `Repr::Boolean` axis, and `soundness_abort.rs` ratifies `1`/`0` rendering in some paths. Tests below that involve a computed boolean pin kali's current `1` rendering and say so; the point they defend is that the argument is PRESENT, not how it renders.

Every affected console sink shares the one lowering choke point, so each one must print both arguments. `log`/`info`/`debug` go to stdout; `error`/`warn` go to stderr (and `warn` carries kali's pre-existing `[warn] ` prefix, which is a separate rendering convention and not what is under test). The assertion is on the full two-argument payload either way, so a dropped tail fails it."""
args = ["run", "every_console_sink_prints_all_arguments_log.ts"]
exit = "success"
stdout_contains = ["S y=6"]

