# Migrated from tests/soundness_console_multiarg.rs -- 10 #[test]
# functions: 9 migrate to 17 cases here, 1 stays hand-written.
# `multi_arg_all_literals_still_prints_all` calls `assert_stdout_line` FOUR
# independent times over four distinct fixtures,
# `multi_arg_unshaped_boolean_renders_one_but_keeps_every_argument` calls it
# TWICE, and `every_console_sink_prints_all_arguments` loops over FIVE
# sinks, each an independent assertion per rule 5, so all three are split
# into siblings; the other six migrated fns are 1:1. No [matrix] -- each
# case runs a distinct one-off TS program via `kali run <file>.ts`.
#
# `multi_arg_never_exits_zero_with_a_dropped_argument` is NOT migrated here
# -- it stays hand-written in `soundness_console_multiarg.rs` (trimmed to
# just that test and its two helpers) per spec 5.11. Its source assertion
# is a genuine disjunction (`if out.status.success() { assert full line }
# else { assert combined stdout+stderr contains "E5506" }`); pinning only
# the currently-observed success branch would either drop the source's
# E5506 alternative (a weakening) or require asserting `stderr_absent =
# ["E5506"]` against a literal that lives only in the untaken branch's code
# (a fabricated claim a first draft of this migration added and review
# rejected -- see that file's `//!` doc for the full reasoning). Both an
# audit-exception mechanism and a reachability analysis to justify that
# shape were explicitly rejected.
#
# The file's opening `//!` doc is prepended verbatim to every case's
# rationale. `assert_stdout_line`'s own `///` doc (explaining why
# full-line equality, not `.contains`, is the point) is claim prose,
# appended to the rationale of every case that helper produced. Every
# fn/loop is ALSO directly preceded by its own `//` comment; the two
# split-`assert_stdout_line` loops each share ONE comment across their
# split siblings, matching what the source itself shares across the
# calls/iterations.
#
# No [constants]: no `const NAME: &str` rule-literal declarations, no
# byte-identical fixture shared across #[test]s, no `${...}` template
# literal. `every_console_sink_prints_all_arguments`'s ONE `format!` call
# site builds fixture text with a `{sink}` substitution -- checked
# explicitly for `{{`/`}}` doubling: none present (no literal brace
# character appears anywhere in that fixture), so no brace-unescape step
# applies; the file's other `format!` call site builds a temp-directory
# path, never fixture text.
#
# `assert_stdout_line` checks that stdout contains a LINE equal to
# `expected` (via `.lines().collect()` then `.contains(&expected)`), not
# that stdout equals `expected` overall -- a `contains`-of-an-exact-line
# check, not a position-anchored `starts_with`. Verified against the real
# built kali binary: every one of these fixtures' program prints EXACTLY
# one line, so pinning the full raw `stdout` (the exact line plus its
# trailing newline) is strictly stronger than the source's own check
# (which would also accept extra surrounding lines), never weaker.
# `every_console_sink_prints_all_arguments` asserts the combined
# stdout+stderr text `.contains("S y=6")` per sink in source -- verified
# against the real built kali binary which stream (`log`/`info`/`debug`
# on stdout, `error`/`warn` on stderr) each sink actually uses, and
# pinned to that SPECIFIC stream via `stdout_contains`/`stderr_contains`,
# strictly stronger than the source's "either stream" check.

