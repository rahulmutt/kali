"multi_arg_literal_then_runtime_concat_prints_both.ts" = """console.log(5, "y=" + 6);
"""
"multi_arg_non_literal_first_then_literals_prints_all.ts" = """function f(x) { return x + 1; }
console.log(f(1), "lit", 7);
"""
"multi_arg_non_literal_in_middle_prints_all_three.ts" = """function f(x) { return x + 1; }
console.log("A", f(2), "C");
"""
"multi_arg_five_arguments_one_dynamic_prints_all.ts" = """function f(x) { return x * 2; }
console.log(1, "b", f(3), "d", 5);
"""
"multi_arg_all_literals_still_prints_all_number_and_string.ts" = """console.log(1, "two");
"""
"multi_arg_all_literals_still_prints_all_two_strings.ts" = """console.log("a", "b");
"""
"multi_arg_all_literals_still_prints_all_three_numbers.ts" = """console.log(1, 2, 3);
"""
"multi_arg_all_literals_still_prints_all_string_bool_null.ts" = """console.log("s", true, null);
"""
"multi_arg_boolean_does_not_drop_following_argument.ts" = """const c = (1 === 1);
console.log(c, "x");
"""
"multi_arg_unshaped_boolean_renders_one_but_keeps_every_argument_return_value.ts" = """function g(a, b) { return a === b; }
console.log(g(1, 1), "y");
"""
"multi_arg_unshaped_boolean_renders_one_but_keeps_every_argument_let_local.ts" = """let d = (2 > 1);
console.log(d, "z");
"""
"multi_arg_runtime_float_prints_both.ts" = """function f(x) { return x / 2; }
console.log("v", f(5));
"""
"every_console_sink_prints_all_arguments_log.ts" = """const v = "y=" + 6;
console.log("S", v);
"""
"every_console_sink_prints_all_arguments_error.ts" = """const v = "y=" + 6;
console.error("S", v);
"""
"every_console_sink_prints_all_arguments_warn.ts" = """const v = "y=" + 6;
console.warn("S", v);
"""
"every_console_sink_prints_all_arguments_info.ts" = """const v = "y=" + 6;
console.info("S", v);
"""
"every_console_sink_prints_all_arguments_debug.ts" = """const v = "y=" + 6;
console.debug("S", v);
"""

[[case]]
name = "multi_arg_literal_then_runtime_concat_prints_both"
rationale = """End-to-end: a multi-argument `console.*` call must never silently discard arguments.

The defect: the console lowering had two lanes. The STATIC lane (`render_console_call`) folds a call whose arguments are ALL compile-time renderable into one interned string joined with `" "` — so all-literal calls printed correctly. The DYNAMIC lane, taken as soon as ANY argument is not statically renderable, emitted argument 0, called the console import, and then emitted each remaining argument purely for side effects and `Drop`ped it. `console.log(5, "y=" + 6)` printed `5` and exited 0 — no diagnostic.

This is evidence-corrupting: fixtures self-check by logging several values on one line, so a vanished argument makes a check pass vacuously.

The invariant: NO SILENT OUTPUT LOSS. Every argument is printed, space-separated, or the call fails closed with an E5506 naming the construct. It is never dropped.

Known, still-open sibling defect (NOT fixed here, deliberately): a COMPUTED boolean renders as `1`/`0` rather than `true`/`false` — it needs a `Repr::Boolean` axis, and `soundness_abort.rs` ratifies `1`/`0` rendering in some paths. Tests below that involve a computed boolean pin kali's current `1` rendering and say so; the point they defend is that the argument is PRESENT, not how it renders.

Assert that `src` runs successfully and emits `expected` as a COMPLETE line on stdout.

Full-line equality is the whole point. A `contains`/prefix assertion passes when the tail of the line is dropped, which is exactly how this defect hid for so long: `assert!(stdout.contains("5"))` is satisfied by the broken output `5` as well as the correct `5 y=6`.

The controller's exact repro: a literal followed by a runtime concatenation. node prints `5 y=6`; the broken lowering printed `5`."""
args = ["run", "multi_arg_literal_then_runtime_concat_prints_both.ts"]
exit = "success"
stdout = "5 y=6\n"

