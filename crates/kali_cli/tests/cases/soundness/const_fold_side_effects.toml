# Migrated from tests/soundness_const_fold_side_effects.rs -- 9 #[test]
# functions become 13 cases: `const_bound_update_expression_applies_exactly_once`
# calls `assert_stdout` FOUR independent times over FOUR distinct
# fixtures (prefix ++/postfix ++/prefix --/postfix --) and
# `const_bound_arrow_with_mutating_body_is_not_promoted` calls it TWICE
# over two distinct fixtures, each call an independent assertion per
# rule 5, so both are split into siblings named for the shape each one
# pins; the other seven fns are 1:1. No [matrix] -- each case runs a
# distinct one-off TS program via `kali run <file>.ts`.
#
# The file's opening `//!` doc is prepended verbatim to every case's
# rationale. `const_bound_update_expression_applies_exactly_once`'s four
# split siblings share ONE comment (line 48) across all four, matching
# what the source itself shares across the four calls.
# `const_bound_arrow_with_mutating_body_is_not_promoted`'s two split
# siblings share the fn's leading comment (lines 77-81); the second
# sibling ALSO carries its own extra mid-body comment (lines 88-89,
# directly above its call) appended on top.
#
# No [constants]: no `const NAME: &str` rule-literal declarations, no
# byte-identical fixture shared across #[test]s, no `${...}` template
# literal, no `format!`-built fixture text (the file's one `format!`
# call site builds a temp-directory path, never fixture text).
#
# `array_literal_argument_is_rejected_fail_closed` asserts failure plus
# TWO stderr substrings (E5506 AND "array literal") in source -- both
# pinned. Every stdout-asserting case (all others) compares stdout via
# `assert_stdout`'s own `assert_eq!(out.stdout, expected)` -- an exact,
# already-untrimmed comparison -- so `stdout` below is a direct copy of
# the literal, no strengthening needed.

