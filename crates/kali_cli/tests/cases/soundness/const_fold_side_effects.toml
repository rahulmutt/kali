"unary_prefix_fixture_semantics_hold.ts" = """const notTrue = !true;
if (notTrue !== false) { throw new Error('neg'); }
const bitwiseNot = ~1;
if (bitwiseNot !== -2) { throw new Error('bitnot'); }
let counter = 1;
const prefix = ++counter;
if (prefix !== 2 || counter !== 2) { throw new Error('prefix'); }
const postfix = counter--;
if (postfix !== 2 || counter !== 1) { throw new Error('postfix'); }
const value = void (1 + 2);
if (value !== void 0) { throw new Error('void'); }
if (typeof value !== 'undefined') { throw new Error('typeof'); }
console.log("ok");
"""
"typeof_provable_lane_matches_node.ts" = """console.log(typeof 42);
console.log(typeof "hi");
console.log(typeof true);
console.log(typeof null);
console.log(typeof undefined);
const v = void 0;
console.log(typeof v);
"""
"typeof_bigint_literal_is_bigint_not_number.ts" = """console.log(typeof 5n);
console.log(typeof -5n);
console.log(typeof 42);
"""
"typeof_direct_call_operand_still_evaluates.ts" = """let n = 0;
function bump() { n = n + 1; return 1.5; }
console.log(typeof bump());
console.log(n);
"""
"array_literal_argument_is_rejected_fail_closed.ts" = """function g(items, value) { return items[0] + items[1] + value; }
console.log(g([1, 2], 1));
"""
"materialized_array_argument_still_works.ts" = """function g(items, value) { return items[0] + items[1] + value; }
const arr = new Array(2);
arr[0] = 1;
arr[1] = 2;
console.log(g(arr, 1));
"""

[[case]]
name = "const_bound_update_expression_applies_exactly_once_prefix_increment"
rationale = """Soundness pins for two fail-open lanes closed in soundness batch 1:

1. `const x = <mutating init>` double-evaluation: the `const` fold lane re-emits the bound init node at every read, which re-applies the side effect. `let b = 5; const x = ++b;` yielded `x == 7, b == 7` (node: `6, 6`); `const y = (b = b + 1)` likewise applied twice. Fixed by promoting any `const` whose init subtree contains a mutating operator to an eager local slot (`declarator_init_contains_mutation`).

2. `typeof` was not parsed as a unary operator at all: `typeof value` parsed as the bare identifier `typeof` (zero placeholder) and dropped `value`, so `typeof v !== 'undefined'` was always true. Now parsed as a real unary expression with a provable static lane (literals, `void` expressions, proven floats); unproven operands keep the pre-existing placeholder fallback.

Golden outputs verified against node v26."""
args = ["run", "const_bound_update_expression_applies_exactly_once_prefix_increment.ts"]
exit = "success"
stdout = "6\n6\n"

