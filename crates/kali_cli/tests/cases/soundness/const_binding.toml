name = "const_member_read_of_mutable_host_state_is_not_folded"
rationale = """Soundness pins for `const` as a real BINDING.

Before this suite, a `const` declarator whose initializer was not on a hand-maintained promotion DENYLIST (`collect_function_locals_from_node` in `crates/kali_codegen/src/lower.rs`) was not bound at all: the initializer AST node was recorded in `FunctionEmitter::bindings` and RE-EMITTED at every read site (`emit/control_flow.rs` identifier arm). A `const` was therefore a textual substitution, not a binding, which produced two silent wrong-value classes with exit 0 and no diagnostic:

1. STALE/WRONG VALUE — the initializer observes state at the READ site instead of the DECLARATION site. The universal swap idiom (`const tmp = a; a = b; b = tmp;`) silently lost a value: kali printed `a=2 b=2` where node prints `a=2 b=1`.

2. REPEATED SIDE EFFECTS — an initializer that calls a function ran once at the declaration plus once per read (N reads => N+1 evaluations).

Both held at module scope and in-function. The fix replaces the denylist with an ALLOWLIST at the same choke point: a `const` keeps the compile-time fold lane only when re-emitting its initializer is provably observationally identical (literals, operators over literals, reads of names that are never reassigned, function-like inits); everything else is promoted to an eager local slot and bound exactly once at the declaration site.

Every golden below is verified against node v26.

A member read is a SNAPSHOT of whatever the property holds at the declaration. Host state reached through a member can be mutated by a METHOD CALL with no assignment to that property appearing anywhere in the program — `c.abort()` mutates `s.aborted`. An earlier form of the stability allowlist admitted any member read whose property was never an *assignment* target, which folded this read and re-evaluated it after the mutation: ONE `const`, TWO values, exit 0 and no diagnostic.

node: `0 0`. Pre-narrowing kali: `0 1`. (Predates the allowlist — the unconditional fold lane had the same hole — so this is a hole the allowlist must CLOSE, not one it opened.) Writing `let before = s.aborted` was already correct, which isolates it to the fold lane."""
args = ["run", "const_member_read_of_mutable_host_state_is_not_folded.ts"]
exit = "success"
stdout = "0\n0\n"

