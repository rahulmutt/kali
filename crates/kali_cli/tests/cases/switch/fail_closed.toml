[[case]]
name = "a_float_discriminant_is_fail_closed"
rationale = """ADDITIVE (Task 4's re-derived boundary matrix, cell 15): a float discriminant is denied. The trap this test exists to close: matrix cell 15 records that a float discriminant already fails today with a DIFFERENT diagnostic, `E4201` (an invalid-module error at load time, for an unrelated reason), so a test that only asserted "this is rejected" would pass for the wrong reason and prove nothing. This asserts E5506 specifically IS present and E4201 is NOT — i.e. `is_provable_i64_scalar`'s float check (`is_float_valued`) is what denies this, at the switch choke point, before any invalid module could ever be produced.

Fix wave item 4: this cell asserted only "some E5506, and not E4201", which is exactly the degradation the file header (and `assert_denied_by`) exist to prevent. Pin the rule.

KNOWN OVERDETERMINATION — recorded, deliberately not fixed in this wave. Three INDEPENDENT gates now deny this one fixture at Rule 1: the parameter-inflow proof added by `83a401c311`, the second gate added by `2bc904375e`, and `emit/switch.rs`'s `scalar(…) == Repr::I64` check. Deleting `is_float_valued` from `is_provable_i64_scalar` today would leave this test GREEN, so the pin above does not actually measure the float check this test's comment claims it does. The same vacuity applies to `a_negative_float_parameter_argument_discriminant_is_fail_closed` below, whose comment claims it pins `expr_is_nonneg_int_literal`'s `fract()` check — unreachable, because the parameter-inflow gate at `emit/switch.rs` returns first. FOLLOW-UP: closing the vacuity needs a fixture that the parameter-inflow and `Repr::I64` gates both ADMIT and only the float check denies; constructing one is its own task and was deliberately out of scope here.

Assert `out` was denied by the named rule, not merely denied."""
exit = "failure"
args = ["run", "a_float_discriminant_is_fail_closed.js"]
stderr_contains = ["E5506", "${RULE_1_DISCRIMINANT}"]
stderr_absent = ["E4201"]

[[case]]
