[[case]]
name = "true_fallthrough_at_module_scope_is_fail_closed"
rationale = """NOTE (Task 9): `switch_nested_in_for_loop_is_fail_closed_not_silently_wrong` used to live here. Task 6 added it as an additive fail-closed requirement and Tasks 7-8 denied it correctly, because its clauses end in `break`/`continue` and Rule 4 admitted only `return`. Task 9 admits those terminators, so the cell FLIPPED to correctness and moved verbatim (per-iteration `console.log` intact) to `switch_runtime.rs` as `switch_nested_in_a_loop_selects_correctly_with_break_and_continue`. It was neither deleted nor weakened; it now asserts node's exact bytes.

Scope is a required test axis. Module scope cannot use `return`, so this pins the DENIAL side at module scope (the admitted twin arrives with Task 9's `break`): true fallthrough (no terminator at all) must still fail closed here too.

Rule 4, not Rule 1: `x` here IS a proven i64, so a Rule 1 denial would mean the discriminant proof had regressed and this cell had stopped testing fallthrough at all.

Task 9 widened Rule 4 from `return`-only to "a proven control transfer", so its message changed and this constant tracks it EXACTLY (not a prefix — the old text is still a prefix of the new one, so leaving it would have made every Rule-4 pin silently insensitive to the widening it is meant to bound).

Assert `out` was denied by the named rule, not merely denied."""
exit = "failure"
args = ["run", "true_fallthrough_at_module_scope_is_fail_closed.js"]
stderr_contains = ["E5506", "${RULE_4_TERMINATOR}"]

