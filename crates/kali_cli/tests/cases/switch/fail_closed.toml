# Migrated from tests/switch_fail_closed.rs.
#
# The exact denial reason each rule emits. A test that asserts only "some E5506"
# silently degrades the moment the cell it names starts denying for a DIFFERENT
# reason — most often Rule 1, since a discriminant proof regression makes every
# switch in the file deny — and it keeps passing while having lost its entire
# purpose. That failure mode has now been found twice on this plan, so it is
# closed structurally: every fail-closed test below pins the rule, and a new one
# has an obvious shape to copy.
#
# PRECISELY (corrected in the pre-merge fix wave — this header used to say
# "every fail-closed test below pins the rule, VIA `assert_denied_by`", which
# was false in two ways and had already let one test drift): - Every `E5506`
# cell pins its rule through `assert_denied_by`. The one that did not —
# `a_float_discriminant_is_fail_closed`, which asserted only `contains("E5506")`
# — was fixed in the same wave. - Three cells legitimately do NOT call
# `assert_denied_by`, and must not: `a_labeled_break_in_a_clause_is_fail_closed`
# denies with **E3100** from name resolution, never reaching E5506 at all; and
# the two `NO_ENCLOSING_LOOP` cells assert on that constant directly because
# they also assert the OTHER cause's message is ABSENT, which is a disjointness
# claim `assert_denied_by` does not make. All three still pin an exact constant
# — none asserts a bare "some denial". Rule literals are never hand-rolled: a
# hand-copied PREFIX goes insensitive exactly when the rule text widens, which
# has already happened once here (Rule 4, Task 9). Always use the constants
# below.
#
# MIGRATION NOTE (flagged, not silently corrected -- the source prose above is
# moved verbatim): "the two `NO_ENCLOSING_LOOP` cells assert on that constant
# directly because they also assert the OTHER cause's message is ABSENT"
# overstates one of the two. Verified against the actual source: only
# `the_two_continue_denial_causes_are_reported_distinctly` (split below into
# `..._no_loop` and `..._bad_form`) makes the disjointness claim -- its
# `..._no_loop` sibling is the disjointness-asserting NO_ENCLOSING_LOOP cell the
# header means. `continue_in_a_switch_with_no_enclosing_loop_is_fail_closed`,
# the OTHER cell that asserts on NO_ENCLOSING_LOOP directly, asserts only that
# NO_ENCLOSING_LOOP is present -- no disjointness claim. Per rule 2 (never add
# an assertion the source did not make), that case below does NOT get a
# fabricated `stderr_absent = ["${UNFAITHFUL_CONTINUE}"]` to manufacture the
# symmetry the header describes. The "three cells" COUNT itself IS accurate at
# #[test]-fn granularity (labeled_break,
# continue_in_a_switch_with_no_enclosing_loop_is_fail_closed, and
# the_two_continue_denial_causes_are_reported_distinctly, which contains the
# actual disjointness pair) -- only the "both assert absence" clause overstates
# the first of those three.
#
# STREAM NOTE: `run_js_expect_failure`'s `out` is stdout+stderr concatenated.
# Every fixture here is refused at compile time before the module ever runs
# (kali's E5506/E3100 diagnostics are emitted before any `console.log`
# executes), so stdout is empty in every case below -- verified directly against
# the real built binary (see the task report). `out.contains(X)` therefore
# translates exactly to `stderr_contains`, and `!out.contains(X)` to
# `stderr_absent`, with no `stdout_contains`/`stdout_absent` needed anywhere in
# this file.
#
# `:623`'s `assert!(!out.is_empty(), "expected a diagnostic, got nothing")` (on
# `continue_in_a_switch_with_no_enclosing_loop_is_fail_closed`) has no direct
# TOML equivalent (the format expresses emptiness via exact `stderr`, not
# non-emptiness) -- it is subsumed by the case's own `stderr_contains =
# ["${NO_ENCLOSING_LOOP}"]`: a string that contains a specific non-empty
# substring cannot itself be empty. See the task report for the full reasoning.

[constants]
RULE_1_DISCRIMINANT = "the discriminant is not a proven integer or string"
RULE_2_CASE_TEST = "a `case` test that is not a literal in the discriminant's domain"
RULE_4_TERMINATOR = "a clause that does not end in `return`, `break` or `continue`"
RULE_5_BLOCK_BINDING = "a `let`/`const` declaration in a clause body"
NO_ENCLOSING_LOOP = "`continue` inside a `switch` requires an enclosing loop; there is none here"
UNFAITHFUL_CONTINUE = "does not re-run the update/test faithfully in the current lowering (register R-09)"
REPR_MIXED_CONFLICT = "is used as both a string and a number"
TRAILING_EMPTY_GROUP = "an empty trailing clause with no body to group onto"
DEFAULT_CANNOT_GROUP = "a `default` clause cannot be grouped with a preceding empty `case` clause"
DEFAULT_NOT_LAST = "a `default` clause that is not the last clause in the switch"

