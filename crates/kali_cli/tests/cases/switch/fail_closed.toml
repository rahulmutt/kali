Fix wave item 5: was a hand-rolled PREFIX of the rule text, which goes insensitive the moment Rule 1's message widens. Routed through the constant. (The claim it makes is unchanged: this must be Rule 1 — the discriminant — not the numeric case-test rule.)

Assert `out` was denied by the named rule, not merely denied."""
exit = "failure"
