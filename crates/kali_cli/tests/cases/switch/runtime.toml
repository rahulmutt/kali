# Migrated from tests/switch_runtime.rs.
#
# Correctness pins for the admitted switch surface -- the companion file to
# switch/fail_closed.toml, which pins the DENIED surface. Two `const NAME:
# &str` declarations exist in the source (`S` at :27, `SS` at :160), but
# REVIEW FIX (Minor 5): the original version of this note said "No
# [constants]: this file has no `const NAME: &str` rule-literal declarations
# (grep-confirmed)" -- overstated; a grep for `const NAME: &str` returns 2,
# not 0. Corrected: neither is a RULE literal (a diagnostic-message pin, the
# thing switch/fail_closed.toml's [constants] hold) -- both are plain JS
# fixture bodies (a numeric-axis switch skeleton, a string-axis one), shared
# across 4 cases each. Hoisted into [constants] below anyway, per rule 7
# ("[constants] for ... byte-identical shared fixture bodies -- assert the
# identity, do not eyeball it"): REVIEW FIX (Minor 4), the two were
# previously duplicated as literal text in each of their 4 cases' [source]
# bodies rather than hoisted, so a change to either shared fixture was a
# 4-place edit instead of a 1-place one -- a property the source's own
# `const` declarations had that the first migration pass dropped. Every
# assertion here is still an exact `stdout` pin against a program that runs
# to completion, not a diagnostic-message pin.
#
# EVERY fixture that carries a loop logs a per-iteration `console.log` line
# (an explicit method note repeated at both the Task 9 and Task 10/11 zone
# banners below): a switch fixture with `break`/`continue` measures LOOP
# TRUNCATION FIRST -- if `break` bound to the enclosing loop instead of the
# switch, the loop would die at iteration 0, and a final-value-only assertion
# could not tell that apart from a merely mis-selected clause. Task 4 shipped
# a wrong boundary-matrix cell for exactly this reason; the per-iteration line
# is what makes the two failure modes distinguishable in the assertion text
# itself, and it survives into every exact `stdout` pin below rather than
# being pared down to a final summary value.
#
# `assert_eq!` is exact-equality throughout, so every case below maps to the
# case-runner's exact `stdout` key, never `stdout_contains` -- a prefix or
# substring match would silently accept extra trailing output no fixture here
# actually produces.

[constants]
S = """function s(x) {
switch (x) {
case 10: return "A";
case 20: return "B";
default: return "D";
}
}
"""
SS = """function s(x) {
switch (x) {
case "a": return 1;
case "b": return 2;
default: return 3;
}
}
"""

