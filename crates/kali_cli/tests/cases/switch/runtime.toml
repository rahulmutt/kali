name = "numeric_switch_selects_the_matching_clause"
rationale = "Anti-spot-check: s(10) is EXCLUDED on purpose. The pre-fix lowering returned \"A\" for every truthy discriminant, so s(10) agreed with node by coincidence and proves nothing. Every assertion below uses a discriminant the broken lowering got wrong, and the answers must vary with the input."
exit = "success"
args = ["run", "numeric_switch_selects_the_matching_clause.js"]
stdout = """v=B
"""

