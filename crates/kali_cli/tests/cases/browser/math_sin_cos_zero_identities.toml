[matrix]
ext = ["js", "ts", "jsx", "tsx"]

[source]
"main.${ext}" = """const zero = 0; console.log(Math.sin(zero)); console.log(Math.cos(zero));
"""
"smoke.test.${ext}" = """Kali.test('math sin/cos zero identities', () => {
  const zero = 0;
  console.log(Math.sin(zero));
  console.log(Math.cos(zero));
});
"""

[[case]]
name = "run_supports_math_sin_and_cos_zero_identities_when_browser_harness_is_configured"
rationale = """Migrated from browser_math_sin_cos_zero_identities.rs, the four `run_supports_math_sin_and_cos_zero_identities_when_browser_harness_is_configured_in_*_input` fns (one per extension). `assert_browser_harness_math_sin_cos` runs `kali run --api browser` with the browser harness backed by node, against a program that takes Math.sin and Math.cos of a zero binding, so the two zero identities print 0 and then 1. Its stdout claims are `stdout.contains("0\\n")` and `stdout.contains("1\\n")` against raw stdout (:76, `stdout.contains(...)` :77). The source spells this as a plain `.contains(...)` against raw stdout, so it is carried as stdout_contains and NOT strengthened to an exact pin -- controller ruling 3, mirror the source: a plain `.contains` against a field that HAS a substring form keeps the substring form even though the exact output was observed."""
args = ["run", "--api", "browser", "main.${ext}"]
env = { KALI_BROWSER_BUNDLE_HARNESS_COMMAND = "node" }
exit = "success"
stdout_contains = ["0\n", "1\n"]

[[case]]
name = "test_supports_math_sin_and_cos_zero_identities_when_browser_harness_is_configured"
rationale = """Migrated from browser_math_sin_cos_zero_identities.rs, the four `test_supports_math_sin_and_cos_zero_identities_when_browser_harness_is_configured_in_*_input` fns (one per extension). `assert_browser_harness_math_sin_cos` runs `kali test --api browser` with the browser harness backed by node, against a program that takes Math.sin and Math.cos of a zero binding, so the two zero identities print 0 and then 1. Its stdout claims are `stdout.contains("0\\n")` and `stdout.contains("1\\n")` against raw stdout (:76, `stdout.contains(...)` :77). The source spells this as a plain `.contains(...)` against raw stdout, so it is carried as stdout_contains and NOT strengthened to an exact pin -- controller ruling 3, mirror the source: a plain `.contains` against a field that HAS a substring form keeps the substring form even though the exact output was observed."""
args = ["test", "--api", "browser", "smoke.test.${ext}"]
env = { KALI_BROWSER_BUNDLE_HARNESS_COMMAND = "node" }
exit = "success"
stdout_contains = ["0\n", "1\n"]

[[case]]
name = "json_run_supports_math_sin_and_cos_zero_identities_when_browser_harness_is_configured"
rationale = """Migrated from browser_math_sin_cos_zero_identities.rs, the four `json_run_supports_math_sin_and_cos_zero_identities_when_browser_harness_is_configured_in_*_input` fns (one per extension). `assert_browser_harness_math_sin_cos` runs `kali --output json run --api browser` with the browser harness backed by node, against a program that takes Math.sin and Math.cos of a zero binding, so the two zero identities print 0 and then 1. This sibling asserts the JSON envelope: schemaVersion/command/success (`json["command"]` :57-59), payload hostContract/runtimeBackend (`json["payload"]["hostContract"]` :60-61), and `exitCode` at both the envelope (:63) and the payload (`json["payload"]["exitCode"]` :64) level for `run`, and `stderr` exactly empty (:73). The source makes NO `errors` claim and NO `skipped` claim on this envelope, so neither is written (rule 2). The same two claims are taken against json["stdout"] (`stdout.contains(...)` :71, `stdout.contains(...)` :72). On the JSON branch the same claim is taken against the string leaf json["stdout"], which has NO substring form in the case format (there is no json_contains key), so per controller ruling 3 it becomes an exact `json.stdout` pin -- and, per U9, only after the value was captured from the real kali binary rather than hand-computed."""
args = ["--output", "json", "run", "--api", "browser", "main.${ext}"]
env = { KALI_BROWSER_BUNDLE_HARNESS_COMMAND = "node" }
exit = "success"
json = { schemaVersion = 1, command = "run", success = true, exitCode = 0, payload = { hostContract = "browser-requested", runtimeBackend = "browser-harness", exitCode = 0 }, stdout = "0\n1\n", stderr = "" }

