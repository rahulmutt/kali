[[case]]
name = "json_run_supports_bracketed_global_this_math_sin_cos_tan_zero_identities_when_browser_harness_is_configured"
rationale = """Migrated from browser_math_sin_cos_tan_bracketed_root.rs, the 4 `ext` cells of the (command, source_name, source, ...) tuple array that `run_and_test_supports_bracketed_global_this_math_sin_cos_tan_zero_identities_when_browser_harness_is_configured_in_js_and_ts_input` loops over (one per extension). That fn's body inlines the whole harness sequence rather than calling a helper: it runs `kali --output json run --api browser --max-threads 0 --max-spawned-processes 0` with the browser harness backed by node (BROWSER_HARNESS_COMMAND_ENV, :206), against a program that reaches sin/cos/tan through a bracketed `globalThis["Math"]` root and prints the three zero identities, sin(0)=0, cos(0)=1 and tan(0)=0. This is the json branch (:231-248). The source spells it `json["stdout"].as_str().expect("stdout").contains(expected_stdout)`, with `expected_stdout` = "1\\n0". On the JSON branch the same claim is taken against the string leaf json["stdout"], which has NO substring form in the case format (there is no json_contains key), so per controller ruling 3 it becomes an exact `json.stdout` pin -- and, per U9, only after the value was captured from the real kali binary rather than hand-computed. The captured value was identical for both commands and all four extensions, which is what makes ONE pin valid under a file-wide `ext` axis. `json["stderr"]` is asserted exactly empty (:248); the source makes NO `errors` claim on this envelope, so none is written (rule 2). The `run` envelope pins `exitCode` at both the envelope and the payload level (:237-238)."""
