rationale = """Migrated from browser_object_is_harness.rs, the four `run_supports_object_is_numeric_literals_when_browser_harness_is_configured_in_*_input` fns (one per extension). `assert_browser_harness_object_is` writes the Object.is run fixture and asks `kali` to run it against the browser API surface with the browser harness backed by node. The program prints Object.is results for signed zeros, primitives, null, NaN, the infinities and `void 0`, then prints a labelled line per same-reference spelling -- optional-chained, bracketed, mixed, dotted, root-bracketed and their frozen counterparts. The process succeeds `output.status.success(),` (:89); the source checks the status class only, not an exact code, so this case carries `exit = "success"`. In text mode all thirteen claims are plain `.contains(...)` against raw stdout, each on its own source line, and they are carried individually rather than merged. The source spells this as a plain `.contains(...)` against raw stdout, so it is carried as stdout_contains and NOT strengthened to an exact pin -- controller ruling 3, mirror the source: a plain `.contains` against a field that HAS a substring form keeps the substring form even though the exact output was observed. RULE 12 -- the Rust comment prose of browser_object_is_harness.rs, carried verbatim: "Corrected 2026-07-19: this assertion encoded console.* argument truncation (fixed in 86de4271d). Expectation is node-verified.""""
args = ["run", "--api", "browser", "--max-threads", "0", "--max-spawned-processes", "0", "main.${ext}"]
env = { KALI_BROWSER_BUNDLE_HARNESS_COMMAND = "node" }
exit = "success"
stdout_contains = ["same-reference true\nsame-reference-await true", "same-reference-await true", "same-reference-optional-chain true", "same-reference-bracketed true", "same-reference-mixed true", "same-reference-root true", "same-reference-root-bracketed true", "same-reference-dot true", "same-reference-freeze-bracketed true", "same-reference-freeze-mixed true", "same-reference-freeze-root true", "same-reference-freeze-root-bracketed true", "0\n1\n1\n1\n1"]

