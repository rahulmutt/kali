# Migrated from tests/browser_object_is_harness.rs.
#
# RULE 12 (carry every source comment verbatim) -- THIS SOURCE HAS PROSE, and it is
# carried into EVERY case's own `rationale`, not just into this header.
# `grep -nE '^\s*//'` over tests/browser_object_is_harness.rs returns 48 Rust comment line(s)
# in 24 contiguous block(s), of 1 distinct text(s):
#   * "Corrected 2026-07-19: this assertion encoded console.* argument truncation (fixed in 86de4271d). Expectation is node-verified."
# Every block sits inside `assert_browser_harness_object_is`,
# which every `[[case]]` below reaches, so U6's bottom-up attribution puts all of it in
# every rationale: the attribution is per helper and this helper is universal in this
# file, which is NOT the over-attribution U6 forbids (that is copying a block into cases
# its producing helper does not reach).
# A pointer ("see the file header") would not satisfy rule 12: a reader of one failing
# trial sees only that trial's `rationale`.
# The 24 blocks are 1 distinct text(s) repeated; the
# rationale below carries each distinct text once. `comment_coverage.py` checks each
# comment LINE's text for membership in each rationale, so one copy discharges every
# repetition, and N identical copies would be noise rather than coverage.
#
# RULE 7 / U1 -- MATRIX ARITHMETIC, and it closes exactly.
# 16 `#[test]` fns, 16 real helper invocations with every loop
# expanded:
#   * `assert_browser_harness_object_is` -- 16 invocation(s) = command(run/test) x ext(js/ts/jsx/tsx) x json_output(false/true), a complete cross product. Every `#[test]` fn is one unlooped call and the file contains no loop at all; both fixture builders are parameterless, so `ext` really is uniform.
# `ext` is the ONE axis every case varies over uniformly, and every helper covers
# all 4 of its values, so a file-wide axis fans nothing the source never ran:
# 4 `[[case]]` entries x ext(4) = 16 trials = 16 invocations. Exact.
# `command` and `json_output` are NOT matrix axes, per rule 7 and design spec 5.6's own note:
# each changes the ASSERTION SHAPE rather than substituting a string.
# `json_output` switches between a text claim and a JSON-envelope claim.
# `command` switches the envelope's payload between `exitCode` (run) and
# `total`/`passed`/`failed` (test).
# Each is written as sibling `[[case]]` entries instead.
#
# RULE 6 -- 1:1 MAPPING, and the fold is stated here as the rule requires.
# Each `[[case]]` below corresponds to 4 source `#[test]` fns, one per `ext` cell; the assertion mapping stays
# 1:1 per trial, so no claim is lost, but a failing trial's id reads its matrix cell
# rather than a source fn name.
#
# U2 -- `[source]` is FILE-WIDE, and that is safe here. Every fixture
# (`main.${ext}`, `smoke.test.${ext}`)
# is written unconditionally by the source into a fresh temp dir: no fixture is written
# behind an `if`, and no case's point is the presence or absence of a file.
# Every command below names its entry explicitly on argv, so the unused siblings in
# a trial dir are inert.
#
# RULE 10 -- NOT NEEDED HERE, and that is checked rather than assumed. `expand.rs`'s
# `substitute()` hard-fails on any `${...}` it cannot resolve, so a fixture carrying a
# genuine JS template literal must declare `[constants] dollar = "$"` and spell the
# genuine `${` as `${dollar}{`. No `[source]` value and no step `body` in this file
# contains `${` at all -- the generator greps every emitted string and raises if one does
# -- so this file declares no `[constants]` table.
#
# RULE 13 -- transitive helper docs. Checked every fn in each call chain:
#   `kali_bin`, `browser_harness_object_is_run_source`,
#   `browser_harness_object_is_test_source`, `assert_browser_harness_object_is` -- none carries a `///` doc comment.
# This file runs no `browser_bundle_harness` step, so ruling 6's exemption has nothing
# to exempt and is not stated.
#
# ARGV ORDER is transcribed in the exact order the source's `Command` builder appends it
# and is not normalised here:
#   * run/test: `[--output json] <run|test> --api browser --max-threads 0
#              --max-spawned-processes 0 <entry>` -- the `--output json` pair is appended
#              BEFORE the subcommand, and both thread flags are always passed.
# The source passes an absolute `dir.path().join(filename)` as the entry; the case runner
# passes the bare filename relative to the trial dir, matching every previously shipped
# `browser/` case file.
# The env value is `KALI_BROWSER_BUNDLE_HARNESS_COMMAND`, read from the
# `kali_runtime_contract::BROWSER_HARNESS_COMMAND_ENV` constant the source passes by
# name `kali_runtime_contract::BROWSER_HARNESS_COMMAND_ENV` (:71) rather than assumed.
#
# ASSERTION SHAPE, mirrored from the source and nothing more.
#   * `exit = "success"` `output.status.success(),` (:89). This source checks `status.success()` only --
#     it does NOT check `status.code()` -- so the status class is what is carried, not
#     an exact code. (Its sibling object_is_alias_chain_harness.toml DOES carry an exact
#     code, because its source asserts one.)
#   * TEXT MODE: THIRTEEN separate `stdout.contains(...)` needles, each its own source
#     line, extracted from the `.rs` by the generator rather than retyped -- they differ
#     by a single word and a retyped list that merged two would silently weaken the
#     claim. The `test` cases carry a fourteenth, `"ok 1"` `stdout.contains("ok 1")` (:250).
# The source spells this as a plain `.contains(...)` against raw stdout, so it is carried as stdout_contains and NOT strengthened to an exact pin -- controller ruling 3, mirror the source: a plain `.contains` against a field that HAS a substring form keeps the substring form even though the exact output was observed.
#   * JSON MODE: the same thirteen claims are taken against the string leaf
#     json["stdout"] `let stdout = json["stdout"].as_str()` (:110), which has NO substring form.
# On the JSON branch the same claim is taken against the string leaf json["stdout"], which has NO substring form in the case format (there is no json_contains key), so per controller ruling 3 it becomes an exact `json.stdout` pin -- and, per U9, only after the value was captured from the real kali binary rather than hand-computed.
#     The two pins differ by exactly the trailing `same(objectAlias, object)` line the
#     `test` fixture adds, and each was re-captured for all four `ext` cells.
#     The envelope also carries schemaVersion/command/success, payload hostContract/
#     runtimeBackend, `exitCode = 0` at BOTH envelope and payload level for `run`
#     `assert_eq!(json["exitCode"], 0)` (:103) or payload total/passed/failed for `test`, `json.stderr = ""`
#     `assert_eq!(json["stderr"], "")` (:172) and an empty `errors` array.

[matrix]
ext = ["js", "ts", "jsx", "tsx"]

[source]
"main.${ext}" = """async function main() { const zero = 0; const alias = zero; const object = { a: 1 }; const objectAlias = object; const frozen = Object.freeze(object); const same = Object.is; const undefinedValue = void 0; console.log(Object.is(alias, -0)); console.log(Object.is(+1, 1)); console.log(Object.is(true, true)); console.log(Object.is("hello", "hello")); console.log(Object.is(null, null)); console.log(Object.is(Infinity, Infinity)); console.log(Object.is(NaN, NaN)); console.log(Object.is(-Infinity, -Infinity)); console.log(Object.is(undefinedValue, void 0)); console.log("same-reference", Object.is(objectAlias, object)); console.log("same-reference-await", Object.is(await globalThis.Object, await globalThis.Object)); console.log("same-reference-optional-chain", globalThis?.Object?.is(objectAlias, object)); console.log("same-reference-bracketed", globalThis["Object"]["is"](objectAlias, object)); console.log("same-reference-mixed", globalThis.Object["is"](objectAlias, object)); console.log("same-reference-root", globalThis["Object"].is(objectAlias, object)); console.log("same-reference-dot", globalThis.Object.is(objectAlias, object)); console.log("same-reference-root-bracketed", Object["is"](objectAlias, object)); console.log("same-reference-freeze", Object.is(frozen, object)); console.log("same-reference-freeze-bracketed", globalThis["Object"]["is"](frozen, object)); console.log("same-reference-freeze-mixed", globalThis.Object["is"](frozen, object)); console.log("same-reference-freeze-root", globalThis["Object"].is(frozen, object)); console.log("same-reference-freeze-root-bracketed", Object["is"](frozen, object)); console.log(Object.is(Object.freeze(object), object)); console.log(globalThis["Object"]["is"](+1, 1)); console.log(globalThis.Object["is"](+1, 1)); console.log(globalThis["Object"].is(+1, 1)); console.log(globalThis.Object.is(+1, 1)); console.log(Object["is"](+1, 1)); } main();
"""
"smoke.test.${ext}" = """Kali.test('object is primitive literals', () => {
  async function main() {
    const zero = 0;
    const alias = zero;
    const object = { a: 1 };
    const objectAlias = object;
    const frozen = Object.freeze(object);
    const same = Object.is;
    const undefinedValue = void 0;
    console.log(Object.is(alias, -0));
    console.log(Object.is(+1, 1));
    console.log(Object.is(true, true));
    console.log(Object.is("hello", "hello"));
    console.log(Object.is(null, null));
    console.log(Object.is(Infinity, Infinity));
    console.log(Object.is(NaN, NaN));
    console.log(Object.is(-Infinity, -Infinity));
    console.log(Object.is(undefinedValue, void 0));
    console.log("same-reference", Object.is(objectAlias, object));
    console.log("same-reference-await", Object.is(await globalThis.Object, await globalThis.Object));
    console.log("same-reference-optional-chain", globalThis?.Object?.is(objectAlias, object));
    console.log("same-reference-bracketed", globalThis["Object"]["is"](objectAlias, object));
    console.log("same-reference-mixed", globalThis.Object["is"](objectAlias, object));
    console.log("same-reference-root", globalThis["Object"].is(objectAlias, object));
    console.log("same-reference-dot", globalThis.Object.is(objectAlias, object));
    console.log("same-reference-root-bracketed", Object["is"](objectAlias, object));
    console.log("same-reference-freeze", Object.is(frozen, object));
    console.log("same-reference-freeze-bracketed", globalThis["Object"]["is"](frozen, object));
    console.log("same-reference-freeze-mixed", globalThis.Object["is"](frozen, object));
    console.log("same-reference-freeze-root", globalThis["Object"].is(frozen, object));
    console.log("same-reference-freeze-root-bracketed", Object["is"](frozen, object));
    console.log(Object.is(Object.freeze(object), object));
    console.log(globalThis["Object"]["is"](+1, 1));
    console.log(globalThis.Object["is"](+1, 1));
    console.log(globalThis["Object"].is(+1, 1));
    console.log(globalThis.Object.is(+1, 1));
    console.log(Object["is"](+1, 1));
    console.log(same(objectAlias, object));
  }
  return main();
});
"""

