[matrix]
ext = ["js", "ts", "jsx", "tsx"]

[source]
"app.${ext}" = """// kali-tree-shake: bracketedGlobalThisMathPowFrozenWrapper
function bracketedGlobalThisMathPowFrozenWrapper() {
  const exponent = 3;
  const alias = exponent;
    console.log(Object.freeze((globalThis.Math))["pow"](2, alias));
  console.log(Object.freeze((globalThis.Math))['pow'](2, alias));
  console.log(Object.freeze((globalThis.Math).pow)(2, alias));
  console.log(Object.freeze((globalThis.Math)['pow'])(2, alias));
  console.log(Object.freeze((globalThis["Math"]))["pow"](2, alias));
  console.log(Object.freeze((globalThis['Math']))['pow'](2, alias));
  console.log(Object.freeze((globalThis['Math'])["pow"])(2, alias));
  console.log(Object.freeze((globalThis['Math'])['pow'])(2, alias));
  console.log(Object.freeze((globalThis["Math"]).pow)(2, alias));
  console.log(Object.freeze((globalThis['Math']).pow)(2, alias));
  return [
    Object.freeze((globalThis.Math))["pow"](2, alias),
    Object.freeze((globalThis.Math))['pow'](2, alias),
    Object.freeze((globalThis.Math).pow)(2, alias),
    Object.freeze((globalThis.Math)['pow'])(2, alias),
    Object.freeze((globalThis["Math"]))["pow"](2, alias),
    Object.freeze((globalThis['Math']))['pow'](2, alias),
    Object.freeze((globalThis['Math'])["pow"])(2, alias),
    Object.freeze((globalThis['Math'])['pow'])(2, alias),
    Object.freeze((globalThis["Math"]).pow)(2, alias),
    Object.freeze((globalThis['Math']).pow)(2, alias),
  ];
}
"""

[[case]]
name = "build_emits_bracketed_global_this_math_pow_frozen_wrapper"
rationale = """Migrated from browser_math_pow_bracketed_frozen_wrapper.rs, the four `build_emits_bracketed_global_this_math_pow_frozen_wrapper_in_*_input` fns (one per extension). `assert_browser_bundle_bracketed_global_this_math_pow_frozen` builds a browser bundle with `kali build --bundle --api browser`, asserts the emitted app/app.meta.json metadata, then runs the bundle glue under the browser-bundle-harness contract backed by node, against a program that raises 2 to an aliased exponent of 3 through every bracketed-root frozen `Math.pow` callable in the canonical inventory, so every line of its output is 8. The file's only stdout claim is `.contains("8\\n8")` (:122), which is what pins that at least two consecutive lines of 8 were printed rather than one. The source spells this as a plain `.contains(...)` against raw stdout, so it is carried as stdout_contains and NOT strengthened to an exact pin -- controller ruling 3, mirror the source: a plain `.contains` against a field that HAS a substring form keeps the substring form even though the exact output was observed. RULE 13 -- doc comments on the library helpers that produce this fixture, carried verbatim: "Canonical `console.log(...)` invocation lines for the supported bracketed-root frozen `Math.pow` aliases.", "Canonical bracketed-root frozen callable aliases for the supported `Math.pow` helper slice.", "Canonical `console.log(...)` invocation lines for an arbitrary `Math.pow` alias inventory.", "Canonical `return [...]` invocation entries for the supported bracketed-root frozen `Math.pow` aliases." and "Canonical `return [...]` invocation entries for an arbitrary `Math.pow` alias inventory.""""

[[case.step]]
args = ["build", "--bundle", "--api", "browser", "app.${ext}"]
exit = "success"

[[case.step]]
kind = "file_json"
path = "app/app.meta.json"
fields = { apiSurface = "browser", artifactKind = "bundle" }

[[case.step]]
kind = "browser_bundle_harness"
entry = "app"
body = """const mod = await import(bundleJs.href);
await mod.bracketedGlobalThisMathPowFrozenWrapper();
"""
exit = "success"
stdout_contains = ["8\n8"]

