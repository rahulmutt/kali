[[case]]
name = "json_run_supports_global_this_math_core_suite_when_browser_harness_is_configured"
rationale = """Migrated from browser_math_global_this_root_core_suite.rs, from the inline loop in `run_and_test_supports_global_this_math_core_suite_when_browser_harness_is_configured_in_js_and_ts_input`. That one #[test] fn loops over eight literal (command, source_name, source, expected_stdout) tuples and over `for output_json in [false, true]`, giving 16 independent invocations; the eight extension cells fold into this file's `ext` matrix axis (see the header's arithmetic) and the command/output-mode cells become sibling cases per rule 7. This case is the `run` / --output json cell. `kali run --api browser --max-threads 0 --max-spawned-processes 0` runs the program with the browser harness backed by `node`; its six dotted globalThis.Math Math calls print 3, 1, 3, -1, -2 and 31. On this branch the source asserts `json["stdout"].as_str().contains(expected_stdout)`. A `json` path has no substring form, so per controller ruling 3 that becomes an exact `json.stdout` pin -- live-captured from the real kali binary for every extension cell (U9), never hand-computed, and checked to contain the source's own expected literal before being written. `stderr` is asserted exactly empty; the source makes no `errors` claim on this envelope, so none is written."""
