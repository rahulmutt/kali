[source]
"app.js" = """// kali-tree-shake: bracketedGlobalThisMathRoundIdentity
function bracketedGlobalThisMathRoundIdentity() {
  const value = 1.6;
  console.log(globalThis["Math"].round(value));
  console.log(globalThis["Math"]["round"](value));
  return [globalThis["Math"].round(value), globalThis["Math"]["round"](value)];
}
"""
"app.ts" = """// kali-tree-shake: bracketedGlobalThisMathRoundIdentity
function bracketedGlobalThisMathRoundIdentity() {
  const value = 1.6;
  console.log(globalThis["Math"].round(value));
  console.log(globalThis["Math"]["round"](value));
  return [globalThis["Math"].round(value), globalThis["Math"]["round"](value)];
}
"""
"app.jsx" = """// kali-tree-shake: bracketedGlobalThisMathRoundIdentity
