  console.log(globalThis["Math"]["round"](value));
  return [globalThis["Math"].round(value), globalThis["Math"]["round"](value)];
}
"""
"app.tsx" = """// kali-tree-shake: bracketedGlobalThisMathRoundIdentity
function bracketedGlobalThisMathRoundIdentity() {
  const value = 1.6;
  console.log(globalThis["Math"].round(value));
  console.log(globalThis["Math"]["round"](value));
  return [globalThis["Math"].round(value), globalThis["Math"]["round"](value)];
}
"""
"main.js" = """const value = 1.6; console.log(globalThis["Math"].round(value)); console.log(globalThis["Math"]["round"](value));
"""
"main.ts" = """const value = 1.6; console.log(globalThis["Math"].round(value)); console.log(globalThis["Math"]["round"](value));
"""
"smoke.test.js" = """Kali.test('bracketed math round identity', () => { const value = 1.6; console.log(globalThis["Math"].round(value)); console.log(globalThis["Math"]["round"](value)); });
"""
"smoke.test.ts" = """Kali.test('bracketed math round identity', () => { const value = 1.6; console.log(globalThis["Math"].round(value)); console.log(globalThis["Math"]["round"](value)); });
"""

