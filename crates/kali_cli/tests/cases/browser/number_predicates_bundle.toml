[[case]]
name = "build_emits_browser_number_predicates_in_js_input"
rationale = """Migrated from browser_number_predicates_bundle.rs, `build_emits_browser_number_predicates_in_js_input` -- one source `#[test]` fn, one case (no `[matrix]` in this file; the fixture body differs by extension, see the header). `assert_browser_bundle_number_predicates` builds a browser bundle with `kali build --bundle --api browser`, asserts the emitted app/app.meta.json metadata, then runs the bundle glue under the browser-bundle-harness contract backed by node, against a program that exercises the whole supported Number-predicate slice through direct, aliased, frozen, bracketed and parenthesized access forms and throws unless every one returns the expected boolean. This case's `app.js` body is the js form of the shared builder, whose alias binding is a plain 1. Its single stdout claim is `.contains("browser number predicates ok")` (:99). The source spells this as a plain `.contains(...)` against raw stdout, so it is carried as stdout_contains and NOT strengthened to an exact pin -- controller ruling 3, mirror the source: a plain `.contains` against a field that HAS a substring form keeps the substring form even though the exact output was observed. RULE 13 -- doc comments on the library helpers that produce this fixture, carried verbatim: "Canonical browser-bundle source text for the supported Number predicate slice.""""

[[case.step]]
args = ["build", "--bundle", "--api", "browser", "app.js"]
exit = "success"

[[case.step]]
kind = "file_json"
path = "app/app.meta.json"
fields = { apiSurface = "browser", artifactKind = "bundle" }

[[case.step]]
kind = "browser_bundle_harness"
entry = "app"
body = """const mod = await import(bundleJs.href);
await mod.browserNumberPredicates();
"""
exit = "success"
stdout_contains = ["browser number predicates ok"]

