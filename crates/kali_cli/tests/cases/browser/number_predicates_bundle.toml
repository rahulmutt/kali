"app.js" = """// kali-tree-shake: browserNumberPredicates
async function browserNumberPredicates() {
  const alias = 1;
  const finite = Number.isFinite;
  const integer = Number.isInteger;
  const safeInteger = Number.isSafeInteger;
  const frozenFinite = Object.freeze(Number.isFinite);
  const frozenNaN = Object.freeze(Number.isNaN);
  const frozenInteger = Object.freeze(Number.isInteger);
  const frozenSafeInteger = Object.freeze(Number.isSafeInteger);
  const frozenBracketedFinite = Object.freeze(Number["isFinite"]);
  const frozenBracketedNaN = Object.freeze(Number["isNaN"]);
  const frozenBracketedInteger = Object.freeze(Number["isInteger"]);
  const frozenBracketedSafeInteger = Object.freeze(Number["isSafeInteger"]);
  const frozenParenthesizedBracketedFinite = Object.freeze((globalThis["Number"])["isFinite"]);
  const frozenParenthesizedBracketedNaN = Object.freeze((globalThis["Number"])["isNaN"]);
  const frozenParenthesizedBracketedInteger = Object.freeze((globalThis["Number"])["isInteger"]);
  const frozenParenthesizedBracketedSafeInteger = Object.freeze((globalThis["Number"])["isSafeInteger"]);
  const frozenParenthesizedPropertyFinite = Object.freeze((globalThis["Number"]).isFinite);
  const frozenParenthesizedPropertyNaN = Object.freeze((globalThis["Number"]).isNaN);
  const frozenParenthesizedPropertyInteger = Object.freeze((globalThis["Number"]).isInteger);
  const frozenParenthesizedPropertySafeInteger = Object.freeze((globalThis["Number"]).isSafeInteger);
  if (
    Number.isFinite(alias) !== true ||
    Number.isSafeInteger(await alias) !== true ||
    integer(alias) !== true ||
    Number.isSafeInteger(alias) !== true ||
    integer(1.5) !== false ||
    Number.isFinite("hello") !== false ||
    Number.isSafeInteger(1.5) !== false ||
    globalThis["Number"]["isNaN"](NaN) !== true ||
    globalThis.Number.isNaN(1) !== false ||
    globalThis["Number"].isNaN(1) !== false ||
    globalThis["Number"]["isFinite"](alias) !== true ||
    globalThis["Number"]["isInteger"](alias) !== true ||
    globalThis["Number"]["isSafeInteger"](alias) !== true ||
    globalThis.Number["isNaN"](1) !== false ||
    globalThis["Number"].isFinite(alias) !== true ||
    globalThis.Number["isInteger"](alias) !== true ||
    globalThis["Number"].isSafeInteger(alias) !== true ||
    Number["isFinite"](alias) !== true ||
    Number["isInteger"](alias) !== true ||
    Number["isSafeInteger"](alias) !== true ||
    Number["isNaN"](1) !== false ||
    frozenFinite(alias) !== true ||
    frozenNaN(NaN) !== true ||
    frozenNaN(1) !== false ||
    frozenInteger(alias) !== true ||
    frozenSafeInteger(alias) !== true ||
    frozenBracketedFinite(alias) !== true ||
    frozenBracketedNaN(NaN) !== true ||
    frozenBracketedNaN(1) !== false ||
    frozenBracketedInteger(alias) !== true ||
    frozenBracketedSafeInteger(alias) !== true ||
    frozenParenthesizedBracketedFinite(alias) !== true ||
    frozenParenthesizedBracketedNaN(NaN) !== true ||
    frozenParenthesizedBracketedNaN(1) !== false ||
    frozenParenthesizedBracketedInteger(alias) !== true ||
    frozenParenthesizedBracketedSafeInteger(alias) !== true ||
    frozenParenthesizedPropertyFinite(alias) !== true ||
    frozenParenthesizedPropertyNaN(NaN) !== true ||
    frozenParenthesizedPropertyNaN(1) !== false ||
    frozenParenthesizedPropertyInteger(alias) !== true ||
    frozenParenthesizedPropertySafeInteger(alias) !== true ||
    safeInteger(alias) !== true ||
    finite(alias) !== true
  ) {
    throw new Error('unexpected browser Number predicate result');
  }
  console.log('browser number predicates ok');
}
"""
