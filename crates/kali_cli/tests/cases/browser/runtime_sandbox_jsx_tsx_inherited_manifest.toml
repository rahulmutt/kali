args = ["test", "--sandbox", "kali.policy.json", "smoke.test.tsx"]
env = { KALI_BROWSER_BUNDLE_HARNESS_COMMAND = "node" }
exit = 1
stderr_contains = ["E5506", "standalone browser runtime contract", "selected host contract: browser-requested"]

