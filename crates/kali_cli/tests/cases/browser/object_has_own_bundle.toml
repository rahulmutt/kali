# Migrated from tests/browser_object_has_own_bundle.rs.
#
# RULE 12 (carry every source comment verbatim) -- THIS SOURCE HAS PROSE, and it is
# carried into EVERY case's own `rationale`, not just into this header.
# `grep -nE '^\s*//'` over tests/browser_object_has_own_bundle.rs returns 2 Rust comment line(s)
# in 1 contiguous block(s), of 1 distinct text(s):
#   * "Honest re-pin (PR #16 rev2): kali fails closed/loud here; see docs/superpowers/followups/pr16-honest-repin-inventory.md."
# Every block sits inside `assert_browser_bundle_object_has_own`,
# which every `[[case]]` below reaches, so U6's bottom-up attribution puts all of it in
# every rationale: the attribution is per helper and this helper is universal in this
# file, which is NOT the over-attribution U6 forbids (that is copying a block into cases
# its producing helper does not reach).
# A pointer ("see the file header") would not satisfy rule 12: a reader of one failing
# trial sees only that trial's `rationale`.
#
# RULE 7 / U1 -- MATRIX DECLINED, and why.
# 8 `#[test]` fns, 8 real helper invocations with every loop
# expanded.
# `ext` LOOKS like a clean four-value axis and the arithmetic would close
# (2 output modes x 4 extensions = 8 = the invocation count), but the fixture
# BODY is not uniform over it: each `#[test]` fn passes its source explicitly,
# and the `.js`/`.jsx` cells get `browser_bundle_object_has_own_js_source()`
# (a bare object literal) while the `.ts`/`.tsx` cells get
# `browser_bundle_object_has_own_ts_source()` (the same object wrapped
# `as const`). A `[matrix]` axis substitutes one string uniformly into every
# case (design spec 5.6); it cannot select a body.
# Per U1 a `[matrix]` axis is FILE-WIDE -- `expand()` fans EVERY `[[case]]` by the full
# cross-product whether or not that case references the axis, and there is no per-case
# opt-out -- so an axis that any one case does not vary over would manufacture trials
# the source never ran (also a rule-2 invention). Rule 7's own remedy applies: drop
# `[matrix]` for the whole file and write named siblings.
# 8 invocations -> 8 named `[[case]]` entries, no `[matrix]`.
#
# RULE 6 -- 1:1 MAPPING. With no `[matrix]` there is no fold: every `[[case]]` below is
# exactly one real helper invocation of the source, named after the `#[test]` fn that made
# it. Two source fns are never folded into one case even when their invocations are
# literally identical, because the case is the only remaining trace of the fn.
#
# U2 -- `[source]` is FILE-WIDE, and that is safe here. Every fixture
# (`app.js`, `app.jsx`, `app.ts`, `app.tsx`)
# is written unconditionally by the source into a fresh temp dir: no fixture is written
# behind an `if`, and no case's point is the presence or absence of a file.
# Every command below names its entry explicitly on argv, so the unused siblings in
# a trial dir are inert.
# Every entry has the stem `app`, so `kali build --bundle` writes the same `app/`
# output directory whichever one a case names -- and only one build runs per trial, so
# there is no collision. That is why no U5 rename is needed here.
#
# RULING 7 -- DUPLICATE `[source]` BODIES ARE NOT HOISTED. Several entries below hold
# byte-identical program text. U13 would hoist them into `[constants]`; controller ruling 7
# declines that for `browser/` (a hoisted body makes `check_fixtures.py` go red on a correct
# file, and hoisting moves program text onto the surface `assertion_strings()` searches).
# The mandatory half of that ruling is honoured instead: the duplication is asserted
# MECHANICALLY in this file's generator, not eyeballed -- the generator compares the
# extracted fixture strings and raises if they are not byte-identical.
#
# RULE 8 / RULE 9 -- THE FIXTURES ARE CAPTURED, NEVER HAND-DERIVED. Both builders are
# one inline `format!` with `{{`/`}}` brace-collapse whose three arguments are computed
# by FOUR kali_common::object helpers, some of which join an alias table and some of
# which wrap another helper's output. That is rule 8's `format!` trap and rule 9's
# "one level removed inside a
# library crate" case at once, and a hand-derived approximation would still be a valid
# program that still built, so the real-binary run would verify the corrupted fixture
# against itself. The two texts below are the byte-exact output of EXECUTING the real
# builders (see tools/task-18-browser-pilot/batch7a_captures.py for the capture
# procedure), and the generator re-checks each against anchors present in both the
# producing Rust source and the captured text before emitting it.
#
# RULE 10 -- NOT NEEDED HERE, and that is checked rather than assumed. `expand.rs`'s
# `substitute()` hard-fails on any `${...}` it cannot resolve, so a fixture carrying a
# genuine JS template literal must declare `[constants] dollar = "$"` and spell the
# genuine `${` as `${dollar}{`. No `[source]` value and no step `body` in this file
# contains `${` at all -- the generator greps every emitted string and raises if one does
# -- so this file declares no `[constants]` table.
#
# RULE 13 -- transitive helper docs. Checked every fn in each call chain:
#   `kali_bin`, `browser_bundle_object_has_own_js_source`,
#   `browser_bundle_object_has_own_ts_source`, `assert_browser_bundle_object_has_own` -- none carries a `///` doc comment.
# The chain DOES reach `///`-documented helpers in `kali_common` whose OUTPUT this
# case file reproduces in [source], so their docs are claim prose and are carried
# into the rationale of every case that helper's text reaches (ruling 6's test:
# carry the docs if the migrated case still depends on what the helper computed).
# The chain also reaches `kali_runtime_contract::browser_bundle_harness_script` and
# `::browser_harness_command_parts_for`, which DO carry one-line `///` docs. Those are
# NOT carried: in the migrated form this case file never calls them -- the
# `browser_bundle_harness` step kind means the case RUNNER does
# (crates/kali_case_runner/src/steps.rs) -- so their docs describe shared runner
# infrastructure documented in design spec 5.3, not what this case claims. That is
# controller ruling 6, which writes the exemption into the rule rather than leaving it
# to implementer discretion.
# The kali_common::object helpers whose output lands in [source], with the
# `///` doc carried into every rationale they reach:
#   * object_has_own_combined_frozen_callable_condition_source
#       "Canonical combined boolean-check source for the supported `Object.hasOwn` helper slice."
#   * object_has_own_frozen_callable_condition_source
#       "Canonical boolean-check source for the supported `Object.hasOwn` frozen callable aliases."
#   * object_has_own_property_call_frozen_callable_condition_source
#       "Canonical boolean-check source for the supported `Object.prototype.hasOwnProperty.call` frozen callable aliases."
#   * object_has_own_frozen_callable_source
#       "Canonical source text for the supported `Object.hasOwn` frozen callable aliases."
#   * object_has_own_property_call_frozen_callable_source
#       "Canonical source text for the supported `Object.prototype.hasOwnProperty.call` frozen callable aliases."
#   * object_has_own_property_call_binding_source
