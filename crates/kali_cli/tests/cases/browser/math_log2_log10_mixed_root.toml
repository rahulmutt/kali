rationale = """Migrated from browser_math_log2_log10_mixed_root.rs, the four `json_build_emits_global_this_math_bracketed_log2_log10_identity_literals_in_*_input` fns (one per extension). `assert_browser_bundle_global_this_math_bracketed_log2_log10` builds a browser bundle with `kali build --bundle --api browser`, asserts the emitted app/app.meta.json metadata, then runs the bundle glue under the browser-bundle-harness contract backed by node, against a program whose four calls -- globalThis.Math["log2"](8), a frozen alias of it, globalThis.Math["log10"](1000) and a frozen alias of that -- each print 3. The source makes TWO separate claims about that output, `.contains("3\\n")` (:128) and `.matches("3\\n").count() >= 2` (:129), so both are carried. The source spells this as a plain `.contains(...)` against raw stdout, so it is carried as stdout_contains and NOT strengthened to an exact pin -- controller ruling 3, mirror the source: a plain `.contains` against a field that HAS a substring form keeps the substring form even though the exact output was observed. The source spells this as `.matches("3\\n").count() >= 2`, carried verbatim as `stdout_count` with `at_least = 2` per controller ruling 3 (mirror the source): NOT weakened to a plain contains, which a single occurrence would satisfy, and NOT strengthened to `exact`, which the source never says. Counting is non-overlapping and left-to-right, as Rust's `str::matches` is. This sibling additionally asserts the build JSON envelope -- schemaVersion/command/success/exitCode, payload artifactKind/bundleFormat, and the empty `errors` array the source checks at :81-84 -- rather than plain text; output shape is not a matrix axis because it changes the assertion shape, so it is a separate case."""

[[case.step]]
