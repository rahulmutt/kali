"app.js" = """// kali-tree-shake: browserIntegerLikeObjectKeysIteration
function browserIntegerLikeObjectKeysIteration() {
  const keys = [];
  const values = [];
  for (const key of Object.keys({ 10: 10, 2: 2, 1: 1, 0: 0, b: 5, a: 6 })) {
    keys.push(key);
  }
  for (const value of Object.values({ 10: 10, 2: 2, 1: 1, 0: 0, b: 5, a: 6 })) {
    values.push(value);
  }
  if (
    keys.length !== 6 ||
    keys[0] !== '0' ||
    keys[1] !== '1' ||
    keys[2] !== '2' ||
    keys[3] !== '10' ||
    keys[4] !== 'b' ||
    keys[5] !== 'a' ||
    values.length !== 6 ||
    values[0] !== 0 ||
    values[1] !== 1 ||
    values[2] !== 2 ||
    values[3] !== 10 ||
    values[4] !== 5 ||
    values[5] !== 6
  ) {
    throw new Error('unexpected integer-like object enumeration ordering');
  }
}
"""
