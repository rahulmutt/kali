[[case]]
name = "run_supports_object_string_enumeration_sequence_wrappers_in_browser_api_surface_with_harness"
rationale = """Migrated from browser_for_await_object_string_enumeration_sequence_wrappers_js_input.rs. Honest re-pin (PR #16 rev2): kali fails closed/loud here; see docs/superpowers/followups/pr16-honest-repin-inventory.md. `assert_browser_harness_object_string_enumeration_sequence_wrappers("run", ...)` runs `kali run --api browser` under the browser harness (`node`) and asserts only that the process fails closed and that E5506 appears on one of the two streams. Source's assertion is `stderr.contains("E5506") || stdout.contains("E5506")` -- an OR across streams for the same code (rule 11's shape, applied to streams instead of codes). Verified directly against the real binary: in this mode E5506 appears on stderr only. Pinned to the stream that actually carries it -- a verified strengthening of the source's OR (a presence claim, so narrowing is safe), with the disjunction sentence carried here per rule 11. `ext` (js/ts/jsx/tsx) is hoisted to a file-level [matrix] axis: 5 #[test] fns collapse to 4 [[case]] entries here, matrix-fanned to 16 trials, matching the 16 real per-(command,json_output,ext) invocations in source exactly. The helper picks its fixture body from the command while writing both to `main.<ext>`, which one flat file-wide `[source]` key cannot express, so the stems are disambiguated to `main_run`/`main_test`; the filename is only ever the bare CLI positional argument, never read back inside a fixture body."""
args = ["run", "--api", "browser", "--max-threads", "0", "--max-spawned-processes", "0", "main_run.${ext}"]
env = { "KALI_BROWSER_BUNDLE_HARNESS_COMMAND" = "node" }
exit = "failure"
stderr_contains = ["E5506"]

