rationale = """Migrated from browser_object_string_enumeration_harness.rs, the four `run_supports_string_primitive_iteration_when_browser_harness_is_configured_in_*_input` fns (one per extension). `assert_browser_harness_object_string_enumeration` writes the string-enumeration run fixture `.expect("write source")` (:386) and asks `kali` to run it against the browser API surface with the browser harness backed by node. The program iterates Object.keys, Object.values and Object.entries over the string primitive 'ab' through ten root spellings each -- dotted, bracketed, single-quoted, and `Object.freeze`d nullish/logical-and/logical-or wrappers -- and checks all thirty collected arrays. kali does not support that: the source's ONLY assertion is that the process fails `assert!(!output.status.success()` (:409), so this step carries `exit = "failure"` and nothing else. Adding a diagnostic code or a stdout claim the source never made would be a rule-2 invention, and `exit = "failure"` is exactly as strong as the assertion it replaces. RULE 12 -- the Rust comment prose of browser_object_string_enumeration_harness.rs, carried verbatim: "Honest re-pin (PR #16 rev2): kali fails closed/loud here; see docs/superpowers/followups/pr16-honest-repin-inventory.md.""""
