[matrix]
ext = ["js", "ts", "jsx", "tsx"]

[source]
"object_keys.${ext}" = """function main() {
  let values = { a: 1 };
  values = values;
  for (const key of Object.keys(values)) {
    console.log(key);
  }
}
main();
"""
"object_values.${ext}" = """function main() {
  let values = { a: 1 };
  values = values;
  for (const value of Object.values(values)) {
    console.log(value);
  }
}
main();
"""
"object_entries.${ext}" = """function main() {
  let values = { a: 1 };
  values = values;
  for (const entry of Object.entries(values)) {
    console.log(entry[0]);
    console.log(entry[1]);
  }
}
main();
"""
"array_callback.${ext}" = """function main() {
  const values = [1, 2];
  for (const item of values.filter((value) => value + 1)) {
    console.log(item);
  }
}
main();
"""
"set_constructor.${ext}" = """function main() {
  let values = [1, 2];
  values = values;
  for (const value of new Set(values.filter(Boolean))) {
    console.log(value);
  }
}
main();
"""
"map_constructor.${ext}" = """function main() {
  let values = [[1, 2], [3, 4]];
  values = values;
  for (const entry of new Map(values.filter(Boolean))) {
    console.log(entry[0]);
    console.log(entry[1]);
  }
}
main();
"""
"kali.json" = """{
  "schemaVersion": 1,
  "compilerOptions": {
    "apiSurface": "browser"
  }
}"""

