exit = "failure"` status class. In `--output json` mode the source parses stdout as the envelope and asserts `assert_eq!(json["schemaVersion"], 1)` (:202), `assert_eq!(json["command"], if bundle { "build" } else { "check" })` (:203), `assert_eq!(json["success"], false)` (:204) and `assert_eq!(json["exitCode"], 1)` (:205); all four are exact source assertions and become exact `json.*` pins. It then asserts `!errors.is_empty()` (:208) and `assert_eq!(errors[0]["code"], "E5506")` (:212). The non-emptiness claim needs no key of its own and is NOT dropped: design spec 5.4 makes an out-of-range numeric segment a HARD failure, never a silent skip, so `json.errors.0.code` cannot pass against an empty array. Pinning it implies the non-emptiness claim and is strictly stronger. The message claim is `message.contains("literal array")` (:214) against `errors[0]["message"]`. That message is a JSON string leaf, and the case format has NO substring form for one (there is no json_contains key), so controller ruling 3 makes it an exact `json.errors.0.message` pin -- and, per U9, only after the value was captured from the real built `kali` for this case rather than hand-computed. TWO-FILE SPLIT (U2). This file is the MANIFEST-INHERITED half: `kali.json` is in its `[source]` table and every argv below omits `--api browser`, so the browser API surface can only come from the manifest. The other 78 `#[test]` fns pass the flag explicitly and are in non_literal_iterator_sources_explicit_api.toml, whose `[source]` deliberately holds no manifest at all -- see that file's header for why one shared `[source]` table would silently disarm them."""
