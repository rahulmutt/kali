rationale = """Migrated from browser_non_literal_iterator_sources.rs, the `check_rejects_set_constructor_iteration_from_call_expression_source_under_inherited_browser_config` `#[test]` fn in its `check.rs` `#[path]` submodule (`check_rejects_set_constructor_iteration_from_call_expression_source_under_inherited_browser_config(` (check.rs:373)). That fn loops `for json_output in [false, true]` over `for filename in ["main.js", "main.ts", "main.jsx", "main.tsx"]`, 8 real invocations; this `[[case]]` is its text-output half, matrix-fanned by `ext(4)` to the 4 filenames, so the 12 fns become 24 cases x 4 = 96 trials = 96 invocations. `assert_inherited_browser_iterator_source_rejects(` (:165) writes the program to a fresh temp dir as `dir.path().join(filename)` (:173) and runs the real `kali` with that dir as cwd. It ALSO writes a `kali.json` manifest -- `dir.path().join("kali.json")` (:176), `.expect("write manifest")` (:184) -- whose `compilerOptions.apiSurface` is `browser`, and it passes NO `--api` flag: the API surface is inherited from the manifest. That conditional fixture is why this is a separate case FILE. The program under test is `set_constructor_call_expression_source()` (:83), written to `set_constructor.${ext}`. The source writes it to `main.js`, `main.ts`, `main.jsx` and `main.tsx`, one per loop iteration, which is the `ext` axis this case is fanned by; the `[source]` key is U5-renamed because `[source]` is one flat file-wide namespace and this source writes 8 different programs to just 2 filename stem(s) (`main.<ext>` and `smoke.test.<ext>`). The rename is argv-only -- no fixture body in this file names any of these files by string -- so it does not rewrite the program under test (rule 9). The source asserts the command FAILED and pins the exact code: `assert!(!output.status.success()` (:197) and `assert_eq!(output.status.code(), Some(1))` (:198). `assert_eq!` is already exact, so rule 1's non-negotiable direction gives `exit = 1` rather than the weaker `exit = "failure"` status class. In text mode the source asserts `stderr.contains("E5506")` (:219) and `stderr.contains("literal array")` (:221). The source spells this as a plain `.contains(...)` against the captured `stderr`, so it is carried as stderr_contains and NOT strengthened to an exact pin -- controller ruling 3, mirror the source: a plain `.contains` against a field that HAS a substring form keeps the substring form even though the exact output was observed. The source reads no JSON in this mode, so this case pins no `json` field: adding one would be a rule 2 invention. TWO-FILE SPLIT (U2). This file is the MANIFEST-INHERITED half: `kali.json` is in its `[source]` table and every argv below omits `--api browser`, so the browser API surface can only come from the manifest. The other 78 `#[test]` fns pass the flag explicitly and are in non_literal_iterator_sources_explicit_api.toml, whose `[source]` deliberately holds no manifest at all -- see that file's header for why one shared `[source]` table would silently disarm them."""
args = ["check", "set_constructor.${ext}"]
exit = 1
stderr_contains = ["E5506", "literal array"]

[[case]]
name = "check_rejects_set_constructor_iteration_from_call_expression_source_under_inherited_browser_config__json"
rationale = """Migrated from browser_non_literal_iterator_sources.rs, the `check_rejects_set_constructor_iteration_from_call_expression_source_under_inherited_browser_config` `#[test]` fn in its `check.rs` `#[path]` submodule (`check_rejects_set_constructor_iteration_from_call_expression_source_under_inherited_browser_config(` (check.rs:373)). That fn loops `for json_output in [false, true]` over `for filename in ["main.js", "main.ts", "main.jsx", "main.tsx"]`, 8 real invocations; this `[[case]]` is its JSON-output half, matrix-fanned by `ext(4)` to the 4 filenames, so the 12 fns become 24 cases x 4 = 96 trials = 96 invocations. `assert_inherited_browser_iterator_source_rejects(` (:165) writes the program to a fresh temp dir as `dir.path().join(filename)` (:173) and runs the real `kali` with that dir as cwd. It ALSO writes a `kali.json` manifest -- `dir.path().join("kali.json")` (:176), `.expect("write manifest")` (:184) -- whose `compilerOptions.apiSurface` is `browser`, and it passes NO `--api` flag: the API surface is inherited from the manifest. That conditional fixture is why this is a separate case FILE. The program under test is `set_constructor_call_expression_source()` (:83), written to `set_constructor.${ext}`. The source writes it to `main.js`, `main.ts`, `main.jsx` and `main.tsx`, one per loop iteration, which is the `ext` axis this case is fanned by; the `[source]` key is U5-renamed because `[source]` is one flat file-wide namespace and this source writes 8 different programs to just 2 filename stem(s) (`main.<ext>` and `smoke.test.<ext>`). The rename is argv-only -- no fixture body in this file names any of these files by string -- so it does not rewrite the program under test (rule 9). The source asserts the command FAILED and pins the exact code: `assert!(!output.status.success()` (:197) and `assert_eq!(output.status.code(), Some(1))` (:198). `assert_eq!` is already exact, so rule 1's non-negotiable direction gives `exit = 1` rather than the weaker `exit = "failure"` status class. In `--output json` mode the source parses stdout as the envelope and asserts `assert_eq!(json["schemaVersion"], 1)` (:202), `assert_eq!(json["command"], if bundle { "build" } else { "check" })` (:203), `assert_eq!(json["success"], false)` (:204) and `assert_eq!(json["exitCode"], 1)` (:205); all four are exact source assertions and become exact `json.*` pins. It then asserts `!errors.is_empty()` (:208) and `assert_eq!(errors[0]["code"], "E5506")` (:212). The non-emptiness claim needs no key of its own and is NOT dropped: design spec 5.4 makes an out-of-range numeric segment a HARD failure, never a silent skip, so `json.errors.0.code` cannot pass against an empty array. Pinning it implies the non-emptiness claim and is strictly stronger. The message claim is `message.contains("literal array")` (:214) against `errors[0]["message"]`. That message is a JSON string leaf, and the case format has NO substring form for one (there is no json_contains key), so controller ruling 3 makes it an exact `json.errors.0.message` pin -- and, per U9, only after the value was captured from the real built `kali` for this case rather than hand-computed. TWO-FILE SPLIT (U2). This file is the MANIFEST-INHERITED half: `kali.json` is in its `[source]` table and every argv below omits `--api browser`, so the browser API surface can only come from the manifest. The other 78 `#[test]` fns pass the flag explicitly and are in non_literal_iterator_sources_explicit_api.toml, whose `[source]` deliberately holds no manifest at all -- see that file's header for why one shared `[source]` table would silently disarm them."""
args = ["--output", "json", "check", "set_constructor.${ext}"]
exit = 1
json.schemaVersion = 1
json.command = "check"
json.success = false
json.exitCode = 1
json.errors.0.code = "E5506"
json.errors.0.message = "for-of array iteration lowering is unavailable unless the iterable is a literal array or supported string iterable with literal elements and the loop target is a variable declaration or simple identifier binding; use a supported loop form or the later compatibility path"
