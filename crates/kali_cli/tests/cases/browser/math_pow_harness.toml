name = "run_supports_math_pow_alias_chain_when_browser_harness_is_configured"
rationale = """Migrated from browser_math_pow_harness.rs, the four `run_supports_math_pow_alias_chain_when_browser_harness_is_configured_in_*_input` fns (one per extension). `assert_browser_harness_math_pow` runs `kali run --api browser` with the browser harness backed by node, against a program that raises 2 to an aliased exponent of 3 through every spelling in the canonical browser Math.pow alias inventory -- bare, dotted and bracketed globalThis roots, frozen callables, parenthesized and nullish/logical frozen wrappers and bracketed-root frozen wrappers -- so 8 is printed once per alias. Its stdout claim is `stdout.contains("8\\n8\\n8")` against raw stdout (:84). The source spells this as a plain `.contains(...)` against raw stdout, so it is carried as stdout_contains and NOT strengthened to an exact pin -- controller ruling 3, mirror the source: a plain `.contains` against a field that HAS a substring form keeps the substring form even though the exact output was observed. RULE 13 -- doc comments on the library helpers that produce this fixture, carried verbatim: "Canonical browser-invocation lines for the supported `Math.pow` browser alias inventory.", "Canonical browser alias inventory for the supported `Math.pow` helper slice.", "Canonical direct aliases for the supported `Math.pow` helper slice.", "Canonical frozen callable aliases for the supported `Math.pow` helper slice.", "Canonical direct frozen callable aliases for the supported `Math.pow` helper slice.", "Canonical parenthesized frozen callable aliases for the supported `Math.pow` helper slice.", "Canonical nullish/logical frozen callable aliases for the supported `Math.pow` helper slice.", "Canonical bracketed-root frozen callable aliases for the supported `Math.pow` helper slice." and "Canonical `console.log(...)` invocation lines for an arbitrary `Math.pow` alias inventory.""""
args = ["run", "--api", "browser", "main.${ext}"]
env = { KALI_BROWSER_BUNDLE_HARNESS_COMMAND = "node" }
exit = "success"
stdout_contains = ["8\n8\n8"]

