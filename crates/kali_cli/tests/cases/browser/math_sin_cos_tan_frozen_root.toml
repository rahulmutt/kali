rationale = """Migrated from browser_math_sin_cos_tan_frozen_root.rs, the four `build_emits_frozen_math_sin_cos_tan_zero_identities_in_*_input` fns (one per extension). `assert_browser_bundle_frozen_math_sin_cos_tan` runs `kali build --bundle --api browser` on the tree-shake-marked bundle fixture, reads the emitted `app/app.meta.json` (:94-95), then runs the bundle glue under the browser-bundle-harness contract against a program that freezes `Math.sin`, `globalThis.Math.cos` and `globalThis["Math"]["tan"]` (and the three bracketed/dotted spellings of the same three) and calls each at zero, so its six console.log calls print 0, 1, 0, 0, 1, 0. Both exit statuses are asserted (`output.status.success()` :71 for the build, `output.status.success()` :124 for the harness process). The source makes TWO separate claims about the harness stdout -- `stdout.contains("1\\n")` (:130) and `stdout.matches("0\\n").count() >= 4` (:131) -- so both are carried, as `stdout_contains` and `stdout_count`; collapsing them into one would drop a claim. The source spells this as a plain `.contains(...)` against raw stdout, so it is carried as stdout_contains and NOT strengthened to an exact pin -- controller ruling 3, mirror the source: a plain `.contains` against a field that HAS a substring form keeps the substring form even though the exact output was observed. The source spells this as `.matches("0\\n").count() >= 4`, carried verbatim as `stdout_count` with `at_least = 4` per controller ruling 3 (mirror the source): NOT weakened to a plain contains, which a single occurrence would satisfy, and NOT strengthened to `exact`, which the source never says. Counting is non-overlapping and left-to-right, as Rust's `str::matches` is."""

[[case.step]]
args = ["build", "--bundle", "--api", "browser", "app.${ext}"]
exit = "success"

[[case.step]]
kind = "file_json"
path = "app/app.meta.json"
fields = { apiSurface = "browser", artifactKind = "bundle" }

[[case.step]]
kind = "browser_bundle_harness"
entry = "app"
body = """const mod = await import(bundleJs.href);
await mod.frozenMathSinCosTanZeroIdentities();
"""
exit = "success"
stdout_contains = ["1\n"]
stdout_count = [{ needle = "0\n", at_least = 4 }]

