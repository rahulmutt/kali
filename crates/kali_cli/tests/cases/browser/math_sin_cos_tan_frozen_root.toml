[matrix]
ext = ["js", "ts", "jsx", "tsx"]

[source]
"app.${ext}" = """// kali-tree-shake: frozenMathSinCosTanZeroIdentities
function frozenMathSinCosTanZeroIdentities() {
  const zero = 0;
  console.log(Object.freeze(Math.sin)(zero));
  console.log(Object.freeze(globalThis.Math.cos)(zero));
  console.log(Object.freeze(globalThis["Math"]["tan"])(zero));
  console.log(Object.freeze(globalThis.Math["sin"])(zero));
  console.log(Object.freeze(globalThis["Math"].cos)(zero));
  console.log(Object.freeze(globalThis["Math"]["tan"])(zero));
  return [
    Object.freeze(Math.sin)(zero),
    Object.freeze(globalThis.Math.cos)(zero),
    Object.freeze(globalThis["Math"]["tan"])(zero),
    Object.freeze(globalThis.Math["sin"])(zero),
    Object.freeze(globalThis["Math"].cos)(zero),
    Object.freeze(globalThis["Math"]["tan"])(zero),
  ];
}
"""
"main.${ext}" = """const zero = 0; console.log(Object.freeze(Math.sin)(zero)); console.log(Object.freeze(globalThis.Math.cos)(zero)); console.log(Object.freeze(globalThis["Math"]["tan"])(zero)); console.log(Object.freeze(globalThis.Math["sin"])(zero)); console.log(Object.freeze(globalThis["Math"].cos)(zero)); console.log(Object.freeze(globalThis["Math"]["tan"])(zero));
"""
"smoke.test.${ext}" = """Kali.test('frozen math sin/cos/tan zero identities', () => {
  const zero = 0;
  console.log(Object.freeze(Math.sin)(zero));
  console.log(Object.freeze(globalThis.Math.cos)(zero));
  console.log(Object.freeze(globalThis["Math"]["tan"])(zero));
  console.log(Object.freeze(globalThis.Math["sin"])(zero));
  console.log(Object.freeze(globalThis["Math"].cos)(zero));
  console.log(Object.freeze(globalThis["Math"]["tan"])(zero));
});
"""

