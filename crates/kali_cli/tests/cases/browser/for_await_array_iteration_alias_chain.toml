"app.js" = """// kali-tree-shake: forAwaitArrayIterationConstAliasChainWrapper
async function forAwaitArrayIterationConstAliasChainWrapper() {
  const values = [1, 2];
  const alias = values;
  for await (const value of alias) {
    console.log(value);
  }
}
"""
"app.ts" = """// kali-tree-shake: forAwaitArrayIterationConstAliasChainWrapper
async function forAwaitArrayIterationConstAliasChainWrapper() {
  const values = [1, 2];
  const alias = values;
  for await (const value of alias) {
    console.log(value);
  }
}
"""
