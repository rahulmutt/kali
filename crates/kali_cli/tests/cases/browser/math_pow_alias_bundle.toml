[[case]]
name = "build_emits_math_pow_alias_chain"
rationale = """Migrated from browser_math_pow_alias_bundle.rs, the four `build_emits_math_pow_alias_chain_in_*_input` fns (one per extension). `assert_browser_bundle_math_pow_alias`, whose body is one forwarding call to `assert_browser_bundle_math_pow_alias_with_source`, builds a browser bundle with `kali build --bundle --api browser`, asserts the emitted bundle metadata, then runs the bundle glue under the browser-bundle-harness contract backed by node, against a program that raises 2 to an aliased exponent of 3 through every alias in the canonical browser `Math.pow` inventory and returns Math.pow(2, alias), so every line of its output is 8. The file's only stdout claim is `.contains("8\\n")` (:131). The source spells this as a plain `.contains(...)` against raw stdout, so it is carried as stdout_contains and NOT strengthened to an exact pin -- controller ruling 3, mirror the source: a plain `.contains` against a field that HAS a substring form keeps the substring form even though the exact output was observed. This case's program is written to app_alias.<ext> rather than the source's app.<ext>: the file writes two DIFFERENT programs to that one name and `[source]` is a single flat namespace (U5). The bundle directory, the metadata path and the harness entry all follow the renamed stem, because `kali build --bundle` names its output after the input stem. RULE 13 -- doc comments on the library helpers that produce this fixture, carried verbatim: "Canonical browser-invocation lines for the supported `Math.pow` browser alias inventory.", "Canonical browser alias inventory for the supported `Math.pow` helper slice.", "Canonical direct aliases for the supported `Math.pow` helper slice.", "Canonical frozen callable aliases for the supported `Math.pow` helper slice.", "Canonical direct frozen callable aliases for the supported `Math.pow` helper slice.", "Canonical parenthesized frozen callable aliases for the supported `Math.pow` helper slice.", "Canonical nullish/logical frozen callable aliases for the supported `Math.pow` helper slice.", "Canonical bracketed-root frozen callable aliases for the supported `Math.pow` helper slice." and "Canonical `console.log(...)` invocation lines for an arbitrary `Math.pow` alias inventory.""""

[[case.step]]
args = ["build", "--bundle", "--api", "browser", "app_alias.${ext}"]
exit = "success"

[[case.step]]
kind = "file_json"
path = "app_alias/app_alias.meta.json"
fields = { apiSurface = "browser", artifactKind = "bundle" }

[[case.step]]
kind = "browser_bundle_harness"
entry = "app_alias"
body = """const mod = await import(bundleJs.href);
await mod.mathPowAliasChain();
"""
exit = "success"
stdout_contains = ["8\n"]

