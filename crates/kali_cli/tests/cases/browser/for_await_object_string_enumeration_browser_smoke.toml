exit = "failure"

[[case]]
name = "check_supports_for_await_object_string_enumeration_in_browser_analysis_context"
rationale = """Migrated from browser_for_await_object_string_enumeration_browser_smoke.rs, `assert_browser_for_await_object_string_enumeration_support`. Writes `browser_for_await_object_string_enumeration_source()` (a `for await` walk over `Object.keys`/`Object.values`/`Object.entries` applied to the string primitive `'ab'`, exercised through direct/global/mixed/bracketed/fully-bracketed/single-bracketed/parenthesized-property-access call shapes, with inline `throw`-guarded length/index assertions on each collector) to `app.${ext}` and runs `kali <command> --api browser [--bundle] [--output json] app.${ext}`. Source asserts `output.status.success()` unconditionally, and (only when `--output json` is passed) `json["schemaVersion"] == 1`, `json["command"] == command`, `json["success"] == true`, and `json["errors"]` is an empty array -- identical logic duplicated in both the `command == "build"` early-return branch and the fallthrough branch, so this is one assertion shape regardless of `check`/`build`.

Throw-fallout Stage 4 Task 6 adjudication (fake-green flip, coordinator-ruled Option B): this fixture used to pass its pushed collectors to assert helper FUNCTIONS (`assertObjectKeysIteration(keys)` — a call-argument escape). That compiled only because `.push` was a silent no-op (the collectors stayed length 0, so the program would have thrown at runtime — these build/check tests never ran it). Task 6's fail-closed reject (E5506 for a growable-shape push receiver in an unsupported position) correctly rejects that shape, so the asserts are now INLINED at each collector (length + index-read string guards — all safe growable positions), and the collectors legitimately promote to the real growable lane with node-parity runtime semantics (verified byte-for-byte on a runnable replica). The `entries` collectors keep length-only guards: their elements are ARRAYS (`[k, v]`), which the growable lane's element surface does not support reading back — any `entry[0]` read anywhere in the function marks `entry` as an array binding and fail-closes every `entries.push(entry)` (E5506, unsupported element)."""
args = ["check", "--api", "browser", "app.${ext}"]
exit = "success"

