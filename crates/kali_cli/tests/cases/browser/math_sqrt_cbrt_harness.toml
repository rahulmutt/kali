# EXTRA-CLAIM DECLARATIONS (U14's `extra` direction).
# check_extra_claims.py compares this file's claim strings against the source's and fails
# on any that appear nowhere in the .rs. The entries below are the deliberate exceptions;
# a genuinely new one will not be on this list and will fail the gate.
# EXTRA-OK: '2\n-3\n' -- live-captured exact `json.stdout` pin; source asserts `.contains` on a JSON leaf, which has no substring form, so ruling 3 requires an exact pin captured from the real binary
# Migrated from tests/browser_math_sqrt_cbrt_harness.rs.
#   SOURCE REF: 28df9ba02962143a1fc1735e418b2f67caee8fc6
#
# RULE 12 (carry every source comment verbatim): `grep -nE '^\s*//'` over
# tests/browser_math_sqrt_cbrt_harness.rs returns NOTHING -- the file has no Rust comments
# at all.
# The file contains no `//` of any kind -- it declares no bundle fixture,
# so there is not even a `// kali-tree-shake:` marker in it.
# There is therefore no prose to move into any `rationale`, and
# comment_coverage.py is run with --allow-empty for this pair.
#
# RULE 7 / U1 -- MATRIX ARITHMETIC, and it closes exactly.
# 16 `#[test]` fns, 16 real helper invocations with every loop
# expanded:
#   * `assert_browser_harness_math_sqrt_cbrt` -- 16 invocation(s) = command(run/test) x ext(js/ts/jsx/tsx) x
#     json_output(false/true), a complete cross product
# `ext` is the ONE axis every case varies over uniformly, and every helper covers
# all 4 of its values, so a file-wide axis fans nothing the source never ran:
# 4 `[[case]]` entries x ext(4) = 16 trials = 16 invocations. Exact.
# `command` and `json_output` are NOT matrix axes, per rule 7 and design spec 5.6's own note:
# each changes the ASSERTION SHAPE rather than substituting a string.
# `json_output` switches between a text claim and a JSON-envelope claim.
# `command` switches the envelope's payload between `exitCode` (run) and
# `total`/`passed`/`failed` (test).
# Each is written as sibling `[[case]]` entries instead.
#
# RULE 6 -- 1:1 MAPPING, and the fold is stated here as the rule requires.
# Each `[[case]]` below corresponds to 4 source `#[test]` fns, one per `ext` cell; the assertion mapping stays
# 1:1 per trial, so no claim is lost, but a failing trial's id reads its matrix cell
# rather than a source fn name.
#
# U2 -- `[source]` is FILE-WIDE, and that is safe here. Every fixture
# (`main.${ext}`, `smoke.test.${ext}`)
# is written unconditionally by the source into a fresh temp dir: no fixture is written
# behind an `if`, and no case's point is the presence or absence of a file.
# Every command below names its entry explicitly on argv, so the unused siblings in
# a trial dir are inert.
#
# RULE 13 -- transitive helper docs. Checked every fn in each call chain:
#   `kali_bin`, `browser_harness_math_sqrt_cbrt_run_source`,
#   `browser_harness_math_sqrt_cbrt_test_source`,
#   `assert_browser_harness_math_sqrt_cbrt` -- none carries a `///` doc comment.
# The chain also reaches `kali_runtime_contract::browser_bundle_harness_script` and
# `::browser_harness_command_parts_for`, which DO carry one-line `///` docs. Those are
# NOT carried: in the migrated form this case file never calls them -- the
# `browser_bundle_harness` step kind means the case RUNNER does
# (crates/kali_case_runner/src/steps.rs) -- so their docs describe shared runner
# infrastructure documented in design spec 5.3, not what this case claims. That is
# controller ruling 6, which writes the exemption into the rule rather than leaving it
# to implementer discretion.
#
# ARGV ORDER is transcribed in the exact order the source's `Command` builder appends it,
# which differs between the two helper shapes and is not normalised here:
#   * build:   `build --bundle --api browser [--output json] <entry>` -- the `--output json`
#              pair is appended AFTER the subcommand and its flags.
#   * run/test: `[--output json] <run|test> --api browser [--max-threads 0
#              --max-spawned-processes 0] <entry>` -- the `--output json` pair is appended
#              BEFORE the subcommand.
# The source passes an absolute `dir.path().join(filename)` as the entry; the case runner
# passes the bare filename relative to the trial dir, matching every previously shipped
# `browser/` case file.
#
# ASSERTION SHAPE, mirrored from the source and nothing more.
# `exit = "success"` on the one `kali` process (:48); the environment carries
# KALI_BROWSER_BUNDLE_HARNESS_COMMAND=node (`.env("KALI_BROWSER_BUNDLE_HARNESS_COMMAND", "node")` :35), spelled as a string literal in this source rather
# than through the `kali_runtime_contract` constant. The source passes no
# --max-threads / --max-spawned-processes arguments, so neither appears on argv.
# json mode carries schemaVersion/command/success/payload(hostContract,
# runtimeBackend) (`json["command"]` :56-60), plus `exitCode` at both levels
# for `run` (:62) or payload total/passed/failed/skipped for `test`
# (`json["payload"]["skipped"]` :68 is the last of the four), then the exact `json.stdout` pin
# standing for the `.contains("2\n-3")` claim at :71, `stderr = ""`
# (`json["stderr"]` :72) and the empty `errors` array (:73).
# Text mode carries the same needle against raw stdout (`stdout.contains(...)` :76) and, for
# `test` only, `.contains("ok 1")` (:78).
# This file uses no count key: the source makes no `.matches(...).count()` claim.

[matrix]
ext = ["js", "ts", "jsx", "tsx"]

[source]
"main.${ext}" = """console.log(Math.sqrt(4));
console.log(Math.cbrt(-27));
"""
"smoke.test.${ext}" = """Kali.test('math sqrt/cbrt literal identities', () => {
  console.log(Math.sqrt(4));
  console.log(Math.cbrt(-27));
});
"""

[[case]]
name = "run_supports_math_sqrt_and_cbrt_literal_identities_when_browser_harness_is_configured"
rationale = """Migrated from browser_math_sqrt_cbrt_harness.rs, the four `run_supports_math_sqrt_and_cbrt_literal_identities_when_browser_harness_is_configured_in_*_input` fns (one per extension). `assert_browser_harness_math_sqrt_cbrt` writes a program calling Math.sqrt(4) and Math.cbrt(-27) (or the same two calls inside a Kali.test wrapper) and runs `kali run` / `kali test --api browser` with the browser harness backed by node, so stdout carries 2 then -3. Its stdout claim is `.contains("2\\n-3")` (:76). The source spells this as a plain `.contains(...)` against raw stdout, so it is carried as stdout_contains and NOT strengthened to an exact pin -- controller ruling 3, mirror the source: a plain `.contains` against a field that HAS a substring form keeps the substring form even though the exact output was observed."""
args = ["run", "--api", "browser", "main.${ext}"]
env = { KALI_BROWSER_BUNDLE_HARNESS_COMMAND = "node" }
exit = "success"
stdout_contains = ["2\n-3"]

[[case]]
name = "json_run_supports_math_sqrt_and_cbrt_literal_identities_when_browser_harness_is_configured"
rationale = """Migrated from browser_math_sqrt_cbrt_harness.rs, the four `json_run_supports_math_sqrt_and_cbrt_literal_identities_when_browser_harness_is_configured_in_*_input` fns (one per extension). `assert_browser_harness_math_sqrt_cbrt` writes a program calling Math.sqrt(4) and Math.cbrt(-27) (or the same two calls inside a Kali.test wrapper) and runs `kali run` / `kali test --api browser` with the browser harness backed by node, so stdout carries 2 then -3. On the JSON branch the same claim is taken against the string leaf json["stdout"], which has NO substring form in the case format (there is no json_contains key), so per controller ruling 3 it becomes an exact `json.stdout` pin -- and, per U9, only after the value was captured from the real kali binary rather than hand-computed."""
args = ["--output", "json", "run", "--api", "browser", "main.${ext}"]
env = { KALI_BROWSER_BUNDLE_HARNESS_COMMAND = "node" }
exit = "success"
json = { schemaVersion = 1, command = "run", success = true, exitCode = 0, payload = { hostContract = "browser-requested", runtimeBackend = "browser-harness", exitCode = 0 }, stdout = "2\n-3\n", stderr = "", errors = [] }

[[case]]
name = "test_supports_math_sqrt_and_cbrt_literal_identities_when_browser_harness_is_configured"
rationale = """Migrated from browser_math_sqrt_cbrt_harness.rs, the four `test_supports_math_sqrt_and_cbrt_literal_identities_when_browser_harness_is_configured_in_*_input` fns (one per extension). `assert_browser_harness_math_sqrt_cbrt` writes a program calling Math.sqrt(4) and Math.cbrt(-27) (or the same two calls inside a Kali.test wrapper) and runs `kali run` / `kali test --api browser` with the browser harness backed by node, so stdout carries 2 then -3. Its stdout claim is `.contains("2\\n-3")` (:76). The source spells this as a plain `.contains(...)` against raw stdout, so it is carried as stdout_contains and NOT strengthened to an exact pin -- controller ruling 3, mirror the source: a plain `.contains` against a field that HAS a substring form keeps the substring form even though the exact output was observed. For `test` the source also asserts `.contains("ok 1")` (:78), which the json branch does not make."""
args = ["test", "--api", "browser", "smoke.test.${ext}"]
env = { KALI_BROWSER_BUNDLE_HARNESS_COMMAND = "node" }
exit = "success"
stdout_contains = ["2\n-3", "ok 1"]

[[case]]
name = "json_test_supports_math_sqrt_and_cbrt_literal_identities_when_browser_harness_is_configured"
rationale = """Migrated from browser_math_sqrt_cbrt_harness.rs, the four `json_test_supports_math_sqrt_and_cbrt_literal_identities_when_browser_harness_is_configured_in_*_input` fns (one per extension). `assert_browser_harness_math_sqrt_cbrt` writes a program calling Math.sqrt(4) and Math.cbrt(-27) (or the same two calls inside a Kali.test wrapper) and runs `kali run` / `kali test --api browser` with the browser harness backed by node, so stdout carries 2 then -3. On the JSON branch the same claim is taken against the string leaf json["stdout"], which has NO substring form in the case format (there is no json_contains key), so per controller ruling 3 it becomes an exact `json.stdout` pin -- and, per U9, only after the value was captured from the real kali binary rather than hand-computed."""
args = ["--output", "json", "test", "--api", "browser", "smoke.test.${ext}"]
env = { KALI_BROWSER_BUNDLE_HARNESS_COMMAND = "node" }
exit = "success"
json = { schemaVersion = 1, command = "test", success = true, payload = { hostContract = "browser-requested", runtimeBackend = "browser-harness", total = 1, passed = 1, failed = 0, skipped = 0 }, stdout = "2\n-3\n", stderr = "", errors = [] }
