[[case]]
name = "run_supports_template_literal_dynamic_import_targets_in_browser_api_surface_with_harness_js_input"
rationale = """Migrated from browser_template_literal_dynamic_import_harness.rs. Every case funnels through `assert_browser_requested_template_literal_dynamic_import`, whose reconciliation comment (Stage P5 Task 5, moved verbatim into this file's header) explains why the program now SUCCEEDS with node-correct stdout rather than failing closed. The fixture bodies are built by `format!` with real `{{`/`}}` doubling around JS code blocks and the genuine `${name}` template-literal interpolation (35 `{{` occurrences total in source, the family's densest brace-collapse trap) -- every resolved fixture text below was captured by actually EXECUTING the real `format!` calls via a temporary Rust test (not hand-derived), matching rule 8. `exit = "success"` for every case: this file's whole premise, per the reconciliation comment, is that these dynamic imports now succeed. For a `test`-command, non-json case, source asserts `stdout.starts_with(&expected_stdout)` -- per the standing rule, this is NOT weakened to `contains`; the exact full `stdout` was captured from the real binary and pinned exactly instead, strictly stronger than the source's own prefix check. `--output json` mode already used exact `assert_eq!` in source (`json["stdout"]` against the full computed `expected_stdout`), so no strengthening was needed there -- copied as-is."""
args = ["run", "--api", "browser", "--max-threads", "0", "--max-spawned-processes", "0", "main_default.js"]
env = { KALI_BROWSER_BUNDLE_HARNESS_COMMAND = "node" }
exit = "success"
stdout = """0
main loaded
"""

