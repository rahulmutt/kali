[[case]]
name = "test_supports_object_freeze_wrapped_literal_dynamic_import_targets_with_logical_wrappers_in_browser_api_surface_with_harness_tsx_input"
rationale = """Migrated from browser_template_literal_dynamic_import_harness.rs. Every case funnels through `assert_browser_requested_template_literal_dynamic_import`.

Stage P5 Task 5 reconciliation (was Task A2b fail-closed pin). `String()` is now a real runtime coercion (String de-denylisted + routed through the `emit_as_string` ladder), so the pre-A2b behavior is restored HONESTLY: every fixture routed through this helper does `console.log(String(value))` (the freeze variant does three such lines) where `value` is the imported `0n`. `String(0n)` -> "0" on both kali and node (referee: node v26.5.0), so the browser-harness run/test SUCCEEDS with node-correct stdout. Derive the expected program stdout FROM the fixture — one `0\\n` per `console.log(String(` site, then `main loaded\\n` — so the assertion is exact and a wrong-reason pass on a stray substring (e.g. a surviving deny that happens to print "0") is not available. In `--output json` mode the program's own stdout is the clean `stdout` JSON field (the TAP `ok 1` test summary stays out of it); for a non-json `test` run the TAP summary trails the program output.

The fixture bodies are built by `format!` with real `{{`/`}}` doubling around JS code blocks and the genuine `${name}` template-literal interpolation (35 `{{` occurrences total in source, the family's densest brace-collapse trap) -- every resolved fixture text below was captured by actually EXECUTING the real `format!` calls via a temporary Rust test (not hand-derived), matching rule 8. `exit = "success"` for every case: this file's whole premise, per the reconciliation note above, is that these dynamic imports now succeed. For a `test`-command, non-json case, source asserts `stdout.starts_with(&expected_stdout)` -- per the standing rule, this is NOT weakened to `contains`; the exact full `stdout` was captured from the real binary and pinned exactly instead, strictly stronger than the source's own prefix check. `--output json` mode already used exact `assert_eq!` in source (`json["stdout"]` against the full computed `expected_stdout`), so no strengthening was needed there -- copied as-is."""
args = ["test", "--api", "browser", "--max-threads", "0", "--max-spawned-processes", "0", "smoke.test_freeze.tsx"]
env = { KALI_BROWSER_BUNDLE_HARNESS_COMMAND = "node" }
exit = "success"
stdout = """0
0
0
main loaded
ok 1
"""
stdout_contains = ["ok 1"]
stdout_absent = ["not ok"]

