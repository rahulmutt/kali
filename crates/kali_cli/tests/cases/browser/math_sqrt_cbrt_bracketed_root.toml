rationale = """Migrated from browser_math_sqrt_cbrt_bracketed_root.rs, the four `build_emits_bracketed_math_sqrt_and_cbrt_zero_identities_in_*_input` fns (one per extension). `assert_browser_bundle_bracketed_math_sqrt_cbrt` runs `kali build --bundle --api browser` on the tree-shake-marked bundle fixture, reads the emitted `app/app.meta.json` (:80-81), then runs the bundle glue under the browser-bundle-harness contract against a program that calls `globalThis["Math"]["sqrt"](4)` and `globalThis["Math"]["cbrt"](-27)`, so its two console.log calls print 2 and -3. Both exit statuses are asserted (`output.status.success()` :58 for the build, `output.status.success()` :110 for the harness process). Its two stdout claims are `stdout.contains("2\\n")` (:116) and `stdout.contains("-3\\n")` (:117). The source spells this as a plain `.contains(...)` against raw stdout, so it is carried as stdout_contains and NOT strengthened to an exact pin -- controller ruling 3, mirror the source: a plain `.contains` against a field that HAS a substring form keeps the substring form even though the exact output was observed. This sibling additionally asserts the JSON build envelope -- schemaVersion/command/success/exitCode and payload artifactKind/bundleFormat (`envelope["payload"].as_object().expect("payload object")` :66-72). The source asserts no `errors` array on this envelope, so none is written. Output shape is not a matrix axis because it changes the assertion shape rather than substituting a string, so it is a separate case."""

[[case.step]]
