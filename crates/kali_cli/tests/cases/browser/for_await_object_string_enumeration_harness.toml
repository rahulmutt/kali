16 #[test] fns in source, each an individual (unlooped) call to `assert_browser_harness_object_string_enumeration`, grouped by (command, json_output) into 4 distinct shapes; within this shape the 4 fns differ only by input extension (js/ts/jsx/tsx) with an identical assertion -- hoisted to a file-level [matrix] axis rather than 4 named siblings per case."""
args = ["--output", "json", "test", "--api", "browser", "--max-threads", "0", "--max-spawned-processes", "0", "smoke.test.${ext}"]
env = { "KALI_BROWSER_BUNDLE_HARNESS_COMMAND" = "node" }
exit = "failure"
stdout_contains = ["E5506"]
