rationale = """Migrated from browser_math_expm1_log1p_fully_bracketed_root.rs. `assert_browser_harness_fully_bracketed_global_this_math_expm1_log1p` runs `kali test --api browser --max-threads 0 --max-spawned-processes 0` with the browser harness backed by `node`. This case is 2 of the 8 invocations the single #[test] fn `run_and_test_supports_fully_bracketed_global_this_math_expm1_log1p_identities_when_browser_harness_is_configured_in_js_and_ts_input` makes by looping over four (command, source_name, source) tuples and then over `for output_json in [false, true]`; per the split-don't-fold rule each independent program becomes its own named sibling [[case]], and the two extensions the loop covers are the file's `ext` matrix axis -- js and ts only, since this file has no jsx/tsx tests in either group. JSON mode (`--output json`): the envelope's schemaVersion/command/success and payload hostContract/runtimeBackend, plus `payload.total`/`passed`/`failed` (the source's `test` branch), `stderr` exactly empty, and an exact `json.stdout` pin. The source claims `json["stdout"].as_str().contains("0\\n")`; a json leaf has no substring form in this format, so ruling 3 resolves it to an exact pin, live-captured from the real `kali` binary and checked to contain the source's literal before being written. The source asserts no `errors` array on this envelope, so none is written."""
