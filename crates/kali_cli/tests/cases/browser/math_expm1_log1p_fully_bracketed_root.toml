# EXTRA-OK: '0\n0\n' -- live-captured exact `json.stdout` pin; source asserts `.contains` on a JSON leaf, which has no substring form, so ruling 3 requires an exact pin captured from the real binary
# Migrated from tests/browser_math_expm1_log1p_fully_bracketed_root.rs.
#
# RULE 12 (carry every source comment verbatim): `browser_math_expm1_log1p_fully_bracketed_root.rs` contains no
# Rust comments at all -- `grep -nE '^\s*//'` finds nothing, and the only `//`
# anywhere in the file is the `// kali-tree-shake:` marker on line 11, inside a
# JS fixture body, which is program text and is carried verbatim into [source].
# There is therefore no prose to move into any `rationale`, and no `///` doc
# comment on any helper in either call chain (checked: `grep -n '///'` finds
# nothing). comment_coverage.py is run with --allow-empty for this pair.
#
# RULE 7 / U1 -- MATRIX ARITHMETIC, closes exactly, over a TWO-VALUE axis.
# 5 #[test] fns, 12 real invocations (enumerated with
# tools/task-18-browser-pilot/enumerate_invocations.py, which parses this file
# completely because both groups call a named assert_* helper):
#   * `assert_browser_bundle_fully_bracketed_global_this_math_expm1_log1p`(
#     filename, json_output) -- 4 invocations from 4 one-line #[test] fns =
#     ext(js/ts) x json_output(false/true). NOTE what is absent: unlike its
#     bracketed-root and mixed-root siblings in this batch, this file has NO
#     jsx/tsx bundle tests at all.
#   * `assert_browser_harness_fully_bracketed_global_this_math_expm1_log1p`(
#     command, filename, source, json_output) -- 8 invocations from the single
#     #[test] fn
#     `run_and_test_supports_fully_bracketed_global_this_math_expm1_log1p_identities_when_browser_harness_is_configured_in_js_and_ts_input`,
#     which loops over four `(command, source_name, source)` tuples --
#     (run, main.js), (test, smoke.test.js), (run, main.ts),
#     (test, smoke.test.ts) -- and then over `for output_json in [false, true]`.
#     Here the fn name is accurate: js and ts only.
# Both groups vary over ext(js/ts) uniformly and completely, and NEITHER covers
# jsx/tsx, so the axis is `["js", "ts"]` and not the four-value axis used by
# this batch's other root-shape files: 6 [[case]] x ext(2) = 12 trials = 12
# invocations. Adding jsx/tsx to the axis would fan every case over four cells
# the source never runs -- inventing untested combinations (rule 2) and breaking
# the arithmetic (rule 7) -- and `[matrix]` is file-wide with no per-case opt-out
# (U1), so the axis values are exactly what the source exercises.
#
# RULE 5 / RULE 6. The 8 harness invocations run 4 independently-written
# programs, so they become 4 descriptively-named sibling [[case]] entries
# (x 2 ext cells), never one folded case. Per rule 6 the matrix fold is stated
# here: each bundle [[case]] corresponds to 2 source #[test] fns (one per ext
# cell) and each harness [[case]] to 2 iterations of the single looping fn; the
# assertion mapping stays 1:1 per trial.
#
# U2 ([source] is file-wide): safe here. All three fixtures are written
# unconditionally into a fresh temp dir, none is behind an `if`, and no case's
# point is a file's presence or absence -- every command names its entry
# explicitly on argv. The `${ext}` suffix keeps each matrix cell's three files
# distinct, so no [source] key needs U5 disambiguation.
#
# RULE 13 (transitive helper docs): every fn in both call chains was checked for
# a `///` doc comment and none of this file's own helpers carries one. The bundle
# chain reaches `kali_runtime_contract::browser_bundle_harness_script` and
# `::browser_harness_command_parts_for`, which do carry one-line `///` docs, but
# the migrated form never calls them -- the `browser_bundle_harness` step kind
# means the case RUNNER does (design spec 5.3), so those docs describe shared
# runner infrastructure, not what this case claims. Consistent with every case
# file shipped before batch 4.
#
# ASSERTION SHAPE, mirrored and nothing more. Bundle: `exit = "success"`; the
# json sibling adds schemaVersion/command/success/exitCode and payload
# artifactKind/bundleFormat -- the source asserts NO `errors` array on this
# envelope (`envelope["payload"].as_object().expect("payload object")` :65-74), so no `errors = []` is written; then the emitted
# `app/app.meta.json` apiSurface/artifactKind; then the bundle-harness
# `stdout_contains = ["0\n"]` (:117, a single plain `.contains`) and the
# harness process's own `exit = "success"` (:110). Harness: argv DOES carry
# `--max-threads 0 --max-spawned-processes 0` (:141-144); env
# KALI_BROWSER_BUNDLE_HARNESS_COMMAND=node; text mode asserts
# `stdout.contains("0\n")` (:181); json mode asserts
# schemaVersion/command/success/payload(hostContract, runtimeBackend),
# `exitCode` + `payload.exitCode` for run or `payload.total/passed/failed` for
# test, an exact `json.stdout` pin and `json.stderr = ""` (:178). No `errors`
# claim on the harness envelope either.
#
# U9 -- the exact `json.stdout` pin. The source's claim is
# `json["stdout"].as_str().contains("0\n")` (:171-177); a json leaf has no
# substring form, so ruling 3 resolves it to an exact pin. Captured from the
# real binary for all 4 (ext x command) cells: every one returns `0\n0\n`
# (expm1(0) = 0 and log1p(0) = 0), so the single pin holds in both matrix cells
# and it contains the source's literal.

[matrix]
ext = ["js", "ts"]

[source]
"app.${ext}" = """// kali-tree-shake: fullyBracketedGlobalThisMathExpm1Log1pIdentities
function fullyBracketedGlobalThisMathExpm1Log1pIdentities() {
  const zero = 0;
  console.log(globalThis["Math"]["expm1"](zero));
  console.log(globalThis["Math"]["log1p"](zero));
  return [globalThis["Math"]["expm1"](zero), globalThis["Math"]["log1p"](zero)];
}
"""
"main.${ext}" = """const zero = 0; console.log(globalThis["Math"]["expm1"](zero)); console.log(globalThis["Math"]["log1p"](zero));
"""
"smoke.test.${ext}" = """Kali.test('fully bracketed expm1/log1p identities', () => {
  const zero = 0;
  console.log(globalThis["Math"]["expm1"](zero));
  console.log(globalThis["Math"]["log1p"](zero));
});
"""

[[case]]
name = "build_emits_fully_bracketed_global_this_math_expm1_log1p_identity_literals"
rationale = """Migrated from browser_math_expm1_log1p_fully_bracketed_root.rs. `assert_browser_bundle_fully_bracketed_global_this_math_expm1_log1p` builds a browser bundle (`kali build --bundle --api browser`), asserts the emitted `app/app.meta.json` metadata, then runs the bundle glue under the browser-bundle-harness contract. The bundled program reaches Math through a fully bracketed root -- `globalThis["Math"]["expm1"]` and `globalThis["Math"]["log1p"]` -- and prints expm1(0) = 0 then log1p(0) = 0. The source makes a single plain `.contains("0\\n")` claim here, mirrored as `stdout_contains` and NOT strengthened to an exact pin (controller ruling 3)."""

[[case.step]]
args = ["build", "--bundle", "--api", "browser", "app.${ext}"]
exit = "success"

[[case.step]]
kind = "file_json"
path = "app/app.meta.json"
fields = { apiSurface = "browser", artifactKind = "bundle" }

[[case.step]]
kind = "browser_bundle_harness"
entry = "app"
body = """const mod = await import(bundleJs.href);
await mod.fullyBracketedGlobalThisMathExpm1Log1pIdentities();
"""
exit = "success"
stdout_contains = ["0\n"]

[[case]]
name = "json_build_emits_fully_bracketed_global_this_math_expm1_log1p_identity_literals"
rationale = """Migrated from browser_math_expm1_log1p_fully_bracketed_root.rs. `assert_browser_bundle_fully_bracketed_global_this_math_expm1_log1p` builds a browser bundle (`kali build --bundle --api browser --output json`), asserts the emitted `app/app.meta.json` metadata, then runs the bundle glue under the browser-bundle-harness contract. The bundled program reaches Math through a fully bracketed root -- `globalThis["Math"]["expm1"]` and `globalThis["Math"]["log1p"]` -- and prints expm1(0) = 0 then log1p(0) = 0. The source makes a single plain `.contains("0\\n")` claim here, mirrored as `stdout_contains` and NOT strengthened to an exact pin (controller ruling 3). This sibling additionally asserts the JSON build envelope: schemaVersion/command/success/exitCode and payload artifactKind/bundleFormat -- the source makes no `errors` claim on this envelope, so none is written."""

[[case.step]]
args = ["build", "--bundle", "--api", "browser", "--output", "json", "app.${ext}"]
exit = "success"
json = { schemaVersion = 1, command = "build", success = true, exitCode = 0, payload = { artifactKind = "bundle", bundleFormat = "esm" } }

[[case.step]]
kind = "file_json"
path = "app/app.meta.json"
fields = { apiSurface = "browser", artifactKind = "bundle" }

[[case.step]]
kind = "browser_bundle_harness"
entry = "app"
body = """const mod = await import(bundleJs.href);
await mod.fullyBracketedGlobalThisMathExpm1Log1pIdentities();
"""
exit = "success"
stdout_contains = ["0\n"]

[[case]]
name = "run_supports_fully_bracketed_global_this_math_expm1_log1p_identities_when_browser_harness_is_configured"
rationale = """Migrated from browser_math_expm1_log1p_fully_bracketed_root.rs. `assert_browser_harness_fully_bracketed_global_this_math_expm1_log1p` runs `kali run --api browser --max-threads 0 --max-spawned-processes 0` with the browser harness backed by `node`. This case is 2 of the 8 invocations the single #[test] fn `run_and_test_supports_fully_bracketed_global_this_math_expm1_log1p_identities_when_browser_harness_is_configured_in_js_and_ts_input` makes by looping over four (command, source_name, source) tuples and then over `for output_json in [false, true]`; per the split-don't-fold rule each independent program becomes its own named sibling [[case]], and the two extensions the loop covers are the file's `ext` matrix axis -- js and ts only, since this file has no jsx/tsx tests in either group. Text mode: a clean exit and `stdout.contains("0\\n")`, mirrored as `stdout_contains`."""
args = ["run", "--api", "browser", "--max-threads", "0", "--max-spawned-processes", "0", "main.${ext}"]
env = { KALI_BROWSER_BUNDLE_HARNESS_COMMAND = "node" }
exit = "success"
stdout_contains = ["0\n"]

[[case]]
name = "test_supports_fully_bracketed_global_this_math_expm1_log1p_identities_when_browser_harness_is_configured"
rationale = """Migrated from browser_math_expm1_log1p_fully_bracketed_root.rs. `assert_browser_harness_fully_bracketed_global_this_math_expm1_log1p` runs `kali test --api browser --max-threads 0 --max-spawned-processes 0` with the browser harness backed by `node`. This case is 2 of the 8 invocations the single #[test] fn `run_and_test_supports_fully_bracketed_global_this_math_expm1_log1p_identities_when_browser_harness_is_configured_in_js_and_ts_input` makes by looping over four (command, source_name, source) tuples and then over `for output_json in [false, true]`; per the split-don't-fold rule each independent program becomes its own named sibling [[case]], and the two extensions the loop covers are the file's `ext` matrix axis -- js and ts only, since this file has no jsx/tsx tests in either group. Text mode: a clean exit and `stdout.contains("0\\n")`, mirrored as `stdout_contains`."""
args = ["test", "--api", "browser", "--max-threads", "0", "--max-spawned-processes", "0", "smoke.test.${ext}"]
env = { KALI_BROWSER_BUNDLE_HARNESS_COMMAND = "node" }
exit = "success"
stdout_contains = ["0\n"]

[[case]]
name = "json_run_supports_fully_bracketed_global_this_math_expm1_log1p_identities_when_browser_harness_is_configured"
rationale = """Migrated from browser_math_expm1_log1p_fully_bracketed_root.rs. `assert_browser_harness_fully_bracketed_global_this_math_expm1_log1p` runs `kali run --api browser --max-threads 0 --max-spawned-processes 0` with the browser harness backed by `node`. This case is 2 of the 8 invocations the single #[test] fn `run_and_test_supports_fully_bracketed_global_this_math_expm1_log1p_identities_when_browser_harness_is_configured_in_js_and_ts_input` makes by looping over four (command, source_name, source) tuples and then over `for output_json in [false, true]`; per the split-don't-fold rule each independent program becomes its own named sibling [[case]], and the two extensions the loop covers are the file's `ext` matrix axis -- js and ts only, since this file has no jsx/tsx tests in either group. JSON mode (`--output json`): the envelope's schemaVersion/command/success and payload hostContract/runtimeBackend, plus `exitCode` and `payload.exitCode` (the source's `run` branch), `stderr` exactly empty, and an exact `json.stdout` pin. The source claims `json["stdout"].as_str().contains("0\\n")`; a json leaf has no substring form in this format, so ruling 3 resolves it to an exact pin, live-captured from the real `kali` binary and checked to contain the source's literal before being written. The source asserts no `errors` array on this envelope, so none is written."""
args = ["--output", "json", "run", "--api", "browser", "--max-threads", "0", "--max-spawned-processes", "0", "main.${ext}"]
env = { KALI_BROWSER_BUNDLE_HARNESS_COMMAND = "node" }
exit = "success"
json = { schemaVersion = 1, command = "run", success = true, exitCode = 0, payload = { hostContract = "browser-requested", runtimeBackend = "browser-harness", exitCode = 0 }, stdout = "0\n0\n", stderr = "" }

[[case]]
