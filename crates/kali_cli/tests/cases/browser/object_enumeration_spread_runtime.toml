[[case]]
name = "json_test_supports_object_enumeration_spread_in_browser_api_surface_with_harness"
rationale = """Migrated from browser_object_enumeration_spread_runtime.rs, the four `json_test_supports_object_enumeration_spread_in_browser_api_surface_with_harness_*_input` fns (one per extension). `assert_browser_requested_object_enumeration_spread` writes the shared Object-enumeration-spread program `object_enumeration_spread_source()).expect("write source")` (:161) and asks `kali` to test it against the browser API surface with the browser harness backed by node. The program spreads Object.keys / Object.values / Object.entries and Reflect.ownKeys over an Object.fromEntries result through every bracketed, single-quoted and frozen root spelling, then prints its keys and its awaited entries. kali does not support that: the source's ONLY assertion is that the process fails `assert!(!output.status.success()` (:183), so this step carries `exit = "failure"` and nothing else. Adding a diagnostic code or a stdout claim the source never made would be a rule-2 invention, and `exit = "failure"` is exactly as strong as the assertion it replaces. This sibling issues the `--output json` argv; the source asserts nothing at all about the envelope, so neither does this case. RULE 12 -- the Rust comment prose of browser_object_enumeration_spread_runtime.rs, carried verbatim: "Honest re-pin (PR #16 rev2): kali fails closed/loud here; see docs/superpowers/followups/pr16-honest-repin-inventory.md.""""
args = ["--output", "json", "test", "--api", "browser", "--max-threads", "0", "--max-spawned-processes", "0", "smoke.test.${ext}"]
env = { KALI_BROWSER_BUNDLE_HARNESS_COMMAND = "node" }
exit = "failure"
