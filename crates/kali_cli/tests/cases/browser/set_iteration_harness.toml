rationale = """Migrated from browser_set_iteration_harness.rs. That source `#[test]` fn is a single unlooped helper call, so it maps 1:1 to this one `[[case]]` and keeps the fn's name verbatim (rule 6). `assert_browser_harness_set_iteration(` (:320) writes the Set-constructor iteration probe to `main.js` in a fresh temp dir and runs the real `kali run --api browser --max-threads 0 --max-spawned-processes 0` with that dir as cwd and the browser harness command variable set to `node`. ASSERTION SHAPE: the source's ONLY process assertion in this file is `assert!(!output.status.success(), "must fail closed: {output:?}")` (:`assert!(!output.status.success(), "must fail closed` (:354)) -- no exit code, no stdout/stderr needle, no envelope field, in either output mode -- so this case carries exactly `exit = "failure"` and nothing else. Adding a diagnostic code or a stream claim would invent a claim the source never made (rule 2), even though the real binary does emit one. NO [matrix] in this file: the looped fn uses one `main.<ext>` filename for BOTH commands while the four individual fns use `main.js`/`smoke.test.js`, so a file-wide `ext` axis could not express the filename pattern without inventing an untested combination (see the file header's arithmetic). The `[source]` key is `main.js`, the source's own filename -- this one does not collide, so it is not renamed. RULE 12 -- the Rust comment prose of browser_set_iteration_harness.rs that this case's call path reaches, carried verbatim: "Honest re-pin (PR #16 rev2, family `mapset`): kali fails closed/loud here (2 of this helper's 5 worklist callers were tagged class B by the automated classifier, but direct verification shows every one of them panics on this exact assertion too — a loud E5506 rejection (try/catch is unavailable), not a silent wrong value; re-pinned as class A for all 5 callers — see docs/superpowers/followups/pr16-honest-repin-inventory.md).""""
args = ["run", "--api", "browser", "--max-threads", "0", "--max-spawned-processes", "0", "main.js"]
env = { KALI_BROWSER_BUNDLE_HARNESS_COMMAND = "node" }
exit = "failure"

