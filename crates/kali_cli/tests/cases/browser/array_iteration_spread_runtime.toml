INVOCATION ARITHMETIC (rule 7): 16 direct #[test] fns each call the helper once (16 invocations) + 4 matrix-helper fns each expand their inner command/json_output loop into exactly 4 invocations (16 more) = 32 invocations total, verified by reading every fn body and counting call sites. This file maps 1:1 to 32 individually named [[case]] entries -- one per real invocation, no folding.

[matrix] DECLINED (rule 7): the filename pattern for the "test" command is not uniform across the ext axis. The 16 direct fns use "smoke.test.js"/"smoke.test.ts" for the "test" command (a different bare name than "run" uses), but `assert_browser_requested_spread_matrix` is called with a SINGLE fixed filename ("main.jsx"/"main.tsx") used for BOTH the "run" and "test" legs of its inner loop -- so the jsx/tsx "test" cases actually invoke `kali test main.jsx`/`kali test main.tsx`, never `smoke.test.jsx`/`smoke.test.tsx`. A file-level [matrix] over `ext` fans every [[case]] uniformly (expand.rs's `expand()` has no per-case axis opt-out), so a single `ext` axis could not express this without inventing an untested combination for one sub-family or the other -- declined for the whole file per the same "heterogeneous, no matrix" reasoning as the pilot's file 1 (math_atan2_bracketed_root) and file 4 (template_literal_dynamic_import_harness).

ASSERTION SHAPE, EVERY CASE: `exit = "success"` maps both `assert!(output.status.success())` and `assert_eq!(output.status.code(), Some(0))`. Non-json mode: source only checks `stdout.contains('1')` and `stdout.contains('2')`; this migration STRENGTHENS both to the real, live-captured exact `stdout` value (never hand-computed -- captured from the real built `kali` binary via tools/task-18-browser-pilot/kali_run.py), per the standing never-weaken/may-strengthen rule. json mode: `json.schemaVersion == 1`, `json.command == "run"`/`"test"`, `json.success == true`, `json.payload.hostContract == "browser-requested"`, `json.payload.runtimeBackend == "browser-harness"`, `json.errors == []` always; and, only when `expect_test_runner` is false (i.e. `command == "run"` -- `expect_test_runner` is literally `command == "test"`, so the json-content check is skipped whenever `command == "test"`, matching source exactly, no `stdout` json-field claim on any "test"-command case), an exact `json.stdout` field (again strengthened from `.contains('1')`/`.contains('2')` on the JSON-embedded string, live-verified).

STREAM-MAPPING: no absence claims and no OR-across-streams/codes anywhere in this file (the only claims are presence-shaped `.contains()` calls on a single stream, resolved above as verified-live exact-value strengthenings), so rules 2/11's stream-mirroring concern does not apply here.

[source] FILENAME DISAMBIGUATION (rule 8): the bare names "main.js"/"main.ts"/"main.jsx"/"main.tsx" and "smoke.test.js"/"smoke.test.ts" are each reused across BOTH the for-of and for-await variant in source -- safe there because every #[test] fn gets its own private tempdir, but [source] is one flat file-wide table here, so each is disambiguated with a `_for_of`/`_for_await` tag. No assertion in this file ever pins the literal filename text, and this file never runs `kali build --bundle` (only direct `run`/`test` invocations), so the stem-derived output-directory concern that applies to the `browser_bundle_harness` step family does not apply here either."""
args = ["test", "--api", "browser", "--max-threads", "0", "--max-spawned-processes", "0", "main_for_of.tsx"]
env = { "KALI_BROWSER_BUNDLE_HARNESS_COMMAND" = "node" }
exit = "success"
stdout = "1\n2\nok 1\n"

