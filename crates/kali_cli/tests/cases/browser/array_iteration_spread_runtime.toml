# Migrated from tests/browser_array_iteration_spread_runtime.rs.
#
# All 20 #[test] fns funnel through `assert_browser_requested_spread(command,
# filename, source, json_output, expect_test_runner)`, either called directly
# (16 fns) or via `assert_browser_requested_spread_matrix(filename, source)`,
# which loops `for command in ["run", "test"] { for json_output in [false,
# true] { ... } }` around it (4 more fns, jsx/tsx only). No Rust comments, no
# `format!`, no `kali_common`/other library-crate import, and no genuine
# `${...}` JS template literal anywhere in this file (grep-confirmed) -- none
# of rules 8/9/10's escalations apply here.
#
# INVOCATION ARITHMETIC (rule 7): 16 direct #[test] fns each call the helper
# once (16 invocations) + 4 matrix-helper fns (`..._jsx_input`/`..._tsx_input`
# for both for-of and for-await) each expand their inner
# `for command in ["run","test"] { for json_output in [false,true] { ... } }`
# loop into exactly 4 invocations (16 more) = 32 invocations total, verified
# by reading every fn body and counting call sites, not by fn-name
# pattern-matching. This file maps 1:1 to 32 individually named [[case]]
# entries below -- one per real invocation, no folding.
#
# [matrix] DECLINED (rule 7): `ext` looks uniform at a glance (all four of
# js/ts/jsx/tsx appear), but the FILENAME PATTERN for the "test" command is
# not uniform across it. The 16 direct fns use "smoke.test.js"/"smoke.test.ts"
# for the "test" command (a different bare name than "run" uses). But
# `assert_browser_requested_spread_matrix` is called with a SINGLE fixed
# filename ("main.jsx"/"main.tsx") used for BOTH the "run" and "test" legs of
# its inner loop -- so the jsx/tsx "test" cases actually invoke
# `kali test main.jsx`/`kali test main.tsx`, never `smoke.test.jsx`/
# `smoke.test.tsx`. A file-level [matrix] over `ext` fans every [[case]]
# uniformly (crates/kali_case_runner/src/expand.rs's `expand()` has no
# per-case axis opt-out), so a single `ext` axis could not express this
# without either inventing an untested `kali test main.js`/`main.ts`
# combination (if the template followed the jsx/tsx pattern) or an untested
# `kali test smoke.test.jsx`/`smoke.test.tsx` combination (if it followed the
# js/ts pattern) -- a rule-2/rule-7 violation either way. Declined for the
# whole file per the same "heterogeneous, no matrix" reasoning as the pilot's
# file 1 (`math_atan2_bracketed_root`) and file 4
# (`template_literal_dynamic_import_harness`).
#
# ASSERTION SHAPE, EVERY CASE: `exit = "success"` maps both
# `assert!(output.status.success())` and `assert_eq!(output.status.code(),
# Some(0))` (the second is redundant with the first on a normal process exit,
# both map to the same `Exit::SUCCESS`). Non-json mode: source only checks
# `stdout.contains('1')` and `stdout.contains('2')`; this migration
# STRENGTHENS both to the real, live-captured exact `stdout` value (never
# hand-computed -- captured from the real built `kali` binary via
# `tools/task-18-browser-pilot/kali_run.py`), per the standing
# never-weaken/may-strengthen rule. json mode: `json.schemaVersion == 1`,
# `json.command == "run"`/`"test"`, `json.success == true`,
# `json.payload.hostContract == "browser-requested"`,
# `json.payload.runtimeBackend == "browser-harness"`, `json.errors == []`
# (source: `json["errors"].as_array().expect(...).is_empty()`) always; and,
# only when `expect_test_runner` is false (i.e. `command == "run"` --
# `expect_test_runner` is literally `command == "test"`, so the json-content
# check is skipped whenever `command == "test"`, matching source exactly, no
# `stdout` json-field claim on any "test"-command case), an exact `json.stdout`
# field (again strengthened from `.contains('1')`/`.contains('2')` on the
# JSON-embedded string, live-verified).
#
# STREAM-MAPPING: no absence claims and no OR-across-streams/codes anywhere in
# this file (the only claims are presence-shaped `.contains()` calls on a
# single stream, resolved above as verified-live exact-value strengthenings),
# so rules 2/11's stream-mirroring concern does not apply here.
#
# [source] FILENAME DISAMBIGUATION (rule 8): the bare names `main.js`/
# `main.ts`/`main.jsx`/`main.tsx` and `smoke.test.js`/`smoke.test.ts` are each
# reused across BOTH the for-of and for-await variant in source -- safe there
# because every #[test] fn gets its own private tempdir, but [source] is one
# flat file-wide table here, so each is disambiguated with a `_for_of`/
# `_for_await` tag. No assertion in this file ever pins the literal filename
# text (an `import()`/`require()` specifier read back inside a fixture body,
# the case rule 8 warns about), and this file never runs `kali build
# --bundle` (only direct `run`/`test` invocations), so the stem-derived
# output-directory concern that applies to the `browser_bundle_harness` step
# family does not apply here either.


