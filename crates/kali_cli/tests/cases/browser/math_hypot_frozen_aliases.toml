[[case]]
name = "build_emits_global_this_math_hypot_frozen_alias_slice_in_js_input"
rationale = """Migrated from browser_math_hypot_frozen_aliases.rs. `assert_browser_bundle_global_this_math_hypot_frozen_aliases` builds a browser bundle (`kali build --bundle --api browser`), asserts the emitted `app/app.meta.json` metadata, then runs the bundle glue under the browser-bundle-harness contract. The bundled program builds fourteen `Object.freeze`d aliases of `Math.hypot` across every dotted/bracketed/single-quoted/parenthesised spelling of the root, calls each with (3, 4) alongside the unfrozen `globalThis.Math.hypot`, and each prints `5`. The source asserts only `stdout.contains("5\\n")` (:188), carried as `stdout_contains` at that strength -- not strengthened to the fifteen-line output that actually appears, which the source never claims (controller ruling 3)."""

[[case.step]]
args = ["build", "--bundle", "--api", "browser", "app.js"]
exit = "success"

[[case.step]]
kind = "file_json"
path = "app/app.meta.json"
fields = { apiSurface = "browser", artifactKind = "bundle" }

[[case.step]]
kind = "browser_bundle_harness"
entry = "app"
body = """const mod = await import(bundleJs.href);
await mod.globalThisMathHypotFrozenAliasSlice();
"""
exit = "success"
stdout_contains = ["5\n"]

