[[case]]
name = "build_emits_math_floor_trunc_ceil_alias_chain"
rationale = """Migrated from browser_math_floor_trunc_ceil_bundle.rs, the four `build_emits_math_floor_trunc_ceil_alias_chain_in_*_input` fns (one per extension). `assert_browser_bundle_math_floor_trunc_ceil_alias` builds a browser bundle (`kali build --bundle --api browser`), asserts the emitted app/app.meta.json metadata (apiSurface/artifactKind), then runs the bundle glue under the browser-bundle-harness contract. The bundled program computes Math.floor(1.6), Math.trunc(1.6) and Math.ceil(1.6) and re-invokes every frozen callable alias in the canonical floor/trunc/ceil inventory, so 1 and 2 are both printed many times. The harness stdout claims are two plain `.contains` calls (:121-122). The source spells this as a plain `.contains(...)` against raw stdout, so it is carried as stdout_contains and NOT strengthened to an exact stdout pin -- controller ruling 3, mirror the source: a plain `.contains` against a field that HAS a substring form keeps the substring form even though the exact output was observed. RULE 13 -- doc comments on the library helpers that produce this fixture, carried verbatim: "Canonical `console.log(...)` invocation lines for the supported `Math.floor` / `Math.trunc` / `Math.ceil` frozen callable aliases.", "Canonical `return [...]` entry text for the supported `Math.floor` / `Math.trunc` / `Math.ceil` frozen callable aliases." and "Canonical frozen callable aliases for the supported `Math.floor` / `Math.trunc` / `Math.ceil` helper slice.""""

[[case.step]]
args = ["build", "--bundle", "--api", "browser", "app.${ext}"]
exit = "success"

[[case.step]]
kind = "file_json"
path = "app/app.meta.json"
fields = { apiSurface = "browser", artifactKind = "bundle" }

[[case.step]]
kind = "browser_bundle_harness"
entry = "app"
body = """const mod = await import(bundleJs.href);
await mod.mathFloorTruncCeilAliasChain();
"""
exit = "success"
stdout_contains = ["1\n", "2\n"]

