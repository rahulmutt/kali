[matrix]
ext = ["js", "ts"]

[source]
"app.${ext}" = """// kali-tree-shake: browserMathImulClz32Aliases
function browserMathImulClz32Aliases() {
  const imulLeft = 2147483647;
  const imulRight = 2;
  const clz32Value = 1;
  const frozenImul = Object.freeze(globalThis.Math.imul);
  const frozenBracketedImul = Object.freeze(globalThis["Math"]["imul"]);
  const frozenClz32 = Object.freeze(globalThis["Math"]["clz32"]);
  const frozenBracketedClz32 = Object.freeze(globalThis.Math["clz32"]);
  console.log(globalThis.Math.imul(imulLeft, imulRight));
  console.log(globalThis.Math["imul"](imulLeft, imulRight));
  console.log(globalThis["Math"].imul(imulLeft, imulRight));
  console.log(globalThis["Math"]["imul"](imulLeft, imulRight));
  console.log(Math["imul"](imulLeft, imulRight));
  console.log(frozenImul(imulLeft, imulRight));
  console.log(frozenBracketedImul(imulLeft, imulRight));
  console.log(Object.freeze(Math.imul)(imulLeft, imulRight));
  console.log(Object.freeze(Math["imul"])(imulLeft, imulRight));
  console.log(globalThis.Math.clz32(clz32Value));
  console.log(globalThis.Math["clz32"](clz32Value));
  console.log(globalThis["Math"].clz32(clz32Value));
  console.log(globalThis["Math"]["clz32"](clz32Value));
  console.log(Math["clz32"](clz32Value));
  console.log(frozenClz32(clz32Value));
  console.log(frozenBracketedClz32(clz32Value));
  console.log(Object.freeze(Math.clz32)(clz32Value));
  console.log(Object.freeze(Math["clz32"])(clz32Value));
  return [
    globalThis.Math.imul(imulLeft, imulRight),
    globalThis.Math["imul"](imulLeft, imulRight),
    globalThis["Math"].imul(imulLeft, imulRight),
    globalThis["Math"]["imul"](imulLeft, imulRight),
    Math["imul"](imulLeft, imulRight),
    frozenImul(imulLeft, imulRight),
    frozenBracketedImul(imulLeft, imulRight),
    Object.freeze(Math.imul)(imulLeft, imulRight),
    Object.freeze(Math["imul"])(imulLeft, imulRight),
    globalThis.Math.clz32(clz32Value),
    globalThis.Math["clz32"](clz32Value),
    globalThis["Math"].clz32(clz32Value),
    globalThis["Math"]["clz32"](clz32Value),
    Math["clz32"](clz32Value),
    frozenClz32(clz32Value),
    frozenBracketedClz32(clz32Value),
    Object.freeze(Math.clz32)(clz32Value),
    Object.freeze(Math["clz32"])(clz32Value),
  ];
}
"""

[[case]]
name = "build_emits_math_imul_clz32_aliases"
rationale = """Migrated from browser_math_imul_clz32_aliases.rs. `assert_browser_bundle_math_imul_clz32_aliases` builds a browser bundle (`kali build --bundle --api browser`), asserts the emitted `app/app.meta.json` metadata, then runs the bundle glue under the browser-bundle-harness contract. The bundled program reaches Math.imul and Math.clz32 through eighteen alias spellings -- dotted, bracketed, mixed, bare `Math[...]`, and `Object.freeze`d captures of each -- printing -2 for imul(2147483647, 2) and 31 for clz32(1). The source's two stdout claims are plain `.contains` (:142-143), mirrored as `stdout_contains` and deliberately neither turned into a count (the source makes no `.matches().count()` claim) nor strengthened to an exact `stdout` pin (ruling 3)."""

[[case.step]]
args = ["build", "--bundle", "--api", "browser", "app.${ext}"]
exit = "success"

[[case.step]]
kind = "file_json"
path = "app/app.meta.json"
fields = { apiSurface = "browser", artifactKind = "bundle" }

[[case.step]]
kind = "browser_bundle_harness"
entry = "app"
body = """const mod = await import(bundleJs.href);
await mod.browserMathImulClz32Aliases();
"""
exit = "success"
stdout_contains = ["-2\n", "31\n"]

[[case]]
name = "json_build_emits_math_imul_clz32_aliases"
rationale = """Migrated from browser_math_imul_clz32_aliases.rs. `assert_browser_bundle_math_imul_clz32_aliases` builds a browser bundle (`kali build --bundle --api browser`), asserts the emitted `app/app.meta.json` metadata, then runs the bundle glue under the browser-bundle-harness contract. The bundled program reaches Math.imul and Math.clz32 through eighteen alias spellings -- dotted, bracketed, mixed, bare `Math[...]`, and `Object.freeze`d captures of each -- printing -2 for imul(2147483647, 2) and 31 for clz32(1). The source's two stdout claims are plain `.contains` (:142-143), mirrored as `stdout_contains` and deliberately neither turned into a count (the source makes no `.matches().count()` claim) nor strengthened to an exact `stdout` pin (ruling 3). This sibling asserts the JSON build envelope (schemaVersion/command/success/exitCode and payload artifactKind/bundleFormat) instead of plain text; the source makes no `errors` claim on that envelope, so none is written. Output shape is not a matrix axis because it changes the assertion shape."""

[[case.step]]
args = ["build", "--bundle", "--api", "browser", "--output", "json", "app.${ext}"]
exit = "success"
json = { schemaVersion = 1, command = "build", success = true, exitCode = 0, payload = { artifactKind = "bundle", bundleFormat = "esm" } }

[[case.step]]
kind = "file_json"
path = "app/app.meta.json"
fields = { apiSurface = "browser", artifactKind = "bundle" }

[[case.step]]
kind = "browser_bundle_harness"
entry = "app"
body = """const mod = await import(bundleJs.href);
await mod.browserMathImulClz32Aliases();
"""
exit = "success"
stdout_contains = ["-2\n", "31\n"]
