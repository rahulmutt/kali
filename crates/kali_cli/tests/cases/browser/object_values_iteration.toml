# trial sees only that trial's `rationale`.
# The 2 blocks are 1 distinct text(s) repeated; the
# rationale below carries each distinct text once. `comment_coverage.py` checks each
# comment LINE's text for membership in each rationale, so one copy discharges every
# repetition, and N identical copies would be noise rather than coverage.
#
# RULE 7 / U1 -- MATRIX ARITHMETIC, and it closes exactly.
# 6 `#[test]` fns, 16 real helper invocations with every loop
# expanded:
#   * `assert_browser_bundle_global_object_values_iteration` -- 8 invocation(s) = ext(js/ts/jsx/tsx) x json_output(false/true), reached through four `#[test]` fns -- a js one and a ts/jsx/tsx loop, in each output mode
#   * `assert_browser_bundle_direct_object_values_iteration` -- 8 invocation(s) = the same eight cells, reached through two `#[test]` fns that each loop all four extensions
