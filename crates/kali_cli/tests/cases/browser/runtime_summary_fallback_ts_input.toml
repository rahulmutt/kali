[[case]]
name = "run_falls_back_to_stdout_when_browser_summary_file_is_unparseable_when_browser_harness_is_configured_in_ts_input"
rationale = """Migrated from browser_runtime_summary_fallback_ts_input.rs, `#[path]` submodule `run.rs` -- one `[[case]]` per source `#[test]` fn, no `[matrix]`, so this case is exactly one fn and one real invocation (rule 6). The fn writes the shared browser test program to `unparseable-summary.ts` in a fresh temp dir (`write_ts_source(` (:10)), points `KALI_BROWSER_BUNDLE_HARNESS_COMMAND` at a `node -e` program that fabricates the browser harness's summary file and stdout, and runs `kali run --api browser <entry>`. The fn asserts directly on the process output; there is no assertion helper in its call chain, so no helper claims and no helper doc are carried here. The source spells this as a plain `.contains(...)` against raw stdout, so it is carried as stdout_contains and NOT strengthened to an exact pin -- controller ruling 3, mirror the source: a plain `.contains` against a field that HAS a substring form keeps the substring form even though the exact output was observed. `stderr = ""` is an exact pin because the source spells an exact equality (`assert_eq!(String::from_utf8_lossy(&output.stderr), "")`), which rule 1 requires be carried as an exact pin rather than a substring claim. U2 -- this file merges both `#[path]` submodules. The fold was measured against the real binary (see the file header): with every fixture of both halves present the output of this exact command is unchanged, so no claim here is supplied by a sibling fixture."""
args = ["run", "--api", "browser", "unparseable-summary.ts"]
env = { KALI_BROWSER_BUNDLE_HARNESS_COMMAND = "node -e 'const fs = require(\"fs\"); fs.writeFileSync(process.env.KALI_BROWSER_HARNESS_SUMMARY_FILE, \"not-json\"); process.stdout.write(\"browser unparseable\\n\");'" }
exit = "success"
stdout_contains = ["browser unparseable"]
stderr = ""

