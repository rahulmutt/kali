-emptiness claim and is strictly stronger. The message claim is `message.contains("literal array")` (:152) against `errors[0]["message"]`. That message is a JSON string leaf, and the case format has NO substring form for one (there is no json_contains key), so controller ruling 3 makes it an exact `json.errors.0.message` pin -- and, per U9, only after the value was captured from the real built `kali` for this case rather than hand-computed. TWO-FILE SPLIT (U2). This file is the EXPLICIT-`--api browser` half: no `kali.json` appears in its `[source]` table at all, which is exactly what keeps this case able to FAIL if `--api browser` regressed. The 12 manifest-inheriting `#[test]` fns are in non_literal_iterator_sources_inherited_manifest.toml. They cannot be `[[case]]` entries in this file: `expand.rs`'s `expand()` clones the whole file-level `[source]` map into EVERY trial regardless of which case references which key, so a shared `kali.json` would supply `apiSurface` here too and this case would pass whether or not the flag did anything -- with no literal dropped, so `audit-case-migration.py` cannot see it, and with the trial still green, so `cargo test` cannot either."""
args = ["--output", "json", "check", "--api", "browser", "for_of.js"]
exit = 1
json.schemaVersion = 1
json.command = "check"
json.success = false
json.exitCode = 1
json.errors.0.code = "E5506"
json.errors.0.message = "for-of array iteration lowering is unavailable unless the iterable is a literal array or supported string iterable with literal elements and the loop target is a variable declaration or simple identifier binding; use a supported loop form or the later compatibility path"

