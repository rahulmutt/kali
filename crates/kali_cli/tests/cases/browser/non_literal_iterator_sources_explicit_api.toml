rationale = """Migrated from browser_non_literal_iterator_sources.rs, the `check_rejects_map_constructor_iteration_from_call_expression_source_in_browser_input` `#[test]` fn in its `check.rs` `#[path]` submodule (`check_rejects_map_constructor_iteration_from_call_expression_source_in_browser_input(` (check.rs:307)). That fn makes 8 real invocations with its loops expanded; this `[[case]]` is exactly one of them (`map_constructor.jsx`, --output json), split into named siblings per rule 5 rather than folded. The call goes through `assert_map_constructor_iteration_from_call_expression_source_rejects(` (:460), a carrier-level helper that is itself the `json_output(2) x filename(4)` loop and forwards to `assert_browser_iterator_source_rejects(` (:108). `assert_browser_iterator_source_rejects(` (:108) writes the program to a fresh temp dir as `dir.path().join(filename)` (:116) and runs the real `kali` with that dir as cwd. The program under test is `map_constructor_call_expression_source()` (:95), written to `map_constructor.jsx`. The source writes it to `main.jsx`; the `[source]` key is U5-renamed because `[source]` is one flat file-wide namespace and this source writes 8 different programs to just 2 filename stem(s) (`main.<ext>` and `smoke.test.<ext>`). The rename is argv-only -- no fixture body in this file names any of these files by string -- so it does not rewrite the program under test (rule 9). The source asserts the command FAILED and pins the exact code: `assert!(!output.status.success()` (:135) and `assert_eq!(output.status.code(), Some(1))` (:136). `assert_eq!` is already exact, so rule 1's non-negotiable direction gives `exit = 1` rather than the weaker `exit = "failure"` status class. In `--output json` mode the source parses stdout as the envelope and asserts `assert_eq!(json["schemaVersion"], 1)` (:140), `assert_eq!(json["command"], if bundle { "build" } else { "check" })` (:141), `assert_eq!(json["success"], false)` (:142) and `assert_eq!(json["exitCode"], 1)` (:143); all four are exact source assertions and become exact `json.*` pins. It then asserts `!errors.is_empty()` (:146) and `assert_eq!(errors[0]["code"], "E5506")` (:150). The non-emptiness claim needs no key of its own and is NOT dropped: design spec 5.4 makes an out-of-range numeric segment a HARD failure, never a silent skip, so `json.errors.0.code` cannot pass against an empty array. Pinning it implies the non-emptiness claim and is strictly stronger. The message claim is `message.contains("literal array")` (:152) against `errors[0]["message"]`. That message is a JSON string leaf, and the case format has NO substring form for one (there is no json_contains key), so controller ruling 3 makes it an exact `json.errors.0.message` pin -- and, per U9, only after the value was captured from the real built `kali` for this case rather than hand-computed. TWO-FILE SPLIT (U2). This file is the EXPLICIT-`--api browser` half: no `kali.json` appears in its `[source]` table at all, which is exactly what keeps this case able to FAIL if `--api browser` regressed. The 12 manifest-inheriting `#[test]` fns are in non_literal_iterator_sources_inherited_manifest.toml. They cannot be `[[case]]` entries in this file: `expand.rs`'s `expand()` clones the whole file-level `[source]` map into EVERY trial regardless of which case references which key, so a shared `kali.json` would supply `apiSurface` here too and this case would pass whether or not the flag did anything -- with no literal dropped, so `audit-case-migration.py` cannot see it, and with the trial still green, so `cargo test` cannot either."""
args = ["--output", "json", "check", "--api", "browser", "map_constructor.jsx"]
exit = 1
json.schemaVersion = 1
json.command = "check"
json.success = false
json.exitCode = 1
json.errors.0.code = "E5506"
json.errors.0.message = "for-of array iteration lowering is unavailable unless the iterable is a literal array or supported string iterable with literal elements and the loop target is a variable declaration or simple identifier binding; use a supported loop form or the later compatibility path"

