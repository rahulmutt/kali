json.command = "build"
json.success = false
json.exitCode = 1
json.errors.0.code = "E5506"
json.errors.0.message = "for-of array iteration lowering is unavailable unless the iterable is a literal array or supported string iterable with literal elements and the loop target is a variable declaration or simple identifier binding; use a supported loop form or the later compatibility path"

