rationale = """Migrated from browser_non_literal_iterator_sources.rs, the `check_rejects_non_literal_object_values_iterator_source_in_js_input` `#[test]` fn in its `check.rs` `#[path]` submodule (`check_rejects_non_literal_object_values_iterator_source_in_js_input(` (check.rs:49)). That fn is a single unlooped helper call, so it maps 1:1 to this one `[[case]]` (rule 6). `assert_browser_iterator_source_rejects(` (:108) writes the program to a fresh temp dir as `dir.path().join(filename)` (:116) and runs the real `kali` with that dir as cwd. The program under test is `object_values_source()` (:47), written to `object_values.js`. The source writes it to `main.js`; the `[source]` key is U5-renamed because `[source]` is one flat file-wide namespace and this source writes 8 different programs to just 2 filename stem(s) (`main.<ext>` and `smoke.test.<ext>`). The rename is argv-only -- no fixture body in this file names any of these files by string -- so it does not rewrite the program under test (rule 9). The source asserts the command FAILED and pins the exact code: `assert!(!output.status.success()` (:135) and `assert_eq!(output.status.code(), Some(1))` (:136). `assert_eq!` is already exact, so rule 1's non-negotiable direction gives `exit = 1` rather than the weaker `exit = "failure"` status class. In text mode the source asserts `stderr.contains("E5506")` (:157) and `stderr.contains("literal array")` (:159). The source spells this as a plain `.contains(...)` against the captured `stderr`, so it is carried as stderr_contains and NOT strengthened to an exact pin -- controller ruling 3, mirror the source: a plain `.contains` against a field that HAS a substring form keeps the substring form even though the exact output was observed. The source reads no JSON in this mode, so this case pins no `json` field: adding one would be a rule 2 invention. TWO-FILE SPLIT (U2). This file is the EXPLICIT-`--api browser` half: no `kali.json` appears in its `[source]` table at all, which is exactly what keeps this case able to FAIL if `--api browser` regressed. The 12 manifest-inheriting `#[test]` fns are in non_literal_iterator_sources_inherited_manifest.toml. They cannot be `[[case]]` entries in this file: `expand.rs`'s `expand()` clones the whole file-level `[source]` map into EVERY trial regardless of which case references which key, so a shared `kali.json` would supply `apiSurface` here too and this case would pass whether or not the flag did anything -- with no literal dropped, so `audit-case-migration.py` cannot see it, and with the trial still green, so `cargo test` cannot either."""
args = ["check", "--api", "browser", "object_values.js"]
exit = 1
stderr_contains = ["E5506", "literal array"]

