ped: design spec 5.4 makes an out-of-range numeric segment a HARD failure, never a silent skip, so `json.errors.0.code` cannot pass against an empty array. Pinning it implies the non-emptiness claim and is strictly stronger. The source's message claim here is a DISJUNCTION, carried verbatim as rule 11 requires: `message.contains("array callback-produced iterables")` (:325) `|| message.contains("literal array")` (:326). The case format has no disjunction, so the real binary was run for this exact case and the `literal array` branch is the one it emits; that branch is what is pinned. Every run satisfying the pin satisfies the source's OR, so this is a verified strengthening, not a narrowing of an absence claim. That message is a JSON string leaf, and the case format has NO substring form for one (there is no json_contains key), so controller ruling 3 makes it an exact `json.errors.0.message` pin -- and, per U9, only after the value was captured from the real built `kali` for this case rather than hand-computed. TWO-FILE SPLIT (U2). This file is the EXPLICIT-`--api browser` half: no `kali.json` appears in its `[source]` table at all, which is exactly what keeps this case able to FAIL if `--api browser` regressed. The 12 manifest-inheriting `#[test]` fns are in non_literal_iterator_sources_inherited_manifest.toml. They cannot be `[[case]]` entries in this file: `expand.rs`'s `expand()` clones the whole file-level `[source]` map into EVERY trial regardless of which case references which key, so a shared `kali.json` would supply `apiSurface` here too and this case would pass whether or not the flag did anything -- with no literal dropped, so `audit-case-migration.py` cannot see it, and with the trial still green, so `cargo test` cannot either."""
