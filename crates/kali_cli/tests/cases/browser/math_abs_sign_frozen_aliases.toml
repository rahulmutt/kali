[matrix]
ext = ["js", "ts", "jsx", "tsx"]

[source]
"app.${ext}" = """// kali-tree-shake: globalThisMathAbsSignFrozenAliases
function globalThisMathAbsSignFrozenAliases() {
  const value = -3;
  const alias = value;
  console.log(globalThis.Math.abs(value));
  console.log(globalThis.Math.sign(value));
  console.log(Object.freeze(globalThis.Math.abs)(alias));
  console.log(Object.freeze(globalThis.Math.sign)(alias));
  console.log(Object.freeze(Math.abs)(alias));
  console.log(Object.freeze(Math.sign)(alias));
  return [
    globalThis.Math.abs(value),
    globalThis.Math.sign(value),
    Object.freeze(globalThis.Math.abs)(alias),
    Object.freeze(globalThis.Math.sign)(alias),
    Object.freeze(Math.abs)(alias),
    Object.freeze(Math.sign)(alias),
  ];
}
"""
"main.${ext}" = """const value = -3; const alias = value; console.log(globalThis.Math.abs(value)); console.log(globalThis.Math.sign(value)); console.log(Object.freeze(globalThis.Math.abs)(alias)); console.log(Object.freeze(globalThis.Math.sign)(alias)); console.log(Object.freeze(Math.abs)(alias)); console.log(Object.freeze(Math.sign)(alias));
"""
"smoke.test.${ext}" = """Kali.test('globalThis.Math abs sign frozen aliases', () => {
  const value = -3;
  const alias = value;
  console.log(globalThis.Math.abs(value));
  console.log(globalThis.Math.sign(value));
  console.log(Object.freeze(globalThis.Math.abs)(alias));
  console.log(Object.freeze(globalThis.Math.sign)(alias));
  console.log(Object.freeze(Math.abs)(alias));
  console.log(Object.freeze(Math.sign)(alias));
});
"""

[[case]]
name = "build_emits_global_this_math_abs_sign_frozen_aliases"
rationale = """Migrated from browser_math_abs_sign_frozen_aliases.rs. `assert_browser_bundle_global_this_math_abs_sign_frozen` builds a browser bundle (`kali build --bundle --api browser`), asserts the emitted `app/app.meta.json` metadata, then runs the bundle glue under the browser-bundle-harness contract and checks that the frozen `Math.abs`/`Math.sign` alias calls printed `3` and `-1`. Source's stdout claims are plain `.contains`, mirrored as `stdout_contains` rather than strengthened. `ext` (js/ts/jsx/tsx) is hoisted to a file-level [matrix] axis: the 24 migrated #[test] fns collapse to 6 [[case]] entries here, matrix-fanned to 24 trials (see the file header's arithmetic). The file's 25th fn, `browser_bundle_global_this_math_abs_sign_frozen_source_includes_direct_frozen_math_aliases`, is a fixture self-inspection test and stays hand-written per rule 3/4."""

[[case.step]]
args = ["build", "--bundle", "--api", "browser", "app.${ext}"]
exit = "success"

[[case.step]]
kind = "file_json"
path = "app/app.meta.json"
fields = { "apiSurface" = "browser", "artifactKind" = "bundle" }

[[case.step]]
kind = "browser_bundle_harness"
entry = "app"
body = """const mod = await import(bundleJs.href);
await mod.globalThisMathAbsSignFrozenAliases();
"""
stdout_contains = ["3\n", "-1\n"]

