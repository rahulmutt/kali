[matrix]
ext = ["ts", "jsx", "tsx"]

[source]
"main.${ext}" = """const bump = () => { console.log("bump"); return 2; };
console.log(Math.atan2(0, 1, bump()));
"""
"smoke.test.${ext}" = """Kali.test('atan2 trailing argument evaluation', () => {
  const bump = () => { console.log("bump"); return 2; };
  console.log(Math.atan2(0, 1, bump()));
});
"""

[[case]]
name = "run_supports_math_atan2_trailing_argument_evaluation_when_browser_harness_is_configured"
rationale = """Migrated from browser_math_atan2_trailing_argument_evaluation_harness.rs. `assert_browser_harness_atan2_trailing_argument_evaluation("run", ...)` loops `for output_json in [false, true]` inside its body, so each of the 6 source #[test] fns is two real invocations. This one runs `kali run --api browser` under the browser harness (`node`) and, in non-json mode, asserts a clean exit and that stdout contains both `bump` (proving the surplus trailing argument's side effect still ran) and `0` (the `Math.atan2(0, 1)` result); the second needle is a char literal `'0'` in source, carried as the one-character string. Plain `.contains` against a field that has a substring form, so mirrored as `stdout_contains`. `exit = "success"` folds both `assert!(output.status.success())` and `assert_eq!(output.status.code(), Some(0))`. `ext` is hoisted to a file-level [matrix] axis over THREE values (ts/jsx/tsx) -- this file has no `_js_input` fn at all -- so 6 #[test] fns / 12 invocations collapse to 4 [[case]] entries here, matrix-fanned to 12 trials (see the file header's arithmetic)."""
args = ["run", "--api", "browser", "--max-threads", "0", "--max-spawned-processes", "0", "main.${ext}"]
env = { "KALI_BROWSER_BUNDLE_HARNESS_COMMAND" = "node" }
exit = "success"
stdout_contains = ["bump", "0"]

[[case]]
name = "json_run_supports_math_atan2_trailing_argument_evaluation_when_browser_harness_is_configured"
rationale = """Migrated from browser_math_atan2_trailing_argument_evaluation_harness.rs. `assert_browser_harness_atan2_trailing_argument_evaluation("run", ...)` loops `for output_json in [false, true]` inside its body, so each of the 6 source #[test] fns is two real invocations. This one runs `kali run --api browser --output json` and asserts the JSON envelope's schemaVersion/command/success/payload (hostContract, runtimeBackend) fields, `payload.exitCode == 0` -- this file asserts only the nested payload field, never the top-level `json["exitCode"]`, so none is added -- that `stderr` is exactly empty, that `errors` is empty, and that `json["stdout"]` contains both `bump` and `0`. A nested `json` leaf has no substring-assertion form in this case-file format (only exact equality), so that claim is resolved to an exact pin -- live-captured from the real `kali` binary and strictly stronger than source's two `.contains()` checks. `exit = "success"` folds both `assert!(output.status.success())` and `assert_eq!(output.status.code(), Some(0))`. `ext` is hoisted to a file-level [matrix] axis over THREE values (ts/jsx/tsx) -- this file has no `_js_input` fn at all -- so 6 #[test] fns / 12 invocations collapse to 4 [[case]] entries here, matrix-fanned to 12 trials (see the file header's arithmetic)."""
args = ["--output", "json", "run", "--api", "browser", "--max-threads", "0", "--max-spawned-processes", "0", "main.${ext}"]
env = { "KALI_BROWSER_BUNDLE_HARNESS_COMMAND" = "node" }
exit = "success"
json = { "schemaVersion" = 1, "command" = "run", "success" = true, "payload" = { "hostContract" = "browser-requested", "runtimeBackend" = "browser-harness", "exitCode" = 0 }, "stdout" = "bump\n0\n", "stderr" = "", "errors" = [] }

