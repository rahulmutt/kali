[[case]]
name = "json_test_supports_global_this_math_max_min_frozen_aliases_when_browser_harness_is_configured"
rationale = """Migrated from browser_math_max_min_frozen_aliases.rs, the two `json_test_supports_global_this_math_max_min_frozen_aliases_when_browser_harness_is_configured_in_*_input` fns (one per extension -- this source runs js and ts only). `assert_browser_harness_global_this_math_max_min_frozen` runs `kali test --output json --api browser` with the browser harness backed by node (:207), against a program that computes globalThis.Math.max(1, 2, 3) and globalThis.Math.min(3, 2, 1) -- the middle argument reaching them through a local alias bound to 2 -- and then re-invokes each through nine further frozen Object.freeze(...) spellings, so its twenty console.log calls alternate 3 and 1. This helper passes NO `--max-threads` and NO `--max-spawned-processes`, unlike the other harness helpers migrated in this batch, so neither appears on argv. The process exit status is asserted at :220. This sibling asserts the JSON envelope: schemaVersion/command/success, payload hostContract/runtimeBackend (:228-232), payload total/passed/failed (:237-239); the source asserts no `skipped` on this envelope, so none is written, plus `stderr` exactly empty (:255) and an empty `errors` array (:256). Its two claims about the JSON stdout leaf are `.contains("3\\n")` (:245) and `.contains("1\\n")` (:252). On the JSON branch the same claim is taken against the string leaf json["stdout"], which has NO substring form in the case format (there is no json_contains key), so per controller ruling 3 it becomes an exact `json.stdout` pin -- and, per U9, only after the value was captured from the real kali binary rather than hand-computed. One pin carries both, because an exact equality on that leaf implies every substring claim taken against it."""
args = ["--output", "json", "test", "--api", "browser", "smoke.test.${ext}"]
env = { KALI_BROWSER_BUNDLE_HARNESS_COMMAND = "node" }
exit = "success"
json = { schemaVersion = 1, command = "test", success = true, payload = { hostContract = "browser-requested", runtimeBackend = "browser-harness", total = 1, passed = 1, failed = 0 }, stdout = "3\n1\n3\n1\n3\n1\n3\n1\n3\n1\n3\n1\n3\n1\n3\n1\n3\n1\n3\n1\n", stderr = "", errors = [] }
