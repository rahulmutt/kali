# Migrated from tests/browser_for_of_array_iteration_break_continue.rs.
# No Rust comments exist anywhere in the source file (checked: `grep -nE
# '^\s*//'` finds nothing outside the JS fixture bodies' own `// kali-tree-
# shake:` markers, which are program text, not Rust comments), so there is no
# prose to move verbatim into `rationale` here (rule 12).
#   SOURCE REF: 28df9ba02962143a1fc1735e418b2f67caee8fc6
#
# MATRIX ARITHMETIC (rule 7): all 16 #[test] fns are individual (no loops
# anywhere in this file) and funnel through the single helper
# `assert_browser_bundle_break_continue(filename, json_output, source,
# harness_function)`, one call per (variant, ext, json_output) triple. Two
# fixture bodies/variants (`for_of_break_continue_source` /
# `for_await_break_continue_source`), each across all four extensions in both
# json_output states: 2 x 4 x 2 = 16 invocations, uniform across every case.
# `ext` is hoisted to a file-level [matrix] axis: 16 #[test] fns collapse to 4
# [[case]] entries, matrix-fanned to 16 trials, matching exactly.
#
# [source] KEY DISAMBIGUATION (U5): source writes both bodies to the bare
# `app.<ext>` (private tempdir per #[test]); the flat file-wide `[source]`
# table
# cannot, so the stems become `app_for_of` / `app_for_await`, and the
# `file_json`
# `path` plus harness `entry` track the rename because `kali build --bundle`
# names its output directory after the input stem. Neither body references its
# own filename by string, so the rename changes no claim.
#
# ASSERTION SHAPE: `exit = "success"` carries
# `assert!(output.status.success())`. This file's harness assertion is a
# SINGLE
# claim -- `assert!(stdout.contains("1\n"))` -- not the two-value
# `1`+`2` check its sibling wrapper files make, because the fixture `break`s
# out
# of the loop after the first truthy value. Only that one needle is carried;
# adding a `2` claim would be a rule-2 invention. Rule 8: the harness `body`
# was
# produced by EXECUTING the real `format!`, not hand-substituted.

[matrix]
ext = ["js", "ts", "jsx", "tsx"]

[source]
"app_for_of.${ext}" = """// kali-tree-shake: forOfArrayIterationBreakContinueWrapper
export function forOfArrayIterationBreakContinueWrapper() {
  const values = [0, 1, 1];
  for (const value of [...values]) {
    if (!value) continue;
    console.log(value);
    if (value) break;
  }
}
"""
"app_for_await.${ext}" = """// kali-tree-shake: forAwaitArrayIterationBreakContinueWrapper
export async function forAwaitArrayIterationBreakContinueWrapper() {
  const values = [0, 1, 1];
  for await (const value of [...values]) {
    if (!value) continue;
    console.log(value);
    if (value) break;
  }
}
"""

[[case]]
name = "build_emits_for_of_break_continue"
rationale = """Migrated from browser_for_of_array_iteration_break_continue.rs. `assert_browser_bundle_break_continue` builds a browser bundle (`kali build --bundle --api browser`), asserts the emitted `app_for_of/app_for_of.meta.json` metadata, then runs the bundle glue under the browser-bundle-harness contract and checks that the for-of loop's `continue`-then-`break` path printed exactly the one value `1`. Source makes a single `stdout.contains("1\\n")` claim here (not the two-value check its sibling wrapper files make), so only that needle is carried -- adding a `2` claim would invent one the source never made. `ext` (js/ts/jsx/tsx) is hoisted to a file-level [matrix] axis: 16 #[test] fns collapse to 4 [[case]] entries here, matrix-fanned to 16 trials, matching the 16 real per-(variant,ext,json_output) invocations in source exactly. `[source]` stems are disambiguated per variant (`app_for_of`/`app_for_await`) because the `[source]` table is one flat file-wide namespace and source reused the bare name `app.<ext>` for both bodies."""

[[case.step]]
args = ["build", "--bundle", "--api", "browser", "app_for_of.${ext}"]
exit = "success"

[[case.step]]
kind = "file_json"
path = "app_for_of/app_for_of.meta.json"
fields = { "apiSurface" = "browser", "artifactKind" = "bundle" }

[[case.step]]
kind = "browser_bundle_harness"
entry = "app_for_of"
body = """const mod = await import(bundleJs.href);
await mod.forOfArrayIterationBreakContinueWrapper();
"""
exit = "success"
stdout_contains = ["1\n"]

[[case]]
name = "json_build_emits_for_of_break_continue"
rationale = """Migrated from browser_for_of_array_iteration_break_continue.rs. `assert_browser_bundle_break_continue` builds a browser bundle (`kali build --bundle --api browser --output json`), asserts the JSON envelope's schemaVersion/command/success/exitCode/payload (artifactKind, bundleFormat) fields and that `errors` is empty, then asserts the emitted `app_for_of/app_for_of.meta.json` metadata, then runs the bundle glue under the browser-bundle-harness contract and checks that the for-of loop's `continue`-then-`break` path printed exactly the one value `1`. Source makes a single `stdout.contains("1\\n")` claim here (not the two-value check its sibling wrapper files make), so only that needle is carried -- adding a `2` claim would invent one the source never made. `ext` (js/ts/jsx/tsx) is hoisted to a file-level [matrix] axis: 16 #[test] fns collapse to 4 [[case]] entries here, matrix-fanned to 16 trials, matching the 16 real per-(variant,ext,json_output) invocations in source exactly. `[source]` stems are disambiguated per variant (`app_for_of`/`app_for_await`) because the `[source]` table is one flat file-wide namespace and source reused the bare name `app.<ext>` for both bodies."""

[[case.step]]
args = ["build", "--bundle", "--api", "browser", "--output", "json", "app_for_of.${ext}"]
exit = "success"
json = { "schemaVersion" = 1, "command" = "build", "success" = true, "exitCode" = 0, "payload" = { "artifactKind" = "bundle", "bundleFormat" = "esm" }, "errors" = [] }

[[case.step]]
kind = "file_json"
path = "app_for_of/app_for_of.meta.json"
fields = { "apiSurface" = "browser", "artifactKind" = "bundle" }

[[case.step]]
kind = "browser_bundle_harness"
entry = "app_for_of"
body = """const mod = await import(bundleJs.href);
await mod.forOfArrayIterationBreakContinueWrapper();
"""
exit = "success"
stdout_contains = ["1\n"]

