[matrix]
ext = ["js", "ts", "jsx", "tsx"]

[source]
"app.${ext}" = """// kali-tree-shake: browserObjectValuesSpreadIteration
function assertObjectValuesSpreadIteration(values) {
  if (values.length !== 2 || values[0] !== 3 || values[1] !== 2) {
    throw new Error('unexpected Object.values spread iteration semantics');
  }
}

function browserObjectValuesSpreadIteration() {
  const fromEntries = Object.fromEntries([["b", 1], ["a", 2], ["b", 3]]);
  const bracketedFromEntries = globalThis["Object"]["fromEntries"]([["b", 1], ["a", 2], ["b", 3]]);
  const mixedBracketedFromEntries = globalThis["Object"]['fromEntries']([["b", 1], ["a", 2], ["b", 3]]);
  const mixedSingleQuotedFromEntries = globalThis['Object']["fromEntries"]([["b", 1], ["a", 2], ["b", 3]]);
  const frozenFromEntries = Object.freeze(Object.fromEntries([["b", 1], ["a", 2], ["b", 3]]));
  const collected = [...Object.values(fromEntries)];
  const globalCollected = [...globalThis.Object.values(fromEntries)];
  const bracketedCollected = [...Object.values(bracketedFromEntries)];
  const mixedBracketedValuesCollected = [...Object.values(mixedBracketedFromEntries)];
  const mixedSingleQuotedValuesCollected = [...Object.values(mixedSingleQuotedFromEntries)];
  const frozenCollected = [...Object.values(frozenFromEntries)];
  const frozenFromEntriesCollected = [...Object.freeze(Object.values(fromEntries))];
  const mixedCollected = [...globalThis.Object["values"](fromEntries)];
  const mixedBracketedCollected = [...globalThis["Object"].values(fromEntries)];
  const doubleQuotedSingleQuotedCollected = [...globalThis["Object"]['values'](fromEntries)];
  const singleBracketedCollected = [...globalThis['Object']['values'](fromEntries)];
  const singleBracketedPropertyCollected = [...globalThis['Object'].values(fromEntries)];
  const parenthesizedSingleQuotedReceiverBracketedCollected = [...Object.freeze((globalThis['Object'])['values'])(fromEntries)];
  const parenthesizedSingleQuotedReceiverBracketedPropertyCollected = [...Object.freeze((globalThis['Object']).values)(fromEntries)];
  const bracketedAliasCollected = [...globalThis["Object"]["values"](fromEntries)];
  const bracketedAliasFromEntriesCollected = [...globalThis["Object"]["values"](bracketedFromEntries)];
  const bracketedAliasFrozenCollected = [...globalThis["Object"]["values"](frozenFromEntries)];
  assertObjectValuesSpreadIteration(collected);
  assertObjectValuesSpreadIteration(globalCollected);
  assertObjectValuesSpreadIteration(bracketedCollected);
  assertObjectValuesSpreadIteration(mixedBracketedValuesCollected);
  assertObjectValuesSpreadIteration(mixedSingleQuotedValuesCollected);
  assertObjectValuesSpreadIteration(frozenCollected);
  assertObjectValuesSpreadIteration(frozenFromEntriesCollected);
  assertObjectValuesSpreadIteration(mixedCollected);
  assertObjectValuesSpreadIteration(mixedBracketedValuesCollected);
  assertObjectValuesSpreadIteration(doubleQuotedSingleQuotedCollected);
  assertObjectValuesSpreadIteration(singleBracketedCollected);
  assertObjectValuesSpreadIteration(singleBracketedPropertyCollected);
  assertObjectValuesSpreadIteration(parenthesizedSingleQuotedReceiverBracketedCollected);
  assertObjectValuesSpreadIteration(parenthesizedSingleQuotedReceiverBracketedPropertyCollected);
  assertObjectValuesSpreadIteration(bracketedAliasCollected);
  assertObjectValuesSpreadIteration(bracketedAliasFromEntriesCollected);
  assertObjectValuesSpreadIteration(bracketedAliasFrozenCollected);
  console.log('browser object values spread iteration ok');
}
"""

[[case]]
name = "build_emits_object_values_spread_iteration"
rationale = """Migrated from browser_object_values_spread_bundle.rs, the four `build_emits_object_values_spread_iteration_in_*_input` fns (one per extension). `assert_browser_bundle_object_values_spread` writes the Object.values spread fixture and builds it with `kali build --bundle --api browser`. At the time of migration the build succeeded `output.status.success(),` (:81) and the metadata was asserted, then the bundle glue was run under the browser-bundle-harness contract backed by node, where it FAILED CLOSED `assert!(!output.status.success()` (:138) (the source's only claim about the harness -- no stdout/stderr needle at all). The program spreads Object.values over three differently-spelled Object.fromEntries results through seventeen root spellings -- dotted, mixed, bracketed, single-quoted, frozen bracket-root and frozen parenthesized-receiver -- and checks every collected array by passing it straight to an assert helper as a bare argument. At `733cd26125` this program built and then threw in the harness because the callee read zeros (`0,0,0` where node v26.8.2 prints `2,3,2`); it now refuses at build time. Task 9 (spec 3.4) widens the fold-lane-array-argument guard to refuse every such argument, so the build now fails closed with E5506 before the metadata write or the harness ever runs -- verified directly against the real binary, across all four extensions and both output modes: `E5506` lands on stderr only in text mode, and only inside the JSON envelope's `errors[0].code` on stdout in `--output json` mode. RULE 12 -- the Rust comment prose of browser_object_values_spread_bundle.rs, carried verbatim: "Honest re-pin (PR #16 rev2): kali fails closed/loud here; see docs/superpowers/followups/pr16-honest-repin-inventory.md.""""
args = ["build", "--bundle", "--api", "browser", "app.${ext}"]
exit = "failure"
stderr_contains = ["E5506"]

