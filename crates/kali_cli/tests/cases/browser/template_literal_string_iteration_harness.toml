[constants]
dollar = "$"

[matrix]
ext = ["js", "ts", "jsx", "tsx"]

[source]
"main.${ext}" = """  const prefix = "he";
  const suffix = "llo";
  const syncChars = [];
  for (const item of `${dollar}{prefix}${dollar}{suffix}`) {
    syncChars.push(item);
  }
  const asyncChars = [];
  for await (const item of `${dollar}{prefix}${dollar}{suffix}`) {
    asyncChars.push(item);
  }
  if (syncChars.join("") !== "hello" || asyncChars.join("") !== "hello") {
    throw new Error('unexpected template literal iteration semantics');
  }
console.log('browser template literal iteration ok');
"""
"smoke.test.${ext}" = """Kali.test('browser template literal iteration', () => {
  const prefix = "he";
  const suffix = "llo";
  const syncChars = [];
  for (const item of `${dollar}{prefix}${dollar}{suffix}`) {
    syncChars.push(item);
  }
  const asyncChars = [];
  for await (const item of `${dollar}{prefix}${dollar}{suffix}`) {
    asyncChars.push(item);
  }
  if (syncChars.join("") !== "hello" || asyncChars.join("") !== "hello") {
    throw new Error('unexpected template literal iteration semantics');
  }
});
"""

