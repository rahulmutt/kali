# Migrated from tests/browser_object_has_own_harness.rs.
#
# RULE 12 (carry every source comment verbatim) -- THIS SOURCE HAS PROSE, and it is
# carried into EVERY case's own `rationale`, not just into this header.
# `grep -nE '^\s*//'` over tests/browser_object_has_own_harness.rs returns 2 Rust comment line(s)
# in 1 contiguous block(s), of 1 distinct text(s):
#   * "Honest re-pin (PR #16 rev2): kali fails closed/loud here; see docs/superpowers/followups/pr16-honest-repin-inventory.md."
# Every block sits inside `assert_browser_harness_object_has_own`,
# which every `[[case]]` below reaches, so U6's bottom-up attribution puts all of it in
# every rationale: the attribution is per helper and this helper is universal in this
# file, which is NOT the over-attribution U6 forbids (that is copying a block into cases
# its producing helper does not reach).
# A pointer ("see the file header") would not satisfy rule 12: a reader of one failing
# trial sees only that trial's `rationale`.
#
# RULE 7 / U1 -- MATRIX ARITHMETIC, and it closes exactly.
# 16 `#[test]` fns, 16 real helper invocations with every loop
# expanded:
#   * `assert_browser_harness_object_has_own` -- 16 invocation(s) = command(run/test) x ext(js/ts/jsx/tsx) x json_output(false/true), a complete cross product. Every `#[test]` fn is one unlooped call and the file contains no loop at all. Unlike this batch's other has-own targets, BOTH fixture builders here take no parameter, so the same text goes to all four extensions and `ext` really is uniform.
# `ext` is the ONE axis every case varies over uniformly, and every helper covers
# all 4 of its values, so a file-wide axis fans nothing the source never ran:
# 4 `[[case]]` entries x ext(4) = 16 trials = 16 invocations. Exact.
# `command` and `json_output` are NOT matrix axes, per rule 7 and design spec 5.6's own
# note, and the reason here is not the usual one: this target asserts nothing but process
# failure, so neither dimension changes what is asserted -- they change the argv and, for
# `command`, the entry filename.
# `command` selects a different `[source]` entry (`main.<ext>` for run, `smoke.test.<ext>`
# for test), and a `[matrix]` axis substitutes ONE string uniformly across every case.
# `json_output` appends an argv PAIR rather than substituting a value.
# Each is written as sibling `[[case]]` entries instead, which is also what rule 6
# requires: the source has its own `#[test]` fns for every combination.
#
# RULE 6 -- 1:1 MAPPING, and the fold is stated here as the rule requires.
# Each `[[case]]` below corresponds to 4 source `#[test]` fns, one per `ext` cell; the assertion mapping stays
# 1:1 per trial, so no claim is lost, but a failing trial's id reads its matrix cell
# rather than a source fn name.
#
# U2 -- `[source]` is FILE-WIDE, and that is safe here. Every fixture
# (`main.${ext}`, `smoke.test.${ext}`)
# is written unconditionally by the source into a fresh temp dir: no fixture is written
# behind an `if`, and no case's point is the presence or absence of a file.
# Every command below names its entry explicitly on argv, so the unused siblings in
# a trial dir are inert.
#
# RULE 8 / RULE 9 -- THE FIXTURES ARE CAPTURED, NEVER HAND-DERIVED. Both builders are
# one inline `format!` with `{{`/`}}` brace-collapse (`format!(` (:25), `format!(` (:86))
# whose three arguments are computed by FOUR kali_common::object helpers, each of
# which joins a thirty-plus entry alias table. That is rule 8's `format!` trap and rule
# 9's "one level removed inside a library crate" case at once. The two texts below are
# the byte-exact output of EXECUTING the real builders (see tools/task-18-browser-
# pilot/batch7a_captures.py for the capture procedure), and the generator re-checks
# each against anchors present in both the producing Rust source and the captured text.
#
# RULE 10 -- NOT NEEDED HERE, and that is checked rather than assumed. `expand.rs`'s
# `substitute()` hard-fails on any `${...}` it cannot resolve, so a fixture carrying a
# genuine JS template literal must declare `[constants] dollar = "$"` and spell the
# genuine `${` as `${dollar}{`. No `[source]` value and no step `body` in this file
# contains `${` at all -- the generator greps every emitted string and raises if one does
# -- so this file declares no `[constants]` table.
#
# RULE 13 -- transitive helper docs. Checked every fn in each call chain:
#   `kali_bin`, `browser_harness_object_has_own_run_source`,
#   `browser_harness_object_has_own_test_source`,
#   `assert_browser_harness_object_has_own` -- none carries a `///` doc comment.
# The chain DOES reach `///`-documented helpers in `kali_common` whose OUTPUT this
# case file reproduces in [source], so their docs are claim prose and are carried
# into the rationale of every case that helper's text reaches (ruling 6's test:
# carry the docs if the migrated case still depends on what the helper computed).
# The kali_common::object helpers whose output lands in [source], with the
# `///` doc carried into every rationale they reach:
#   * object_has_own_combined_frozen_callable_condition_source
#       "Canonical combined boolean-check source for the supported `Object.hasOwn` helper slice."
#   * object_has_own_frozen_callable_condition_source
#       "Canonical boolean-check source for the supported `Object.hasOwn` frozen callable aliases."
#   * object_has_own_property_call_frozen_callable_condition_source
#       "Canonical boolean-check source for the supported `Object.prototype.hasOwnProperty.call` frozen callable aliases."
#   * object_has_own_frozen_callable_source
#       "Canonical source text for the supported `Object.hasOwn` frozen callable aliases."
#   * object_has_own_property_call_frozen_callable_source
#       "Canonical source text for the supported `Object.prototype.hasOwnProperty.call` frozen callable aliases."
#   * object_has_own_property_call_binding_source
#       "Canonical binding source for the supported `Object.prototype.hasOwnProperty.call` helper."
#   * object_has_own_property_call_source
#       "Canonical source text for the supported `Object.prototype.hasOwnProperty.call` helper."
# This file runs no `browser_bundle_harness` step, so its call chain never reaches
# `kali_runtime_contract`'s two harness helpers and ruling 6's exemption is not stated.
#
# ARGV ORDER is transcribed in the exact order the source's `Command` builder appends it
# and is not normalised here:
#   * run/test: `[--output json] <run|test> --api browser --max-threads 0
#              --max-spawned-processes 0 <entry>` -- the `--output json` pair is appended
#              BEFORE the subcommand, and both thread flags are always passed.
# The source passes an absolute `dir.path().join(filename)` as the entry; the case runner
# passes the bare filename relative to the trial dir, matching every previously shipped
# `browser/` case file.
# The env value is `KALI_BROWSER_BUNDLE_HARNESS_COMMAND`, read from the
# `kali_runtime_contract::BROWSER_HARNESS_COMMAND_ENV` constant the source passes by
# name `kali_runtime_contract::BROWSER_HARNESS_COMMAND_ENV` (:151) rather than assumed.
#
# ASSERTION SHAPE -- THIS TARGET ASSERTS A FAILURE, NOT A SUCCESS. The source's only
# process assertion is `assert!(!output.status.success(), ...)`, so the migrated step
# carries `exit = "failure"` and nothing else. That is the whole claim; adding a
# diagnostic-code or stdout claim the source never made would be a rule-2 invention,
# and `exit = "failure"` is exactly as strong as the assertion it replaces.
# The source's only assertion is at `assert!(!output.status.success()` (:170), for every one of its 16 fns, in both
# output modes.

