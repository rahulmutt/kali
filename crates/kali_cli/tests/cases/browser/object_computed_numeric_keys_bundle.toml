[matrix]
ext = ["js", "ts", "jsx", "tsx"]

[source]
"app_plain.${ext}" = """// kali-tree-shake: computedNumericObjectKeys
export async function computedNumericObjectKeys() {
  const obj = { [-1]: 'neg', [+2]: 'pos', [(-0)]: 'zero' };
  console.log(obj[-1]);
  console.log(obj[2]);
  console.log(obj[0]);
}
"""
"app_await.${ext}" = """// kali-tree-shake: computedNumericObjectKeysWithAwaitWrappers
export async function computedNumericObjectKeysWithAwaitWrappers() {
  const obj = {
    [await 1]: 'neg',
    [+(await 2)]: 'pos',
    [(0, await 0)]: 'zero',
  };
  console.log(obj[1]);
  console.log(obj[2]);
  console.log(obj[0]);
}
"""

[[case]]
name = "build_emits_computed_numeric_object_keys"
rationale = """Migrated from browser_object_computed_numeric_keys_bundle.rs, `build_emits_computed_numeric_object_keys_in_js_ts_jsx_and_tsx_input` -- one source `#[test]` fn, whose `for filename in [...]` loop is reproduced by this file's four `ext` cells. `assert_browser_bundle_computed_numeric_keys` builds a browser bundle with `kali build --bundle --api browser`, asserts the emitted metadata, then runs the bundle glue under the browser-bundle-harness contract backed by node, against a program whose object literal uses computed numeric keys with unary signs and a negative zero (`[-1]`, `[+2]`, `[(-0)]`), then reads them back and prints neg, pos and zero. Its three stdout claims are separate source lines (`stdout.contains("neg")` :123 and the two after it, ending at `stdout.contains("zero")` :125). The source spells this as a plain `.contains(...)` against raw stdout, so it is carried as stdout_contains and NOT strengthened to an exact pin -- controller ruling 3, mirror the source: a plain `.contains` against a field that HAS a substring form keeps the substring form even though the exact output was observed."""

[[case.step]]
args = ["build", "--bundle", "--api", "browser", "app_plain.${ext}"]
exit = "success"

[[case.step]]
kind = "file_json"
path = "app_plain/app_plain.meta.json"
fields = { apiSurface = "browser", artifactKind = "bundle" }

[[case.step]]
kind = "browser_bundle_harness"
entry = "app_plain"
body = """const mod = await import(bundleJs.href);
await mod.computedNumericObjectKeys();
"""
exit = "success"
stdout_contains = ["neg", "pos", "zero"]

