# RULE 7 / U1 -- MATRIX ARITHMETIC, and it closes exactly.
# 4 `#[test]` fns, 16 real helper invocations with every loop
# expanded:
#   * `assert_browser_bundle_computed_numeric_keys` -- 16 invocation(s) = program(plain/await-wrapped) x ext(js/ts/jsx/tsx) x
#     json_output(false/true). Each of the 4 `#[test]` fns
#     is a `for filename in [...]` loop over four
#     filenames, so 4 fns make 16 invocations
# `ext` is the ONE axis every case varies over uniformly, and every helper covers
# all 4 of its values, so a file-wide axis fans nothing the source never ran:
# 4 `[[case]]` entries x ext(4) = 16 trials = 16 invocations. Exact.
# `json_output` is NOT a matrix axis, per rule 7 and design spec 5.6's own note:
# it changes the ASSERTION SHAPE rather than substituting a string.
# `json_output` switches between a text claim and a JSON-envelope claim.
# It is written as sibling `[[case]]` entries instead.
# THE PROGRAM DIMENSION IS NOT AN AXIS EITHER, and for a different reason from
# `json_output`: the two programs are two different FILES, not one file's text under
# substitution. `[source]` is file-wide (U2), so both are written into every trial
# dir and each case names its own entry on argv; an axis cannot express that, because
# an axis substitutes into a `[source]` KEY and one key holds one body.
#
# RULE 6 -- 1:1 MAPPING, and the fold is stated here as the rule requires.
# Each `[[case]]` below corresponds to one source `#[test]` fn, whose own `for filename in [...]` loop
# over four filenames is what the four `ext` cells reproduce; the assertion mapping stays
# 1:1 per trial, so no claim is lost, but a failing trial's id reads its matrix cell
# rather than a source fn name.
#
# U2 -- `[source]` is FILE-WIDE, and that is safe here. Every fixture
# (`app_plain.${ext}`, `app_await.${ext}`)
# is written unconditionally by the source into a fresh temp dir: no fixture is written
# behind an `if`, and no case's point is the presence or absence of a file.
# Every command below names its entry explicitly on argv, so the unused siblings in
# a trial dir are inert.
#
# U5 -- `[source]` KEY RENAMES. `[source]` is one flat file-wide namespace, and this
# source writes two different program texts to the same filename in different tests, so
# the keys are variant-suffixed:
#   * `app.${ext} (the plain-computed-key program)` -> `app_plain.${ext}` -- the source writes TWO different programs to the same `app.<ext>` filename in different tests
#   * `app.${ext} (the await-wrapped program)` -> `app_await.${ext}` -- same filename, second program
# U5's safety condition holds for every rename: each of these filenames is passed to
# `kali` as a CLI argument only. None is referenced by string from inside any fixture
# body -- no dynamic-import call and no CommonJS require call names any of them, checked
# against every `[source]` value in this file -- so renaming does not rewrite the program
# under test (rule 9).
# `kali build --bundle` names its output directory after the input STEM, so each
# case's `file_json` path and browser-bundle-harness `entry` track the rename rather
# than staying hardcoded to `app` -- `app_plain/app_plain.meta.json` and
# `entry = "app_plain"`, and likewise for the await-wrapped pair.
#
# RULE 8 / RULE 9 -- the two browser-bundle harness BODIES are `format!`-built,
# inline inside the assert helper (`import(bundleJs.href)` :95) with a placeholder for the
# exported function name, so neither exists as a string literal anywhere. Both are
# the byte-exact OUTPUT of executing the real code, captured by running this
# target's own tests with KALI_BROWSER_BUNDLE_HARNESS_COMMAND pointed at a wrapper that copies the
# harness script it is handed and then execs node, and subtracting
# kali_runtime_contract::browser_bundle_harness_prelude("app", false) from each
# captured script -- `browser_bundle_harness_script` is defined as prelude + body,
# so the remainder IS the resolved body. The procedure is recorded in
# `tools/task-18-browser-pilot/batch6a_captures.py`.
#
# RULE 13 -- transitive helper docs. Checked every fn in each call chain:
#   `kali_bin`, `browser_bundle_computed_numeric_keys_source`,
#   `browser_bundle_computed_numeric_keys_with_await_wrappers_source`,
#   `assert_browser_bundle_computed_numeric_keys` -- none carries a `///` doc comment.
# The chain also reaches `kali_runtime_contract::browser_bundle_harness_script` and
# `::browser_harness_command_parts_for`, which DO carry one-line `///` docs. Those are
# NOT carried: in the migrated form this case file never calls them -- the
# `browser_bundle_harness` step kind means the case RUNNER does
# (crates/kali_case_runner/src/steps.rs) -- so their docs describe shared runner
# infrastructure documented in design spec 5.3, not what this case claims. That is
# controller ruling 6, which writes the exemption into the rule rather than leaving it
# to implementer discretion.
#
# ARGV ORDER is transcribed in the exact order the source's `Command` builder appends it,
# which differs between the two helper shapes and is not normalised here:
#   * build:   `build --bundle --api browser [--output json] <entry>` -- the `--output json`
#              pair is appended AFTER the subcommand and its flags.
#   * run/test: `[--output json] <run|test> --api browser [--max-threads 0
#              --max-spawned-processes 0] <entry>` -- the `--output json` pair is appended
#              BEFORE the subcommand.
# The source passes an absolute `dir.path().join(filename)` as the entry; the case runner
# passes the bare filename relative to the trial dir, matching every previously shipped
# `browser/` case file.
#
# ASSERTION SHAPE, mirrored from the source and nothing more.
# `exit = "success"` on the `kali build` process (:59) and on the
# browser-bundle harness process (`output.status.success()` :117).
# In json mode, the build envelope's schemaVersion/command/success/exitCode and the
# payload's artifactKind/bundleFormat (`envelope["payload"].as_object().expect("payload object")` :67-73), plus
# the empty `errors` array (:74).
# The emitted <entry>/<entry>.meta.json apiSurface/artifactKind
# (`metadata["apiSurface"]` :85-86) is asserted in BOTH modes, because the source reads
# that file outside the `if json_output` block.
# The harness step carries the file's three stdout claims, `.contains("neg")`
# (`stdout.contains("neg")` :123), `.contains("pos")` on the next line and `.contains("zero")`
# (`stdout.contains("zero")` :125), all of which stay `stdout_contains`.
# There is no count claim, no stderr claim on either process, and the build
# envelope's stdout leaf is never read, so no `json.stdout` pin.
# The source passes no --max-threads / --max-spawned-processes arguments, so neither
