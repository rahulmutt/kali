[matrix]
ext = ["js", "ts", "jsx", "tsx"]

[source]
"app.${ext}" = """// kali-tree-shake: bracketedGlobalThisMathPowAliasChain
function bracketedGlobalThisMathPowAliasChain() {
  const exponent = 3;
  const alias = exponent;
  console.log(globalThis["Math"].pow(2, alias));
  return globalThis["Math"].pow(2, alias);
}
"""
"main.${ext}" = """const exponent = 3; const alias = exponent; console.log(globalThis["Math"].pow(2, alias));
"""
"smoke.test.${ext}" = """Kali.test('bracketed pow alias', () => { const exponent = 3; const alias = exponent; console.log(globalThis["Math"].pow(2, alias)); });
"""
"app_member_chain.${ext}" = """// kali-tree-shake: bracketedGlobalThisMathPowMemberChain
function bracketedGlobalThisMathPowMemberChain() {
  const exponent = 3;
  const alias = exponent;
  console.log(globalThis["Math"]["pow"](2, alias));
  return globalThis["Math"]["pow"](2, alias);
}
"""
"main_member_chain.${ext}" = """const exponent = 3; const alias = exponent; console.log(globalThis["Math"]["pow"](2, alias));
"""
"smoke_member_chain.test.${ext}" = """Kali.test('bracketed pow member alias', () => { const exponent = 3; const alias = exponent; console.log(globalThis["Math"]["pow"](2, alias)); });
"""

[[case]]
name = "build_emits_bracketed_global_this_math_pow_alias_chain"
rationale = """Migrated from browser_math_pow_bracketed_root.rs, the 4 `build_emits_bracketed_global_this_math_pow_alias_chain_in_<ext>_input` fns (one per extension). `assert_browser_bundle_bracketed_global_this_math_pow` builds a browser bundle (`kali build --bundle --api browser`), asserts the emitted bundle metadata, then runs the bundle glue under the browser-bundle-harness contract, against a program that reaches `pow` through a bracketed `globalThis["Math"].pow` alias chain and raises 2 to an aliased exponent of 3, so the harness prints `8`. The source's only output claim on that step is `stdout.contains("8\\n")`. The source spells this as a plain `.contains(...)` against raw stdout, so it is carried as stdout_contains and NOT strengthened to an exact pin -- controller ruling 3, mirror the source: a plain `.contains` against a field that HAS a substring form keeps the substring form even though the exact output was observed. The program in `[source]` is not a literal in the `.rs`: the helper writes the output of the kali_common library fn math_pow_bracketed_global_this_alias_chain_source (`kali_common::math_pow_bracketed_global_this_alias_chain_source()` :15), and the text below is the byte-exact result of executing that fn, never a transcription (rule 9). RULE 13 -- doc comments on the library helpers that produce this fixture, carried verbatim: "Canonical browser-bundle source text for the supported bracketed `globalThis["Math"].pow` alias chain.""""

[[case.step]]
args = ["build", "--bundle", "--api", "browser", "app.${ext}"]
exit = "success"

[[case.step]]
kind = "file_json"
path = "app/app.meta.json"
fields = { apiSurface = "browser", artifactKind = "bundle" }

[[case.step]]
kind = "browser_bundle_harness"
entry = "app"
body = """const mod = await import(bundleJs.href);
await mod.bracketedGlobalThisMathPowAliasChain();
"""
exit = "success"
stdout_contains = ["8\n"]

