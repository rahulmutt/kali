# Migrated from tests/browser_promise_all_harness.rs.
#
# RULE 7 / U1 -- MATRIX ARITHMETIC, and it closes exactly.
# 16 `#[test]` fns, 16 real helper invocations with every loop
# expanded:
#   * `assert_browser_requested_promise_all` -- 16 invocation(s) = 16 individual `#[test]` fns, each one unlooped call = command(run/test) x json_output(2) x ext(4); the file contains no loop, so 16 fns = 16 invocations
# `ext` is the ONE axis every case varies over uniformly, and every helper covers
# all 4 of its values, so a file-wide axis fans nothing the source never ran:
# 4 `[[case]]` entries x ext(4) = 16 trials = 16 invocations. Exact.
# `command` and `json_output` are NOT matrix axes, per rule 7 and design spec 5.6's own note:
# each changes the ASSERTION SHAPE rather than substituting a string.
# `json_output` switches between a text claim and a JSON-envelope claim.
# `command` switches the envelope's payload between `exitCode` (run) and
# `total`/`passed`/`failed` (test).
# Each is written as sibling `[[case]]` entries instead.
#
# RULE 6 -- 1:1 MAPPING, and the fold is stated here as the rule requires.
# Each `[[case]]` below corresponds to one `(command, json_output)` cell of the source's 16 fns, fanned to the 4 extensions; the assertion mapping stays
# 1:1 per trial, so no claim is lost, but a failing trial's id reads its matrix cell
# rather than a source fn name.
#
# U2 -- `[source]` is FILE-WIDE, and that is safe here. Both fixtures
# (`main.${ext}`, `smoke.test.${ext}`) are written unconditionally by the source into
# a fresh temp dir: no fixture is written behind an `if`, no `kali.json` manifest is
# written anywhere in this file, and no case's point is the presence or absence of a
# file. Every command below names its entry explicitly on argv, so the unused siblings
# in a trial dir are inert -- verified against the real binary rather than assumed:
# `kali --output json test smoke.test.js` in a directory holding all four
# `smoke.test.<ext>` fixtures still reports `payload.total = 1`, so no sibling is
# picked up by discovery.
#
# U5 -- NO `[source]` KEY RENAME IS NEEDED. The helper picks its body from the
# COMMAND (`if command == "test" { ..._test_source() } else { ..._run_source() }`)
# and the source hands it a DIFFERENT filename per command for every extension --
# `main.<ext>` for `run` and `smoke.test.<ext>` for `test` -- so the two program
# texts never land on one key and the flat file-wide namespace has no collision.
# (That is the axis on which this file differs from `set_iteration_harness`, whose
# looped fn reuses `main.<ext>` for BOTH commands and therefore does need renames.)
#
# ASSERTION SHAPE -- THIS TARGET ASSERTS A FAILURE, NOT A SUCCESS. The source's only
# process assertion is `assert!(!output.status.success(), ...)`, so the migrated step
# carries `exit = "failure"` and nothing else. That is the whole claim; adding a
# diagnostic-code or stdout claim the source never made would be a rule-2 invention,
# and `exit = "failure"` is exactly as strong as the assertion it replaces.
# The source's fail-closed assertion is at `output.status.success()` :52.
#
# ARGV ORDER is transcribed in the exact order the source's `Command` builder appends it,
# which differs between the two helper shapes and is not normalised here:
#   * build:   `build --bundle --api browser [--output json] <entry>` -- the `--output json`
#              pair is appended AFTER the subcommand and its flags.
#   * run/test: `[--output json] <run|test> --api browser [--max-threads 0
#              --max-spawned-processes 0] <entry>` -- the `--output json` pair is appended
#              BEFORE the subcommand.
# The source passes an absolute `dir.path().join(filename)` as the entry; the case runner
# passes the bare filename relative to the trial dir, matching every previously shipped
# `browser/` case file.
#
# RULE 13 -- transitive helper docs. Checked every fn in each call chain:
#   `assert_browser_requested_promise_all`, `browser_promise_all_run_source`,
#   `browser_promise_all_test_source` -- none carries a `///` doc comment.
# The chain DOES reach `///`-documented helpers in `kali_common` whose OUTPUT this
# case file reproduces in [source], so their docs are claim prose and are carried
# into the rationale of every case that helper's text reaches (ruling 6's test:
# carry the docs if the migrated case still depends on what the helper computed).
# This file runs no `browser_bundle_harness` step at all -- every case is a single
# `kali run`/`kali test` invocation -- so ruling 6's runner-infrastructure paragraph
# is omitted rather than printed about a chain this file never reaches.
#
# RULE 12 / U6 -- SOURCE COMMENT PROSE, CARRIED VERBATIM AND ATTRIBUTED BOTTOM-UP.
# tests/browser_promise_all_harness.rs has 1 Rust comment block(s), listed with their
# line numbers before any TOML was written:
#   * `// Honest re-pin (PR #16 rev2): kali fails closed/loud here;` (:50) -- opens a 2-line block
# It sits in `assert_browser_requested_promise_all`, which every `#[test]` fn in the file calls,
# so it is carried into the rationale of every case in this file. The text is COPIED out of the `.rs`
# by this generator (`comment_blocks`), not retyped, so an em-dash cannot become `--`.
#
# No count of the wider `browser/` corpus appears anywhere in this file (ruling 16): a
# family-wide population count has no gateable home inside a case file, and the
# remaining batches would falsify it by construction.

