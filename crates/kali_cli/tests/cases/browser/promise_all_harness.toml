rationale = """Migrated from browser_promise_all_harness.rs. This `[[case]]` is the `(test, text)` cell of the source's 16 `#[test]` fns, matrix-fanned by `ext(4)` to the four extensions, so it stands for `test_supports_promise_all_in_js_input_when_browser_harness_is_configured`, `test_supports_promise_all_in_ts_input_when_browser_harness_is_configured`, `test_supports_promise_all_in_jsx_input_when_browser_harness_is_configured`, `test_supports_promise_all_in_tsx_input_when_browser_harness_is_configured` -- one trial per fn, assertion mapping 1:1 (rule 6's sanctioned rule-7 fold, stated here as the rule requires). `assert_browser_requested_promise_all(` (:25) writes the browser `Promise.all` smoke probe to `smoke.test.${ext}` in a fresh temp dir and runs the real `kali test --api browser` with that dir as cwd and the browser harness command variable set to `node`. ASSERTION SHAPE: the source's ONLY process assertion in this file is `assert!(!output.status.success(), "must fail closed: {output:?}")` (:52) -- no exit code, no stdout/stderr needle, no envelope field, in either output mode -- so this case carries exactly `exit = "failure"` and nothing else. Adding a diagnostic code or a stream claim would invent a claim the source never made (rule 2), even though the real binary does emit one. The program under test is `browser_promise_all_test_source()`; its text is the byte-exact output of executing that real code (rules 8 and 9), never hand-derived. RULE 12 -- the Rust comment prose of browser_promise_all_harness.rs, carried verbatim: "Honest re-pin (PR #16 rev2): kali fails closed/loud here; see docs/superpowers/followups/pr16-honest-repin-inventory.md." RULE 13 -- doc comments on the library helpers that produce this fixture, carried verbatim: "Canonical browser smoke body for the supported `Promise.all` slice." That doc belongs to promise_all_browser_body_source (named plainly rather than backticked: U8's gate resolves backticked identifiers against this source's own fn list and this one lives in kali_common)."""
args = ["test", "--api", "browser", "smoke.test.${ext}"]
env = { KALI_BROWSER_BUNDLE_HARNESS_COMMAND = "node" }
exit = "failure"

