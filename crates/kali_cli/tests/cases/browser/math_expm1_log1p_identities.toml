name = "run_supports_math_expm1_and_log1p_identity_literals_when_browser_harness_is_configured_in_ts_input"
rationale = """Migrated from browser_math_expm1_log1p_identities.rs, `run_supports_math_expm1_and_log1p_identity_literals_when_browser_harness_is_configured_in_ts_input`. `assert_browser_harness_math_expm1_log1p` runs `kali run --api browser` with the browser harness backed by node, against a program that calls Math.expm1(0) and Math.log1p(0), each of which prints 0. Its stdout claim here is a single `.contains("0\\n")` against raw stdout (:80). The source spells this as a plain `.contains(...)` against raw stdout, so it is carried as stdout_contains and NOT strengthened to an exact stdout pin -- controller ruling 3, mirror the source: a plain `.contains` against a field that HAS a substring form keeps the substring form even though the exact output was observed."""
args = ["run", "--api", "browser", "main.ts"]
env = { KALI_BROWSER_BUNDLE_HARNESS_COMMAND = "node" }
exit = "success"
stdout_contains = ["0\n"]

