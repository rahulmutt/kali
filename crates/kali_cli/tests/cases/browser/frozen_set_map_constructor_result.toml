# Migrated from tests/browser_frozen_set_map_constructor_result.rs.
#
# `ext` (js/ts/jsx/tsx) is a genuinely uniform file-level [matrix] axis:
# every one of this file's 23 #[test] fns is, for a fixed (variant, mode,
# json_output) combination, exercising the SAME assertion shape across all
# four extensions -- confirmed by reading every fn (individual js/ts fns
# plus a jsx-and-tsx loop fn together give full coverage for `run`/`test`;
# a single all-4-extension loop for the parenthesized variant and for
# `build`). 23 #[test] fns collapse to 12 [[case]] entries here,
# matrix-fanned to 48 trials. The true per-(variant,mode,json_output,ext)
# assertion count is variant(2) x mode(run/test/build=3) x json_output(2) x
# ext(4) = 48 -- this IS what all 23 fns together assert (23 differs from 48
# because several fns make more than one call each, e.g. every jsx-and-tsx
# loop fn makes 2), just organized unevenly across individual vs looped fns.
#
# [source] filenames are disambiguated with a `_plain`/`_paren` stem tag:
# [source] is one flat file-wide table, but source reuses bare filenames
# (main.js, app.ts, smoke.test.js, ...) across the plain/parenthesized
# variants (each gets its own private tempdir in the .rs world). No
# assertion ever pins the literal filename, so this changes no claim.
#
# `--output json` mode's nested `json.stdout` field: source's own check is
# `.contains(...)`, which the `json` assertion key cannot express directly
# (exact-equality-only per path). The exact value was captured live from the
# real binary for every case and pinned exactly -- strictly stronger.
#
# BATCH CONVENTION (minor, pilot round 1 review): a single [[case]] here can
# correspond to MORE THAN ONE source #[test] fn -- e.g. the `run`/`test`
# plain-variant cases fold together the individual `..._in_js_input`/
# `..._in_ts_input` fns with the `..._in_jsx_and_tsx_input` loop fn (three
# source fns, one [[case]] block, matrix-fanned over `ext`). Assertion
# mapping stays 1:1 (every trial still checks exactly the real
# per-extension source assertion), so no claim is lost -- but a failing
# trial's id reads `[ext=jsx]`, not a source fn name, so this is worth
# stating explicitly as the convention batches 2-8 will also produce.


[matrix]
ext = ["js", "ts", "jsx", "tsx"]

[source]
"app_paren.${ext}" = """// kali-tree-shake: browserParenthesizedFrozenSetMapConstructorResult
export async function browserParenthesizedFrozenSetMapConstructorResult() {
  const values = [1, 2, 1];
  for (const value of Object.freeze((new Set(values)))) {
    console.log(value);
  }
  for (const entry of Object.freeze((new Map([[1, 2], [1, 3], [4, 5]])))) {
    console.log(entry[0]);
    console.log(entry[1]);
  }
  for (const value of Object.freeze((new globalThis["Set"](values)))) {
    console.log(value);
  }
  for (const entry of Object.freeze((new globalThis['Map']([[1, 2], [1, 3], [4, 5]])))) {
    console.log(entry[0]);
    console.log(entry[1]);
  }
  for (const value of Object.freeze((new (null ?? Set)(values)))) {
    console.log(value);
  }
  for (const value of Object.freeze((new (false || Set)(values)))) {
    console.log(value);
  }
  for (const entry of Object.freeze((new (null ?? Map)([[1, 2], [1, 3], [4, 5]])))) {
    console.log(entry[0]);
    console.log(entry[1]);
  }
  for (const entry of Object.freeze((new (false || Map)([[1, 2], [1, 3], [4, 5]])))) {
    console.log(entry[0]);
    console.log(entry[1]);
  }
}
"""
