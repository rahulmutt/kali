[matrix]
ext = ["js", "ts", "jsx", "tsx"]

[source]
"app.${ext}" = """// kali-tree-shake: browserStringConcatenation
export async function browserStringConcatenation() {
  const prefix = "he";
  const suffix = "llo";
  const syncChars = [];
  for (const item of prefix + suffix) {
    syncChars.push(item);
  }
  const asyncChars = [];
  for await (const item of prefix + suffix) {
    asyncChars.push(item);
  }
  if (syncChars.join("") !== "hello" || asyncChars.join("") !== "hello") {
    throw new Error('unexpected string concatenation iteration semantics');
  }
  console.log('browser string concatenation ok');
}
"""

[[case]]
name = "string_concatenation_bundle__text"
rationale = """Migrated from browser_string_concatenation_bundle.rs. This `[[case]]` is the text output half of the source's 8 `#[test]` fns, matrix-fanned by `ext(4)` to the four extensions, so it stands for `build_emits_browser_string_concatenation_in_js_input`, `build_emits_browser_string_concatenation_in_ts_input`, `build_emits_browser_string_concatenation_in_jsx_input`, `build_emits_browser_string_concatenation_in_tsx_input` -- one trial per fn, assertion mapping 1:1 (rule 6's sanctioned rule-7 fold, stated here as the rule requires). `fn assert_browser_bundle_string_concatenation(` (:31) writes the string-concatenation iteration probe to `app.<ext>` in a fresh temp dir, builds it with `kali build --bundle --api browser`, asserts the build succeeds  -- `output.status.success(),` (:49), asserts the emitted `app/app.meta.json` metadata (`join("app.meta.json")` (:72)), then writes the browser-bundle harness and runs it under node. THE BUILD SUCCEEDS; it is the HARNESS process that must fail closed (`assert!(!output.status.success(), "must fail closed` (:106)), so the `browser_bundle_harness` step carries `exit = "failure"` and no output claim -- the source makes none there, and inventing one would break rule 2. The program under test is `fn browser_bundle_string_concatenation_source(` (:10); its text is the byte-exact output of executing that real code (rules 8 and 9), never hand-derived. RULE 12 -- the Rust comment prose of browser_string_concatenation_bundle.rs, carried verbatim: "Honest re-pin (PR #16 rev2): kali fails closed/loud here; see docs/superpowers/followups/pr16-honest-repin-inventory.md.""""

