  for (const key of globalThis["Object"]['keys'](alias)) {
    doubleQuotedSingleQuoted.push(key);
  }
  const bracketed = [];
  for (const key of globalThis["Object"]["keys"](alias)) {
    bracketed.push(key);
  }
