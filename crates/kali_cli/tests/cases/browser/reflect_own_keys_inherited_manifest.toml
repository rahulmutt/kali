r. (The `payload.hostContract` measurement that justified this split before the U4 trim is NOT cited here: those fields are asserted only by the retained `test.rs`, so they no longer cover anything either file claims.) RULE 12 -- the Rust comment prose of the `run` submodule, which is the only one of this target's five files that carries any, carried verbatim: "Honest re-pin (PR #16 rev2): kali fails closed/loud here; see docs/superpowers/followups/pr16-honest-repin-inventory.md. These are local, run-module-only variants of the shared assert_browser_requested_reflect_own_keys / assert_json_browser_requested_reflect_own_keys / assert_inherited_browser_api_surface_reflect_own_keys helpers defined in the parent `browser_reflect_own_keys.rs`. Those shared helpers still have green callers in `test.rs` (out of this batch), so per the shared-helper red-only rule they are left untouched; the command shape is copied here instead and the assertion is narrowed to the honest fail-closed result.""""
