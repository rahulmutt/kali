# Migrated from tests/browser_number_predicates_harness.rs.
#
# RULE 12 (carry every source comment verbatim): `grep -nE '^\s*//'` over
# tests/browser_number_predicates_harness.rs returns NOTHING -- the file has no Rust comments
# at all.
# The file contains no `//` of any kind -- it declares no bundle fixture,
# so there is not even a `// kali-tree-shake:` marker in it.
# There is therefore no prose to move into any `rationale`, and
# comment_coverage.py is run with --allow-empty for this pair.
#
# RULE 7 / U1 -- MATRIX ARITHMETIC, and it closes exactly.
# 16 `#[test]` fns, 16 real helper invocations with every loop
# expanded:
#   * `assert_browser_harness_number_predicates` -- 16 invocation(s) = command(run/test) x ext(js/ts/jsx/tsx) x
#     json_output(false/true), a complete cross product
# `ext` is the ONE axis every case varies over uniformly, and every helper covers
# all 4 of its values, so a file-wide axis fans nothing the source never ran:
# 4 `[[case]]` entries x ext(4) = 16 trials = 16 invocations. Exact.
# `command` and `json_output` are NOT matrix axes, per rule 7 and design spec 5.6's own note:
# each changes the ASSERTION SHAPE rather than substituting a string.
# `json_output` switches between a text claim and a JSON-envelope claim.
# `command` switches the envelope's payload between `exitCode` (run) and
# `total`/`passed`/`failed` (test).
# Each is written as sibling `[[case]]` entries instead.
#
# RULE 6 -- 1:1 MAPPING, and the fold is stated here as the rule requires.
# Each `[[case]]` below corresponds to 4 source `#[test]` fns, one per `ext` cell; the assertion mapping stays
# 1:1 per trial, so no claim is lost, but a failing trial's id reads its matrix cell
# rather than a source fn name.
#
# U2 -- `[source]` is FILE-WIDE, and that is safe here. Every fixture
# (`main.${ext}`, `smoke.test.${ext}`)
# is written unconditionally by the source into a fresh temp dir: no fixture is written
# behind an `if`, and no case's point is the presence or absence of a file.
# Every command below names its entry explicitly on argv, so the unused siblings in
# a trial dir are inert.
#
# RULE 8 / RULE 9 -- both [source] programs are built one level removed, inside
# kali_common, by `format!`, so neither appears as a string literal in this `.rs`.
# Both bodies below are the byte-exact OUTPUT of executing the real builders,
# captured by a temporary test target that `include!`d this `.rs` and dumped their
# return values; the procedure is recorded in
# `tools/task-18-browser-pilot/batch6a_captures.py`.
#
# CHECK_FIXTURES.PY IS VACUOUS ON THIS PAIR, AND THAT REPORT IS CORRECT.
# `verify_pair.sh number_predicates_harness` exits non-zero at the rule-9 fixture
# arm with `VACUOUS: no fixture-shaped literals found`. That is a true statement
# about this `.rs`: BOTH of its fixtures are built inside kali_common, so the file
# contains no program-shaped string literal for the gate to compare -- its `.rs`
# holds only the two builder call sites and the assertion needles. The gate's
# vacuity floor is doing exactly its job (a vacuous green is the dangerous
# direction) and it is NOT worked around here.
# The real check is the same gate pointed at the crate that actually holds the
# fixtures, which is where rule 9's one-level-removed clause puts it:
#   python3 tools/task-18-browser-pilot/check_fixtures.py \
#       crates/kali_common/src/number.rs \
#       crates/kali_cli/tests/cases/browser/number_predicates_harness.toml \
#       crates/kali_cli/tests/cases/browser/number_predicates_bundle.toml
# It exits 0, over a corpus of 66 fixtures against the two case files together --
# strictly more than the pairwise run could ever have checked. Run it whenever
# either of those two case files changes.
#
# RULE 13 -- transitive helper docs. Checked every fn in each call chain:
#   `kali_bin`, `browser_number_predicates_run_source`,
#   `browser_number_predicates_test_source`,
#   `assert_browser_harness_number_predicates` -- none carries a `///` doc comment.
# The chain DOES reach `///`-documented helpers in `kali_common` whose OUTPUT this
# case file reproduces in [source], so their docs are claim prose and are carried
# into the rationale of every case that helper's text reaches (ruling 6's test:
# carry the docs if the migrated case still depends on what the helper computed).
# The chain also reaches `kali_runtime_contract::browser_bundle_harness_script` and
# `::browser_harness_command_parts_for`, which DO carry one-line `///` docs. Those are
# NOT carried: in the migrated form this case file never calls them -- the
# `browser_bundle_harness` step kind means the case RUNNER does
# (crates/kali_case_runner/src/steps.rs) -- so their docs describe shared runner
# infrastructure documented in design spec 5.3, not what this case claims. That is
# controller ruling 6, which writes the exemption into the rule rather than leaving it
# to implementer discretion.
# The documented chain, in call order, all in crates/kali_common/src/number.rs:
#   number_predicates_runtime_source and number_predicates_test_source, each of
#   which calls number_predicates_preamble_source and
#   number_predicates_console_log_body_source.
# Their `///` docs are extracted from that file by this generator, not retyped,
# and carried verbatim into the rationale of every case they reach -- the
# runtime-source doc into the `run` cases only and the Kali.test-source doc into
# the `test` cases only, per U6, never pooled across both.
#
# ARGV ORDER is transcribed in the exact order the source's `Command` builder appends it,
# which differs between the two helper shapes and is not normalised here:
#   * build:   `build --bundle --api browser [--output json] <entry>` -- the `--output json`
#              pair is appended AFTER the subcommand and its flags.
#   * run/test: `[--output json] <run|test> --api browser [--max-threads 0
#              --max-spawned-processes 0] <entry>` -- the `--output json` pair is appended
#              BEFORE the subcommand.
# The source passes an absolute `dir.path().join(filename)` as the entry; the case runner
# passes the bare filename relative to the trial dir, matching every previously shipped
# `browser/` case file.
#
# ASSERTION SHAPE, mirrored from the source and nothing more.
# `exit = "success"` on the one `kali` process (:44); the environment carries
# KALI_BROWSER_BUNDLE_HARNESS_COMMAND=node (:31). The source passes no --max-threads /
# --max-spawned-processes arguments, so neither appears on argv.
# json mode carries schemaVersion/command/success/payload(hostContract,
# runtimeBackend) (:52-56).
# THE TWO JSON BRANCHES ASSERT THE SAME LEAF IN DIFFERENT SHAPES, and the difference
# is preserved rather than normalised:
#   * `run` asserts `exitCode` at both levels (:58) and then an EXACT
#     `assert_eq!(json["stdout"], ...)` (:61) -- already exact in
#     the source, so ruling 3's exact-source-assertion direction applies directly.
#   * `test` asserts payload total/passed/failed/skipped (:68 is the
#     last of the four) and a `.contains(...)` on the same leaf
#     (:69) -- a plain `.contains` against a JSON leaf, which
#     has no substring form, so ruling 3 makes it an exact pin, live-captured.
# Both land on the same string, and the live capture asserts that across all eight
# run/test x ext cells before either is emitted.
# Both branches then carry `stderr = ""` (:74). Neither reads `errors`,
# so no `errors` claim is written.
# Text mode carries the same needle against raw stdout (:78) and, for
# `test` only, `.contains("ok 1")` (:84).
# This file uses no count key: the source makes no `.matches(...).count()` claim.

[matrix]
ext = ["js", "ts", "jsx", "tsx"]

