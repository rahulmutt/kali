[matrix]
ext = ["js", "ts", "jsx", "tsx"]

[source]
"main.${ext}" = """function assertObjectKeysIteration(keys) {
  if (keys.length !== 1 || keys[0] !== 'a') {
    throw new Error('unexpected Object.keys break/continue iteration semantics');
  }
}

function browserObjectKeysBreakContinueIteration() {
  const values = { "b": 1, "a": 2 };
  const alias = values;
  const keys = [];
  for (const key of Object.keys(alias)) {
    if (key === 'b') {
      continue;
    }
    keys.push(key);
    break;
  }
  const propertyKeys = [];
  for (const key of Object.freeze((globalThis['Object']).keys)(alias)) {
    if (key === 'b') {
      continue;
    }
    propertyKeys.push(key);
    break;
  }
  assertObjectKeysIteration(keys);
  assertObjectKeysIteration(propertyKeys);
  console.log('browser object keys break/continue iteration ok');
}

browserObjectKeysBreakContinueIteration();
"""
"smoke.test.${ext}" = """Kali.test('object keys break/continue iteration', () => {
  function assertObjectKeysIteration(keys) {
    if (keys.length !== 1 || keys[0] !== 'a') {
      throw new Error('unexpected Object.keys break/continue iteration semantics');
    }
  }

  const values = { "b": 1, "a": 2 };
  const alias = values;
  const keys = [];
  for (const key of Object.keys(alias)) {
    if (key === 'b') {
      continue;
    }
    keys.push(key);
    break;
  }
  const propertyKeys = [];
  for (const key of Object.freeze((globalThis['Object']).keys)(alias)) {
    if (key === 'b') {
      continue;
    }
    propertyKeys.push(key);
    break;
  }
  assertObjectKeysIteration(keys);
  assertObjectKeysIteration(propertyKeys);
  console.log('browser object keys break/continue iteration ok');
});
"""

[[case]]
name = "run_supports_object_keys_break_continue_when_browser_harness_is_configured"
rationale = """Migrated from browser_object_keys_break_continue_harness.rs, the four `run_supports_object_keys_break_continue_when_browser_harness_is_configured_in_*_input` fns (one per extension). `assert_browser_harness_object_keys_break_continue` writes the break/continue Object.keys run fixture `.expect("write source")` (:85) and asks `kali` to run it against the browser API surface with the browser harness backed by node. The program iterates Object.keys over a two-key object, continues past the first key and breaks after pushing the second, then repeats the same loop through a frozen single-quoted parenthesized-receiver property spelling and checks both collected arrays. kali does not support that: the source's ONLY assertion is that the process fails `assert!(!output.status.success()` (:108), so this step carries `exit = "failure"` and nothing else. Adding a diagnostic code or a stdout claim the source never made would be a rule-2 invention, and `exit = "failure"` is exactly as strong as the assertion it replaces. RULE 12 -- the Rust comment prose of browser_object_keys_break_continue_harness.rs, carried verbatim: "Honest re-pin (PR #16 rev2): kali fails closed/loud here; see docs/superpowers/followups/pr16-honest-repin-inventory.md.""""
args = ["run", "--api", "browser", "--max-threads", "0", "--max-spawned-processes", "0", "main.${ext}"]
env = { KALI_BROWSER_BUNDLE_HARNESS_COMMAND = "node" }
exit = "failure"

