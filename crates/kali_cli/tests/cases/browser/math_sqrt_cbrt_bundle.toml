# EXTRA-CLAIM DECLARATIONS (U14's `extra` direction).
# check_extra_claims.py compares this file's claim strings against the source's and fails
# on any that appear nowhere in the .rs. The entries below are the deliberate exceptions;
# a genuinely new one will not be on this list and will fail the gate.
# EXTRA-OK: '0' -- the source's `.contains('0')` CHAR literal, carried per rule 1; `check_extra_claims.py` accepts it because the character does occur in the .rs, but the audit's own extractor never saw it
# Migrated from tests/browser_math_sqrt_cbrt_bundle.rs.
#
# RULE 12 (carry every source comment verbatim): `grep -nE '^\s*//'` over
# tests/browser_math_sqrt_cbrt_bundle.rs returns NOTHING -- the file has no Rust comments
# at all.
# The 1 other `//` occurrence(s) in the file (:11) sit
# inside JS fixture bodies, which is program text carried verbatim into
# [source], not Rust prose.
# There is therefore no prose to move into any `rationale`, and
# comment_coverage.py is run with --allow-empty for this pair.
#
# RULE 7 / U1 -- MATRIX ARITHMETIC, and it closes exactly.
# 8 `#[test]` fns, 8 real helper invocations with every loop
# expanded:
#   * `assert_browser_bundle_math_sqrt_cbrt` -- 8 invocation(s) = ext(js/ts/jsx/tsx) x json_output(false/true), a complete cross
#     product. Every `#[test]` fn is one unlooped call and the file
#     contains no loop at all.
# `ext` is the ONE axis every case varies over uniformly, and every helper covers
# all 4 of its values, so a file-wide axis fans nothing the source never ran:
# 2 `[[case]]` entries x ext(4) = 8 trials = 8 invocations. Exact.
# `json_output` is NOT a matrix axis, per rule 7 and design spec 5.6's own note:
# it changes the ASSERTION SHAPE rather than substituting a string.
# `json_output` switches between a text claim and a JSON-envelope claim.
# It is written as sibling `[[case]]` entries instead.
#
# RULE 6 -- 1:1 MAPPING, and the fold is stated here as the rule requires.
# Each `[[case]]` below corresponds to 4 source `#[test]` fns, one per `ext` cell; the assertion mapping stays
# 1:1 per trial, so no claim is lost, but a failing trial's id reads its matrix cell
# rather than a source fn name.
#
# U2 -- `[source]` is FILE-WIDE, and that is safe here. Every fixture
# (`app.${ext}`)
# is written unconditionally by the source into a fresh temp dir: no fixture is written
# behind an `if`, and no case's point is the presence or absence of a file.
# Every command below names its entry explicitly on argv, so the unused siblings in
# a trial dir are inert.
#
# RULE 10 -- A GENUINE JS TEMPLATE LITERAL, ESCAPED THROUGH `[constants]`.
# The browser-bundle harness body (`console.log` :77) interpolates the JS binding the
# fixture itself declares into an Error message, with a real JS template literal.
# `expand.rs`'s `substitute()` hard-fails on any `${...}` it cannot resolve, and a
# step `body` IS substituted, so this file declares `[constants] dollar = "$"` and
# spells the genuine `${` as `${dollar}{`. The RESOLVED program text is byte-identical
# to the source's -- this is an encoding of rule 9, not an exception to it.
# This is the first pair in the family to need it while its `.rs` still exists, so
# note what `check_fixtures.py` does with it: the stored body differs from the `.rs`
# literal by exactly that escape, so the gate falls through to its `format!`-segment
# arm and matches on the segments either side of the placeholder. It exits 0, and its
# "format!-built (segments matched)" label is the only inaccuracy -- reported, not
# worked around.
#
# RULE 13 -- transitive helper docs. Checked every fn in each call chain:
#   `kali_bin`, `browser_bundle_math_sqrt_cbrt_source`,
#   `assert_browser_bundle_math_sqrt_cbrt` -- none carries a `///` doc comment.
# The chain also reaches `kali_runtime_contract::browser_bundle_harness_script` and
# `::browser_harness_command_parts_for`, which DO carry one-line `///` docs. Those are
# NOT carried: in the migrated form this case file never calls them -- the
# `browser_bundle_harness` step kind means the case RUNNER does
# (crates/kali_case_runner/src/steps.rs) -- so their docs describe shared runner
# infrastructure documented in design spec 5.3, not what this case claims. That is
# controller ruling 6, which writes the exemption into the rule rather than leaving it
# to implementer discretion.
#
# ARGV ORDER is transcribed in the exact order the source's `Command` builder appends it,
# which differs between the two helper shapes and is not normalised here:
#   * build:   `build --bundle --api browser [--output json] <entry>` -- the `--output json`
#              pair is appended AFTER the subcommand and its flags.
#   * run/test: `[--output json] <run|test> --api browser [--max-threads 0
#              --max-spawned-processes 0] <entry>` -- the `--output json` pair is appended
#              BEFORE the subcommand.
# The source passes an absolute `dir.path().join(filename)` as the entry; the case runner
# passes the bare filename relative to the trial dir, matching every previously shipped
# `browser/` case file.
#
# ASSERTION SHAPE, mirrored from the source and nothing more.
# `exit = "success"` on the `kali build` process (:38) and on the
# browser-bundle harness process (`output.status.success()` :98).
# In json mode, the build envelope's schemaVersion/command/success/exitCode and the
# payload's artifactKind/bundleFormat (`envelope["payload"].as_object().expect("payload object")` :46-52), AND an
# empty `errors` array (:53-56).
# The emitted app/app.meta.json apiSurface/artifactKind (`metadata["apiSurface"]` :64-65)
# is asserted in BOTH modes, because the source reads that file outside the
# `if json_output` block.
# The harness step carries this file's THREE stdout claims: `.contains("2\n")`
# (`stdout.contains(...)` :104), `.contains("-3\n")` (:105) and `.contains('0')`
# (`stdout.contains('0')` :106). The third is a CHAR literal, which
# `audit-case-migration.py`'s `.contains` extractor does not see (its literal pattern
# requires double quotes), so nothing would have reported it missing -- it is carried
# anyway, because rule 1 is about the source's claims and not about what the audit
# can see.
# There is no count claim in this file, so no `stdout_count`; no stderr claim on
# either process; and the build envelope's stdout leaf is never read, so no
# `json.stdout` pin.
# The source passes no --max-threads / --max-spawned-processes arguments, so neither
# appears on argv.

[constants]
dollar = "$"

[matrix]
ext = ["js", "ts", "jsx", "tsx"]

[source]
"app.${ext}" = """// kali-tree-shake: mathSqrtCbrtZeroIdentities
async function mathSqrtCbrtZeroIdentities(left, right) {
  console.log(Math.sqrt(4));
  console.log(Math.cbrt(-27));
  return left - left + right - right;
}
"""

[[case]]
name = "build_emits_math_sqrt_and_cbrt_zero_identities"
rationale = """Migrated from browser_math_sqrt_cbrt_bundle.rs, the four `build_emits_math_sqrt_and_cbrt_zero_identities_in_*_input` fns (one per extension). `assert_browser_bundle_math_sqrt_cbrt` builds a browser bundle with `kali build --bundle --api browser`, asserts the emitted app/app.meta.json metadata, then runs the bundle glue under the browser-bundle-harness contract backed by node, against a program that computes Math.sqrt(4) and Math.cbrt(-27) -- so its two console.log calls print 2 and -3 -- and whose harness body additionally calls the exported function with two BigInt arguments and prints String(result), which is 0. Its three claims about that output are separate source lines: `.contains("2\\n")` (:104), `.contains("-3\\n")` (:105) and the char-literal `.contains('0')` (:106); all three are carried. The source spells this as a plain `.contains(...)` against raw stdout, so it is carried as stdout_contains and NOT strengthened to an exact pin -- controller ruling 3, mirror the source: a plain `.contains` against a field that HAS a substring form keeps the substring form even though the exact output was observed."""

[[case.step]]
args = ["build", "--bundle", "--api", "browser", "app.${ext}"]
exit = "success"

[[case.step]]
kind = "file_json"
path = "app/app.meta.json"
fields = { apiSurface = "browser", artifactKind = "bundle" }

[[case.step]]
kind = "browser_bundle_harness"
entry = "app"
body = """const mod = await import(bundleJs.href);
const result = await mod.mathSqrtCbrtZeroIdentities(1n, 2n);
if (result !== 0n) {
  throw new Error(`unexpected result ${dollar}{result}`);
}
console.log(String(result));
"""
exit = "success"
stdout_contains = ["2\n", "-3\n", "0"]

[[case]]
name = "json_build_emits_math_sqrt_and_cbrt_zero_identities"
rationale = """Migrated from browser_math_sqrt_cbrt_bundle.rs, the four `json_build_emits_math_sqrt_and_cbrt_zero_identities_in_*_input` fns (one per extension). `assert_browser_bundle_math_sqrt_cbrt` builds a browser bundle with `kali build --bundle --api browser`, asserts the emitted app/app.meta.json metadata, then runs the bundle glue under the browser-bundle-harness contract backed by node, against a program that computes Math.sqrt(4) and Math.cbrt(-27) -- so its two console.log calls print 2 and -3 -- and whose harness body additionally calls the exported function with two BigInt arguments and prints String(result), which is 0. Its three claims about that output are separate source lines: `.contains("2\\n")` (:104), `.contains("-3\\n")` (:105) and the char-literal `.contains('0')` (:106); all three are carried. The source spells this as a plain `.contains(...)` against raw stdout, so it is carried as stdout_contains and NOT strengthened to an exact pin -- controller ruling 3, mirror the source: a plain `.contains` against a field that HAS a substring form keeps the substring form even though the exact output was observed. This sibling additionally asserts the build JSON envelope -- schemaVersion/command/success/exitCode, payload artifactKind/bundleFormat, and the empty `errors` array the source checks at :53-56 -- rather than plain text; output shape is not a matrix axis because it changes the assertion shape, so it is a separate case."""

[[case.step]]
args = ["build", "--bundle", "--api", "browser", "--output", "json", "app.${ext}"]
exit = "success"
json = { schemaVersion = 1, command = "build", success = true, exitCode = 0, payload = { artifactKind = "bundle", bundleFormat = "esm" }, errors = [] }

[[case.step]]
kind = "file_json"
path = "app/app.meta.json"
fields = { apiSurface = "browser", artifactKind = "bundle" }

[[case.step]]
kind = "browser_bundle_harness"
entry = "app"
body = """const mod = await import(bundleJs.href);
const result = await mod.mathSqrtCbrtZeroIdentities(1n, 2n);
if (result !== 0n) {
  throw new Error(`unexpected result ${dollar}{result}`);
}
console.log(String(result));
"""
exit = "success"
stdout_contains = ["2\n", "-3\n", "0"]
