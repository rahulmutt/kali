[matrix]
ext = ["js", "ts", "jsx", "tsx"]

[source]
"app.${ext}" = """// kali-tree-shake: forOfArrayIterationSequenceWrapper
function forOfArrayIterationSequenceWrapper() {
  let count = 0;
  for (const item of (0, [(0, 1), (0, 2)])) {
    console.log(++count);
  }
}
"""

[[case]]
name = "build_emits_for_of_sequence_wrapper"
rationale = """Migrated from browser_for_of_array_iteration_sequence_wrappers.rs. `assert_browser_bundle_for_of_sequence_wrapper` builds a browser bundle (`kali build --bundle --api browser`), asserts the emitted `app/app.meta.json` metadata, then runs the bundle glue under the browser-bundle-harness contract and checks that the sequence-wrapped `for (const item of (0, [(0, 1), (0, 2)]))` loop printed both `1` and `2`. `ext` (js/ts/jsx/tsx) is hoisted to a file-level [matrix] axis: 8 #[test] fns collapse to 2 [[case]] entries here, matrix-fanned to 8 trials, matching the 8 real per-(ext,json_output) invocations in source exactly (see the file header's arithmetic). Source's stdout claim is a plain `.contains`, mirrored as `stdout_contains` rather than strengthened to an exact pin."""

[[case.step]]
args = ["build", "--bundle", "--api", "browser", "app.${ext}"]
exit = "success"

[[case.step]]
kind = "file_json"
path = "app/app.meta.json"
fields = { "apiSurface" = "browser", "artifactKind" = "bundle" }

[[case.step]]
kind = "browser_bundle_harness"
entry = "app"
body = """const mod = await import(bundleJs.href);
await mod.forOfArrayIterationSequenceWrapper();
"""
exit = "success"
stdout_contains = ["1\n", "2\n"]

[[case]]
name = "json_build_emits_for_of_sequence_wrapper"
rationale = """Migrated from browser_for_of_array_iteration_sequence_wrappers.rs. `assert_browser_bundle_for_of_sequence_wrapper` builds a browser bundle (`kali build --bundle --api browser --output json`), asserts the JSON envelope's schemaVersion/command/success/exitCode/payload (artifactKind, bundleFormat) fields and that `errors` is empty, then asserts the emitted `app/app.meta.json` metadata, then runs the bundle glue under the browser-bundle-harness contract and checks that the sequence-wrapped `for (const item of (0, [(0, 1), (0, 2)]))` loop printed both `1` and `2`. `ext` (js/ts/jsx/tsx) is hoisted to a file-level [matrix] axis: 8 #[test] fns collapse to 2 [[case]] entries here, matrix-fanned to 8 trials, matching the 8 real per-(ext,json_output) invocations in source exactly (see the file header's arithmetic). Source's stdout claim is a plain `.contains`, mirrored as `stdout_contains` rather than strengthened to an exact pin."""

[[case.step]]
args = ["build", "--bundle", "--api", "browser", "--output", "json", "app.${ext}"]
exit = "success"
json = { "schemaVersion" = 1, "command" = "build", "success" = true, "exitCode" = 0, "payload" = { "artifactKind" = "bundle", "bundleFormat" = "esm" }, "errors" = [] }

[[case.step]]
kind = "file_json"
path = "app/app.meta.json"
fields = { "apiSurface" = "browser", "artifactKind" = "bundle" }

[[case.step]]
kind = "browser_bundle_harness"
entry = "app"
body = """const mod = await import(bundleJs.href);
await mod.forOfArrayIterationSequenceWrapper();
"""
exit = "success"
stdout_contains = ["1\n", "2\n"]
