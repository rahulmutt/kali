rationale = """Migrated from browser_for_of_array_iteration_harness_wrappers_js_input.rs. Every one of this file's 40 #[test] fns is an individual (zero-loop) call to `assert_browser_harness_for_of_wrapper(command, filename, source, json_output)`. No [matrix]: the `satisfies` variant is exercised in only js and tsx (not ts/jsx), so a file-level `ext` axis would either invent an untested (satisfies, ts)/(satisfies, jsx) case or require excluding a case from an axis the format cannot express. Source asserts the JSON envelope's schemaVersion/command/success/payload (hostContract, runtimeBackend) fields, that `stderr` is exactly empty, that `errors` is empty, and that `json["stdout"]` contains both `1` and `2`; a nested `json` leaf has no substring-assertion form in this format, so that claim is resolved to an exact pin -- live-captured from the real `kali` binary, never hand-computed, and strictly stronger than source's two `.contains()` checks. `exit = "success"` folds both `assert!(output.status.success())` and `assert_eq!(output.status.code(), Some(0))`. `[source]` filenames are disambiguated with a variant-suffix stem (`main_<variant>.<ext>`) because source reuses the bare name `main.<ext>` across all three variants and the `[source]` table is one flat file-wide namespace; the filename is only ever the bare CLI positional argument, never read back inside a fixture body, so renaming it changes no claim."""
args = ["--output", "json", "test", "--api", "browser", "--max-threads", "0", "--max-spawned-processes", "0", "main_parenthesized_const_alias.tsx"]
env = { "KALI_BROWSER_BUNDLE_HARNESS_COMMAND" = "node" }
exit = "success"
json = { "schemaVersion" = 1, "command" = "test", "success" = true, "payload" = { "hostContract" = "browser-requested", "runtimeBackend" = "browser-harness" }, "stdout" = "1\n2\n", "stderr" = "", "errors" = [] }
