  const values = { "b": 1, "a": 2 };
  const alias = values;
  const collected = [];
  for (const value of Object.values(alias)) {
    collected.push(value);
  }
  assertObjectValuesIteration(collected);
  console.log('browser object values iteration ok');
}

browserObjectValuesIteration();
