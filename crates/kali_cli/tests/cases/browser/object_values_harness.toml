rationale = """Migrated from browser_object_values_harness.rs, the source fn `run_supports_frozen_object_values_spread_iteration_when_browser_harness_is_configured`, its `--output json` half (rule 5: that fn loops all four extensions and makes two independent invocations per extension, so it becomes two named siblings carrying the loop coordinate rather than one folded case). The fn builds its own `Command` rather than routing through `assert_browser_harness_object_values_spread`, and writes the frozen spread fixture and asks `kali` to run it against the browser API surface with the browser harness backed by node. The program spreads Object.values over an Object.fromEntries result through nine bracketed, single-quoted and mixed root spellings and checks every collected array, with the fromEntries result itself wrapped in `Object.freeze(...)`. kali does not support that: the source's ONLY assertion is that the process fails `assert!(!output.status.success()` (:733), so this step carries `exit = "failure"` and nothing else. RULE 12 -- the Rust comment prose of browser_object_values_harness.rs, carried verbatim: "Honest re-pin (PR #16 rev2): kali fails closed/loud here; see docs/superpowers/followups/pr16-honest-repin-inventory.md. Inlined (not routed through assert_browser_harness_object_values_spread): that helper also serves out-of-batch callers that are still green, so it is left untouched.""""
args = ["--output", "json", "run", "--api", "browser", "--max-threads", "0", "--max-spawned-processes", "0", "main_frozen_spread.${ext}"]
env = { KALI_BROWSER_BUNDLE_HARNESS_COMMAND = "node" }
exit = "failure"

