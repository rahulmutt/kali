# The source spells this as a plain `.contains(...)` against raw stdout, so it is carried as stdout_contains and NOT strengthened to an exact pin -- controller ruling 3, mirror the source: a plain `.contains` against a field that HAS a substring form keeps the substring form even though the exact output was observed.

[matrix]
ext = ["js", "ts", "jsx", "tsx"]

[source]
"app.${ext}" = """// kali-tree-shake: objectIsVoidUndefined
function objectIsVoidUndefined() {
  const alias = void 0;
  console.log(Object.is(alias, void 0));
  console.log(globalThis.Object.is(alias, void 0));
  console.log(globalThis["Object"]["is"](alias, void 0));
  return [Object.is(alias, void 0), globalThis.Object.is(alias, void 0), globalThis["Object"]["is"](alias, void 0)];
}
"""

[[case]]
name = "build_emits_object_is_void_undefined"
rationale = """Migrated from browser_object_is_void_undefined_bundle.rs, the four `build_emits_object_is_void_undefined_in_*_input` fns (one per extension). `assert_browser_bundle_object_is_void_undefined` writes the void-0 Object.is fixture, builds it with `kali build --bundle --api browser`, asserts the emitted app/app.meta.json metadata, then runs the bundle glue under the browser-bundle-harness contract backed by node. The program aliases `void 0` and prints Object.is(alias, void 0) through the dotted and bracketed `globalThis` roots -- three `true` lines -- then returns them as an array. Both processes succeed (`output.status.success(),` (:44), `output.status.success(),` (:96)), and the harness's only output claim is `stdout.contains("1\\n1\\n1\\n")` (:102). The source spells this as a plain `.contains(...)` against raw stdout, so it is carried as stdout_contains and NOT strengthened to an exact pin -- controller ruling 3, mirror the source: a plain `.contains` against a field that HAS a substring form keeps the substring form even though the exact output was observed."""

[[case.step]]
args = ["build", "--bundle", "--api", "browser", "app.${ext}"]
exit = "success"

[[case.step]]
kind = "file_json"
path = "app/app.meta.json"
fields = { apiSurface = "browser", artifactKind = "bundle" }

[[case.step]]
kind = "browser_bundle_harness"
entry = "app"
body = """const mod = await import(bundleJs.href);
await mod.objectIsVoidUndefined();
"""
exit = "success"
stdout_contains = ["1\n1\n1\n"]

[[case]]
name = "json_build_emits_object_is_void_undefined"
rationale = """Migrated from browser_object_is_void_undefined_bundle.rs, the four `json_build_emits_object_is_void_undefined_in_*_input` fns (one per extension). `assert_browser_bundle_object_is_void_undefined` writes the void-0 Object.is fixture, builds it with `kali build --bundle --api browser` with `--output json`, asserts the emitted app/app.meta.json metadata, then runs the bundle glue under the browser-bundle-harness contract backed by node. The program aliases `void 0` and prints Object.is(alias, void 0) through the dotted and bracketed `globalThis` roots -- three `true` lines -- then returns them as an array. Both processes succeed (`output.status.success(),` (:44), `output.status.success(),` (:96)), and the harness's only output claim is `stdout.contains("1\\n1\\n1\\n")` (:102). The source spells this as a plain `.contains(...)` against raw stdout, so it is carried as stdout_contains and NOT strengthened to an exact pin -- controller ruling 3, mirror the source: a plain `.contains` against a field that HAS a substring form keeps the substring form even though the exact output was observed. This sibling additionally asserts the build JSON envelope -- schemaVersion/command/success/exitCode and payload artifactKind/bundleFormat `assert_eq!(payload["bundleFormat"], "esm")` (:58) -- rather than plain text; output shape is not a matrix axis because it changes the assertion shape, so it is a separate case. Note this source makes NO `errors = []` claim, unlike most bundle targets in this family, so none is asserted here (rule 2)."""

[[case.step]]
args = ["build", "--bundle", "--api", "browser", "--output", "json", "app.${ext}"]
exit = "success"
json = { schemaVersion = 1, command = "build", success = true, exitCode = 0, payload = { artifactKind = "bundle", bundleFormat = "esm" } }

[[case.step]]
kind = "file_json"
path = "app/app.meta.json"
fields = { apiSurface = "browser", artifactKind = "bundle" }

[[case.step]]
kind = "browser_bundle_harness"
entry = "app"
body = """const mod = await import(bundleJs.href);
await mod.objectIsVoidUndefined();
"""
exit = "success"
stdout_contains = ["1\n1\n1\n"]
