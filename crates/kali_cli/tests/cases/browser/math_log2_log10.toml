rationale = """Migrated from browser_math_log2_log10.rs. `assert_browser_bundle_math_log2_log10` builds a browser bundle (`kali build --bundle --api browser`), asserts the emitted `app/app.meta.json` metadata, then runs the bundle glue under the browser-bundle-harness contract and checks that the log2/log10 identity output appears: Math.log2(8), frozenLog2(8), Math.log10(1000) and frozenLog10(1000) each print `3`. The source makes TWO separate claims about that output -- `stdout.contains("3\\n")` (:106) and `stdout.matches("3\\n").count() >= 2` (:107) -- so both are carried, as `stdout_contains` and `stdout_count` respectively. The count is mirrored at `at_least = 2` exactly as the source spells it; the real output contains four occurrences, but pinning `exact = 4` would assert something the source never claimed. This sibling asserts the JSON output envelope (schemaVersion/command/success/exitCode, payload artifactKind and bundleFormat, and an empty `errors` array) rather than plain text; output shape is not a matrix axis because it changes the assertion shape, so it is a separate case."""

[[case.step]]
args = ["build", "--bundle", "--api", "browser", "--output", "json", "app.${ext}"]
