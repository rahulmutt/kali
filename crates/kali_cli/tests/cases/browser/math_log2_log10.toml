[[case.step]]
kind = "browser_bundle_harness"
entry = "app"
body = """const mod = await import(bundleJs.href);
await mod.mathLog2Log10Identities();
"""
exit = "success"
stdout_contains = ["3\n"]
stdout_count = [{ needle = "3\n", at_least = 2 }]

