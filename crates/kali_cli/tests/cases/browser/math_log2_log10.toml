# The source adds no `--max-threads`/`--max-spawned-processes` arguments (unlike
# several siblings in this batch), so neither is added here.

[matrix]
ext = ["js", "ts", "jsx", "tsx"]

[source]
"app.${ext}" = """// kali-tree-shake: mathLog2Log10Identities
function mathLog2Log10Identities() {
  const log2Value = 8;
  const log10Value = 1000;
  const frozenLog2 = Object.freeze(Math.log2);
  const frozenLog10 = Object.freeze(Math.log10);
  console.log(Math.log2(log2Value));
  console.log(frozenLog2(log2Value));
  console.log(Math.log10(log10Value));
  console.log(frozenLog10(log10Value));
  return [Math.log2(log2Value), Math.log10(log10Value), frozenLog2(log2Value), frozenLog10(log10Value)];
}
"""
"main.${ext}" = """const frozenLog2 = Object.freeze(Math.log2); const frozenLog10 = Object.freeze(Math.log10); console.log(Math.log2(8)); console.log(frozenLog2(8)); console.log(Math.log10(1000)); console.log(frozenLog10(1000));
"""
"smoke.test.${ext}" = """Kali.test('math log2/log10', () => {
  const frozenLog2 = Object.freeze(Math.log2);
  const frozenLog10 = Object.freeze(Math.log10);
  console.log(Math.log2(8));
  console.log(frozenLog2(8));
  console.log(Math.log10(1000));
  console.log(frozenLog10(1000));
});
"""

[[case]]
name = "build_emits_math_log2_and_log10_identity_literals"
rationale = """Migrated from browser_math_log2_log10.rs. `assert_browser_bundle_math_log2_log10` builds a browser bundle (`kali build --bundle --api browser`), asserts the emitted `app/app.meta.json` metadata, then runs the bundle glue under the browser-bundle-harness contract and checks that the log2/log10 identity output appears: Math.log2(8), frozenLog2(8), Math.log10(1000) and frozenLog10(1000) each print `3`. The source makes TWO separate claims about that output -- `stdout.contains("3\\n")` (:106) and `stdout.matches("3\\n").count() >= 2` (:107) -- so both are carried, as `stdout_contains` and `stdout_count` respectively. The count is mirrored at `at_least = 2` exactly as the source spells it; the real output contains four occurrences, but pinning `exact = 4` would assert something the source never claimed."""

[[case.step]]
args = ["build", "--bundle", "--api", "browser", "app.${ext}"]
exit = "success"

[[case.step]]
kind = "file_json"
path = "app/app.meta.json"
fields = { apiSurface = "browser", artifactKind = "bundle" }

[[case.step]]
kind = "browser_bundle_harness"
entry = "app"
body = """const mod = await import(bundleJs.href);
await mod.mathLog2Log10Identities();
"""
exit = "success"
stdout_contains = ["3\n"]
stdout_count = [{ needle = "3\n", at_least = 2 }]

