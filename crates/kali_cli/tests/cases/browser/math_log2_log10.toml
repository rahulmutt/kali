# command/success/payload(hostContract, runtimeBackend) (`json["command"]` :160-164), plus
# `exitCode`/`payload.exitCode` for `run` (:166-167) or payload total/passed/
# failed for `test` (:169-171), then `json_count` for :173-181, `stderr = ""`
# (`json["stderr"]` :182) and `errors = []` (:183). NO `json.stdout` pin is written: the source
