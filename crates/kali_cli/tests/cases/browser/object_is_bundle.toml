# Migrated from tests/browser_object_is_bundle.rs.
#   SOURCE REF: 28df9ba02962143a1fc1735e418b2f67caee8fc6
#
# RULE 12 (carry every source comment verbatim): `grep -nE '^\s*//'` over
# tests/browser_object_is_bundle.rs returns NOTHING -- the file has no Rust comment lines at
# all. The generator re-derives that on every run and RAISES rather than emitting this
# block if the source ever grows one, so the `--allow-empty` discharge below cannot
# become a vacuous green by drift.
# The file's only other `//` sequences are kali-tree-shake markers inside its
# JS fixture bodies -- program text carried verbatim into [source], not Rust
# prose. The generator checks that every one of them is such a marker:
#   * // kali-tree-shake: browserObjectIs
# There is therefore no prose to move into any `rationale`, and
# comment_coverage.py is run with --allow-empty for this pair.
#
# RULE 7 / U1 -- MATRIX DECLINED, and why.
# 8 `#[test]` fns, 8 real helper invocations with every loop
# expanded.
# `ext` LOOKS like a clean four-value axis and the arithmetic would close
# (2 output modes x 4 extensions = 8 = the invocation count), but the fixture
# BODY is not uniform over it: each `#[test]` fn passes its source explicitly,
# and the `.js`/`.jsx` cells get `browser_bundle_object_is_js_source()` (a bare
# `const zero = 0;`) while the `.ts`/`.tsx` cells get
# `browser_bundle_object_is_ts_source()` (`const zero = (0 as const);`). A
# `[matrix]` axis substitutes one string uniformly into every case (design spec
# 5.6); it cannot select a body.
# Per U1 a `[matrix]` axis is FILE-WIDE -- `expand()` fans EVERY `[[case]]` by the full
# cross-product whether or not that case references the axis, and there is no per-case
# opt-out -- so an axis that any one case does not vary over would manufacture trials
# the source never ran (also a rule-2 invention). Rule 7's own remedy applies: drop
# `[matrix]` for the whole file and write named siblings.
# 8 invocations -> 8 named `[[case]]` entries, no `[matrix]`.
#
# RULE 6 -- 1:1 MAPPING. With no `[matrix]` there is no fold: every `[[case]]` below is
# exactly one real helper invocation of the source, named after the `#[test]` fn that made
# it. Two source fns are never folded into one case even when their invocations are
# literally identical, because the case is the only remaining trace of the fn.
#
# U2 -- `[source]` is FILE-WIDE, and that is safe here. Every fixture
# (`app.js`, `app.jsx`, `app.ts`, `app.tsx`)
# is written unconditionally by the source into a fresh temp dir: no fixture is written
# behind an `if`, and no case's point is the presence or absence of a file.
# Every command below names its entry explicitly on argv, so the unused siblings in
# a trial dir are inert.
# Every entry has the stem `app`, so `kali build --bundle` writes the same `app/` output
# directory whichever one a case names, and only one build runs per trial. No U5 rename
# is needed.
#
# RULING 7 -- DUPLICATE `[source]` BODIES ARE NOT HOISTED. Several entries below hold
# byte-identical program text. U13 would hoist them into `[constants]`; controller ruling 7
# declines that for `browser/` (a hoisted body makes `check_fixtures.py` go red on a correct
# file, and hoisting moves program text onto the surface `assertion_strings()` searches).
# The mandatory half of that ruling is honoured instead: the duplication is asserted
# MECHANICALLY in this file's generator, not eyeballed -- the generator compares the
# extracted fixture strings and raises if they are not byte-identical.
#
# RULE 10 -- NOT NEEDED HERE, and that is checked rather than assumed. `expand.rs`'s
# `substitute()` hard-fails on any `${...}` it cannot resolve, so a fixture carrying a
# genuine JS template literal must declare `[constants] dollar = "$"` and spell the
# genuine `${` as `${dollar}{`. No `[source]` value and no step `body` in this file
# contains `${` at all -- the generator greps every emitted string and raises if one does
# -- so this file declares no `[constants]` table.
#
# RULE 13 -- transitive helper docs. Checked every fn in each call chain:
#   `kali_bin`, `browser_bundle_object_is_js_source`,
#   `browser_bundle_object_is_ts_source`, `assert_browser_bundle_object_is` -- none carries a `///` doc comment.
# The chain also reaches `kali_runtime_contract::browser_bundle_harness_script` and
# `::browser_harness_command_parts_for`, which DO carry one-line `///` docs. Those are
# NOT carried: in the migrated form this case file never calls them -- the
# `browser_bundle_harness` step kind means the case RUNNER does
# (crates/kali_case_runner/src/steps.rs) -- so their docs describe shared runner
# infrastructure documented in design spec 5.3, not what this case claims. That is
# controller ruling 6, which writes the exemption into the rule rather than leaving it
# to implementer discretion.
#
# ARGV ORDER is transcribed in the exact order the source's `Command` builder appends it
# and is not normalised here:
#   * build: `build --bundle --api browser [--output json] <entry>` -- the `--output json`
#            pair is appended AFTER the subcommand and its flags.
# The source passes an absolute `dir.path().join(filename)` as the entry; the case runner
# passes the bare filename relative to the trial dir, matching every previously shipped
# `browser/` case file.
#
# THE `browser_bundle_harness` STEP is the migrated form of the source's own harness run.
# The source writes `kali_runtime_contract::browser_bundle_harness_script("app", false,
# <body>)` next to the emitted bundle directory and executes it under
# `browser_harness_command_parts_for`; the case runner does exactly that from the step's
# `entry` and `body` (crates/kali_case_runner/src/steps.rs). The prelude resolves the
# bundle relative to the harness script's own URL rather than to the process working
# directory, so the runner's cwd (the trial root) and the source's cwd (the bundle dir)
# produce the same resolution -- which is why every previously shipped `browser/` bundle
# case file spells it this way.
#
# ASSERTION SHAPE, mirrored from the source and nothing more.
#   * `exit = "success"` on the build `output.status.success(),` (:60) and on the browser-bundle
#     harness `output.status.success(),` (:116).
#   * In json mode, the build envelope's schemaVersion/command/success/exitCode and the
#     payload's artifactKind/bundleFormat, plus an EMPTY `errors` array `assert!(envelope["errors"]` (:75).
#   * `app/app.meta.json`'s apiSurface/artifactKind `assert_eq!(metadata["apiSurface"], "browser")` (:86), asserted in BOTH
#     modes, because the source reads that file outside the `if json_output` block.
#   * The harness's one stdout claim, `stdout.contains("browser object is ok")` (:122).
# The source spells this as a plain `.contains(...)` against raw stdout, so it is carried as stdout_contains and NOT strengthened to an exact pin -- controller ruling 3, mirror the source: a plain `.contains` against a field that HAS a substring form keeps the substring form even though the exact output was observed.

