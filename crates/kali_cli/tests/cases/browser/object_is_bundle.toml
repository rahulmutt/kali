rationale = """Migrated from browser_object_is_bundle.rs, the source fn `json_build_emits_browser_object_is_in_tsx_input` (one case per source fn, rule 6). `assert_browser_bundle_object_is` writes the `as const` TypeScript variant of the browser Object.is fixture to app.tsx, builds it with `kali build --bundle --api browser` with `--output json`, asserts the emitted app/app.meta.json metadata, then runs the bundle glue under the browser-bundle-harness contract backed by node. The program pins Object.is over signed zeros, awaited aliases, primitives, BigInts, NaN, infinities, frozen objects and every bracketed `globalThis["Object"]["is"]` spelling, then prints its ok line. Both processes succeed (`output.status.success(),` (:60), `output.status.success(),` (:116)), and the harness's only output claim is `stdout.contains("browser object is ok")` (:122). The source spells this as a plain `.contains(...)` against raw stdout, so it is carried as stdout_contains and NOT strengthened to an exact pin -- controller ruling 3, mirror the source: a plain `.contains` against a field that HAS a substring form keeps the substring form even though the exact output was observed. This sibling additionally asserts the build JSON envelope -- schemaVersion/command/success/exitCode, payload artifactKind/bundleFormat, and the empty `errors` array `assert!(envelope["errors"]` (:75) -- rather than plain text; output shape is not a matrix axis because it changes the assertion shape, so it is a separate case."""

[[case.step]]
args = ["build", "--bundle", "--api", "browser", "--output", "json", "app.tsx"]
exit = "success"
json = { schemaVersion = 1, command = "build", success = true, exitCode = 0, payload = { artifactKind = "bundle", bundleFormat = "esm" }, errors = [] }

[[case.step]]
kind = "file_json"
path = "app/app.meta.json"
fields = { apiSurface = "browser", artifactKind = "bundle" }

[[case.step]]
kind = "browser_bundle_harness"
entry = "app"
body = """const mod = await import(bundleJs.href);
await mod.browserObjectIs();
"""
exit = "success"
stdout_contains = ["browser object is ok"]
