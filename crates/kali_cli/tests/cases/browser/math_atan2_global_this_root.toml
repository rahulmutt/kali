[[case.step]]
args = ["build", "--bundle", "--api", "browser", "app_zero_slice.js"]
exit = "success"

[[case.step]]
kind = "file_json"
path = "app_zero_slice/app_zero_slice.meta.json"
fields = { "apiSurface" = "browser", "artifactKind" = "bundle" }

[[case.step]]
kind = "browser_bundle_harness"
entry = "app_zero_slice"
body = """const mod = await import(bundleJs.href);
await mod.globalThisMathAtan2ZeroSlice();
"""
stdout_contains = ["0\n"]

