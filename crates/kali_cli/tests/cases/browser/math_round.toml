  console.log(Math.round(alias));
});
"""
"smoke_alias.test.tsx" = """Kali.test('math round alias chain', () => {
  const value = 1.6;
  const alias = value;
  console.log(Math.round(alias));
});
"""

[[case]]
name = "run_supports_math_round_when_browser_harness_is_configured_in_ts_input"
rationale = """Migrated from browser_math_round.rs, the `#[test]` fn of that name (one of four, one per extension). `assert_browser_harness_math_round` runs `kali run --api browser` with the browser harness backed by node, against a program that prints Math.round(1.6) directly, so 2 is printed once. THE AUDIT CANNOT SEE THIS CLAIM. The source spells it `assert!(stdout.contains('2'), ...)` (:92) with a Rust CHAR literal, and audit-case-migration.py's `.contains` extractor matches double-quoted string literals only, so it yields no audit claim in either direction. It was verified by hand against the source's non-json arm and is carried as stdout_contains = ["2"] -- a bare `2`, exactly as the source spells it, NOT the `"2\\n"` the json branch claims and NOT an exact stdout pin. The source spells this as a plain `.contains(...)` against raw stdout, so it is carried as stdout_contains and NOT strengthened to an exact pin -- controller ruling 3, mirror the source: a plain `.contains` against a field that HAS a substring form keeps the substring form even though the exact output was observed. [matrix] is declined for this whole file -- the two alias text groups run js and ts only while every other group runs all four extensions -- so this is one named case per real helper invocation; see the file header for the arithmetic."""
args = ["run", "--api", "browser", "main.ts"]
env = { KALI_BROWSER_BUNDLE_HARNESS_COMMAND = "node" }
exit = "success"
stdout_contains = ["2"]

