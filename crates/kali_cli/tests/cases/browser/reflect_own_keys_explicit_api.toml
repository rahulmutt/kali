    asyncSequenceCount += 1;
  }
  let frozenAsyncSequenceCount = 0;
  for await (const key of (0, Reflect.ownKeys(frozenObj))) {
    frozenAsyncSequenceCount += 1;
  }
  let breakContinueCount = 0;
