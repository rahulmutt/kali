rationale = """Migrated from browser_reflect_own_keys.rs, the `json_check_accepts_reflect_own_keys_in_jsx_input_on_browser_surface` `#[test]` fn in its `check` `#[path]` submodule (check.rs:14). That fn is a single unlooped helper call, so it maps 1:1 to this one `[[case]]` and keeps the fn's name verbatim -- the case is the only remaining trace of the fn (rule 6). `assert_browser_checked_reflect_own_keys(` (:748) writes the run-mode probe to `main.jsx` and runs `kali check --api browser --output json`, asserting the process succeeds and pinning the envelope's schemaVersion/command/success/exitCode, `payload.filesChecked = 1`, and an empty `errors` array. NOTE THE EXTENSION DOMAIN: `check` is exercised for `jsx` and `tsx` ONLY, never for `js` or `ts`. That is why this file declares no `[matrix]` -- see the header's arithmetic. U2 TWO-FILE SPLIT: this case is in the EXPLICIT-`--api browser` half. `kali.json` appears nowhere in this file's `[source]` table, which is exactly what keeps this case able to FAIL if `--api browser` regressed. The other half is in reflect_own_keys_inherited_manifest.toml. They cannot share a file: `expand()` clones the whole file-level `[source]` map into every trial, so a shared `kali.json` would supply the browser surface to the explicit cases too -- measured, the manifest's presence alone moves `payload.hostContract` from `kali-hosted` to `browser-requested` -- with no literal dropped, so the audit cannot see it, and with the trial still green, so `cargo test` cannot either."""
args = ["check", "--api", "browser", "--output", "json", "main.jsx"]
exit = "success"
json = { schemaVersion = 1, command = "check", success = true, exitCode = 0, payload = { filesChecked = 1 }, errors = [] }

