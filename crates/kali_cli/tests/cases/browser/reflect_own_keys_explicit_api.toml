rationale = """Migrated from browser_reflect_own_keys.rs, the `build_emits_browser_bundle_reflect_own_keys_semantics_in_tsx_input` `#[test]` fn in its `build` `#[path]` submodule (build.rs:19). That fn is a single unlooped helper call, so it maps 1:1 to this one `[[case]]` and keeps the fn's name verbatim -- the case is the only remaining trace of the fn (rule 6). `assert_browser_bundle_reflect_own_keys(` (:665) writes the tree-shakeable `reflectOwnKeysSmoke` bundle fixture to `app.tsx`, builds it with `kali build --bundle --api browser`, asserts the emitted `app/app.meta.json` metadata, then writes the browser-bundle harness and runs it under node. UNLIKE the other bundle targets in this batch, BOTH processes succeed here: the source asserts `output.status.success()` on the harness too, and then `stdout.contains('0')`. So the `browser_bundle_harness` step carries `exit = "success"` and `stdout_contains = ["0"]` -- a plain `.contains` against a field that HAS a substring form, mirrored as `stdout_contains` rather than strengthened to an exact pin (ruling 3). U2 TWO-FILE SPLIT: this case is in the EXPLICIT-`--api browser` half. `kali.json` appears nowhere in this file's `[source]` table, which is exactly what keeps this case able to FAIL if `--api browser` regressed. The other half is in reflect_own_keys_inherited_manifest.toml. They cannot share a file: `expand()` clones the whole file-level `[source]` map into every trial, so a shared `kali.json` would supply the browser surface to the explicit cases too -- measured, the manifest's presence alone moves `payload.hostContract` from `kali-hosted` to `browser-requested` -- with no literal dropped, so the audit cannot see it, and with the trial still green, so `cargo test` cannot either."""

[[case.step]]
args = ["build", "--bundle", "--api", "browser", "app.tsx"]
exit = "success"

[[case.step]]
kind = "file_json"
path = "app/app.meta.json"
fields = { apiSurface = "browser", artifactKind = "bundle" }

[[case.step]]
kind = "browser_bundle_harness"
entry = "app"
body = """const mod = await import(bundleJs.href);
const result = await mod.reflectOwnKeysSmoke(1n, 2n);
if (result !== 0n) {
  throw new Error(`unexpected result ${dollar}{result}`);
}
console.log(String(result));
"""
exit = "success"
stdout_contains = ["0"]

[[case]]
name = "json_build_emits_browser_bundle_reflect_own_keys_semantics_in_tsx_input"
rationale = """Migrated from browser_reflect_own_keys.rs, the `json_build_emits_browser_bundle_reflect_own_keys_semantics_in_tsx_input` `#[test]` fn in its `build` `#[path]` submodule (build.rs:39). That fn is a single unlooped helper call, so it maps 1:1 to this one `[[case]]` and keeps the fn's name verbatim -- the case is the only remaining trace of the fn (rule 6). `assert_browser_bundle_reflect_own_keys(` (:665) writes the tree-shakeable `reflectOwnKeysSmoke` bundle fixture to `app.tsx`, builds it with `kali build --bundle --api browser --output json`, asserts the JSON envelope's schemaVersion/command/success/exitCode and payload(artifactKind, bundleFormat), asserts the emitted `app/app.meta.json` metadata, then writes the browser-bundle harness and runs it under node. UNLIKE the other bundle targets in this batch, BOTH processes succeed here: the source asserts `output.status.success()` on the harness too, and then `stdout.contains('0')`. So the `browser_bundle_harness` step carries `exit = "success"` and `stdout_contains = ["0"]` -- a plain `.contains` against a field that HAS a substring form, mirrored as `stdout_contains` rather than strengthened to an exact pin (ruling 3). This helper does NOT assert that the envelope's `errors` array is empty -- the other five bundle helpers in this batch do -- so no `errors` claim is carried here. Mirroring the source means mirroring what it omits. U2 TWO-FILE SPLIT: this case is in the EXPLICIT-`--api browser` half. `kali.json` appears nowhere in this file's `[source]` table, which is exactly what keeps this case able to FAIL if `--api browser` regressed. The other half is in reflect_own_keys_inherited_manifest.toml. They cannot share a file: `expand()` clones the whole file-level `[source]` map into every trial, so a shared `kali.json` would supply the browser surface to the explicit cases too -- measured, the manifest's presence alone moves `payload.hostContract` from `kali-hosted` to `browser-requested` -- with no literal dropped, so the audit cannot see it, and with the trial still green, so `cargo test` cannot either."""

[[case.step]]
args = ["build", "--bundle", "--api", "browser", "--output", "json", "app.tsx"]
exit = "success"
json = { schemaVersion = 1, command = "build", success = true, exitCode = 0, payload = { artifactKind = "bundle", bundleFormat = "esm" } }

[[case.step]]
kind = "file_json"
path = "app/app.meta.json"
fields = { apiSurface = "browser", artifactKind = "bundle" }

[[case.step]]
kind = "browser_bundle_harness"
entry = "app"
body = """const mod = await import(bundleJs.href);
const result = await mod.reflectOwnKeysSmoke(1n, 2n);
if (result !== 0n) {
  throw new Error(`unexpected result ${dollar}{result}`);
}
console.log(String(result));
"""
exit = "success"
stdout_contains = ["0"]

[[case]]
