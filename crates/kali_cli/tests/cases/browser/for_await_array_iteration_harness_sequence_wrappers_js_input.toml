[matrix]
ext = ["js", "ts", "jsx", "tsx"]

[source]
"main.${ext}" = """// kali-tree-shake: forAwaitArrayIterationSequenceWrapper
let count = 0;
for await (const item of (0, [(0, 1), (0, 2)])) {
  console.log(++count);
}
"""

[[case]]
name = "run_supports_for_await_array_iteration_with_sequence_wrappers_in_browser_api_surface_with_harness"
rationale = "Migrated from browser_for_await_array_iteration_harness_sequence_wrappers_js_input.rs. `assert_browser_harness_for_await_sequence_wrapper(\"run\", ...)` runs `kali run --api browser` under the browser harness (`node`) and, in non-json mode, asserts a clean exit and that stdout contains both `1` and `2`. `ext` (js/ts/jsx/tsx) is hoisted to a file-level [matrix] axis: 5 #[test] fns collapse to 4 [[case]] entries here, matrix-fanned to 16 trials, matching the 16 real per-(command,json_output,ext) invocations in source exactly (see the file header's arithmetic)."
args = ["run", "--api", "browser", "--max-threads", "0", "--max-spawned-processes", "0", "main.${ext}"]
env = { KALI_BROWSER_BUNDLE_HARNESS_COMMAND = "node" }
exit = "success"
stdout_contains = ["1", "2"]

