name = "run_supports_math_clz32_omitted_operands_when_browser_harness_is_configured"
rationale = """Migrated from browser_math_clz32_omitted_operands.rs. `assert_browser_harness_math_clz32_omitted_operands("run", ...)` runs `kali run --api browser` under the browser harness (`node`) and asserts a clean exit plus `stdout.contains('32\\n32\\n32\\n32\\n32\\n32\\n32')` -- a plain `.contains` against a field that has a substring form, so it is mirrored as `stdout_contains` rather than strengthened to an exact pin. `ext` (js/ts/jsx/tsx) is hoisted to a file-level [matrix] axis: 24 #[test] fns collapse to 6 [[case]] entries here, matrix-fanned to 24 trials (see the file header's arithmetic)."""
args = ["run", "--api", "browser", "--max-threads", "0", "--max-spawned-processes", "0", "main.${ext}"]
