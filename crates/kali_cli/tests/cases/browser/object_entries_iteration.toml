rationale = """Migrated from browser_object_entries_iteration.rs, the four `json_build_emits_global_object_entries_iteration_semantics_in_*_input` fns (one per extension). `assert_browser_bundle_global_object_entries_iteration` runs `kali build --bundle --api browser` on a program that reads Object.entries through nine globalThis-rooted access forms, asserts the build SUCCEEDS and that the emitted metadata names the browser bundle, then runs the emitted bundle under the browser-bundle-harness contract and asserts THAT process fails closed. Honest re-pin (PR #16 rev2, family `object-enum`): the build step succeeds (its own success assert above holds honestly); kali fails closed/loud only at browser-bundle execution here (a runtime trap surfacing the fixture's own assertion throw) — this helper's 8 worklist callers are all class A — see docs/superpowers/followups/pr16-honest-repin-inventory.md. MIGRATION NOTE (controller ruling 8): the source fn name says "emits", which is true of the build step, but the test's terminal claim is that the harness run fails. The name is carried unchanged; see this file's header for why. On the json branch the source additionally reads the build envelope's schemaVersion/command/success/exitCode and asserts the `errors` array is empty -- and asserts NO payload field, which is preserved rather than normalised against the other bundle helpers in this batch."""

[[case.step]]
args = ["build", "--bundle", "--api", "browser", "--output", "json", "app_global.${ext}"]
exit = "success"
json = { schemaVersion = 1, command = "build", success = true, exitCode = 0, errors = [] }

[[case.step]]
kind = "file_json"
path = "app_global/app_global.meta.json"
fields = { apiSurface = "browser", artifactKind = "bundle" }

[[case.step]]
kind = "browser_bundle_harness"
entry = "app_global"
body = """const mod = await import(bundleJs.href);
await mod.browserGlobalObjectEntriesIteration();
"""
exit = "failure"
