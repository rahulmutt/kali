# Migrated from tests/browser_nullish_coalescing_harness.rs.
#
# RULE 12 (carry every source comment verbatim): `grep -nE '^\s*//'` over
# tests/browser_nullish_coalescing_harness.rs returns NOTHING -- the file has no Rust comments
# at all.
# The file contains no `//` of any kind -- it declares no bundle fixture,
# so there is not even a `// kali-tree-shake:` marker in it.
# There is therefore no prose to move into any `rationale`, and
# comment_coverage.py is run with --allow-empty for this pair.
#
# RULE 7 / U1 -- MATRIX ARITHMETIC, and it closes exactly.
# 4 `#[test]` fns, 12 real helper invocations with every loop
# expanded:
#   * `assert_browser_harness_nullish_coalescing` -- 12 invocation(s) = command(run/test) x ext(ts/jsx/tsx) x
#     json_output(false/true). Each of the 4 `#[test]` fns
#     is a `for filename in [...]` loop over three
#     filenames, so 4 fns make 12 invocations
# `ext` is the ONE axis every case varies over uniformly, and every helper covers
# all 3 of its values, so a file-wide axis fans nothing the source never ran:
# 4 `[[case]]` entries x ext(3) = 12 trials = 12 invocations. Exact.
# `command` and `json_output` are NOT matrix axes, per rule 7 and design spec 5.6's own note:
# each changes the ASSERTION SHAPE rather than substituting a string.
# `json_output` switches between a text claim and a JSON-envelope claim.
# `command` switches the envelope's payload between `exitCode` (run) and
# `total`/`passed`/`failed` (test).
# Each is written as sibling `[[case]]` entries instead.
# THE AXIS HAS THREE VALUES, NOT FOUR. This source loops over ts, jsx and tsx only;
# it declares no js test at all. A four-value axis would invent four runs the source
# never made (rule 2).
#
# RULE 6 -- 1:1 MAPPING, and the fold is stated here as the rule requires.
# Each `[[case]]` below corresponds to one source `#[test]` fn, whose own `for filename in [...]` loop
# over three filenames is what the three `ext` cells reproduce; the assertion mapping stays
# 1:1 per trial, so no claim is lost, but a failing trial's id reads its matrix cell
# rather than a source fn name.
#
# U2 -- `[source]` is FILE-WIDE, and that is safe here. Every fixture
# (`main.${ext}`, `smoke.test.${ext}`)
# is written unconditionally by the source into a fresh temp dir: no fixture is written
# behind an `if`, and no case's point is the presence or absence of a file.
# Every command below names its entry explicitly on argv, so the unused siblings in
# a trial dir are inert.
#
# RULE 13 -- transitive helper docs. Checked every fn in each call chain:
#   `kali_bin`, `parse_json_stdout`, `browser_run_source`, `browser_test_source`,
#   `assert_browser_harness_nullish_coalescing` -- none carries a `///` doc comment.
# The chain also reaches `kali_runtime_contract::browser_bundle_harness_script` and
# `::browser_harness_command_parts_for`, which DO carry one-line `///` docs. Those are
# NOT carried: in the migrated form this case file never calls them -- the
# `browser_bundle_harness` step kind means the case RUNNER does
# (crates/kali_case_runner/src/steps.rs) -- so their docs describe shared runner
# infrastructure documented in design spec 5.3, not what this case claims. That is
# controller ruling 6, which writes the exemption into the rule rather than leaving it
# to implementer discretion.
#
# ARGV ORDER is transcribed in the exact order the source's `Command` builder appends it,
# which differs between the two helper shapes and is not normalised here:
#   * build:   `build --bundle --api browser [--output json] <entry>` -- the `--output json`
#              pair is appended AFTER the subcommand and its flags.
#   * run/test: `[--output json] <run|test> --api browser [--max-threads 0
#              --max-spawned-processes 0] <entry>` -- the `--output json` pair is appended
#              BEFORE the subcommand.
# The source passes an absolute `dir.path().join(filename)` as the entry; the case runner
# passes the bare filename relative to the trial dir, matching every previously shipped
# `browser/` case file.
#
# ASSERTION SHAPE, mirrored from the source and nothing more, and this file's shape
# is unusual: IT MAKES NO STDOUT CLAIM AT ALL.
# The source asserts the process succeeded (`output.status.success()` :51) and then, separately, that its
# exit code is exactly `Some(0)` (:56). The exact form is the stronger of the
# two and implies the other, so the migrated step carries `exit = 0` rather than
# `exit = "success"` -- ruling 3's mirror-the-source direction, an exact source
# assertion becoming an exact pin.
# In json mode it carries schemaVersion/command/success (`json["schemaVersion"]` :60-
# 62) and the empty `errors` array (:63). It reads NO
# payload field, NO stdout leaf and NO stderr leaf, so none is written -- the program
# prints 3 and the source never looks at it. Inventing a stdout claim here because
# the output is knowable is exactly the rule-2 invention the `extra` gate exists for.
# The argv carries `--max-threads 0` (:42) and `--max-spawned-processes 0`
# (`.arg("--max-spawned-processes")` :44), and the environment carries the variable named by
# `kali_runtime_contract::BROWSER_HARNESS_COMMAND_ENV` (:33), set to node.

[matrix]
ext = ["ts", "jsx", "tsx"]

[source]
"main.${ext}" = """const nullValue = null ?? 1; const voidValue = void 0 ?? 2; console.log(nullValue + voidValue);
"""
"smoke.test.${ext}" = """Kali.test('browser nullish coalescing', () => { const nullValue = null ?? 1; const voidValue = void 0 ?? 2; return nullValue + voidValue; });
"""

[[case]]
name = "run_supports_nullish_coalescing_in_browser_api_surface_with_harness_input_matrix"
rationale = """Migrated from browser_nullish_coalescing_harness.rs, `run_supports_nullish_coalescing_in_browser_api_surface_with_harness_input_matrix` -- one source `#[test]` fn whose `for filename in [...]` loop is reproduced by this file's three `ext` cells. `assert_browser_harness_nullish_coalescing` writes a program whose two nullish-coalescing expressions bind `null ?? 1` and `void 0 ?? 2` (or the same two inside a Kali.test wrapper) and runs `kali run` / `kali test --api browser` with the browser harness backed by node and both concurrency limits pinned to 0. This case makes no stdout claim because the source makes none: it asserts the process succeeded and that its exit code is exactly 0, and nothing about what the program printed."""
args = ["run", "--api", "browser", "--max-threads", "0", "--max-spawned-processes", "0", "main.${ext}"]
env = { KALI_BROWSER_BUNDLE_HARNESS_COMMAND = "node" }
exit = 0

[[case]]
name = "json_run_supports_nullish_coalescing_in_browser_api_surface_with_harness_input_matrix"
rationale = """Migrated from browser_nullish_coalescing_harness.rs, `json_run_supports_nullish_coalescing_in_browser_api_surface_with_harness_input_matrix` -- one source `#[test]` fn whose `for filename in [...]` loop is reproduced by this file's three `ext` cells. `assert_browser_harness_nullish_coalescing` writes a program whose two nullish-coalescing expressions bind `null ?? 1` and `void 0 ?? 2` (or the same two inside a Kali.test wrapper) and runs `kali run` / `kali test --api browser` with the browser harness backed by node and both concurrency limits pinned to 0. This case makes no stdout claim because the source makes none: it asserts the process succeeded and that its exit code is exactly 0, and nothing about what the program printed. On the json branch it additionally reads the envelope's schemaVersion/command/success and asserts the `errors` array is empty; output shape is not a matrix axis because it changes the assertion shape, so it is a separate case."""
args = ["--output", "json", "run", "--api", "browser", "--max-threads", "0", "--max-spawned-processes", "0", "main.${ext}"]
env = { KALI_BROWSER_BUNDLE_HARNESS_COMMAND = "node" }
exit = 0
json = { schemaVersion = 1, command = "run", success = true, errors = [] }

[[case]]
name = "test_supports_nullish_coalescing_in_browser_api_surface_with_harness_input_matrix"
rationale = """Migrated from browser_nullish_coalescing_harness.rs, `test_supports_nullish_coalescing_in_browser_api_surface_with_harness_input_matrix` -- one source `#[test]` fn whose `for filename in [...]` loop is reproduced by this file's three `ext` cells. `assert_browser_harness_nullish_coalescing` writes a program whose two nullish-coalescing expressions bind `null ?? 1` and `void 0 ?? 2` (or the same two inside a Kali.test wrapper) and runs `kali run` / `kali test --api browser` with the browser harness backed by node and both concurrency limits pinned to 0. This case makes no stdout claim because the source makes none: it asserts the process succeeded and that its exit code is exactly 0, and nothing about what the program printed."""
args = ["test", "--api", "browser", "--max-threads", "0", "--max-spawned-processes", "0", "smoke.test.${ext}"]
env = { KALI_BROWSER_BUNDLE_HARNESS_COMMAND = "node" }
exit = 0

[[case]]
name = "json_test_supports_nullish_coalescing_in_browser_api_surface_with_harness_input_matrix"
rationale = """Migrated from browser_nullish_coalescing_harness.rs, `json_test_supports_nullish_coalescing_in_browser_api_surface_with_harness_input_matrix` -- one source `#[test]` fn whose `for filename in [...]` loop is reproduced by this file's three `ext` cells. `assert_browser_harness_nullish_coalescing` writes a program whose two nullish-coalescing expressions bind `null ?? 1` and `void 0 ?? 2` (or the same two inside a Kali.test wrapper) and runs `kali run` / `kali test --api browser` with the browser harness backed by node and both concurrency limits pinned to 0. This case makes no stdout claim because the source makes none: it asserts the process succeeded and that its exit code is exactly 0, and nothing about what the program printed. On the json branch it additionally reads the envelope's schemaVersion/command/success and asserts the `errors` array is empty; output shape is not a matrix axis because it changes the assertion shape, so it is a separate case."""
args = ["--output", "json", "test", "--api", "browser", "--max-threads", "0", "--max-spawned-processes", "0", "smoke.test.${ext}"]
env = { KALI_BROWSER_BUNDLE_HARNESS_COMMAND = "node" }
exit = 0
json = { schemaVersion = 1, command = "test", success = true, errors = [] }
