"main.js" = """function browserMapIteration() {
  function assertMapIteration(values) {
    if (
      values.length !== 2 ||
      values[0][0] !== 1 ||
      values[0][1] !== 3 ||
      values[1][0] !== 4 ||
      values[1][1] !== 5
    ) {
      throw new Error('unexpected Map constructor iteration semantics');
    }
  }

  const values = [[1, 2], [1, 3], [4, 5]];
  const mapAlias = Map;
  const wrappedMapAlias = (mapAlias);
  const aliasValues = (values);
  const direct = [];
  for (const entry of new Map(values)) {
    direct.push(entry);
  }
  const alias = [];
  for (const entry of new mapAlias(aliasValues)) {
    alias.push(entry);
  }
  const wrappedAlias = [];
  for (const entry of new (wrappedMapAlias)(aliasValues)) {
    wrappedAlias.push(entry);
  }
  const globalDirect = [];
  for (const entry of new globalThis.Map(values)) {
    globalDirect.push(entry);
  }
  const parenthesizedBracketed = [];
  for (const entry of new (globalThis["Map"])(values)) {
    parenthesizedBracketed.push(entry);
  }
  const parenthesizedSingleBracketed = [];
  for (const entry of new (globalThis['Map'])(values)) {
    parenthesizedSingleBracketed.push(entry);
  }
  const bracketed = [];
  for (const entry of new globalThis["Map"](values)) {
    bracketed.push(entry);
  }
  const singleBracketed = [];
  for (const entry of new globalThis['Map'](values)) {
    singleBracketed.push(entry);
  }
  const nullishEntries = [];
  for (const entry of new (null ?? Map)(aliasValues)) {
    nullishEntries.push(entry);
  }
  const logicalOrEntries = [];
  for (const entry of new (false || Map)(aliasValues)) {
    logicalOrEntries.push(entry);
  }
  assertMapIteration(nullishEntries);
  assertMapIteration(logicalOrEntries);
  const frozenMapValues = Object.freeze(aliasValues);
  const frozenMap = Object.freeze(Map);
  const frozenGlobalThisMap = Object.freeze(globalThis.Map);
  const frozenGlobalThisBracketedMap = Object.freeze(globalThis["Map"]);
  const wrappedFrozenMap = Object.freeze((Map));
  const wrappedFrozenGlobalThisMap = Object.freeze((globalThis.Map));
  const wrappedFrozenGlobalThisBracketedMap = Object.freeze((globalThis["Map"]));
  const frozenDirect = [];
  for (const entry of new Map(frozenMapValues)) {
    frozenDirect.push(entry);
  }
  const frozenAlias = [];
  for (const entry of new (frozenMap)(values)) {
    frozenAlias.push(entry);
  }
  const frozenGlobalDirect = [];
  for (const entry of new (frozenGlobalThisMap)(values)) {
    frozenGlobalDirect.push(entry);
  }
  const frozenGlobalBracketed = [];
  for (const entry of new (frozenGlobalThisBracketedMap)(values)) {
    frozenGlobalBracketed.push(entry);
  }
  const wrappedFrozenDirect = [];
  for (const entry of new (wrappedFrozenMap)(values)) {
    wrappedFrozenDirect.push(entry);
  }
  const wrappedFrozenGlobalDirect = [];
  for (const entry of new (wrappedFrozenGlobalThisMap)(values)) {
    wrappedFrozenGlobalDirect.push(entry);
  }
  const wrappedFrozenGlobalBracketed = [];
  for (const entry of new (wrappedFrozenGlobalThisBracketedMap)(values)) {
    wrappedFrozenGlobalBracketed.push(entry);
  }

  let returnFinally = false;
  function mapReturnProbe() {
    try {
      let returnEntry = null;
      for (const entry of new Map([[1, 2], [1, 3], [4, 5]])) {
        returnEntry = entry;
        break;
      }
      if (returnEntry === null) {
        throw new Error('unexpected empty Map constructor iteration');
      }
      return returnEntry;
    } finally {
      returnFinally = true;
    }
  }
  const returnEntry = mapReturnProbe();
  if (returnEntry[0] !== 1 || returnEntry[1] !== 2 || !returnFinally) {
    throw new Error('unexpected Map constructor return/finally semantics');
  }

  let throwFinally = false;
  function mapThrowProbe() {
    try {
      for (const entry of new Map([[1, 2], [1, 3], [4, 5]])) {
        if (entry[0] === 1) {
          throw new Error('boom');
        }
      }
      throw new Error('unexpected empty Map constructor iteration');
    } finally {
      throwFinally = true;
    }
  }
  let threw = false;
  try {
    mapThrowProbe();
  } catch {
    threw = true;
  }
  if (!threw || !throwFinally) {
    throw new Error('unexpected Map constructor throw/finally semantics');
  }

  assertMapIteration(direct);
  assertMapIteration(alias);
  assertMapIteration(wrappedAlias);
  assertMapIteration(globalDirect);
  assertMapIteration(parenthesizedBracketed);
  assertMapIteration(parenthesizedSingleBracketed);
  assertMapIteration(bracketed);
  assertMapIteration(singleBracketed);
  assertMapIteration(frozenDirect);
  assertMapIteration(frozenAlias);
  assertMapIteration(frozenGlobalDirect);
  assertMapIteration(frozenGlobalBracketed);
  assertMapIteration(wrappedFrozenDirect);
  assertMapIteration(wrappedFrozenGlobalDirect);
  assertMapIteration(wrappedFrozenGlobalBracketed);
  console.log('browser map constructor iteration ok');
}

browserMapIteration();
