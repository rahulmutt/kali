rationale = """Migrated from browser_map_iteration_harness.rs. Honest re-pin (PR #16 rev2): kali fails closed/loud here; see docs/superpowers/followups/pr16-honest-repin-inventory.md. `assert_browser_harness_map_iteration("run", "main.js", true)` runs `kali run --api browser --output json` under the browser harness (`node`) against the Map-constructor iteration probe and asserts ONLY that the process fails closed. That is the source's single assertion in this file -- no exit code, no stdout/stderr needle, no envelope field -- so this case carries exactly `exit = "failure"` and nothing else; adding a diagnostic code or a stream claim would invent a claim the source never made. No [matrix] in this file: the four individual #[test] fns use `main.js`/`smoke.test.js` while the looping fn uses a single `main.<ext>` filename for BOTH commands, so a file-wide `ext` axis could not express the filename pattern without inventing an untested combination (see the file header's arithmetic). The `[source]` stems for ts/jsx/tsx are split into `main_run`/`main_test` because the helper picks its body from the command while writing both to the same `main.<ext>` name, which one flat file-wide `[source]` key cannot carry; `main.js`/`smoke.test.js` keep their source names."""
args = ["--output", "json", "run", "--api", "browser", "--max-threads", "0", "--max-spawned-processes", "0", "main.js"]
env = { "KALI_BROWSER_BUNDLE_HARNESS_COMMAND" = "node" }
exit = "failure"

