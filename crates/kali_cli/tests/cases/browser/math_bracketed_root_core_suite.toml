rationale = """Migrated from browser_math_bracketed_root_core_suite.rs. This case is one of the 16 invocations the single #[test] fn `run_and_test_supports_bracketed_global_this_math_core_suite_when_browser_harness_is_configured_in_js_and_ts_input` performs by looping over eight (command, source_name, source, expected_stdout) tuples and over `for output_json in [false, true]`; per the split-don't-fold rule each independent invocation shape gets its own sibling [[case]] rather than being folded. It runs `kali run --api browser --output json` and asserts the JSON envelope's schemaVersion/command/success/payload (hostContract, runtimeBackend) fields, `json["exitCode"] == 0` and `payload.exitCode == 0`, that `stderr` is exactly empty, and that `json["stdout"]` contains the source's own `expected_stdout` literal '3\\n1\\n3\\n-1\\n-2\\n31'. A nested `json` leaf has no substring-assertion form in this case-file format (only exact equality), so that claim is resolved to an exact pin -- live-captured from the real `kali` binary and checked to contain the source's literal before being written. `ext` (js/ts/jsx/tsx) is hoisted to a file-level [matrix] axis -- safe here because this file's harness tuple list genuinely covers all four extensions, unlike its `exp_log` siblings (see the file header's arithmetic)."""
args = ["--output", "json", "run", "--api", "browser", "--max-threads", "0", "--max-spawned-processes", "0", "main.${ext}"]
