# Migrated from tests/browser_math_asinh_acosh_atanh_identities.rs.
# No Rust comments exist anywhere in the source file (checked: `grep -nE
# '^\s*//'` finds nothing outside the JS fixture bodies' own `// kali-tree-
# shake:` markers, which are program text, not Rust comments), so there is no
# prose to move verbatim into `rationale` here (rule 12).
#
# MATRIX ARITHMETIC (rule 7): 8 bundle fns (ext(4) x json_output(2)) + 16
# harness
# fns (command(run/test) x ext(4) x json_output(2)) = 24 invocations = 24
# #[test]
# fns, all individual (no loops anywhere in this file). Both groups vary
# uniformly over all four extensions, so `ext` is hoisted to a file-level
# [matrix] axis: 24 fns collapse to 6 [[case]] entries, matrix-fanned to 24
# trials, matching exactly.
#
# COUNT CLAIM (rule 1 -- never weaken). This file does NOT use a plain
# `.contains`: every stdout assertion is
# `stdout.matches("0\n").count() >= 3`, i.e. at least three separate `0\n`
# occurrences (asinh(0), acosh(1), atanh(0) each print 0). A bare
# `stdout_contains = ["0\n"]` would satisfy a single occurrence and is
# therefore
# a WEAKENING -- rejected. The migrated claim is
# `stdout_contains = ["0\n0\n0\n"]`: since Rust's `str::matches` counts
# non-overlapping matches, a run containing the three-in-a-row needle
# necessarily has `count() >= 3`, so this implies the source claim and is
# strictly stronger (the converse does not hold -- three non-adjacent `0\n`s
# would satisfy source but not this). The strengthening was verified against
# the
# real binary before being written, not assumed: the live capture asserts both
# `count("0\n") >= 3` and the contiguous `0\n0\n0\n` substring for every
# command. The nested `json["stdout"]` leaf has no substring form at all, so
# there the claim becomes an exact live-captured pin.
#
# [source] needs no disambiguation (U5): `app.<ext>`, `main.<ext>` and
# `smoke.test.<ext>` are already distinct keys.
#
# ASSERTION SHAPE. Bundle json mode: schemaVersion/command/success/exitCode/
# payload(artifactKind, bundleFormat); source makes no `errors` claim in this
# file's bundle helper, so none is added (rule 2). Harness json mode adds
# `json["exitCode"]`/`payload.exitCode` for "run" or
# `payload.total/passed/failed` for "test", plus `stderr = ""`; source makes
# no
# `errors` claim in the harness helper either, so none is added. The harness
# argv
# carries no `--max-threads`/`--max-spawned-processes` throttle; mirrored.

[matrix]
ext = ["js", "ts", "jsx", "tsx"]

[source]
"app.${ext}" = """// kali-tree-shake: mathInverseHyperbolicIdentities
function mathInverseHyperbolicIdentities() {
  const zero = 0;
  const one = 1;
  console.log(Math.asinh(zero));
  console.log(Math.acosh(one));
  console.log(Math.atanh(zero));
}
"""
"main.${ext}" = """const zero = 0; const one = 1; console.log(Math.asinh(zero)); console.log(Math.acosh(one)); console.log(Math.atanh(zero));
"""
"smoke.test.${ext}" = """Kali.test('math inverse hyperbolic identities', () => {
  const zero = 0;
  const one = 1;
  console.log(Math.asinh(zero));
  console.log(Math.acosh(one));
  console.log(Math.atanh(zero));
});
"""

[[case]]
name = "build_emits_math_inverse_hyperbolic_identity_literals"
rationale = """Migrated from browser_math_asinh_acosh_atanh_identities.rs. `assert_browser_bundle_math_inverse_hyperbolic` builds a browser bundle (`kali build --bundle --api browser`), asserts the emitted `app/app.meta.json` metadata, then runs the bundle glue under the browser-bundle-harness contract and checks the asinh(0)/acosh(1)/atanh(0) identity output. Source's stdout claim here is `stdout.matches("0\\n").count() >= 3`, not a plain `.contains`: a bare `stdout_contains = ["0\\n"]` would be satisfied by ONE occurrence and would weaken it. It is carried as the contiguous needle `0\\n0\\n0\\n`, which implies `count() >= 3` because `str::matches` counts non-overlapping matches -- strictly stronger than the source claim, and verified against the real binary before being written. `ext` (js/ts/jsx/tsx) is hoisted to a file-level [matrix] axis: 24 #[test] fns collapse to 6 [[case]] entries here, matrix-fanned to 24 trials, matching the 24 real invocations exactly (see the file header's arithmetic)."""

[[case.step]]
args = ["build", "--bundle", "--api", "browser", "app.${ext}"]
exit = "success"

[[case.step]]
kind = "file_json"
path = "app/app.meta.json"
fields = { "apiSurface" = "browser", "artifactKind" = "bundle" }

[[case.step]]
kind = "browser_bundle_harness"
entry = "app"
body = """const mod = await import(bundleJs.href);
await mod.mathInverseHyperbolicIdentities();
"""
stdout_contains = ["0\n0\n0\n"]

