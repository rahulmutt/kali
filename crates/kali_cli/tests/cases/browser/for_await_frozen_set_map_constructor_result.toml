# Migrated from tests/browser_for_await_frozen_set_map_constructor_result.rs
#
#   SOURCE REF: 3e083edc5d8ba24dd69a79cc75c60889d8258cb5
#   git show 3e083edc5d8ba24dd69a79cc75c60889d8258cb5:crates/kali_cli/tests/browser_for_await_frozen_set_map_constructor_result.rs
# and its sibling submodule directory tests/browser_for_await_frozen_set_map_
# constructor_result/{run,build,test}.rs (the `#[path]` submodule shape: the
# top-level file declares zero top-level #[test] fns and pulls its 40 tests
# in via `#[path = "..."] mod run;` / `mod build;` / `mod test;`). run.rs has
# 14 #[test] fns, build.rs has 12, test.rs has 14 -- 40 total.
#
# `ext` (js/ts/jsx/tsx) is a genuinely uniform file-level [matrix] axis.
# Every real assertion in this family -- enumerated by expanding every loop
# in every #[test] fn, not counted by fn -- is, for a fixed (variant,
# command, json_output) combination, exercising the identical assertion
# shape across all four extensions:
#   - `assert_browser_requested_frozen_set_map_constructor_result` (plain)
#     and `..._parenthesized_frozen_set_map_constructor_result` (paren) and
#     `..._frozen_object_helper_iteration_targets` (object): each reached
#     command(run,test) x ext(js,ts,jsx,tsx) x json_output(2) = 16 times
#     across run.rs+test.rs together, for each of the 3 variants (individual
#     js/ts fns plus a jsx-and-tsx loop fn together cover run/test's full
#     ext axis; a single all-4-extension loop covers the parenthesized
#     variant's run/test axis in one fn each). 3 x 16 = 48 real invocations.
#   - `assert_browser_bundle_frozen_set_map_constructor_result` (plain) and
#     `..._bundle_parenthesized_frozen_set_map_constructor_result` (paren)
#     and `..._bundle_frozen_object_helper_iteration_targets` (object): each
#     reached ext(4) x json_output(2) = 8 times in build.rs, for each of the
#     3 variants (individual js/ts fns plus a jsx-and-tsx loop calling both
#     json_output values; a single all-4-extension loop, split one fn per
#     json_output, covers the parenthesized variant). 3 x 8 = 24 real
#     invocations.
# Total real invocations: 48 + 24 = 72 = variant(3) x [command(2) x
# json_output(2) + build(1) x json_output(2)] x ext(4) = 3 x (4+2) x 4 = 72.
# This IS what all 40 #[test] fns together assert (40 differs from 72
# because several fns make more than one call each -- every jsx-and-tsx loop
# fn makes 2, the parenthesized run/test loop fns make 4 each, the
# parenthesized+jsx-and-tsx build fns make up to 4 each), organized unevenly
# across individual vs looped fns; recorded here per the house rule that
# [matrix] eligibility is decided on invocation count, not #[test] fn count.
# 18 [[case]] entries here (variant(3) x mode(run/test/build=3) x
# json_output(2)), matrix-fanned by ext(4) = 72 trials, matching the 72 real
# invocations exactly.
#
# [source] filenames are disambiguated with a `_plain`/`_paren`/`_object`
# stem tag: [source] is one flat file-wide table, but source reuses bare
# filenames (main.js, smoke.test.js, app.js, ...) across all THREE variants
# (each gets its own private tempdir in the .rs world). No assertion ever
# pins the literal filename, and no fixture body ever reads its own filename
# back (no import()/require() of a self-referencing string anywhere in any
# of the 9 fixture-building fns across all four source files), so renaming
# it for disambiguation changes no claim -- same mechanism as the sibling
# `frozen_set_map_constructor_result.toml` (the pre-existing non-for-await
# migration of this same family), whose `_plain`/`_paren` convention this
# file extends with a third `_object` tag for the frozen-object-helper
# variant that file doesn't have.
#
# `--output json` mode's nested `json.stdout` field: source's own check is
# `.contains(...)` (three separate substring checks for the `object`
# variant), which the `json` assertion key cannot express directly
# (exact-equality-only per path, per model.rs). The exact value was captured
# LIVE from the real binary for every case and pinned exactly -- strictly
# stronger, and (for `object`) it subsumes all three of source's substring
# checks at once since the exact captured text contains each of them.
#
# `[[case.step]]`'s `browser_bundle_harness` `body` similarly pins the exact
# captured harness stdout (via `stdout_contains` using source's own literal
# needle(s), since source itself only ever asserts `.contains(...)` there,
# never `assert_eq!`) rather than fabricating an exact-match claim source
# never made.
#
# Every case's expected stdout/json/harness-stdout was captured LIVE from
# the real `kali` binary (and, for browser_bundle_harness steps, real
# `node`), via `tools/task-18-browser-pilot/kali_run.py` plus a small direct
# harness-script replication (the same `browser_bundle_harness_prelude`
# shape `crates/kali_runtime_contract/src/browser/harness.rs` emits,
# `allow_subpaths = false`) -- not hand-computed.
#
# No Rust comments exist in any of the four source files (confirmed:
# `grep -n '^\s*//'` on the top-level file and all three submodule files
# has zero hits outside the JS `// kali-tree-shake: ...` fixture markers,
# which are program text kept verbatim inside [source] bodies below, not
# Rust doc comments), so there is no prose to move into `rationale`.
#
# BATCH CONVENTION (per pilot round 1 review, restated here): a single
# [[case]] can correspond to MORE THAN ONE source #[test] fn (individual
# js/ts fns plus a jsx-and-tsx loop fn, or a run/test all-4-extension loop
# fn, folded into one matrix-fanned case). Assertion mapping stays 1:1 (every
# trial still checks exactly the real per-extension source assertion), so no
# claim is lost -- but a failing trial's id reads `[ext=jsx]`, not a source
# fn name.


