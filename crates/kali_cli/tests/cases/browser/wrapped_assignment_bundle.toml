[constants]
dollar = "$"

[matrix]
ext = ["js", "ts", "jsx", "tsx"]

[source]
"app.${ext}" = """// kali-tree-shake: browserWrappedAssignmentTargets
export function browserWrappedAssignmentTargets() {
  var table = { a: 1, b: 2 };
  var last = null;
  for (var c in table) {
    last = c;
  }
  ((last)) ??= null;
  var nullishOk = 0;
  if (last) { nullishOk = 1; }

  let left = 0;
  ((left)) ||= 1;
  let right = 1;
  ((right)) &&= 2;
  if (nullishOk !== 1 || left !== 1 || right !== 2) {
    throw new Error(`unexpected wrapped assignment result ${dollar}{nullishOk} ${dollar}{left} ${dollar}{right}`);
  }
}
"""

[[case]]
name = "build_emits_wrapped_nullish_and_logical_assignment_semantics_in_js_ts_jsx_tsx_input__text"
rationale = """Migrated from browser_wrapped_assignment_bundle.rs. This `[[case]]` is the text half of the source's 2 `#[test]` fns, matrix-fanned by `ext(4)` to the four extensions, so it stands for one trial per real invocation of `build_emits_wrapped_nullish_and_logical_assignment_semantics_in_js_ts_jsx_tsx_input`, with the assertion mapping staying one-to-one per trial (rule 6's sanctioned rule-7 fold, stated here as the rule requires). `assert_browser_bundle_wrapped_assignment(` (:36) writes a bundle whose exported function exercises the wrapped nullish and logical assignment targets `((last)) ??= null`, `((left)) ||= 1` and `((right)) &&= 2`, throwing if any of them lands on the wrong value to `app.<ext>` in a fresh temp dir, builds it with `kali build --bundle --api browser`, asserts the build succeeds, asserts the emitted `app/app.meta.json` carries `apiSurface = "browser"`, `artifactKind = "bundle"` (`join("app.meta.json")` (:74)), then writes the browser-bundle harness and runs it under node. BOTH PROCESSES SUCCEED here, unlike the fail-closed bundle targets migrated in earlier batches: the source asserts `output.status.success()` on the harness run and that its stdout is exactly empty, so the harness step carries `exit = "success"` and `stdout = ""`. The program under test is `browser_bundle_wrapped_assignment_source(` (:14); its text is copied out of the `.rs` by this generator, never retyped (rule 9). RULE 12 -- the Rust comment prose of this source, carried verbatim: "fasta Spec 7 Task 3: scalar `??=` rejects fail-closed (null and 0 are indistinguishable for a scalar), so the wrapped `??=` coverage rides the one surviving lowering — a for-in-key ALIAS binding (`-1` null sentinel). The scalar `||=`/`&&=` targets keep their falsy semantics and stay unchanged.""""

[[case.step]]
args = ["build", "--bundle", "--api", "browser", "app.${ext}"]
exit = "success"

[[case.step]]
