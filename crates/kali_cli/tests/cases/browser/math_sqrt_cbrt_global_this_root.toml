[matrix]
ext = ["js", "ts", "jsx", "tsx"]

[source]
"app.${ext}" = """// kali-tree-shake: globalThisMathSqrtCbrtZeroIdentities
function globalThisMathSqrtCbrtZeroIdentities() {
  const four = 4;
  const minusTwentySeven = -27;
  console.log(globalThis.Math.sqrt(four));
  console.log(globalThis.Math.cbrt(minusTwentySeven));
  return [globalThis.Math.sqrt(four), globalThis.Math.cbrt(minusTwentySeven)];
}
"""
"main.${ext}" = """const four = 4; const minusTwentySeven = -27; console.log(globalThis.Math.sqrt(four)); console.log(globalThis.Math.cbrt(minusTwentySeven));
"""
"smoke.test.${ext}" = """Kali.test('globalThis math sqrt/cbrt zero identities', () => {
  const four = 4;
  const minusTwentySeven = -27;
  console.log(globalThis.Math.sqrt(four));
  console.log(globalThis.Math.cbrt(minusTwentySeven));
});
"""

[[case]]
name = "build_emits_global_this_math_sqrt_and_cbrt_zero_identities"
rationale = """Migrated from browser_math_sqrt_cbrt_global_this_root.rs, the four `build_emits_global_this_math_sqrt_and_cbrt_zero_identities_in_*_input` fns (one per extension). `assert_browser_bundle_global_this_math_sqrt_cbrt` builds a browser bundle with `kali build --bundle --api browser`, asserts the emitted app/app.meta.json metadata, then runs the bundle glue under the browser-bundle-harness contract backed by node, against a program that calls globalThis.Math.sqrt(4) and globalThis.Math.cbrt(-27), so its two console.log calls print 2 and -3. Its two stdout claims are separate source lines, `.contains("2\\n")` (:116) and `.contains("-3\\n")` on the line after it. The source spells this as a plain `.contains(...)` against raw stdout, so it is carried as stdout_contains and NOT strengthened to an exact pin -- controller ruling 3, mirror the source: a plain `.contains` against a field that HAS a substring form keeps the substring form even though the exact output was observed."""

[[case.step]]
args = ["build", "--bundle", "--api", "browser", "app.${ext}"]
exit = "success"

[[case.step]]
kind = "file_json"
path = "app/app.meta.json"
fields = { apiSurface = "browser", artifactKind = "bundle" }

[[case.step]]
kind = "browser_bundle_harness"
entry = "app"
body = """const mod = await import(bundleJs.href);
await mod.globalThisMathSqrtCbrtZeroIdentities();
"""
exit = "success"
stdout_contains = ["2\n", "-3\n"]

[[case]]
name = "json_build_emits_global_this_math_sqrt_and_cbrt_zero_identities"
rationale = """Migrated from browser_math_sqrt_cbrt_global_this_root.rs, the four `json_build_emits_global_this_math_sqrt_and_cbrt_zero_identities_in_*_input` fns (one per extension). `assert_browser_bundle_global_this_math_sqrt_cbrt` builds a browser bundle with `kali build --bundle --api browser`, asserts the emitted app/app.meta.json metadata, then runs the bundle glue under the browser-bundle-harness contract backed by node, against a program that calls globalThis.Math.sqrt(4) and globalThis.Math.cbrt(-27), so its two console.log calls print 2 and -3. Its two stdout claims are separate source lines, `.contains("2\\n")` (:116) and `.contains("-3\\n")` on the line after it. The source spells this as a plain `.contains(...)` against raw stdout, so it is carried as stdout_contains and NOT strengthened to an exact pin -- controller ruling 3, mirror the source: a plain `.contains` against a field that HAS a substring form keeps the substring form even though the exact output was observed. This sibling additionally asserts the build JSON envelope rather than plain text; output shape is not a matrix axis because it changes the assertion shape, so it is a separate case."""

[[case.step]]
args = ["build", "--bundle", "--api", "browser", "--output", "json", "app.${ext}"]
exit = "success"
json = { schemaVersion = 1, command = "build", success = true, exitCode = 0, payload = { artifactKind = "bundle", bundleFormat = "esm" } }

[[case.step]]
kind = "file_json"
path = "app/app.meta.json"
fields = { apiSurface = "browser", artifactKind = "bundle" }

[[case.step]]
kind = "browser_bundle_harness"
entry = "app"
body = """const mod = await import(bundleJs.href);
await mod.globalThisMathSqrtCbrtZeroIdentities();
"""
exit = "success"
stdout_contains = ["2\n", "-3\n"]

[[case]]
name = "run_supports_global_this_math_sqrt_and_cbrt_zero_identities_when_browser_harness_is_configured"
rationale = """Migrated from browser_math_sqrt_cbrt_global_this_root.rs, the four `run_supports_global_this_math_sqrt_and_cbrt_zero_identities_when_browser_harness_is_configured_*_input` fns (one per extension). `assert_browser_harness_global_this_math_sqrt_cbrt` writes the same globalThis-rooted slice as a plain program and runs `kali run` (or a Kali.test wrapper under `kali test`) with the browser harness backed by node and both concurrency limits pinned to 0. Its two stdout claims are separate source lines (:188, :189). The source spells this as a plain `.contains(...)` against raw stdout, so it is carried as stdout_contains and NOT strengthened to an exact pin -- controller ruling 3, mirror the source: a plain `.contains` against a field that HAS a substring form keeps the substring form even though the exact output was observed."""
args = ["run", "--api", "browser", "--max-threads", "0", "--max-spawned-processes", "0", "main.${ext}"]
env = { KALI_BROWSER_BUNDLE_HARNESS_COMMAND = "node" }
exit = "success"
stdout_contains = ["2\n", "-3\n"]

[[case]]
name = "run_supports_global_this_math_sqrt_and_cbrt_zero_identities_when_browser_harness_is_configured_in_json"
rationale = """Migrated from browser_math_sqrt_cbrt_global_this_root.rs, the four `run_supports_global_this_math_sqrt_and_cbrt_zero_identities_when_browser_harness_is_configured_in_json_*_input` fns (one per extension). `assert_browser_harness_global_this_math_sqrt_cbrt` writes the same globalThis-rooted slice as a plain program and runs `kali run` (or a Kali.test wrapper under `kali test`) with the browser harness backed by node and both concurrency limits pinned to 0. On the JSON branch the same claim is taken against the string leaf json["stdout"], which has NO substring form in the case format (there is no json_contains key), so per controller ruling 3 it becomes an exact `json.stdout` pin -- and, per U9, only after the value was captured from the real kali binary rather than hand-computed."""
args = ["--output", "json", "run", "--api", "browser", "--max-threads", "0", "--max-spawned-processes", "0", "main.${ext}"]
env = { KALI_BROWSER_BUNDLE_HARNESS_COMMAND = "node" }
exit = "success"
json = { schemaVersion = 1, command = "run", success = true, exitCode = 0, payload = { hostContract = "browser-requested", runtimeBackend = "browser-harness", exitCode = 0 }, stdout = "2\n-3\n", stderr = "" }

