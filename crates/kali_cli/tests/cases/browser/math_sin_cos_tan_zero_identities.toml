# Migrated from tests/browser_math_sin_cos_tan_zero_identities.rs.
#
# RULE 12 (carry every source comment verbatim): `grep -nE '^\s*//'` over
# tests/browser_math_sin_cos_tan_zero_identities.rs returns NOTHING -- the file has no Rust comments
# at all.
# The 1 other `//` occurrence(s) in the file (:11) sit
# inside JS fixture bodies, which is program text carried verbatim into
# [source], not Rust prose.
# There is therefore no prose to move into any `rationale`, and
# comment_coverage.py is run with --allow-empty for this pair.
#
# RULE 7 / U1 -- MATRIX ARITHMETIC, and it closes exactly.
# 8 `#[test]` fns, 8 real helper invocations with every loop
# expanded:
#   * `assert_browser_bundle_math_sin_cos_tan` -- 8 invocation(s) = ext(js/ts/jsx/tsx) x json_output(false/true), a complete cross
#     product. Every `#[test]` fn is one unlooped call and the file contains no
#     loop at all.
# `ext` is the ONE axis every case varies over uniformly, and every helper covers
# all 4 of its values, so a file-wide axis fans nothing the source never ran:
# 2 `[[case]]` entries x ext(4) = 8 trials = 8 invocations. Exact.
# `json_output` is NOT a matrix axis, per rule 7 and design spec 5.6's own note:
# it changes the ASSERTION SHAPE rather than substituting a string.
# `json_output` switches between a text claim and a JSON-envelope claim.
# It is written as sibling `[[case]]` entries instead.
#
# RULE 6 -- 1:1 MAPPING, and the fold is stated here as the rule requires.
# Each `[[case]]` below corresponds to 4 source `#[test]` fns, one per `ext` cell; the assertion mapping stays
# 1:1 per trial, so no claim is lost, but a failing trial's id reads its matrix cell
# rather than a source fn name.
#
# U2 -- `[source]` is FILE-WIDE, and that is safe here. Every fixture
# (`app.${ext}`)
# is written unconditionally by the source into a fresh temp dir: no fixture is written
# behind an `if`, and no case's point is the presence or absence of a file.
# Every command below names its entry explicitly on argv, so the unused siblings in
# a trial dir are inert.
#
# THE COUNT KEYS. The source makes exactly one occurrence-count claim, on the raw
# stdout of the browser-bundle harness process: `.matches("0\n").count() >= 2`
# (:103). It is carried as `stdout_count` with `at_least = 2` -- the bound the
# source states, neither weakened nor strengthened. The preceding line's separate
# `.contains("1\n")` (:102) is a DIFFERENT claim about the same surface and is
# carried alongside it as `stdout_contains`; collapsing the two into one would drop a
# claim. There is no count claim anywhere else in the file, and none on a JSON leaf, so
# no `json_count` is written.
#
# RULE 13 -- transitive helper docs. Checked every fn in each call chain:
#   `kali_bin`, `browser_bundle_math_sin_cos_tan_source`,
#   `assert_browser_bundle_math_sin_cos_tan` -- none carries a `///` doc comment.
# The chain also reaches `kali_runtime_contract::browser_bundle_harness_script` and
# `::browser_harness_command_parts_for`, which DO carry one-line `///` docs. Those are
# NOT carried: in the migrated form this case file never calls them -- the
# `browser_bundle_harness` step kind means the case RUNNER does
# (crates/kali_case_runner/src/steps.rs) -- so their docs describe shared runner
# infrastructure documented in design spec 5.3, not what this case claims. That is
# controller ruling 6, which writes the exemption into the rule rather than leaving it
# to implementer discretion.
#
# ARGV ORDER is transcribed in the exact order the source's `Command` builder appends it,
# which differs between the two helper shapes and is not normalised here:
#   * build:   `build --bundle --api browser [--output json] <entry>` -- the `--output json`
#              pair is appended AFTER the subcommand and its flags.
#   * run/test: `[--output json] <run|test> --api browser [--max-threads 0
#              --max-spawned-processes 0] <entry>` -- the `--output json` pair is appended
#              BEFORE the subcommand.
# The source passes an absolute `dir.path().join(filename)` as the entry; the case runner
# passes the bare filename relative to the trial dir, matching every previously shipped
# `browser/` case file.
#
# ASSERTION SHAPE, mirrored from the source and nothing more.
# `exit = "success"` on the `kali build` process (:40) and on the harness
# process (:96).
# In json mode, the build envelope's schemaVersion/command/success/exitCode and the
# payload's artifactKind/bundleFormat (:48-54), AND an empty
# `errors` array: this source really does assert
# `envelope["errors"].as_array().is_empty()` (:55-58), so
# `errors = []` is written here. (The three `Math.pow` sources migrated alongside it in
# this group assert no such thing and get no `errors` claim -- the difference is real and
# is not normalised away.)
# The emitted app/app.meta.json apiSurface/artifactKind (:66-67) is
# asserted in BOTH modes, because the source reads that file outside the `if json_output`
# block.
# The harness step carries `stdout_contains` (:102) and `stdout_count`
# (:103).
# The source asserts NOTHING about stderr on either process, and never reads the build
# envelope's stdout leaf, so no stderr claim and no `json.stdout` pin are written.
# It passes no --max-threads / --max-spawned-processes arguments, so neither appears on
# argv.

[matrix]
ext = ["js", "ts", "jsx", "tsx"]

[source]
"app.${ext}" = """// kali-tree-shake: mathSinCosTanZeroIdentities
function mathSinCosTanZeroIdentities() {
  const zero = 0;
  console.log(Math.sin(zero));
  console.log(Math.cos(zero));
  console.log(Math.tan(zero));
  return [Math.sin(zero), Math.cos(zero), Math.tan(zero)];
}
"""

[[case]]
name = "build_emits_math_sin_cos_tan_zero_identities"
rationale = """Migrated from browser_math_sin_cos_tan_zero_identities.rs, the four `build_emits_math_sin_cos_tan_zero_identities_in_*_input` fns (one per extension). `assert_browser_bundle_math_sin_cos_tan` builds a browser bundle with `kali build --bundle --api browser`, asserts the emitted app/app.meta.json metadata, then runs the bundle glue under the browser-bundle-harness contract backed by node, against a program that computes Math.sin(0), Math.cos(0) and Math.tan(0) -- so the cosine prints 1 and the sine and tangent each print 0. Its two claims about that output are separate source lines: `.contains("1\\n")` (:102) and `.matches("0\\n").count() >= 2` (:103), and both are carried. The source spells this as a plain `.contains(...)` against raw stdout, so it is carried as stdout_contains and NOT strengthened to an exact pin -- controller ruling 3, mirror the source: a plain `.contains` against a field that HAS a substring form keeps the substring form even though the exact output was observed. The source spells this as `.matches("0\\n").count() >= 2`, carried verbatim as `stdout_count` with `at_least = 2` per controller ruling 3 (mirror the source): NOT weakened to a plain contains, which a single occurrence would satisfy, and NOT strengthened to `exact`, which the source never says. Counting is non-overlapping and left-to-right, as Rust's `str::matches` is."""

[[case.step]]
args = ["build", "--bundle", "--api", "browser", "app.${ext}"]
exit = "success"

[[case.step]]
kind = "file_json"
path = "app/app.meta.json"
fields = { apiSurface = "browser", artifactKind = "bundle" }

[[case.step]]
kind = "browser_bundle_harness"
entry = "app"
body = """const mod = await import(bundleJs.href);
await mod.mathSinCosTanZeroIdentities();
"""
exit = "success"
stdout_contains = ["1\n"]
stdout_count = [{ needle = "0\n", at_least = 2 }]

[[case]]
name = "json_build_emits_math_sin_cos_tan_zero_identities"
rationale = """Migrated from browser_math_sin_cos_tan_zero_identities.rs, the four `json_build_emits_math_sin_cos_tan_zero_identities_in_*_input` fns (one per extension). `assert_browser_bundle_math_sin_cos_tan` builds a browser bundle with `kali build --bundle --api browser`, asserts the emitted app/app.meta.json metadata, then runs the bundle glue under the browser-bundle-harness contract backed by node, against a program that computes Math.sin(0), Math.cos(0) and Math.tan(0) -- so the cosine prints 1 and the sine and tangent each print 0. Its two claims about that output are separate source lines: `.contains("1\\n")` (:102) and `.matches("0\\n").count() >= 2` (:103), and both are carried. The source spells this as a plain `.contains(...)` against raw stdout, so it is carried as stdout_contains and NOT strengthened to an exact pin -- controller ruling 3, mirror the source: a plain `.contains` against a field that HAS a substring form keeps the substring form even though the exact output was observed. The source spells this as `.matches("0\\n").count() >= 2`, carried verbatim as `stdout_count` with `at_least = 2` per controller ruling 3 (mirror the source): NOT weakened to a plain contains, which a single occurrence would satisfy, and NOT strengthened to `exact`, which the source never says. Counting is non-overlapping and left-to-right, as Rust's `str::matches` is. This sibling additionally asserts the build JSON envelope -- schemaVersion/command/success/exitCode, payload artifactKind/bundleFormat, and the empty `errors` array the source checks at :55-58 -- rather than plain text; output shape is not a matrix axis because it changes the assertion shape, so it is a separate case."""

[[case.step]]
args = ["build", "--bundle", "--api", "browser", "--output", "json", "app.${ext}"]
exit = "success"
json = { schemaVersion = 1, command = "build", success = true, exitCode = 0, payload = { artifactKind = "bundle", bundleFormat = "esm" }, errors = [] }

[[case.step]]
kind = "file_json"
path = "app/app.meta.json"
fields = { apiSurface = "browser", artifactKind = "bundle" }

[[case.step]]
kind = "browser_bundle_harness"
entry = "app"
body = """const mod = await import(bundleJs.href);
await mod.mathSinCosTanZeroIdentities();
"""
exit = "success"
stdout_contains = ["1\n"]
stdout_count = [{ needle = "0\n", at_least = 2 }]
