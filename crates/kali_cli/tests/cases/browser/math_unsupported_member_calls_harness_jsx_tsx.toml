name = "run_supports_math_sqrt_member_calls_in_js_input"
rationale = """Migrated from browser_math_unsupported_member_calls_harness_jsx_tsx.rs, `run_supports_math_sqrt_member_calls_in_browser_api_surface_with_harness_js_ts_jsx_and_tsx_input` -- one of that fn's `for extension in [...]` loop iterations, in its text-output invocation. `assert_browser_harness_math_sqrt_success` runs `kali run --api browser` with the browser harness backed by node, against a program that calls Math.sqrt(1.6) through six access forms. Math.sqrt on a non-perfect-square literal is SUPPORTED since e5d776d93 (runtime F64Sqrt). node ground truth, bit-for-bit with `kali run`: Math.sqrt(1.6) -> 1.2649110640673518. The fixtures call sqrt through six access forms, so run/test stdout carries the value exactly six times. The source spells this as `.matches("1.2649110640673518").count() == 6`, carried verbatim as `stdout_count` with `exact = 6` per controller ruling 3 (mirror the source): NOT weakened to a plain contains, which a single occurrence would satisfy, and NOT strengthened to `exact`, which the source never says. Counting is non-overlapping and left-to-right, as Rust's `str::matches` is."""
args = ["run", "--api", "browser", "main.js"]
env = { KALI_BROWSER_BUNDLE_HARNESS_COMMAND = "node" }
exit = "success"
stdout_count = [{ needle = "1.2649110640673518", exact = 6 }]

