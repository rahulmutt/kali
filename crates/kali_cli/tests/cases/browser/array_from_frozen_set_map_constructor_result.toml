# No Rust comments exist anywhere in the source file (checked: `grep -n '^\s*//'`
# finds nothing outside the JS fixture bodies' own `// kali-tree-shake:` markers,
# which are program text, not Rust comments), so there is no prose to move
# verbatim into `rationale` here.
#
# MATRIX ARITHMETIC (rule 7): all 14 #[test] fns funnel through exactly four
# helpers (`assert_browser_check_array_from_frozen_set_map`,
# `assert_browser_harness_array_from_frozen_set_map` for "run", the same
# helper for "test", and `assert_browser_bundle_array_from_frozen_set_map`),
# each called once per `(ext, json_output)` pair with an identical assertion
# shape within its own helper. Enumerating every call site (expanding every
# `for filename in [...]` loop):
#   check:  1 (js) + 3 (ts/jsx/tsx loop) + 4 (json, all 4 loop)      =  8 calls
#   run:    1 (js) + 3 (ts/jsx/tsx loop) + 4 (json, all 4 loop)      =  8 calls
#   test:   1 (js) + 3 (ts/jsx/tsx loop) + 4 (json, all 4 loop)      =  8 calls
#   build:  1(js,false)+1(js,true)+1(ts,false)+1(ts,true)
#           + 2(jsx: false,true) + 2(tsx: false,true)                =  8 calls
# Total 32 invocations = 8 case-groups (check/run/test/build x
# json_output false/true) x ext(4) exactly -- matching the `[matrix]` fan
# below exactly. `ext` is hoisted to a file-level [matrix] axis; the
# `json_output` axis is NOT folded into matrix (each json_output value has a
# structurally different assertion shape -- CLI-plain assertions vs a JSON
# envelope), so it stays as separate named cases, matching the pilot's
# `object_keys_harness.toml`/`frozen_set_map_constructor_result.toml`
# convention: 14 #[test] fns collapse to 8 [[case]] entries, matrix-fanned to
# 32 trials.
#
# `check` and `run` share the exact same underlying fixture body
# (`browser_array_from_frozen_set_map_run_source`) and filename convention
# (`main.${ext}`) in source -- both map to one shared `[source]` key here.
# `test` uses a distinct `Kali.test(...)`-wrapped body and `smoke.test.${ext}`
# filename; `build` uses a distinct `export async function ...` (bundle/
# tree-shake) body and `app.${ext}` filename. Three distinct fixture bodies,
# not four, matching the three distinct helper source-builder fns in the
# .rs file.
#
# The nested-JSON `.contains()` claims on `json["stdout"]` (both `run` and
# `test`, json_output mode) have no substring-assertion form in the case
# format (`json` asserts exact leaf equality via dotted-path lookup, there is
# no `json_contains`) -- resolved as a verified strengthening: the full,
# live-captured stdout text was confirmed to equal the claimed literal
# exactly (not merely contain it, confirmed directly against the real
# binary), so pinning `json.stdout` to that exact text is strictly stronger
# than source's own `.contains()` check, not a fabrication.

[matrix]
ext = ["js", "ts", "jsx", "tsx"]

[source]
"main.${ext}" = """async function browserArrayFromFrozenSetMapWrappers() {
  const setValues = [1, 2, 1];
  const mapValues = [[1, 2], [1, 3], [4, 5]];
  for (const value of Array.from(Object.freeze(new Set(setValues)))) {
    console.log(value);
  }
  for (const value of Array.from(Object.freeze(new globalThis["Set"](setValues)))) {
    console.log(value);
  }
  for (const value of Array.from(Object.freeze(new globalThis['Set'](setValues)))) {
    console.log(value);
  }
  for await (const value of Array.from(Object.freeze((new Set(setValues))))) {
    console.log(value);
  }
  for (const value of Array.from(Object.freeze((null ?? new Set(setValues))))) {
    console.log(value);
  }
  for await (const value of Array.from(Object.freeze((false || new Set(setValues))))) {
    console.log(value);
  }
  for (const value of Array.from(Object.freeze((new (true && Set)(setValues))))) {
    console.log(value);
  }
  for (const entry of Array.from(Object.freeze(new Map(mapValues)))) {
    console.log(entry[0]);
    console.log(entry[1]);
  }
  for (const entry of Array.from(Object.freeze(new globalThis['Map'](mapValues)))) {
    console.log(entry[0]);
    console.log(entry[1]);
  }
  for (const entry of Array.from(Object.freeze(new globalThis["Map"](mapValues)))) {
    console.log(entry[0]);
    console.log(entry[1]);
  }
  for await (const entry of Array.from(Object.freeze((new Map(mapValues))))) {
    console.log(entry[0]);
    console.log(entry[1]);
  }
  for (const entry of Array.from(Object.freeze((null ?? new Map(mapValues))))) {
    console.log(entry[0]);
    console.log(entry[1]);
  }
  for await (const entry of Array.from(Object.freeze((false || new Map(mapValues))))) {
    console.log(entry[0]);
    console.log(entry[1]);
  }
  for (const entry of Array.from(Object.freeze((new (true && Map)(mapValues))))) {
    console.log(entry[0]);
    console.log(entry[1]);
  }
}

browserArrayFromFrozenSetMapWrappers();
"""
