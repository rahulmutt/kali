rationale = """Migrated from browser_math_exp_log_bracketed_root.rs. This case is one of the 8 invocations the single #[test] fn `run_and_test_supports_bracketed_global_this_math_exp_log_identities_when_browser_harness_is_configured_in_js_and_ts_input` performs by looping over four (command, source_name, source, expected_stdout) tuples and over `for output_json in [false, true]`; per the split-don't-fold rule each independent program gets its own sibling [[case]] rather than being folded. It runs `kali test --api browser` under the browser harness (`node`) and, in non-json mode, asserts a clean exit and `stdout.contains('1\\n0')`; a plain `.contains` against a field that has a substring form, so mirrored as `stdout_contains`. No [matrix] in this file: the harness group covers only js/ts while the bundle group covers all four extensions, and `[matrix]` is file-wide with no per-case opt-out."""
args = ["test", "--api", "browser", "--max-threads", "0", "--max-spawned-processes", "0", "smoke.test.ts"]
env = { "KALI_BROWSER_BUNDLE_HARNESS_COMMAND" = "node" }
exit = "success"
stdout_contains = ["1\n0"]

[[case]]
name = "json_test_supports_bracketed_global_this_math_exp_log_identities_when_browser_harness_is_configured_in_ts_input"
rationale = """Migrated from browser_math_exp_log_bracketed_root.rs. This case is one of the 8 invocations the single #[test] fn `run_and_test_supports_bracketed_global_this_math_exp_log_identities_when_browser_harness_is_configured_in_js_and_ts_input` performs by looping over four (command, source_name, source, expected_stdout) tuples and over `for output_json in [false, true]`; per the split-don't-fold rule each independent program gets its own sibling [[case]] rather than being folded. It runs `kali test --api browser --output json` and asserts the JSON envelope's schemaVersion/command/success/payload (hostContract, runtimeBackend) fields, `payload.total`/`passed`/`failed` == 1/1/0, that `stderr` is exactly empty, and that `json["stdout"]` contains the source's own `expected_stdout` literal '1\\n0'. A nested `json` leaf has no substring-assertion form in this case-file format (only exact equality), so that claim is resolved to an exact pin -- live-captured from the real `kali` binary and checked to contain the source's literal before being written. No [matrix] in this file: the harness group covers only js/ts while the bundle group covers all four extensions, and `[matrix]` is file-wide with no per-case opt-out."""
args = ["--output", "json", "test", "--api", "browser", "--max-threads", "0", "--max-spawned-processes", "0", "smoke.test.ts"]
env = { "KALI_BROWSER_BUNDLE_HARNESS_COMMAND" = "node" }
exit = "success"
json = { "schemaVersion" = 1, "command" = "test", "success" = true, "payload" = { "hostContract" = "browser-requested", "runtimeBackend" = "browser-harness", "total" = 1, "passed" = 1, "failed" = 0 }, "stdout" = "1\n0\n", "stderr" = "" }
