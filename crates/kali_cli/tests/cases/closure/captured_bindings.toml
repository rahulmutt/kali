[[case]]
name = "a_closure_over_a_fractional_parameter_is_refused"
rationale = """§3.1, A-1: a parameter is refused whatever its repr (here F64). node prints `1.5`; baseline printed `0` at exit 0 (row `cb_a6 SILENT 1.5 0 0`).
Task 7 (2026-10-05): the rewrite makes `x` a local; it is refused by value type (F64 in phase 1, an unpromoted TaggedVal cell in codegen) until Tasks 8-9. HEAD prints `error[E5506]: a closure `__kali_fn_0` that captures `x` is unavailable in the current phase: its value type has no closure cell`.
Task 9 (2026-10-05): ruling R14 (A-4): F64 cells now promote under `Widening::CapturedBindings`, but a capturer may only write one (an assignment statement `=` / `+=` / `-=` / `*=` / `/=` whose right-hand side does not read it). `repr_infer` types the closure's `x` by its own node, which defaults to I64 and is not joined to the owner's, so an f64 read would reach integer-typed wasm places (E4201). Here the closure reads `x` (and the `{p}` check rule stays I64-with-proof only). node prints `1.5`; HEAD still exits 1 with `error[E5506]: a closure `__kali_fn_0` that captures `x` is unavailable in the current phase: its value type has no closure cell`."""
args = ["run", "a6.js"]
exit = "failure"
stderr_contains = ["E5506", "that captures `x`", "its value type has no closure cell"]

