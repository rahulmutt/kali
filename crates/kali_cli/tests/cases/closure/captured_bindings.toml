name = "an_f64_compound_assignment_returned_from_an_unkeyed_method_is_refused"
rationale = """Task 9 fix round 1 (2026-10-05), reviewer p26: `return x += 1` in an anonymous class method uses the assignment's value (R14). node prints `2.5` then `2.5`; cc1458493 exited 1 with `error[E5506]: compound assignment lowering is unavailable for binding 'x' (operator '+=') …`; b605fbfd1 (Task 9 first commit) failed with `error[E4201]: failed to load WASM module: failed to compile: …` — invalid wasm, which spec §3.1 forbids; HEAD exits 1 with `error[E5506]: a closure `m` that captures `x` is unavailable in the current phase: its value type has no closure cell`."""
args = ["run", "cm26.js"]
exit = "failure"
stderr_contains = ["E5506", "a closure `m` that captures `x`", "its value type has no closure cell"]
stderr_absent = ["E4201"]

[[case]]
name = "an_f64_compound_assignment_in_a_condition_of_an_unkeyed_method_is_refused"
rationale = """Task 9 fix round 1 (2026-10-05), reviewer w3: `if ((x += 1) > 2)` in an anonymous class method compares the assignment's value (R14). node prints `big` then `2.5`; cc1458493 exited 1 with `error[E5506]: compound assignment lowering is unavailable for binding 'x' (operator '+=') …`; b605fbfd1 (Task 9 first commit) failed with `error[E4201]: failed to load WASM module: failed to compile: …` — invalid wasm, which spec §3.1 forbids; HEAD exits 1 with `error[E5506]: a closure `m` that captures `x` is unavailable in the current phase: its value type has no closure cell`."""
args = ["run", "cmw3.js"]
exit = "failure"
stderr_contains = ["E5506", "a closure `m` that captures `x`", "its value type has no closure cell"]
stderr_absent = ["E4201"]

[[case]]
name = "a_closure_assigning_nan_to_an_f64_capture"
rationale = """Task 9 fix round 1 (2026-10-05), reviewer z12: the F64 cell's right-hand side is a global `NaN` that no other lane claims; it lowers as `f64.const nan` (`f64_constant_rhs`), not through the identifier lane (which reads a placeholder, and whose shape made the cell arm emit `f64.convert_i64_s` over an f64). node prints `NaN`; cc1458493 exited 1 with E5506 (value type); b605fbfd1 (Task 9 first commit) failed with `error[E4201]: failed to load WASM module: failed to compile: …` — invalid wasm, which spec §3.1 forbids; HEAD prints `NaN` at exit 0."""
args = ["run", "fnan.js"]
exit = "success"
stdout = "NaN\n"

[[case]]
name = "a_closure_multiplying_an_f64_capture_by_a_large_literal"
rationale = """Task 9 fix round 1 (2026-10-05), reviewer y7: `1e20` is an integer-valued literal outside i64, which the generic literal lane interns as a string handle (an i64) while `is_float_valued` calls it float; the F64 cell arm now emits the literal's value as `f64.const` (`f64_constant_rhs`). node prints `150000000000000000000`; cc1458493 exited 1 with E5506 (value type); b605fbfd1 (Task 9 first commit) failed with `error[E4201]: failed to load WASM module: failed to compile: …` — invalid wasm, which spec §3.1 forbids; HEAD prints `150000000000000000000` at exit 0."""
args = ["run", "fbig.js"]
exit = "success"
stdout = "150000000000000000000\n"
