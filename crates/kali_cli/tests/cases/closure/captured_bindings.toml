# --- existing refusals keep their messages ---

[[case]]
name = "a_compound_assignment_to_a_capture_keeps_its_refusal"
rationale = """§3.1: compound assignment is unchanged. node prints `2.5`; baseline refused (row `cb_w3 REFUSES 2.5 error[E5506]: compound assignment lowering is unavailable for binding 'x' (operator '+=') ... 0`).
Task 5 (2026-10-05): the check pass now refuses first, as the captured F64 `x` has no closure cell; HEAD prints `error[E5506]: a closure `__kali_fn_0` that captures `x` is unavailable in the current phase: its value type has no closure cell` and no longer prints the compound-assignment message. Still E5506."""
args = ["run", "w3.js"]
exit = "failure"
stderr_contains = ["E5506", "that captures `x`", "its value type has no closure cell"]

[[case]]
name = "an_update_expression_on_a_capture_keeps_its_refusal"
rationale = """§3.1: update expressions are unchanged. node prints `6`; baseline refused (row `cb_w4 REFUSES 6 error[E5506]: update expression lowering is unavailable for binding 'k' ... 0`).
Task 5 (2026-10-05): the check pass now refuses first, as `k` is a captured parameter; HEAD prints `error[E5506]: a closure `__kali_fn_0` that captures `k` is unavailable in the current phase: `k` is a parameter of `f`` and no longer prints the update-expression message. Still E5506."""
args = ["run", "w4.js"]
exit = "failure"
stderr_contains = ["E5506", "that captures `k`", "`k` is a parameter of `f`"]

[[case]]
name = "a_deferred_callback_over_a_parameter_keeps_its_refusal"
rationale = """§3.1: the deferred-registration lane keeps its own allowlist and message. node prints `5`; baseline refused (row `cb_v2 REFUSES 5 error[E5506]: a captured param binding without closure lowering would read a placeholder ... 0`).
Task 5 (2026-10-05): the check pass now refuses first, as `k` is a captured parameter, before the deferred lane in codegen is reached; HEAD prints `error[E5506]: a closure `__kali_fn_0` that captures `k` is unavailable in the current phase: `k` is a parameter of `f`` and no longer prints the deferred-lane message. Still E5506."""
args = ["run", "v2.js"]
exit = "failure"
stderr_contains = ["E5506", "that captures `k`", "`k` is a parameter of `f`"]

