# --- a captured parameter (A-1). Task 7: the rewrite makes it a `let` local, so
# `run` refuses it by value type until Task 8 promotes the cell ---

[[case]]
name = "a_closure_over_a_parameter_is_refused"
rationale = """Spec §3.1, A-1: a parameter's cell is TaggedVal and unpromoted, so the closure read fell to the zero placeholder. node prints `5`; baseline printed `0` at exit 0 (row `cb_p1 SILENT 5 0 0`).
Task 7 (2026-10-05): the rewrite makes `k` a local; it is refused as a TaggedVal until Task 8. HEAD prints `error[E5506]: a closure `__kali_fn_0` that captures `k` is unavailable in the current phase: its value type has no closure cell`."""
args = ["run", "p1.js"]
exit = "failure"
stderr_contains = ["E5506", "that captures `k`", "its value type has no closure cell"]

