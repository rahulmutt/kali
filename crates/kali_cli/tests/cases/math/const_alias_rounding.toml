[[case]]
name = "an_unpublished_float_loop_item_takes_the_runtime_f64_lane_module_scope"
rationale = "Residual round 4 (spec A-45): a `let` loop item over float literals that is pushed onto a growable array carries the f64 item repr (RE-PINNED 2026-10-08, round 5: the item is now pushed, since the item flow runs only for a loop that feeds a growable element; node's stdout re-measured) but is not a published compile-time number (`let`), so inference gives the rounding call a float edge and codegen lowers it on the runtime f64 lane (the item's value as an f64) instead of refusing it as a non-integer literal at `run` after `check` passed."
args = ["run", "runtime_lane_module.js"]
exit = "success"
stdout = "1 2 1 2 1.5 1.5 2\n2 3 2 3 2.5 2 2.5\n0 1 0 0 0.25 0.25 2\n3 1.5\n"

