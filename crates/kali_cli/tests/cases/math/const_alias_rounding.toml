# Residual round 1 of the growable-runtime-arrays lane (spec A-39, N1): a
# rounding call over a `const` alias of a numeric literal keeps the i64
# constant-fold lane it had on `main`, so `%`, bitwise operators, `**`,
# `new Array(n)` and a loop bound work on its result. Round 0 gave it an f64
# result and these failed to load (E4201) or were refused (E5506) while `check`
# exited 0. Expected stdout is node v26.10.0's (`env -u FORCE_COLOR node`).

[source]
"alias_module.js" = """
const t = 7.9;
const u = 2.6;
const c = 3.2;
console.log(Math.floor(t) % 3, Math.floor(t) | 0, Math.floor(u) << 1, Math.trunc(u) ** 2);
const k = Math.floor(t);
console.log(k % 3, k & 1, k ^ 2);
const a = new Array(Math.floor(u)).fill(1);
console.log(a.length);
const n = Math.ceil(c);
let s = "";
for (let i = 0; i < n; i++) s += "x";
console.log(s, n % 2 === 0);
function f(m) { return m % 2; }
console.log(f(Math.round(u)));
"""
"alias_function.js" = """
function main() {
  const t = 7.9;
  const u = 2.6;
  const c = 3.2;
  console.log(Math.floor(t) % 3, Math.floor(t) | 0, Math.floor(u) << 1, Math.trunc(u) ** 2);
  const k = Math.floor(t);
  console.log(k % 3, k & 1, k ^ 2);
  const a = new Array(Math.floor(u)).fill(1);
  console.log(a.length);
  const n = Math.ceil(c);
  let s = "";
  for (let i = 0; i < n; i++) s += "x";
  console.log(s, n % 2 === 0);
  function f(m) { return m % 2; }
  console.log(f(Math.round(u)));
}
main();
"""
"module_const_from_function.js" = """
const t = 7.9; function first(){ const k = Math.floor(t); console.log(k % 3, k & 1); } first();
function second() { console.log(Math.floor(t), Math.trunc(t) % 4); } second();
"""
"chain_module.js" = """
const t = 7.9;
const u = t;
const a = 7.9;
const b = -a;
function f() { return Math.floor(u) % 3; }
function g() { return Math.floor(b) % 3; }
function h() { const t2 = t; return Math.floor(t2) | 1; }
function k() { const m = Math.floor(u); return m | 1; }
console.log(f(), g(), h(), k(), Math.floor(u) % 3, Math.ceil(b) | 0);
"""
"chain_function.js" = """
function main() {
  const t = 7.9;
  const u = t;
  const a = 7.9;
  const b = -a;
  const t2 = u;
  const m = Math.floor(u);
  console.log(Math.floor(u) % 3, Math.floor(b) % 3, Math.floor(t2) | 1, m | 1, Math.ceil(b) | 0);
}
main();
"""
"loop_module.js" = """
for (const x of [1.5, 2.5]) {
  const k = Math.floor(x);
  console.log(k, k % 2, k / 2, Math.round(x) * 1.5);
}
const ys = [3.5, 4.25];
for (const y of ys) {
  const k = Math.ceil(y);
  console.log(k | 1, k % 3);
}
"""
"loop_function.js" = """
function main() {
  for (const x of [1.5, 2.5]) {
    const k = Math.floor(x);
    console.log(k, k % 2, k / 2, Math.round(x) * 1.5);
  }
  const ys = [3.5, 4.25];
  for (const y of ys) {
    const k = Math.ceil(y);
    console.log(k | 1, k % 3);
  }
}
main();
"""
"class_module.js" = """
class C {
  static f() { const t = 1.5; console.log(Math.floor(t), Math.floor(t) % 2); }
  static g() { const t = 2.5; return Math.floor(t) % 2; }
  static h() { for (const x of [1.5, 2.5]) { console.log(Math.floor(x) % 2); } }
  static r() { for (const x of [1.5]) { return Math.floor(x) % 2; } return 9; }
}
C.f();
console.log(C.g());
C.h();
console.log(C.r());
"""
"class_function.js" = """
function main() {
  class C {
    static f() { const t = 1.5; console.log(Math.floor(t), Math.floor(t) % 2); }
    static g() { const t = 2.5; return Math.floor(t) % 2; }
    static h() { for (const x of [1.5, 2.5]) { console.log(Math.floor(x) % 2); } }
    static r() { for (const x of [1.5]) { return Math.floor(x) % 2; } return 9; }
  }
  C.f();
  console.log(C.g());
  C.h();
  console.log(C.r());
}
main();
"""
"class_expression.js" = """
const D = class { static f() { const t = 1.5; console.log(Math.floor(t) % 2); } };
D.f();
"""
"class_extends.js" = """
class A { static f() { return 1; } }
class B extends A { static g() { const t = 2.5; return Math.floor(t) % 2; } }
console.log(B.g());
"""
"default_export.ts" = """
export default function () { const t = 1.5; console.log(Math.floor(t) % 2); }
console.log("ok");
"""
"ts_wrapped.ts" = """
const t = 1.5 as number;
const s = 2.5 satisfies number;
const u = t as number;
console.log(Math.floor(t) % 2, Math.floor(s) % 2, Math.floor(u) % 2, Math.ceil(u) % 2);
"""
"ts_wrapped_main.ts" = """
function main() {
  const t = 1.5 as number;
  const s = 2.5 satisfies number;
  const u = t as number;
  console.log(Math.floor(t) % 2, Math.floor(s) % 2, Math.floor(u) % 2, Math.ceil(u) % 2);
}
main();
"""
"loop_shapes.js" = """
for (let x of [1.5, 2.5]) { const k = Math.floor(x); console.log(k % 2); }
const ys = [1.5, 2.5]; const zs = ys; for (const x of zs) { console.log(Math.floor(x) % 2); }
const fr = Object.freeze([3.5, 4.5]); for (const x of fr) { console.log(Math.floor(x) % 2); }
for (const x of new Set([1.5, 2.5])) { console.log(Math.floor(x) % 2); }
for (const x of Object.values({a: 1.5, b: 2.5})) { console.log(Math.floor(x) % 2); }
for (const x of [1.5, 2.5].map(v => v)) { console.log(Math.floor(x) % 2); }
for (let x of [5.5, 6.5]) { console.log(Math.floor(x)); }
"""
"loop_shapes_main.js" = """
function main() {
  for (let x of [1.5, 2.5]) { const k = Math.floor(x); console.log(k % 2); }
  const ys = [1.5, 2.5]; const zs = ys; for (const x of zs) { console.log(Math.floor(x) % 2); }
  const fr = Object.freeze([3.5, 4.5]); for (const x of fr) { console.log(Math.floor(x) % 2); }
  for (const x of new Set([1.5, 2.5])) { console.log(Math.floor(x) % 2); }
  for (const x of Object.values({a: 1.5, b: 2.5})) { console.log(Math.floor(x) % 2); }
  for (const x of [1.5, 2.5].map(v => v)) { console.log(Math.floor(x) % 2); }
  for (let x of [5.5, 6.5]) { console.log(Math.floor(x)); }
}
main();
"""
"float_print.js" = """
for (const x of new Set([1.5, 2.5])) { console.log(Math.floor(x)); }
const ys = [3.5, 4.5]; const zs = ys; for (const x of zs) { console.log(Math.floor(x), Math.round(x)); }
"""
"runtime_lane_module.js" = """
const out = [];
for (let x of [1.5, 2.5, 0.25]) {
  out.push(x);
  console.log(Math.floor(x), Math.ceil(x), Math.trunc(x), Math.round(x), Math.abs(x), Math.min(x, 2), Math.max(x, 2));
}
console.log(out.length, out[0]);
"""
"runtime_lane_function.js" = """
function main() {
  const out = [];
  for (let x of [1.5, 2.5, 0.25]) {
    out.push(x);
    console.log(Math.floor(x), Math.ceil(x), Math.trunc(x), Math.round(x), Math.abs(x), Math.min(x, 2), Math.max(x, 2));
  }
  console.log(out.length, out[0]);
}
main();
"""
"loop_copy_module.js" = """
for (const x of [1.5, 2.5, 3.7]) { const y = x; console.log(Math.floor(y) % 2, Math.round(y) | 0, y); }
for (const x of [1.5, 2.5]) { const y = x; const z = y; console.log(Math.floor(z) % 2); }
"""
"loop_copy_function.js" = """
function main() {
  for (const x of [1.5, 2.5, 3.7]) { const y = x; console.log(Math.floor(y) % 2, Math.round(y) | 0, y); }
  for (const x of [1.5, 2.5]) { const y = x; const z = y; console.log(Math.floor(z) % 2); }
}
main();
"""

[[case]]
name = "a_rounded_const_alias_folds_to_an_integer_module_scope"
rationale = "Residual round 1 (N1): `const t = 7.9; Math.floor(t) % 3`, `| 0`, `<< 1`, `Math.trunc(u) ** 2`, a `const k = Math.floor(t)` under `%`/`&`/`^`, `new Array(Math.floor(u))`, a `Math.ceil` loop bound with `n % 2`, and `Math.round(u)` passed to a `%` function print node's values."
args = ["run", "alias_module.js"]
exit = "success"
stdout = "1 7 4 4\n1 1 5\n2\nxxxx true\n1\n"

