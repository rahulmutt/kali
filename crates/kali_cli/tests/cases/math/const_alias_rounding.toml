[[case]]
name = "a_rounded_unrolled_loop_variable_folds_to_an_integer_module_scope"
rationale = "Residual round 3 (N1c, spec A-44): a `const` loop variable of a `for-of` over a literal array of floats (inline, or a non-growable `const` binding) is a compile-time number on both sides, so `Math.floor`/`Math.ceil` of it folds to an integer and `%`, `|`, `/` and `* 1.5` print node's values (round 2: `check` passed, `run` E4201)."
args = ["run", "loop_module.js"]
exit = "success"
stdout = "1 1 0.5 3\n2 0 1 4.5\n5 1\n5 2\n"

