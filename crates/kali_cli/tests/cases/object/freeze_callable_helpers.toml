# Migrated from tests/object_freeze_callable_helpers.rs -- all 8 #[test]
# functions, as 4 sibling case blocks fanned across a file-level `[matrix]`
# extension axis (js/ts/jsx/tsx) = 16 trials, matching the original 8
# #[test] fns exactly: 4 of them (`run_supports_..._in_js_input`,
# `json_run_supports_..._in_js_input`, `test_supports_..._in_js_input`,
# `json_test_supports_..._in_js_input`) each cover exactly the "js"
# extension, and their 4 siblings (`..._in_ts_jsx_and_tsx_input`) each loop
# over ["ts", "jsx", "tsx"] internally -- together, each of the 4 case
# shapes (run plain, json run, test plain, json test) is exercised across
# all 4 extensions with an identical assertion shape per extension (the
# fixture source and expected output do not depend on the extension at
# all). That is a file-level uniform axis exactly like
# `array/callback_number_predicates_browser_harness.toml` (Task 14), so
# `[matrix]` is the right tool here rather than 8 flat siblings, per this
# task's two-axis rule -- it was only split into a dedicated js-only test
# plus a ts/jsx/tsx-looping test in the original `.rs`, not because any
# case is exempt from any extension.
#
# `[constants]` factors out the two fixture bodies (`main_source`,
# `test_source`) and their two expected-stdout bodies (`expected_stdout`,
# `test_stdout`), each identical byte-for-byte across all 4 extensions.
# `expected_stdout`/`test_stdout` are two separate constants (not one
# referencing the other with `${expected_stdout}`) because `[constants]`
# substitution is a single non-recursive pass (`crates/kali_case_runner/
# src/expand.rs`'s `expand`): a constant's own value is never itself
# scanned for `${...}` placeholders, so nesting them would leave a literal
# `${expected_stdout}` token in the output instead of substituting it.
#
# Fixture content is generated at test-run time in the original `.rs` from
# `kali_common::object_has_own_frozen_callable_aliases()` (37 entries) and
# `kali_common::math_floor_trunc_ceil_frozen_callable_aliases()` (81
# entries) -- not literal text in the `.rs` file itself. The exact bodies
# below were captured by running a throwaway program linked against
# `kali_common` that calls the same functions the original test calls, and
# the exact expected stdout was verified for real by running the built
# `kali` binary (`cargo run -q --bin kali --`, from the repository root) against the
# captured fixture -- not guessed. The `test_plain` case's original
# assertions were `stdout.contains(&expected_stdout)` followed by a
# separate `stdout.contains("ok 1")`; running the binary confirmed the
# real `test` stdout is exactly `expected_stdout` immediately followed by
# `"ok 1\n"` with nothing else, so this migrates to an exact `stdout`
# equality assertion (`test_stdout` below), strictly stronger than the
# original `.contains()` pair, not a weakening -- the same judgment call
# already made and documented in
