# Pins for the property-key identity project (spec
# docs/superpowers/specs/2026-08-16-hir-property-key-identity-design.md).
#
# EVERY EXPECTATION IN THIS FILE IS WRONG ON PURPOSE at the commit that adds
# it. These cases record what kali does at `5c80f081d2` so that the fix has
# something to turn red. The `rationale` on each says what node does and which
# task is expected to move it; a case that moves without its task moving is a
# surprise, which is the point.
#
# The two control cases at the end are the opposite: they are CORRECT today and
# must stay correct. `{5:1}` and `{"5":1}` are the same property in JavaScript,
# and a discriminator that separated them would fix R-56 by breaking conforming
# programs.
#
# One more pair was added beyond the plan's Step 2 list: `object_keys_
# enumeration_order_*`. The plan's spec claims Object.keys enumeration order is
# pinned before it changes (docs/superpowers/specs/2026-08-16-hir-property-key-
# identity-design.md:374-378, risk 4: "the ordering is pinned by cases before
# the change so any movement is visible rather than inferred"), but the ten
# cases above never actually exercise ordering with a mixed array-index-like
# key and a string key. Measured against this commit, kali already agrees with
# node, so this pair is a sixth CONTROL rather than a seventh defect: it exists
# so that ordering movement caused by a later task's HIR key-slot collapse or
# Object.keys rewrite is visible as a named red case rather than inferred from
# an unrelated failure.

[source]
"bigint_module.js" = """const o = {42n: 1};
console.log(Object.hasOwn(o, 0));
console.log(o[0]);
console.log(o[42]);
"""
"bigint_function.js" = """function main() {
  const o = {42n: 1};
  console.log(Object.hasOwn(o, 0));
  console.log(o[0]);
  console.log(o[42]);
}
main();
"""
"keys_small_module.js" = """for (const k of Object.keys({1e-7: 1})) console.log(k);
"""
"keys_small_function.js" = """function main() {
  for (const k of Object.keys({1e-7: 1})) console.log(k);
}
main();
"""
"keys_extreme_module.js" = """for (const k of Object.keys({[-1e999]: 1, [1e21]: 2})) console.log(k);
"""
"keys_extreme_function.js" = """function main() {
  for (const k of Object.keys({[-1e999]: 1, [1e21]: 2})) console.log(k);
}
main();
"""
"numeric_string_same_key_module.js" = """const o = {5: 1};
const p = {"5": 1};
console.log(Object.hasOwn(o, 5));
console.log(Object.hasOwn(p, 5));
console.log(Object.hasOwn(o, "5"));
"""
"numeric_string_same_key_function.js" = """function main() {
  const o = {5: 1};
  const p = {"5": 1};
  console.log(Object.hasOwn(o, 5));
  console.log(Object.hasOwn(p, 5));
  console.log(Object.hasOwn(o, "5"));
}
main();
"""
"quoted_numeric_member_read_module.js" = """const q = {'"5"': 1};
console.log(q['"5"']);
"""
"quoted_numeric_member_read_function.js" = """function main() {
  const q = {'"5"': 1};
  console.log(q['"5"']);
}
main();
"""
"member_read_module.js" = """const a = {1e21: 1};
console.log(a[1e21]);
const b = {1e-7: 2};
console.log(b[1e-7]);
const c = {[-1e999]: 3};
console.log(c[-1e999]);
"""
"member_read_function.js" = """function main() {
  const a = {1e21: 1};
  console.log(a[1e21]);
  const b = {1e-7: 2};
  console.log(b[1e-7]);
  const c = {[-1e999]: 3};
  console.log(c[-1e999]);
}
main();
"""
"keys_order_module.js" = """for (const k of Object.keys({2: 'a', foo: 'b', 0: 'c'})) console.log(k);
"""
"keys_order_function.js" = """function main() {
  for (const k of Object.keys({2: 'a', foo: 'b', 0: 'c'})) console.log(k);
}
main();
"""

[[case]]
name = "bigint_key_is_stored_under_zero_module_scope"
rationale = "RE-PINNED, was wrong now differently wrong (Task 2): node prints `false`, `undefined`, `1`. kali now prints `false`, `0`, `1` -- `Object.hasOwn(o, 0)` is fixed (the parser reads `42n` as `PropertyName::BigInt(\"42\")` instead of falling back to the key `0`, so `hasOwn` and `o[42]` now agree with node), but `o[0]` reads `0` instead of `undefined`. That residual is a DIFFERENT defect -- an absent-property read returning a fabricated `0` rather than `undefined` -- not the key-identity defect this task fixes. Not chased here; see the commit message."
args = ["run", "bigint_module.js"]
exit = "success"
stdout = "false\n0\n1\n"

[[case]]
name = "bigint_key_is_stored_under_zero_in_function"
rationale = "RE-PINNED, was wrong now differently wrong (Task 2): same as the module-scope case, in function scope. node prints `false`, `undefined`, `1`; kali prints `false`, `0`, `1`. The key-identity part of this case is fixed; the `o[0]` residual is the same absent-property-read defect described on the module-scope case, not this task's defect."
args = ["run", "bigint_function.js"]
exit = "success"
stdout = "false\n0\n1\n"

[[case]]
name = "object_keys_renders_small_magnitude_key_with_rust_display_module_scope"
rationale = "RE-PINNED, was wrong now RIGHT and AGREEING WITH NODE (Task 3): kali now prints `1e-7`, which is what node prints. What moved: `lower_property_name` stores the key as `format_js_number(1e-7)` instead of Rust's `Display for f64`, so the enumeration fold reads `1e-7` out of the key node rather than `0.0000001`. Task 4 was expected to own finishing this lane; Task 3's HIR change alone finished it, so Task 4 should find this case already green rather than move it again."
args = ["run", "keys_small_module.js"]
exit = "success"
stdout = "1e-7\n"

[[case]]
name = "object_keys_renders_small_magnitude_key_with_rust_display_in_function"
rationale = "RE-PINNED, was wrong now RIGHT and AGREEING WITH NODE (Task 3): same movement in function scope; kali and node both print `1e-7`. Task 4 should find this already green."
args = ["run", "keys_small_function.js"]
exit = "success"
stdout = "1e-7\n"

[[case]]
name = "object_keys_leaks_rust_infinity_spelling_module_scope"
rationale = "RE-PINNED, was wrong now RIGHT and AGREEING WITH NODE (Task 3): kali now prints `-Infinity` then `1e+21`, matching node. The `-inf` line -- a string no JavaScript program can produce -- is gone because `lower_property_name` renders the key through `format_js_number`, which spells the infinities the way `String(number)` does. Task 4 was expected to own finishing this lane; Task 3's HIR change alone finished it, so Task 4 should find this case already green."
args = ["run", "keys_extreme_module.js"]
exit = "success"
stdout = "-Infinity\n1e+21\n"

[[case]]
name = "object_keys_leaks_rust_infinity_spelling_in_function"
rationale = "RE-PINNED, was wrong now RIGHT and AGREEING WITH NODE (Task 3): same movement in function scope; kali and node both print `-Infinity` then `1e+21`. Task 4 should find this already green."
args = ["run", "keys_extreme_function.js"]
exit = "success"
stdout = "-Infinity\n1e+21\n"

[[case]]
name = "numeric_and_quoted_numeric_keys_are_the_same_property_module_scope"
rationale = "CONTROL -- correct today and must stay correct. JavaScript gives `{5:1}` and `{\"5\":1}` the same property name, and both probes agree with node at `true true true`. This case is what a discriminator that over-separates would break, so it is the guard on Task 3 rather than a target of it."
args = ["run", "numeric_string_same_key_module.js"]
exit = "success"
stdout = "true\ntrue\ntrue\n"

[[case]]
name = "numeric_and_quoted_numeric_keys_are_the_same_property_in_function"
rationale = "CONTROL -- correct today and must stay correct, in function scope. node agrees at `true true true`."
args = ["run", "numeric_string_same_key_function.js"]
exit = "success"
stdout = "true\ntrue\ntrue\n"

[[case]]
name = "quoted_numeric_string_key_member_read_is_correct_module_scope"
rationale = "CONTROL -- correct today and must stay correct. The member read of R-56's key already agrees with node (`1`); it is the two `Object.hasOwn` probes in the oracle case `r56a_quoted_numeric_string_key_module_scope` that diverge. Keeping the read pinned here means a fix that repairs the probes by breaking the read cannot pass."
args = ["run", "quoted_numeric_member_read_module.js"]
exit = "success"
stdout = "1\n"

[[case]]
name = "quoted_numeric_string_key_member_read_is_correct_in_function"
rationale = "CONTROL -- correct today and must stay correct, in function scope. node prints `1`."
args = ["run", "quoted_numeric_member_read_function.js"]
exit = "success"
stdout = "1\n"

[[case]]
name = "member_read_of_exponent_spelled_numeric_key_module_scope"
rationale = "CONTROL, added by Task 3's review because nothing covered it. A member read of a numeric key whose JavaScript spelling differs from Rust's -- `1e21` (>= the 1e21 threshold), `1e-7` (< the 1e-6 threshold) and `-1e999` (overflow to -Infinity). node prints `1`, `2`, `3`; kali agrees. This is a REGRESSION GUARD with a real history: Task 3's first commit moved the stored key to `format_js_number` and left `expression_to_property_name` on `format!(\"{n:.0}\")`/`Display`, so `o[1e21]` probed for `1000000000000000000000` while the key was stored as `1e+21`, the object-literal field lookup missed, and the member read emitted a fabricated `0` at exit 0 -- in a program whose `Object.hasOwn` and `Object.keys` were both already right. The existing cases in this file exercise these keys only through `Object.keys`, which is why they did not catch it. Both formatters are `format_js_number` now; if either side ever grows a second one, this case goes red."
args = ["run", "member_read_module.js"]
exit = "success"
stdout = "1\n2\n3\n"

[[case]]
name = "member_read_of_exponent_spelled_numeric_key_in_function"
rationale = "CONTROL, added by Task 3's review. Same regression guard in function scope; node prints `1`, `2`, `3` and kali agrees."
args = ["run", "member_read_function.js"]
exit = "success"
stdout = "1\n2\n3\n"

[[case]]
name = "object_keys_enumeration_order_module_scope"
rationale = "CONTROL -- correct today and must stay correct. Enumerating `Object.keys({2: 'a', foo: 'b', 0: 'c'})`, kali and node both print `0`, `2`, `foo`: ES enumeration order puts array-index-like keys first in ascending numeric order, then string keys in insertion order, and kali gets this right today. This case is not in the plan's Step 2 list; it is added because the design's risk register (docs/superpowers/specs/2026-08-16-hir-property-key-identity-design.md:374-378) says ordering is 'pinned by cases before the change so any movement is visible rather than inferred', and none of the ten cases above actually mix an array-index-like key with a string key. No task in this plan owns changing this ordering; it is a tripwire -- if a later task's HIR key-slot collapse or Object.keys rewrite perturbs enumeration order, this case turns red on its own rather than the movement being inferred from something else."
args = ["run", "keys_order_module.js"]
exit = "success"
stdout = "0\n2\nfoo\n"

[[case]]
name = "object_keys_enumeration_order_in_function"
rationale = "CONTROL -- correct today and must stay correct, in function scope. node agrees at `0 2 foo`. Same tripwire as the module-scope case: no task in this plan owns changing this ordering."
args = ["run", "keys_order_function.js"]
exit = "success"
stdout = "0\n2\nfoo\n"
