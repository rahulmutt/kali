# Pins for the property-key identity project (spec
# docs/superpowers/specs/2026-08-16-hir-property-key-identity-design.md).
#
# EVERY EXPECTATION IN THIS FILE IS WRONG ON PURPOSE at the commit that adds
# it. These cases record what kali does at `5c80f081d2` so that the fix has
# something to turn red. The `rationale` on each says what node does and which
# task is expected to move it; a case that moves without its task moving is a
# surprise, which is the point.
#
# The two control cases at the end are the opposite: they are CORRECT today and
# must stay correct. `{5:1}` and `{"5":1}` are the same property in JavaScript,
# and a discriminator that separated them would fix R-56 by breaking conforming
# programs.
#
# One more pair was added beyond the plan's Step 2 list: `object_keys_
# enumeration_order_*`. The plan's spec claims Object.keys enumeration order is
# pinned before it changes (docs/superpowers/specs/2026-08-16-hir-property-key-
# identity-design.md:374-378, risk 4: "the ordering is pinned by cases before
# the change so any movement is visible rather than inferred"), but the ten
# cases above never actually exercise ordering with a mixed array-index-like
# key and a string key. Measured against this commit, kali already agrees with
# node, so this pair is a sixth CONTROL rather than a seventh defect: it exists
# so that ordering movement caused by a later task's HIR key-slot collapse or
# Object.keys rewrite is visible as a named red case rather than inferred from
# an unrelated failure.
#
# Two more pairs were added by Task 5, and they are pinned at what kali does
# AFTER that task rather than before it, so the "wrong on purpose" note above
# does not describe them: `object_keys_over_a_quoted_string_key_*` is correct
# and agrees with node (it was wrong in both text and order before Task 5), and
# `member_probe_does_not_invent_a_property_from_quote_characters_*` is correct
# on two of three lines, with the third WRONG ON PURPOSE and its rationale
# naming the separate pre-existing defect that owns it. They exist because the
# divergences they measure were invisible: nothing in this file exercised a
# string key whose own content contains quote characters through the
# ENUMERATION-order lane or the MEMBER-read lane.
#
# FILED 2026-09-08, at `b13c890330` and `02297ca6c2` (off `dde0f083c0`, the
# branch base, which carries no entry): ~~two~~ **FOUR** of the wrong-on-purpose
# pairs below are
# now register entries, on the human's instruction, with every reading
# re-measured there against node v26.8.1 rather than carried across from these
# rationales. (The "two" was written when the first pair of entries landed and
# was left behind by the commit that filed the second pair; corrected here.)
# `escaped_quote_in_a_key_is_stored_undecoded_*` is **R-57**,
# `octal_leading_zero_numeric_key_is_read_as_decimal_*` is **R-58**,
# `computed_member_index_is_fabricated_from_the_index_expression_*` is **R-59**
# and `a_present_property_on_a_from_entries_object_also_reads_the_fabricated_zero_*`
# is **R-60** -- all four §2
# Tier 2 in docs/superpowers/followups/kali-silent-miscompile-register.md, each
# with an `r57a`/`r58a`/`r59a`/`r60a` oracle pair of its own in
# crates/kali_cli/tests/cases/oracle/tier2.toml. Three of the four pairs below are
# UNCHANGED and stay WRONG ON PURPOSE: they pin probes the oracle pairs
# deliberately do not carry (the member reads), and their expectations are still
# what kali prints. THE R-59 PAIR IS THE EXCEPTION AND NO LONGER STAYS WRONG ON
# PURPOSE: it FLIPPED TO A REFUSAL at `3ef65ef785`, re-pinned 2026-09-09 by the
# computed-member-static-name project (docs/superpowers/specs/2026-09-08-
# computed-member-static-name-design.md), which taught
# `expression_to_property_name` to decline. Both scopes now exit 1 with the
# shared E5506 under `kali check` and `kali run` alike, where they used to print
# `7` then `9` at exit 0; each case's own rationale opens with the dated record.
# The "no task in this plan owns closing it" notes below remain true of THIS
# plan; what has changed is that the register now tracks the defects.
#
# A THIRD pair was added by Task 5's review: `escaped_quote_in_a_key_is_stored_
# undecoded_*`. It is WRONG ON PURPOSE and no task in this plan owns closing it.
# It matters more than its size suggests, because it falsifies this project's
# invariant as the project has been stating it: a key slot's text is the
# property name for every shape of key EXCEPT one whose source spelling
# contains an escape sequence, which is stored undecoded. That exception is
# pre-existing parser behaviour (measured identical before and after Task 5),
# and it is pinned here rather than chased because decoding belongs to the
# parser, not to a task about comparison sites.
#
# THE FINAL WHOLE-BRANCH REVIEW AND ITS FIX WAVE made two further kinds of
# change, none of which is a task in this plan and none of which owns closing
# anything. It EXTENDED two existing pairs with probes their original rationale
# did not cover (`escaped_quote_in_a_key_is_stored_undecoded_*` gained a
# `k === "a\"b"` strict-equality probe; `object_keys_over_a_quoted_string_key_*`
# gained a `.length` and a `k === '"2"'` probe, and its rationale was downgraded
# from "correct" to "agrees on text and order" because `.length` does not
# agree). And it ADDED three WRONG-ON-PURPOSE pairs, all pre-existing and all
# out of scope:
#
#   * `octal_leading_zero_numeric_key_is_read_as_decimal_*` -- `{042: 1}`'s key
#     reads as decimal `42` where node says `34`, in the same nine-line parser
#     function whose BigInt half this branch guarded against exactly this
#     (filed 2026-09-08 as R-58);
#   * `computed_member_index_is_fabricated_from_the_index_expression_*` --
#     `expression_to_property_name` invents a property name for any index shape
#     it cannot read statically, the same fabricated-key class Tasks 2 and 5
#     deleted elsewhere, surviving one file over (filed 2026-09-08 as R-59);
#   * `a_present_property_on_a_from_entries_object_also_reads_the_fabricated_
#     zero_*` -- the fabricated `0` this file's other rationales call the
#     "absent-property read" defect also fires on a property that is PRESENT,
#     which is what forced those rationales to stop calling it that
#     (filed 2026-09-08 as R-60).
#
# Every expectation in the three new pairs is what kali printed at the commit
# that adds them, measured with the live binary against node v26.8.1 in both
# scopes; none of them is a guess at what kali ought to do.
#
[source]
"bigint_module.js" = """const o = {42n: 1};
console.log(Object.hasOwn(o, 0));
console.log(o[0]);
console.log(o[42]);
"""
"bigint_function.js" = """function main() {
  const o = {42n: 1};
  console.log(Object.hasOwn(o, 0));
  console.log(o[0]);
  console.log(o[42]);
}
main();
"""
"keys_small_module.js" = """for (const k of Object.keys({1e-7: 1})) console.log(k);
"""
"keys_small_function.js" = """function main() {
  for (const k of Object.keys({1e-7: 1})) console.log(k);
}
main();
"""
"keys_extreme_module.js" = """for (const k of Object.keys({[-1e999]: 1, [1e21]: 2})) console.log(k);
"""
"keys_extreme_function.js" = """function main() {
  for (const k of Object.keys({[-1e999]: 1, [1e21]: 2})) console.log(k);
}
main();
"""
"numeric_string_same_key_module.js" = """const o = {5: 1};
const p = {"5": 1};
console.log(Object.hasOwn(o, 5));
console.log(Object.hasOwn(p, 5));
console.log(Object.hasOwn(o, "5"));
"""
"numeric_string_same_key_function.js" = """function main() {
  const o = {5: 1};
  const p = {"5": 1};
  console.log(Object.hasOwn(o, 5));
  console.log(Object.hasOwn(p, 5));
  console.log(Object.hasOwn(o, "5"));
}
main();
"""
"quoted_numeric_member_read_module.js" = """const q = {'"5"': 1};
console.log(q['"5"']);
"""
"quoted_numeric_member_read_function.js" = """function main() {
  const q = {'"5"': 1};
  console.log(q['"5"']);
}
main();
"""
"member_read_module.js" = """const a = {1e21: 1};
console.log(a[1e21]);
const b = {1e-7: 2};
console.log(b[1e-7]);
const c = {[-1e999]: 3};
console.log(c[-1e999]);
"""
"member_read_function.js" = """function main() {
  const a = {1e21: 1};
  console.log(a[1e21]);
  const b = {1e-7: 2};
  console.log(b[1e-7]);
  const c = {[-1e999]: 3};
  console.log(c[-1e999]);
}
main();
"""
"keys_order_module.js" = """for (const k of Object.keys({2: 'a', foo: 'b', 0: 'c'})) console.log(k);
"""
"keys_order_function.js" = """function main() {
  for (const k of Object.keys({2: 'a', foo: 'b', 0: 'c'})) console.log(k);
}
main();
"""
"keys_typeof_module.js" = """for (const k of Object.keys({5: 1})) console.log(typeof k);
"""
"keys_typeof_function.js" = """function main() {
  for (const k of Object.keys({5: 1})) console.log(typeof k);
}
main();
"""
"keys_bigint_module.js" = """for (const k of Object.keys({42n: 1})) console.log(k, typeof k);
"""
"keys_bigint_function.js" = """function main() {
  for (const k of Object.keys({42n: 1})) console.log(k, typeof k);
}
main();
"""
"keys_quoted_string_key_order_module.js" = """const o = {foo:'b','"2"':'a'};
for (const k of Object.keys(o)) { console.log(k); console.log(k.length); console.log(k === '"2"'); }
"""
"keys_quoted_string_key_order_function.js" = """function main() {
  const o = {foo:'b','"2"':'a'};
  for (const k of Object.keys(o)) { console.log(k); console.log(k.length); console.log(k === '"2"'); }
}
main();
"""
"quoted_key_member_probe_module.js" = """const p = {'"a"': 1};
console.log(p['"a"']);
console.log(p['a']);
console.log(Object.hasOwn(p, 'a'));
"""
"quoted_key_member_probe_function.js" = """function main() {
  const p = {'"a"': 1};
  console.log(p['"a"']);
  console.log(p['a']);
  console.log(Object.hasOwn(p, 'a'));
}
main();
"""
# TOML LITERAL strings ('''), not basic ones, so the JS source keeps its
# backslash exactly as written: the key's source spelling is `"a\"b"`.
"escaped_quote_key_module.js" = '''const o = {"a\"b": 1};
for (const k of Object.keys(o)) { console.log(k, k.length); console.log(k === "a\"b"); }
console.log(o['a"b']);
'''
"escaped_quote_key_function.js" = '''function main() {
  const o = {"a\"b": 1};
  for (const k of Object.keys(o)) { console.log(k, k.length); console.log(k === "a\"b"); }
  console.log(o['a"b']);
}
main();
'''
"octal_leading_zero_numeric_key_module.js" = """const o = {042: 1};
console.log(Object.keys(o)[0]);
"""
"octal_leading_zero_numeric_key_function.js" = """function main() {
  const o = {042: 1};
  console.log(Object.keys(o)[0]);
}
main();
"""
"computed_member_index_module.js" = """const o = {index: 9, i: 7};
let i = 1;
console.log(o[i]);
console.log(o[i + 0]);
"""
"computed_member_index_function.js" = """function main() {
  const o = {index: 9, i: 7};
  let i = 1;
  console.log(o[i]);
  console.log(o[i + 0]);
}
main();
"""
"from_entries_present_property_module.js" = """const o = Object.fromEntries([["a", 1]]);
console.log(o.a);
"""
"from_entries_present_property_function.js" = """function main() {
  const o = Object.fromEntries([["a", 1]]);
  console.log(o.a);
}
main();
"""

[[case]]
name = "bigint_key_is_stored_under_zero_module_scope"
rationale = "RE-PINNED, was wrong now differently wrong (Task 2): node prints `false`, `undefined`, `1`. kali now prints `false`, `0`, `1` -- `Object.hasOwn(o, 0)` is fixed (the parser reads `42n` as `PropertyName::BigInt(\"42\")` instead of falling back to the key `0`, so `hasOwn` and `o[42]` now agree with node), but `o[0]` reads `0` instead of `undefined`. That residual is a DIFFERENT defect -- a static member read returning a fabricated `0` rather than the value JavaScript would produce -- not the key-identity defect this task fixes. It is reached here because the property is ABSENT, but the final whole-branch review measured the same fabricated `0` coming back for a PRESENT property too, so the defect is not only an absent-property one; see `a_present_property_on_a_from_entries_object_also_reads_the_fabricated_zero_module_scope`. Not chased here; see the commit message."
args = ["run", "bigint_module.js"]
exit = "success"
stdout = "false\n0\n1\n"

