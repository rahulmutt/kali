rationale = "ADDED BY THE FINAL WHOLE-BRANCH REVIEW, same probe in function scope; node prints `1` and kali prints `0`, at exit 0. WRONG ON PURPOSE for the reason given on the module-scope case: the fabricated `0` a static member read emits is not confined to ABSENT properties -- `Object.fromEntries([[\"a\", 1]])` has an own `a` worth `1`, and reading it still yields `0`, ~~because under `kali run`'s Fast mode the fromEntries BINDING fold never runs (it is gated to Release/ReleaseAdvanced) and the read has no shape to resolve against~~. Pre-existing, unowned by this plan, not chased here. FILED 2026-09-08 as R-60 (register section 2, Tier 2), at `02297ca6c2` (off `dde0f083c0`, the branch base), on the human's instruction, with an `r60a` oracle pair in both scopes; this case is unchanged and stays wrong on purpose. THE STRUCK CLAUSE IS THE ONE THING THE ENTRY DISPROVED, and it is kept struck rather than deleted because it is what this file believed: it is true of the READ and false of the OBJECT. On the same `o`, in the same Fast-mode run, `Object.hasOwn(o, \"a\")` folds to `true` and `Object.hasOwn(o, \"b\")` to `false` -- both agreeing with node -- because `static_object_has_own` recognizes a `fromEntries` call operand directly; and `Object.keys(o)` REFUSES the program (`error[E5506]`, exit 1). The shape is known to a sibling consumer in the same run; what has no shape to resolve against is this member read's RECEIVER, which by codegen is a scalar zero placeholder. Measured at `35e9ef4ef6` against node v26.8.1, both scopes."
