[[case]]
name = "object_keys_yields_strings_not_numbers_module_scope"
rationale = """
TESTS-ONLY (Task 4): this case passes on arrival at this commit, and Task 4 did
NOT change any code -- it was ordered not to conclude that from `typeof` alone,
because `typeof` on a value bound directly to a for-of loop's key node can be
constant-folded at compile time, which would print `string` even if the
underlying enumeration item were still numeric. That is exactly what happens
here: `typeof k` in this loop body IS folded away at compile time (confirmed
by contrast -- routing the same value through a genuine non-foldable path, a
function-parameter boundary, makes kali's runtime `typeof` operator answer `0`
instead of `string`, but that turns out to be a separate, pre-existing,
general defect: `typeof` on ANY runtime-string function parameter answers `0`
in kali today, reproduced with a hardcoded `probe(x){console.log(typeof x)}
probe(\"hello\")`, nothing to do with Object.keys or property keys).
Because `typeof` alone cannot be trusted, the enumeration item's string-ness
was verified through that same non-foldable function-parameter boundary using
discriminators `typeof` cannot poison: `x.length` (a number has none) and
strict equality both ways (`x === \"5\"` true, `x === 5` false) all agree with
node, for `{5:1}`, `{1e-7:1}`, `{[-1e999]:1}`, and `{42n:1}` alike. node
prints `string` for this case's probe."""
args = ["run", "keys_typeof_module.js"]
exit = "success"
stdout = "string\n"

