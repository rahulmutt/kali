[[case]]
name = "escaped_quote_in_a_key_is_stored_undecoded_module_scope"
rationale = """
PINNED BY TASK 5's REVIEW, EXTENDED BY THE FINAL WHOLE-BRANCH REVIEW. WRONG ON
PURPOSE, all four answers, and NO TASK IN THIS PLAN OWNS CLOSING IT.

node prints `a"b 3`, `true`, then `1`. kali prints `a\\"b 6`, `false`, then
`0`, at exit 0.

WHAT THIS FALSIFIES. Task 3's invariant, as this project has been stating it --
"an HIR key-slot node's text IS the property name, `String(key)`, for every
shape of key" -- is FALSE for any key whose source spelling contains an escape
sequence. `kali_parser`'s `unquote_string_literal` strips the delimiters
WITHOUT DECODING, so `{"a\\"b": 1}` stores the FOUR-character text `a\\"b`
where the property name is the three characters `a"b`. The member probe
`o['a"b']` -- spelled with the real name -- misses that four-character stored
text and falls into the absent-property lane's fabricated `0`.

THE `6` IS A SEPARATE, SECOND DIVERGENCE, NOT THE STORED TEXT'S OWN LENGTH.
Reading the key back out through `Object.keys` re-encodes the already-undecoded
four-character text with a second escaping pass
(`fold_object_enumeration_call`'s `format!("{key:?}", ...)`,
`crates/kali_optimize/src/object_fold.rs`), which is what stretches `.length`
to `6`. That the print sink still shows the familiar `a\\"b` spelling hides
this: `k === "a\\"b"` is `false` even though `console.log(k)` reads as the same
text. One program giving `Object.hasOwn`-style identity and `===` opposite
answers about what looks like the same key, in a single run at exit 0, is
R-56's own signature, and this new `false` line is what makes it visible here
instead of only in a review.

MEASURED, NOT INTRODUCED. Identical at `f563a0ecf4` (before Task 5) and after,
verified by building both commits: `a\\"b 6` then `0` in both. The `===` probe
was not part of the original case; the final whole-branch review added it and
measured `false` at HEAD only. It is `false` at `f563a0ecf4` too, but that is
read from the SOURCE, not from a second build (this fix wave was explicitly
denied a second build tree): `git show f563a0ecf4:crates/kali_parser/src/
literal.rs` has a byte-identical `unquote_string_literal`, and
`git show f563a0ecf4:crates/kali_optimize/src/object_fold.rs` has the same
second escaping pass spelled `format!("{:?}", key.trim_matches('"'))` at what
are now lines 173/180/199 -- and `trim_matches('"')` is a no-op on the stored
text `a\\"b`, which neither starts nor ends with a quote. Both inputs to the
divergence are therefore unchanged. Task 5 deleted
fourteen un-quoting sites and moved one producer; none of that touches escape
decoding, which lives in the parser. The invariant is stated with this
exception in
docs/superpowers/followups/property-key-trim-site-classification.md section 6
and in the doc comments of the sites that rely on it.

WHY IT IS NOT CHASED HERE. Decoding a string literal's escapes is a parser
change with a blast radius far wider than property keys (every string literal
in the language shares `unquote_string_literal`'s siblings). It is recorded and
pinned so it is visible, rather than fixed opportunistically inside a task
about comparison sites.

FILED 2026-09-08 as R-57 (register section 2, Tier 2), at `b13c890330` (off
`dde0f083c0`, the branch base), on the human's instruction. This case is unchanged and stays wrong on purpose; the
entry re-measured all four probes here rather than citing them, and it carries
the eleven-escape sweep, the two same-spelling probes that AGREE with node, and
the fix direction. Note what this case pins that the `r57a` oracle pair does
NOT: the member read `o['a\"b']`, whose `0` spelling belongs to a neighbouring
defect and which the oracle pair therefore leaves out.

WHAT WOULD CLOSE IT: property-key lowering decoding escape sequences, so the
key slot holds `a"b`. When that lands, this expectation becomes
`a"b 3\\ntrue\\n1\\n` and agrees with node on all four answers. Until then, a
change that alters ANY of these four answers is a surprise this case makes
visible.
"""
args = ["run", "escaped_quote_key_module.js"]
exit = "success"
stdout = "a\\\"b 6\nfalse\n0\n"

