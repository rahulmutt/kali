name = "escaped_quote_in_a_key_is_stored_undecoded_in_function"
rationale = "PINNED BY TASK 5's REVIEW, same three probes in function scope; node prints `a\"b 3` then `1`, kali prints `a\\\"b 6` then `0`. WRONG ON PURPOSE for the reason given on the module-scope case: `unquote_string_literal` strips a key's delimiters without decoding its escape sequences, so the stored key text is not the property name. Measured identical before and after Task 5; no task in this plan owns closing it."
args = ["run", "escaped_quote_key_function.js"]
exit = "success"
stdout = "a\\\"b 6\n0\n"
