[[case]]
name = "member_probe_does_not_invent_a_property_from_quote_characters_module_scope"
rationale = """
PINNED BY TASK 5. PARTLY FIXED, and the residual line is WRONG ON PURPOSE.

node prints `1`, `undefined`, `false`. kali prints `1`, `0`, `false`.

WHAT MOVED. Line 2 is the point of this case. `p` has exactly one own
property, named `"a"` with the quote characters in the name; `p['a']` probes
for the one-character name `a`, which `p` does not have. At `f563a0ecf4` kali
printed `1` -- it INVENTED the property, because `object_literal_field`
stripped `"` off both the probe and the stored key before comparing, which is a
guess at a key's type from its punctuation. The same program's
`Object.hasOwn(p,'a')` -- which Task 3 had already moved onto property-name
comparison -- answered `false` on the same line of reasoning it should have
used. One program contradicting itself is the R-56 class at a second address,
and it is closed: the member lane compares property names now, so the probe
misses.

WHY LINE 2 IS STILL NOT `undefined`. Missing the fold, the read falls into the
pre-existing absent-property lane, which emits a fabricated `0` rather than
JS's `undefined`. That is a DIFFERENT, already-inventoried defect -- the same
one recorded on `bigint_key_is_stored_under_zero_module_scope` in this file for
`o[0]` -- and it is not property-key identity. Task 5 did not chase it. WHAT
WOULD CLOSE IT: an absent-property read on a statically known object literal
producing the `undefined` value rather than an `I64Const(0)` placeholder; when
that lands, this expectation becomes `1\\nundefined\\nfalse\\n` and agrees with
node on all three lines.

Line 1 is a CONTROL inside the same program: `p['"a"']` names the property that
exists and must keep reading `1`. A fix that repairs line 2 by breaking line 1
cannot pass."""
args = ["run", "quoted_key_member_probe_module.js"]
exit = "success"
stdout = "1\n0\nfalse\n"

[[case]]
name = "member_probe_does_not_invent_a_property_from_quote_characters_in_function"
rationale = "PINNED BY TASK 5, same three probes in function scope; node prints `1`, `undefined`, `false` and kali prints `1`, `0`, `false`. WRONG ON PURPOSE on line 2 for the reason given on the module-scope case: the invented property is gone (it read `1` at `f563a0ecf4`), and what remains is the pre-existing absent-property-read defect that fabricates `0` instead of `undefined`."
args = ["run", "quoted_key_member_probe_function.js"]
exit = "success"
stdout = "1\n0\nfalse\n"

[[case]]
name = "escaped_quote_in_a_key_is_stored_undecoded_module_scope"
rationale = """
PINNED BY TASK 5's REVIEW. WRONG ON PURPOSE, all three answers, and NO TASK IN
THIS PLAN OWNS CLOSING IT.

node prints `a"b 3` then `1`. kali prints `a\\"b 6` then `0`, at exit 0.

WHAT THIS FALSIFIES. Task 3's invariant, as this project has been stating it --
"an HIR key-slot node's text IS the property name, `String(key)`, for every
shape of key" -- is FALSE for any key whose source spelling contains an escape
sequence. `kali_parser`'s `unquote_string_literal` strips the delimiters
WITHOUT DECODING, so `{"a\\"b": 1}` stores the six-character text `a\\"b` where
the property name is the three characters `a"b`. All three answers follow from
that one fact: the enumerated key prints with a stray backslash, its `.length`
is 6 rather than 3, and the member probe `o['a"b']` -- which is spelled with
the real name -- misses the stored text entirely and falls into the
absent-property lane's fabricated `0`.

MEASURED, NOT INTRODUCED. Identical at `f563a0ecf4` (before Task 5) and after,
verified by building both commits: `a\\"b 6` then `0` in both. Task 5 deleted
fourteen un-quoting sites and moved one producer; none of that touches escape
decoding, which lives in the parser. The invariant is stated with this
exception in
docs/superpowers/followups/property-key-trim-site-classification.md section 6
and in the doc comments of the sites that rely on it.

WHY IT IS NOT CHASED HERE. Decoding a string literal's escapes is a parser
change with a blast radius far wider than property keys (every string literal
in the language shares `unquote_string_literal`'s siblings). It is recorded and
pinned so it is visible, rather than fixed opportunistically inside a task
about comparison sites.

WHAT WOULD CLOSE IT: property-key lowering decoding escape sequences, so the
key slot holds `a"b`. When that lands, this expectation becomes
`a"b 3\\n1\\n` and agrees with node on all three answers. Until then, a change
that alters ANY of these three answers is a surprise this case makes visible.
"""
args = ["run", "escaped_quote_key_module.js"]
exit = "success"
stdout = "a\\\"b 6\n0\n"

