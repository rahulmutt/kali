[[case]]
name = "octal_leading_zero_numeric_key_is_read_as_decimal_module_scope"
rationale = """
ADDED BY THE FINAL WHOLE-BRANCH REVIEW. WRONG ON PURPOSE, and NO TASK IN THIS
PLAN OWNS CLOSING IT -- pre-existing, out of this project's original scope,
and not chased here. Do NOT change the parser to close this case.

`{042: 1}` is a legacy OCTAL numeric-literal property key in sloppy mode
(kali's `.js` entry files run non-strict, same as a node CommonJS script):
`042` denotes the same value as `0o42`, decimal `34`. node's
`Object.keys({042: 1})[0]` is `"34"`. kali's is `"42"` -- it reads the digits
`042` as decimal, at exit 0, with no diagnostic.

WHY THIS IS THE OCTAL SIBLING OF A GUARD THIS BRANCH WROTE. `numeric_property_
name` (`crates/kali_parser/src/expression/object.rs`) guards a leading zero on
the BigInt branch (`042n` is refused, matching JavaScript's real
SyntaxError -- a LOUD divergence) but walks straight past a leading zero on the
`f64` branch, which is what `042` (no `n` suffix) parses through
(`text.parse::<f64>().ok()`, no leading-zero check). The two branches are the
two halves of one nine-line function: the BigInt guard is the
`!(digits.len() > 1 && digits.starts_with('0'))` conjunct, and the unguarded
`f64` fallthrough is the function's last statement three lines below it.
`042n` failing loudly and `042` silently returning a WRONG key at exit 0 is
strictly worse than the BigInt case this branch already guarded, and it sits
inside the same function this branch rewrote, for the same underlying reason
(legacy octal is not decimal parsing).

WHY IT IS NOT CLOSED HERE. Pre-existing (unrelated to property-key identity),
out of the original seven-task plan's scope, and closing it correctly means
teaching this phase to recognize a leading-zero decimal-digit run as legacy
octal and convert its VALUE (not just refuse it), which is a parser change
with its own verification surface. Pinned so it is visible instead.

FILED 2026-09-08 as R-58 (register section 2, Tier 2), at `b13c890330` (off
`dde0f083c0`, the branch base), on the human's instruction. This case is unchanged and stays wrong on purpose. The
entry re-measured this line and adds what this rationale did not know: the same
misreading fires OUTSIDE key position (`console.log(042)` prints `42`, node
`34`), so it is a numeric-literal defect that a property key is one consumer of;
the hasOwn 2x2 is wrong in both directions (`Object.hasOwn(o, 34)` `false`
against node's `true`, `Object.hasOwn(o, 42)` `true` against node's `false`);
and under `\"use strict\"` node refuses the file outright while kali accepts it
and still prints `42`, which is a second lane in a different verdict class."""
args = ["run", "octal_leading_zero_numeric_key_module.js"]
exit = "success"
stdout = "42\n"

