[[case]]
name = "a_present_property_on_a_from_entries_object_also_reads_the_fabricated_zero_module_scope"
rationale = """
ADDED BY THE FINAL WHOLE-BRANCH REVIEW. WRONG ON PURPOSE, and NO TASK IN THIS
PLAN OWNS CLOSING IT.

node prints `1`. kali prints `0`, at exit 0, with no diagnostic.

WHAT IT CORRECTS. Several rationales in this file and in
docs/superpowers/followups/ describe the fabricated-`0` residual as the
"absent-property read" defect -- a read of a property that does not exist
returning `0` where JavaScript returns `undefined`. That name is too narrow.
`Object.fromEntries([["a", 1]])` HAS an own property named `a`, with the value
`1`; reading it still yields `0`. The `0` is what a static member read emits
whenever the fold cannot resolve the object's shape, whether or not the
property is there -- which means it is not a `undefined`-vs-`0` rendering
divergence at all on this shape, but a wrong VALUE for a property that exists.
Nothing in this file exercised that half before, so every statement of the
divergence was scoped to the half that was pinned.

WHY THIS SHAPE REACHES IT. `fold_object_from_entries_call`'s binding path runs
only at `OptimizationLevel::Release`/`ReleaseAdvanced` (section 7 of
docs/superpowers/followups/property-key-trim-site-classification.md), and
`kali run` -- what this corpus executes -- is `BuildMode::Fast`. So the object
is never materialized into a statically-known shape, the member read finds no
shape to read from, and the same fabricated `0` the absent-property lane emits
comes back for a property that is present.

WHY IT IS NOT CLOSED HERE. It is the same unowned placeholder-read defect
already recorded on `bigint_key_is_stored_under_zero_module_scope` and
`member_probe_does_not_invent_a_property_from_quote_characters_module_scope`;
this pair only widens what those rationales are allowed to claim about it.
WHAT WOULD CLOSE IT: a static member read that cannot resolve its object's
shape declining to fold, instead of emitting a placeholder. When that lands,
this expectation becomes `1\\n` and agrees with node.

FILED 2026-09-08 as R-60 (register section 2, Tier 2), at `02297ca6c2` (off
`dde0f083c0`, the branch base), on the human's instruction. This case is unchanged and stays wrong on purpose. The
entry re-measured this line and adds what this rationale did not know: THE SHAPE
IS NOT UNRESOLVABLE TO EVERY CONSUMER. On the same object, at the same build
mode, `Object.hasOwn(o, "a")` folds to `true` and `Object.hasOwn(o, "b")` to
`false` -- both agreeing with node -- because `static_object_has_own` recognizes
a `fromEntries` call directly, while `Object.keys(o)` / `Object.values(o)` /
`Object.entries(o)` REFUSE the program (`error[E5506]: Object enumeration is
only supported where the object has a compile-time-known fixed shape`, exit 1),
which is a different verdict class. So this rationale's \"the member read has no
statically known shape to resolve against\" describes this read and not the
object: the shape is known to a sibling consumer in the same run."""
args = ["run", "from_entries_present_property_module.js"]
exit = "success"
stdout = "0\n"

[[case]]
