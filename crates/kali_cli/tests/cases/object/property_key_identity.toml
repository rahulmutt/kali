[[case]]
name = "object_keys_over_a_quoted_string_key_module_scope"
rationale = """
PINNED BY TASK 5. AGREES ON TEXT AND ORDER as of the commit that adds it --
NOT "correct" outright; the final whole-branch review found a `.length`
divergence this case did not probe for, added below. `{foo:'b','"2"':'a'}`
has two ordinary string keys; the second one's NAME is the three-character
text `"2"`, quotes included. node prints `foo` then `"2"`: neither key is
array-index-like, so both enumerate in insertion order, and the second prints
with its quote characters because they are part of the name.

WHAT IT MEASURED AT `f563a0ecf4`, BEFORE TASK 5. kali printed `2` then `foo` --
wrong TEXT and wrong ORDER, at exit 0. Two surviving un-quoting sites caused
it: `kali_common::property_order_key` stripped the quotes before classifying,
read the key as the array index 2 and sorted it ahead of `foo`; and the
enumeration fold stripped them again before re-encoding the key as a string
literal, so it printed `2`. Both are R-56's collision -- the string key `'"5"'`
conflated with the numeric key `5` -- at a second address, exactly as the
design's section 4.6 predicted. Both are gone; nothing normalizes a key-slot
text now, because a key-slot text IS the property name.

WHAT THE PRINT SINK HID. `console.log(k)` cannot distinguish a correct key
from one whose `.length` is wrong -- exactly the trap this project's own
design (section 4.5) warned about, and the trap the sibling `keys_typeof_*`
cases went to real trouble not to fall into for `typeof`. This case did not
extend the same suspicion to `.length` when Task 5 added it. Probed now: `"2"`
(the quoted key) reports `.length` `5`, not `3` -- the same
`fold_object_enumeration_call` double-escaping pass documented in
docs/superpowers/followups/property-key-trim-site-classification.md section 6
for the sibling escaped-quote case, here triggered by the quote CHARACTERS in
the key's own name rather than by a source escape sequence. `k === '"2"'`
still agrees with node (`true`), so the name and order claims stand; `.length`
does not, and is pinned WRONG ON PURPOSE below. No task in this plan owns
closing it.

This case is also the ORDERING half's tripwire: it mixes a would-be-index-like
key with a string key, which the `object_keys_enumeration_order_*` pair does
not do (those use real numeric keys). If a later change re-introduces
quote-blind index classification, this case goes red on the ORDER before
anything else notices."""
args = ["run", "keys_quoted_string_key_order_module.js"]
exit = "success"
