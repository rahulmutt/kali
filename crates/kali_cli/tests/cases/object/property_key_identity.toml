[[case]]
name = "computed_member_index_is_fabricated_from_the_index_expression_module_scope"
rationale = """
CLOSED 2026-09-09 at `3ef65ef785` by the computed-member-static-name project (docs/superpowers/specs/2026-09-08-computed-member-static-name-design.md): both lines now refuse with the shared E5506 -- `kali check` and `kali run` alike, exit 1, empty stdout, one message per line -- instead of reading `7` and `9`. node still prints `undefined` twice at exit 0, so this is FAIL_CLOSED rather than FIXED. `expression_to_property_name` returns `Option<String>` and declines every index shape it cannot read statically, so `o[i]` no longer becomes a probe for the property named `i` and `o[i + 0]` no longer falls to the catch-all `index`. The paragraphs below are kept as the record of what this program did while it was wrong on purpose; they are no longer a description of the binary.

ADDED BY THE FINAL WHOLE-BRANCH REVIEW. WRONG ON PURPOSE, both lines, and NO
TASK IN THIS PLAN OWNS CLOSING IT. Do NOT change the parser to close it.

node prints `undefined` then `undefined`. kali prints `7` then `9`, at exit 0.

WHAT IT PINS. `kali_parser`'s `expression_to_property_name`
(`crates/kali_parser/src/literal.rs`) turns a computed member index into the
JavaScript property name it denotes -- but only for the shapes it can read
statically (a literal, or a folded `+`/`-` unary on one). For every OTHER
shape it does not decline; it FABRICATES a name:

* `o[i]` hits `Expression::Identifier(s) => s.clone()`, so the probe is the
  identifier's own text `i`. `o` happens to have a property named `i`, so
  kali reads `7` -- the wrong property, for a program where node reads
  `o[1]` and gets `undefined`.
* `o[i + 0]` is a binary expression, which no arm matches, so it falls to the
  catch-all `_ => "index".to_string()`. `o` happens to have a property named
  `index`, so kali reads `9`.

Both properties exist ONLY so this case can tell the two fabrication arms
apart by their output. An index expression this phase cannot read is supposed
to be declined, not renamed.

WHY IT MATTERS TO THIS BRANCH SPECIFICALLY. This is the same fabricated-key
class Task 2 deleted from the parser's numeric-key arm (the `unwrap_or(0.0)`
that stored `{42n: 1}` under the key `0`) and Task 5 deleted from the
un-quoting sites -- surviving one file over, in the function whose doc comment
this branch rewrote to claim that a probe and the key it probes are "one
currency by construction". That claim is true only for the shapes this
function actually reads; these two lines are what it is not true for.

WHY IT IS NOT CLOSED HERE. Closing it means returning `Option<String>` and
teaching every caller to decline, which is a behaviour change with its own
verification surface -- out of this documentation-only fix wave's scope. The
doc comment on `expression_to_property_name` now names the recommendation and
cites this case; the case is what keeps the recommendation honest.

FILED 2026-09-08 as R-59 (register section 2, Tier 2), at `02297ca6c2` (off
`dde0f083c0`, the branch base), on the human's instruction. This case is unchanged and stays wrong on purpose. The
entry re-measured both lines and adds what this rationale did not know: the
optional-chained spelling `o?.[i]` fabricates identically (`7`); the four index
shapes this phase DOES read statically all agree with node (`o[(1)]`,
`o[(0, 1)]`, `o[+1]`, and `o[-1]`, which reads the correct name `-1`); the same
fabricated name is consumed by the ARRAY lane through
`static_member_index`, where it can never hit, so an array literal read at a
variable index prints `0` against node's element while a `new Array(n)` receiver
reaches a runtime-index lane and agrees; and the WRITE half does not fabricate
(`o[i] = 8` leaves `o.i` at `7`, agreeing with node), so R-59 is a read-lane
entry."""
args = ["run", "computed_member_index_module.js"]
exit = "failure"
stderr_contains = ["E5506", "computed member access `o[k]` is unavailable"]

[[case]]
name = "computed_member_index_is_fabricated_from_the_index_expression_in_function"
rationale = "CLOSED 2026-09-09 at `3ef65ef785` by the computed-member-static-name project (docs/superpowers/specs/2026-09-08-computed-member-static-name-design.md): both lines now refuse with the shared E5506 -- `kali check` and `kali run` alike, exit 1, empty stdout, one message per line -- instead of reading `7` and `9`. node still prints `undefined` twice at exit 0, so this is FAIL_CLOSED rather than FIXED. `expression_to_property_name` returns `Option<String>` and declines every index shape it cannot read statically, so `o[i]` no longer becomes a probe for the property named `i` and `o[i + 0]` no longer falls to the catch-all `index`. The paragraphs below are kept as the record of what this program did while it was wrong on purpose; they are no longer a description of the binary. ADDED BY THE FINAL WHOLE-BRANCH REVIEW, same two probes in function scope; node prints `undefined` twice and kali prints `7` then `9`, at exit 0. WRONG ON PURPOSE for the reason given on the module-scope case: `expression_to_property_name` fabricates a property name for every index shape it cannot read statically -- the identifier's own text for `o[i]`, the literal string `index` for the catch-all arm `o[i + 0]` reaches. Pre-existing, out of scope, not chased here; do not change the parser. FILED 2026-09-08 as R-59 (register section 2, Tier 2), at `02297ca6c2` (off `dde0f083c0`, the branch base), on the human's instruction, with an `r59a` oracle pair in both scopes; this case is unchanged and stays wrong on purpose. The entry re-measured this scope too and records it byte-identical to the module scope, which is what the mechanism predicts: the name is fabricated by `kali_parser` while the member expression is parsed, before any scope exists."
