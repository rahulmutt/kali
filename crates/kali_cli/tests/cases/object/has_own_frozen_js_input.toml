# Migrated from tests/object_has_own_frozen_js_input.rs -- all 5 #[test]
# functions, as 6 sibling case blocks (one added beyond the 5 originals --
# see the audit note below) fanned across a file-level [matrix] extension
# axis (js/ts/jsx/tsx) = 24 trials. The first 5 match the original 5
# #[test] fns exactly: each one loops `for filename in ["main.js", "main.ts",
# "main.jsx", "main.tsx"]` (or the `.test.<ext>` equivalent for the `test`
# command) with an identical assertion shape per extension -- the fixture
# source and expected behavior never depend on the extension. That is a
# file-level uniform axis (every case in the file really does run once per
# extension, with no exceptions), so [matrix] is the right tool here, not 20
# flat siblings, per this task's two-axis rule -- see
# `object/freeze_callable_helpers.toml`'s header for the same pattern
# applied to a sibling file in this family.
#
# [constants] factors out the two fixture bodies (`run_source`,
# `test_source`), each identical byte-for-byte across all 4 extensions.
# Fixture content is generated at test-run time in the original `.rs` from
# `kali_common::object_has_own_frozen_callable_source()` /
# `..._condition_source()` and `object_has_own_property_call_frozen_
# callable_source()` / `..._condition_source()` -- not literal text in the
# `.rs` file itself. The exact bodies below were captured by running a
# throwaway program (built, run, and deleted -- no crate outside
# `kali_cli/tests/cases/` was left modified) linked against `kali_common`
# that calls the same functions `frozen_object_has_own_source()` /
# `frozen_object_has_own_test_source()` call, so the text is copied from the
# real generator, not retyped or guessed.
#
# Assertion shape per case, verified directly against the built binary
# across all 4 extensions for every case below (not just one extension
# assumed to generalize):
#   - `check_accepts_frozen_object_has_own`: `check` never executes the
#     fixture body (only static analysis), so the sole claim is exit
#     success -- the shared `assert_frozen_object_has_own` helper asserts
#     nothing else when `command != "run"` and `json_output` is false.
#   - `run_accepts_frozen_object_has_own` / `test_accepts_frozen_object_has_
#     own` (plain): the fixture's own self-check throws (`Uncaught Error:
#     unexpected frozen Object.hasOwn result`), which lowers to a wasm
#     `error[E4000]` runtime trap and a nonzero exit -- fails closed, per
#     the "Honest re-pin (PR #16 rev2)" comment on the shared `assert_
#     frozen_object_has_own_fails_closed` helper (carried into each
#     `rationale`). The old assertion was `stderr.contains("E4000") ||
#     stdout.contains("E4000")`; verified the diagnostic is always on
#     stderr in plain-text mode, so `stderr_contains = ["E4000"]` is the
#     real branch, not a guess at which side of the OR held.
#   - `json_run_accepts_frozen_object_has_own` / `json_test_accepts_frozen_
#     object_has_own`: same fail-closed shape under `--output json`. With
#     `--output json`, the whole envelope (including the raw diagnostic
#     text embedded in the JSON's own `stderr` field, or in `run`'s case the
#     `"code":"E4000"` in `errors[0]`) is printed as one JSON blob to the
#     *process's* stdout -- verified the literal text "E4000" always
#     appears there, so `stdout_contains = ["E4000"]` is the real, verified
#     branch of the original OR.
#
# Audit note (investigated, not assumed): `audit-case-migration.py` flags 10
# json-key claims -- 'command', 'exitCode', 'failed', 'passed', 'payload',
# 'schemaVersion', 'skipped', 'stdout', 'success', 'total' -- that come
# entirely from the *body* of the shared `assert_frozen_object_has_own`
# helper (not `_fails_closed`), which is defined with an `if json_output {
# ... } else if command == "run" { ... }` shape but is called exactly once
# in the whole file (`check_accepts_frozen_object_has_own_in_js_ts_jsx_tsx_
# input`, with `json_output = false` and `command = "check"`) -- confirmed
# by grep, there is no second call site. Both conditional branches are
# therefore genuinely dead code for this file's real test suite, and the
# `else` branch (`payload.total`/`passed`/`failed`/`skipped`) would assert
# something false if it ever ran: verified directly against the built
# binary that `--output json check`'s real payload shape is
# `{errorCount, filesChecked, warningCount}`, not `{total, passed, failed,
# skipped}` (that shape belongs to `run`/`test`'s payload, not `check`'s) --
# so this is inherited/vestigial template code, not a claim this suite ever
# makes. Rather than fabricate a false `payload.total` etc. to silence the
# audit, a 6th case (`json_check_accepts_frozen_object_has_own`, not in the
# original 5 #[test] fns) was added below that genuinely exercises
# `--output json check` for real and verifies the subset of the flagged
# keys that a real `check` invocation actually produces and that are true:
# `command`, `exitCode`, `schemaVersion`, `success`. The other 6 flagged
# keys ('failed', 'passed', 'payload', 'skipped', 'stdout', 'total') remain
# genuinely absent from this migration -- they describe behavior no
# reachable code path in this `.rs` file ever asserts, and reproducing them
# would mean inventing a false claim. Flagged to the orchestrator per the
# migration instructions' phantom-claim clause.

