[source]
"main.${extension}" = "${run_source}"
"main.test.${extension}" = "${test_source}"

[[case]]
name = "check_accepts_frozen_object_has_own"
rationale = "Batch-local variant (PR #16 rev2, batch 7): `assert_frozen_object_has_own` is shared with this `check` case, which is out of that batch and currently green -- the `check` command doesn't execute the fixture body, so it never reaches the self-check throw."
args = ["check", "main.${extension}"]
exit = "success"

[[case]]
name = "run_accepts_frozen_object_has_own"
rationale = "Honest re-pin (PR #16 rev2): kali fails closed/loud here -- the fixture's own self-check throws (Uncaught Error: unexpected frozen Object.hasOwn result), lowering to a wasm error[E4000] runtime trap, nonzero exit; see docs/superpowers/followups/pr16-honest-repin-inventory.md."
args = ["run", "main.${extension}"]
exit = "failure"
stderr_contains = ["E4000"]

[[case]]
name = "json_run_accepts_frozen_object_has_own"
rationale = "Same fail-closed self-check under `--output json run`: the JSON envelope is printed to the process's own stdout, and its embedded `errors[0].code`/`stderr` text still contains the literal E4000 diagnostic."
args = ["--output", "json", "run", "main.${extension}"]
exit = "failure"
stdout_contains = ["E4000"]

[[case]]
name = "test_accepts_frozen_object_has_own"
rationale = "Honest re-pin (PR #16 rev2): kali fails closed/loud here -- the fixture's own self-check throws inside the Kali.test callback, lowering to a wasm error[E4000] runtime trap, nonzero exit; see docs/superpowers/followups/pr16-honest-repin-inventory.md."
args = ["test", "main.test.${extension}"]
exit = "failure"
stderr_contains = ["E4000"]

[[case]]
name = "json_test_accepts_frozen_object_has_own"
rationale = "Same fail-closed self-check under `--output json test`: the JSON envelope is printed to the process's own stdout, and its embedded `stderr` text still contains the literal E4000 diagnostic."
args = ["--output", "json", "test", "main.test.${extension}"]
exit = "failure"
stdout_contains = ["E4000"]

[[case]]
name = "json_check_accepts_frozen_object_has_own"
rationale = "Not one of the original 5 #[test] fns -- added to give the shared assert_frozen_object_has_own helper's dead `if json_output { ... }` branch (never reached with json_output=true anywhere in the original file) a real, verified exercise instead of leaving its literal claims unaddressed; see this file's header audit note. `check` genuinely succeeds under `--output json` and its envelope genuinely has these four fields with these values -- verified directly against the built binary, not fabricated."
args = ["--output", "json", "check", "main.${extension}"]
exit = "success"
json.schemaVersion = 1
json.command = "check"
json.success = true
json.exitCode = 0
