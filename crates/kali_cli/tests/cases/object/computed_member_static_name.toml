# ---- admitted: the fold is the dot spelling ---------------------------------

[[case]]
name = "a_const_string_key_reads_the_property_module_scope"
rationale = """R-13's read lane, spec section 2.2. node prints 2 then 3. Before this project kali printed 0 then 1 at exit 0: the parser fabricated the name `k`, the fold-lane object had no such field, and the miss was the placeholder 0. Now `k` folds to "b" through the const rule and the read is `o.b`. Measured at `3ef65ef785` against node v26.8.1: kali prints 2 then 3 at exit 0 with empty stderr, `check` clean."""
args = ["run", "const_key_read_module.js"]
exit = "success"
stdout = "2\n3\n"

[[case]]
name = "a_const_string_key_reads_the_property_in_function"
rationale = "The module-scope program inside `function main() { ... }`; the fold is scope-independent (a const declarator in the same scope). Measured at `3ef65ef785`: kali prints 2 then 3, byte-identical to node and to the module scope."
args = ["run", "const_key_read_function.js"]
exit = "success"
stdout = "2\n3\n"

[[case]]
name = "a_const_number_key_folds_through_the_shared_number_formatter"
rationale = "`const k = 1; o[k]` on `{1: \"one\"}`: the fold renders 1 with format_js_number, the same formatter HIR stored the key with, so probe and key are one spelling. node prints one. Measured at `3ef65ef785`: kali prints one."
args = ["run", "const_number_key_read.js"]
exit = "success"
stdout = "one\n"

[[case]]
name = "a_const_string_key_store_lands_module_scope"
rationale = """R-13's write lane, spec section 2.3. node prints 8. Before this project kali printed 2: the bracket store fell out of every store arm and the caller emitted a bare read. Now the folded target takes the dot-store arm, and the checker recorded the write access that materializes `o`. Measured at `3ef65ef785`: kali prints 8, `check` clean."""
args = ["run", "const_key_store_module.js"]
exit = "success"
stdout = "8\n"

[[case]]
name = "a_const_string_key_store_lands_in_function"
rationale = "The write lane inside `function main() { ... }`. Measured at `3ef65ef785`: kali prints 8, byte-identical to node and to the module scope."
args = ["run", "const_key_store_function.js"]
exit = "success"
stdout = "8\n"

[[case]]
name = "a_literal_string_key_bracket_store_lands"
rationale = "console-render follow-up item 2.3, string key: `p[\"a\"] = 7` then `p[\"a\"]`. node prints 7; kali printed 1 before this project. The named bracket store takes the dot-store arm. Measured at `3ef65ef785`: kali prints 7."
args = ["run", "literal_key_store_string.js"]
exit = "success"
stdout = "7\n"

[[case]]
name = "a_literal_number_key_bracket_store_is_refused_by_the_preexisting_numeric_key_gate"
rationale = """console-render follow-up item 2.3, numeric key: `o[5] = 7` then `o[5]` on `{5: 1}`.

THE PLAN'S TASK 7 BRIEF PREDICTED `stdout = "7"` HERE AND THE BINARY DOES NOT PRODUCE IT. Measured at `3ef65ef785` against node v26.8.1: node prints 7; kali refuses, exit 1, with

  error[E5506]: object literal for Binding("_start", "o") uses a numeric property name, which is unavailable in the current phase

under `run` AND under `check`. The expectation is pinned to the MEASUREMENT, not to the prediction, and this paragraph is the record of the disagreement; the controller owns deciding whether the prediction or the binary is wrong.

WHY THIS IS NOT A DEFECT IN THIS PROJECT'S FOLD. The message comes from `record_object_literal` in crates/kali_types/src/repr_infer.rs, an "honest fail-closed residue" that predates this branch (present at the baseline `dc19c3a040`): an UNQUOTED numeric object-literal key keeps the slot off the shape lane and records a DEFERRED conflict, which is promoted to a real gate conflict only when something forces the slot onto the object lane. A read-only literal keeps working, which the two controls below pin; ANY store promotes it, which the dot-store control below pins with no bracket in the program at all. What this project changed is reachability, not correctness: at `dc19c3a040` the bracket store was silently dropped, nothing forced the slot, and the program printed the pre-store `1` against node's `7`. It now refuses honestly. A silent wrong 1 became an E5506 at exit 1, which is the direction spec section 2.3 asks for; the numeric-key materialization lane itself is a separate design and no task in this plan owns it."""
args = ["run", "literal_key_store_number.js"]
exit = "failure"
stderr_contains = ["E5506", "${NUMERIC_KEY}"]

[[case]]
name = "check_refuses_a_literal_number_key_bracket_store_too"
rationale = "The twin of the case above: the numeric-key gate lives in the checker, so `check` refuses the same program with the same message. Measured at `3ef65ef785`."
args = ["check", "literal_key_store_number.js"]
exit = "failure"
stderr_contains = ["E5506", "${NUMERIC_KEY}"]

[[case]]
name = "a_dot_store_on_a_numeric_key_object_refuses_identically_with_no_bracket_in_the_program"
rationale = """The control that proves the refusal above belongs to the pre-existing numeric-key gate and not to this project's bracket store: `const o = {5: 1}; o.x = 2;` contains no computed member access of any kind, and refuses with the SAME message. Measured at `3ef65ef785`: node prints 1; kali refuses, exit 1, under both `run` and `check`. Without this control a reader could conclude the bracket store caused the refusal."""
args = ["run", "numeric_key_dot_store_control.js"]
exit = "failure"
stderr_contains = ["E5506", "${NUMERIC_KEY}"]

[[case]]
name = "a_numeric_key_object_read_only_is_still_admitted"
rationale = "The second half of the same control: with no store anywhere, the deferred conflict is never promoted and the read-only fold lane keeps today's behaviour. node prints 1; kali prints 1. Measured at `3ef65ef785`. This is what makes the two cases above a REACHABILITY change rather than a new refusal."
args = ["run", "numeric_key_read_control.js"]
exit = "success"
stdout = "1\n"

[[case]]
name = "an_absent_property_after_a_successful_fold_is_r21s_lane_not_this_projects"
rationale = """WRONG ON PURPOSE, and NO TASK IN THIS PLAN OWNS CLOSING IT. node prints undefined three times; kali prints 0 three times, at exit 0.

WHAT IT PINS, AND WHY IT IS A CASE AT ALL. Spec section 5 carves this lane out: a `const` key that folds to a name the object does NOT have reads the same placeholder `0` the dot spelling `o.c` reads today. All three spellings are pinned together precisely so they must move together: the fold's whole claim is that a folded bracket access IS the dot access, and if a later change made `o[k]` and `o.c` disagree here, that claim would have quietly broken. The `0` itself is R-21 (there is no value distinct from the scalar 0), which this project does not touch.

Measured at `dc19c3a040` and re-measured at `3ef65ef785`: all three lines print 0 before and after this project, at exit 0, with `check` clean."""
args = ["run", "absent_property_after_fold.js"]
exit = "success"
stdout = "0\n0\n0\n"

