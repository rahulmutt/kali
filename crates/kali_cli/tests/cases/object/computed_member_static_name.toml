[[case]]
name = "run_refuses_a_chained_access_off_a_folded_member"
rationale = """Spec section 4.5: `o[k].length` with a const key -- the outer access sees the inner node by id, and by id it is the nameless kind, so it refuses. node prints 3.

THIS IS NOT A WORKING LANE BEING REGRESSED. Measured at `dc19c3a040`: this program printed `2`, and so did the same program with `"xyzwv"` -- the value is `render_length`'s text-less arm returning the member node's CHILD COUNT, not the string's length. Refusing replaces a silent wrong answer with an honest one. The dot spelling `o.a.length` prints `1` by the same arm and is NOT fixed here; it is recorded as a separate divergence in the follow-up this project files.

NO `check` TWIN IS ASSERTED, AND THAT IS A RECORDED DISAGREEMENT, NOT AN OVERSIGHT. Measured at `3ef65ef785`: `kali run` refuses at exit 1 with the shared message, while `kali check` on the SAME program exits 0 with `Checked 1 file(s)`. Binding constraint 8 (spec section 8) says codegen may fold a strict superset but the checker admitting what codegen refuses is a defect, so this is one. Task 7 owns case files only and does not change compiler source, so the twin is left unasserted here and the disagreement is reported to the controller instead of being papered over with a `run`-shaped claim about `check`."""
args = ["run", "chained_access_off_folded_member.js"]
exit = "failure"
stderr_contains = ["E5506"]

[[case]]
name = "check_still_admits_the_chained_access_off_a_folded_member"
rationale = """The other half of the disagreement above, pinned so it is visible rather than inferred: `kali check` on `const o = {a: \"xyz\"}; const k = \"a\"; console.log(o[k].length);` exits 0 at `3ef65ef785` while `kali run` refuses. This case is WRONG ON PURPOSE in the sense that the project's own twin rule (spec section 8) says it should refuse; it is pinned at the measurement so that the day the checker's admit list is closed, this case goes red and has to be flipped deliberately. No task in this plan owns closing it."""
args = ["check", "chained_access_off_folded_member.js"]
exit = "success"

[[case]]
name = "run_refuses_a_computed_callee"
rationale = """`Object[k](o)` with `const k = "keys"`: the optimizer's name-string fold declines a nameless member, so the call has no resolvable callee and refuses.

ALSO NOT A WORKING LANE. Measured at `dc19c3a040`, this printed `2` for a FOUR-key object -- the child count again, through the same renderer. node prints 4. Measured at `3ef65ef785`: `kali run` refuses at exit 1 with the shared computed-member message.

Like the chained-access case above, `kali check` still admits this program at `3ef65ef785` (exit 0), which is the same spec-section-8 twin disagreement and is pinned by its own case below."""
args = ["run", "computed_callee_fold.js"]
exit = "failure"
stderr_contains = ["E5506"]

[[case]]
name = "check_still_admits_the_computed_callee"
rationale = "The other half of the computed-callee disagreement, pinned at the measurement for the same reason as the chained-access pair: `kali check` exits 0 at `3ef65ef785` where `kali run` refuses. Twin disagreement under spec section 8; no task in this plan owns closing it, and this task changes no compiler source."
args = ["check", "computed_callee_fold.js"]
exit = "success"

# ---- wrong on purpose: divergences this project does not own ----------------

[[case]]
name = "the_argv_index_lane_disagrees_with_itself_between_a_number_and_a_string_spelling"
rationale = """CONTROLLER RULING R15. WRONG ON PURPOSE, and NO TASK IN THIS PLAN OWNS CLOSING IT; Task 8 files it as a follow-up.

Measured at `3ef65ef785` under `--api node` with `-- 5`, against node v26.8.1 run as `node argv.js 5`: node prints 5, 5, 5. kali prints 5, 0, 0 -- `process.argv[2]` is correct, `const i = 2; process.argv[i]` is 0, and `process.argv["2"]` is 0.

WHY IT IS PINNED HERE RATHER THAN READ AS A FOLD DEFECT. The folded spelling agrees EXACTLY with the equivalent string-literal spelling, which is this project's whole contract: a folded bracket access is the literal bracket access. The root defect is that kali's argv intrinsic keys on the index child's LITERAL FORM, so `argv[2]` and `argv["2"]` disagree where JavaScript treats them as the same property key. It is pre-existing and unchanged from `dc19c3a040`, and it is a defect in the argv intrinsic rather than in the fold. `check` is clean on this program in both readings."""
args = ["run", "--api", "node", "argv_index_divergence.js", "--", "5"]
exit = "success"
stdout = "5\n0\n0\n"

[[case]]
name = "a_bracket_store_reaches_the_same_bigint_rendering_hole_the_dot_spelling_has"
rationale = """WRONG ON PURPOSE, and NO TASK IN THIS PLAN OWNS CLOSING IT.

`let o = {a: 1, b: 7n}; o["a"] = 5; console.log(o.b);` -- measured at `3ef65ef785`: node prints `7n`, kali prints `7`, both at exit 0, `check` clean.

THE DIVERGENCE IS BIGINT RENDERING, NOT A WRONG VALUE. The field's value is right; the `n` suffix is missing. What this case adds is the observation that the newly-real bracket store reaches the same materialization hole the DOT spelling has always had, so the store lane this project opened inherits the existing defect rather than introducing a new one. Pinned so that a later BigInt rendering fix moves this case deliberately."""
args = ["run", "bigint_field_after_bracket_store.js"]
exit = "success"
stdout = "7\n"
