[[case]]
name = "check_refuses_a_shadowed_fold_name_read"
rationale = """CONTROLLER RULING R16, a refusal shape the plan's refused matrix did not carry. A name declared more than once in the same function does not fold, in either checker pass: `repr_infer`'s `const_index_names` is keyed (func, binding) and codegen's `bindings` map is flat per FunctionEmitter, so a block-scoped shadow collapses onto one key and the LAST insert wins.

Measured before `3ef65ef785`: `const k = "b"; const o = {a:1,b:2}; if (true) { const k = "a"; } console.log(o[k]);` printed `1` -- field `a`, the shadow's value -- at exit 0 with `check` clean, against node's `2`. A name that hits a real, WRONG property is R-59's own defining symptom, on the lane this project opened. Measured at `3ef65ef785` against node v26.8.1: node prints 2, kali refuses with the shared message at exit 1 under BOTH twins. The order-sensitivity is deliberate and has its own control case above."""
args = ["check", "shadowed_key_read.js"]
exit = "failure"
stderr_contains = ["E5506", "${COMPUTED}"]

[[case]]
name = "run_refuses_a_shadowed_fold_name_read"
rationale = "Twin of the check case. Both passes must decline together: a gate that admitted here while `repr_infer` declined would leave the store with no materialization evidence and make `check` clean where `run` refuses. Measured at `3ef65ef785`."
args = ["run", "shadowed_key_read.js"]
exit = "failure"
stderr_contains = ["E5506", "${COMPUTED}"]

