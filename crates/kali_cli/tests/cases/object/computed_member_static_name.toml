rationale = """Controller ruling R16's control, and it is deliberate rather than incidental. A name declared twice in one function does not fold (the two cases in the refused matrix below), but the poison is filled by a single source-order walk, so a shadow declared AFTER the use has not been seen yet and the use still folds. That matches codegen's flat source-order `bindings` map, which is the thing the refusal exists to stay in step with. node prints 8; measured at `3ef65ef785`: kali prints 8, `check` clean. If the poison were ever made order-insensitive this case must move together with the two refusals."""
args = ["run", "shadow_after_the_use_control.js"]
exit = "success"
stdout = "8\n"

[[case]]
name = "the_let_object_bracket_read_agrees_with_its_dot_spelling"
rationale = """CONTROLLER RULING R14, RE-MEASURED AND PINNED CORRECT RATHER THAN WRONG ON PURPOSE. The Task 7 handoff ruled that this pair be pinned WRONG ON PURPOSE on the strength of a reading taken earlier on this branch: `let o = {a:1,b:2}` with nothing else materializing `o` gave `o.b` 2 but `o[\"b\"]` 0 and `const k = \"b\"; o[k]` 0, against node 2/2/2 -- the LITERAL bracket spelling missing too, which is what made it a pre-existing bracket-read defect rather than a fold defect.

RE-MEASURED 2026-09-09 at `3ef65ef785` against node v26.8.1: kali prints 2 then 2, node prints 2 then 2, exit 0, `check` clean. The defect no longer reproduces at this commit. The isolated one-line probes read correctly too (`let o = {a:1,b:2}; console.log(o[\"b\"]);` -> 2; `let o = {a:1,b:2}; const k=\"b\"; console.log(o[k]);` -> 2), so this is not an artefact of the two probes sharing a program. The mechanism is Task 6's `44e8033ae9` (\"a static-name bracket access records the dot form's deferred object access\"): the bracket read now records the same deferred access the dot form records, which is exactly what materializes the `let` object.

An expectation of `0` was NOT written here, because writing an expectation the binary does not produce is the one thing this task is forbidden to do. The case is kept -- with the ruling's coverage intact -- as the CONTROL that the fold agrees with its literal bracket spelling on a `let` receiver. If the defect returns, this case goes red and the paragraph above is the record of what it looked like."""
args = ["run", "let_object_bracket_read.js"]
exit = "success"
stdout = "2\n2\n"

