# Cases for the computed-member-static-name project (spec
# docs/superpowers/specs/2026-09-08-computed-member-static-name-design.md).
#
# The admitted matrix (dot, literal, const-folded; read and store), the
# refused matrix (let/var/parameter key, binary index, boolean/null/BigInt
# literal, string receiver, array-literal store and mutable-index read, a
# shadowed fold name), and the controls of spec section 2.5. Every refusal is
# asserted under BOTH `check` and `run` with the one shared message, because
# `kali check` runs the checker only and the refusal must live in both twins.
#
# Every expectation here was measured at `3ef65ef785` against node v26.8.1, in
# both scopes where the program has a function twin. Nothing here is predicted:
# where the plan's Task 7 brief dictated an expectation the binary does not
# produce, the MEASUREMENT is what is pinned and the rationale carries both
# readings and names the mechanism. Three such divergences exist and each is
# called out by name in the case that carries it:
#   * `a_literal_number_key_bracket_store_is_refused_by_the_preexisting_numeric_key_gate`
#     (the brief predicted `7`; the binary refuses, through a gate that predates
#     this project and fires for a DOT store too),
#   * `the_let_object_bracket_read_agrees_with_its_dot_spelling`
#     (handoff ruling R14 predicted a wrong-on-purpose `0`; it reads correctly
#     at this commit),
#   * the two `..._chained_access_...` / `..._computed_callee_...` cases, which
#     are `run`-only because `check` still admits them (spec section 8 twin
#     disagreement, recorded rather than papered over).
#
# THREE CASES HERE ARE WRONG ON PURPOSE and no task in this plan owns closing
# them (spec section 6.3): the absent-property read after a fold, the
# `process.argv` index divergence, and the BigInt field rendering after a
# bracket store. Each says so in its own rationale.

[constants]
COMPUTED = "computed member access `o[k]` is unavailable in the current phase unless the index is a literal or a compile-time-constant `const` binding, or the receiver is a runtime array or a `for..in` key over the same object"
STRING = "indexing a string `s[i]` is unavailable in the current phase; use `charAt`/`at` on a statically-known ASCII string or the later compatibility path"
NUMERIC_KEY = "uses a numeric property name, which is unavailable in the current phase"

