[[case]]
name = "json_run_accepts_object_has_own_in_js_input"
rationale = "Same js `run` fixture, asserting the JSON output envelope, including the exact stdout text (verified for real, strictly stronger than the original `.contains(\"object hasOwn ok\")`)."
args = ["--output", "json", "run", "main.js"]
exit = "success"
json.schemaVersion = 1
json.command = "run"
json.success = true
json.exitCode = 0
json.stdout = "object hasOwn ok\n"

