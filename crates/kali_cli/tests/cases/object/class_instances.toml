[[case]]
name = "ok_user_push_is_refused_under_run"
rationale = """Control, equal to its own baseline row (ruling R-7): the refusal is the pre-existing literal-array `.push()` lane (`a.push(2)` on `const a=[1]`), not the class. node v26.10.0 prints `2 5`. At `7c4daa9f7` the baseline row `cls_ok_user_push`: REFUSES, kali printed `error[E5506]: calling `.push()` on a literal array is unavailable in the current phase: kali folds a literal array to its initial elements, so kali refuses rather than silently skip the call`, check exit 1."""
args = ["run", "ok_user_push.js"]
exit = "failure"
stdout = ""
stderr_contains = ["E5506", "calling `.push()` on a literal array"]

