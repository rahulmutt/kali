RE-PINNED 2026-10-04 by the block-scoping project (`docs/superpowers/specs/2026-10-04-block-scoping-design.md`) (diagnostic only; still refused). The baseline's second reason, `has a field initializer that names a parameter or variable of its constructor`, was the name conflation: the initializer's `k` is the enclosing function's `k`, not the constructor parameter. HEAD drops it (pinned absent) and keeps the true reason, `reads a variable of an enclosing function`. HEAD's first diagnostic: E5506 `constructing class `C` is unavailable in the current phase: it reads a variable of an enclosing function; kali refuses rather than build an instance whose field`."""
args = ["check", "r26_b4_initializer_names_ctor_param_in_fn.js"]
exit = "failure"
stdout = ""
stderr_contains = ["E5506", "reads a variable of an enclosing function"]
stderr_absent = ["has a field initializer that names a parameter or variable of its constructor"]

