# Cases for the class-instances project (spec
# docs/superpowers/specs/2026-10-04-class-instances-design.md and its §6
# amendments). A program-class instance holds its fields, or kali refuses with
# E5506 under `run` and `check` alike. Each rationale gives kali's output at
# the baseline `7c4daa9f7` (tools/array-return-probes/baseline-cls.tsv) and
# node v26.10.0's.
#
# `[source]` keys are one file per program, because `[source]` is file-wide.

[source]
"field_write_in_method.js" = '''
class Stack{ constructor(){ this.n=0; } add(x){ this.n=this.n+x; } } function main(){ const s=new Stack(); s.add(3); console.log(s.n); } main();
'''
"ctor_arg.js" = '''
class C{ constructor(v){ this.n=v; } get(){ return this.n+1; } } const s=new C(4); console.log(s.get(), s.n);
'''
"method_instance_flow.js" = '''
class P{ constructor(x){ this.x=x; } } class C{ constructor(){ this.n=0; } take(p){ return p.x; } self(){ return this; } } const c=new C(); const d=c.self(); console.log(c.take(new P(7)), d.n);
'''
"init_then_ctor.js" = '''
class C{ n=2; constructor(){ this.m=this.n*3; } } const c=new C(); console.log(c.n, c.m);
'''

"14a.js" = '''
class S { push(v){ return v+1; } } console.log(new S().push(1));
'''

"ctor_chain.js" = '''
class C{ constructor(){ this.n=0; this.m=this.n+2; } } const s=new C(); console.log(s.m);
'''

"ctor_read.js" = '''
class C{ constructor(){ this.n=5; } } const s=new C(); console.log(s.n);
'''

"field_decl.js" = '''
class C{ n=1; set(v){ this.n=v; } } const s=new C(); s.set(9); console.log(s.n);
'''

"in_main.js" = '''
function main(){ class C{ constructor(v){ this.v=v; } } const c=new C(2); console.log(c.v); } main();
'''

"known_r30.js" = '''
class F{ constructor(){ this.ok=false; } set(){ this.ok=true; } } const f=new F(); f.set(); console.log(f.ok);
'''

"method_read.js" = '''
class C{ constructor(){ this.n=5; } get(){ return this.n; } } const s=new C(); console.log(s.get());
'''

"method_write.js" = '''
class C{ constructor(){ this.n=0; } set(v){ this.n=v; } } const s=new C(); s.set(9); console.log(s.n);
'''

"ok_extends_stateless.js" = '''
class A{ f(){return 4;} } class B extends A{ g(){ return 1; } } const b=new B(); console.log(b.f()+b.g());
'''

"ok_host_r8.js" = '''
class X extends EventTarget { fire(){ this.addEventListener("t", () => {}); return 1; } } const x = new X(); console.log(x.fire());
'''

"ok_objlit.js" = '''
function mk(){ return {n:0}; } function get(o){ return o.n; } const a=mk(); a.n=2; console.log(get(a));
'''

"ok_static_only.js" = '''
class U { static twice(x){ return 2*x; } } console.log(U.twice(4));
'''

"ok_user_push.js" = '''
class Stack{ constructor(){ this.n=0; } push(v){ this.n=this.n+v; return this.n; } } const s=new Stack(); const a=[1]; a.push(2); console.log(a.length, s.push(5));
'''

"outside_write.js" = '''
class C{ constructor(){ this.n=0; } } const s=new C(); s.n=4; console.log(s.n);
'''

"param.js" = '''
class P{ constructor(x,y){ this.x=x; this.y=y; } } function len2(p){ return p.x*p.x+p.y*p.y; } console.log(len2(new P(3,4)));
'''

"r_ambiguous.js" = '''
function a(){ class P{ constructor(){ this.n=1; } } return new P(); } function b(){ class P{ constructor(){ this.n=2; } } return new P(); } console.log(a().n, b().n);
'''

"r_array.js" = '''
class C{ constructor(){ this.n=1; } } const xs=[new C(), new C()]; console.log(xs[1].n);
'''

"r_ctor_return.js" = '''
class C{ constructor(){ this.n=1; return {n:2}; } } const c=new C(); console.log(c.n);
'''

"r_extends_stateful.js" = '''
class A{ constructor(){ this.n=1; } } class B extends A{ g(){ return this.n; } } const b=new B(); console.log(b.g());
'''

"r_field_outside.js" = '''
class C{ constructor(){ this.n=0; } set(){ this.m=1; } } const c=new C(); c.set(); console.log(c.m);
'''

"r_getter.js" = '''
class A{ get v(){ return 3; } } const a=new A(); console.log(a.v);
'''

"r_instanceof.js" = '''
class C{ constructor(){ this.n=1; } } const c=new C(); console.log(c instanceof C);
'''

"r_log_instance.js" = '''
class C{ constructor(){ this.n=1; } } const c=new C(); console.log(c);
'''

"r_method_value.js" = '''
class C{ constructor(){ this.n=1; } get(){ return this.n; } } const c=new C(); const m=c.get; console.log(typeof m);
'''

"r_mixed_param.js" = '''
class A{ constructor(){ this.n=1; } } class B{ constructor(){ this.n=2; } } function f(x){ return x.n; } console.log(f(new A()), f(new B()));
'''

"r_no_init.js" = '''
class C{ n; } const c=new C(); console.log(c.n);
'''

"r_plain_fn_new.js" = '''
function Box(v){ this.v=v; } const b=new Box(9); console.log(b.v);
'''

"r_undeclared_read.js" = '''
class C{ constructor(){ this.n=1; } } const c=new C(); console.log(c.zz);
'''

"r_unresolved_recv.js" = '''
class C{ constructor(){ this.n=1; } get(){ return this.n; } } function f(x){ return x.get(); } const g=f; console.log(g(new C()));
'''

"recursive.js" = '''
class M{ constructor(){ this.calls=0; } fact(n){ this.calls=this.calls+1; if (n<=1) { return 1; } return n*this.fact(n-1); } } const m=new M(); console.log(m.fact(5), m.calls);
'''

"return.js" = '''
class C{ constructor(v){ this.v=v; } } function mk(v){ return new C(v); } const c=mk(7); console.log(c.v);
'''

"same_method.js" = '''
class A{ f(){ return 1; } } class B{ f(){ return 2; } } const a=new A(); const b=new B(); console.log(a.f(), b.f());
'''

"this_method.js" = '''
class A{ a(){ return this.b()+1; } b(){ return 2; } } const x=new A(); console.log(x.a());
'''

"top.js" = '''
class Stack{ constructor(){ this.n=0; } add(x){ this.n=this.n+x; } } const s=new Stack(); s.add(3); console.log(s.n);
'''

"14b.ts" = '''
class Stack{ n: number = 0; add(x: number){ this.n=this.n+x; } } function main(){ const s=new Stack(); s.add(3); console.log(s.n); } main();
'''
"ctor_arg.ts" = '''
class C{ n: number; constructor(v: number){ this.n=v; } get(): number { return this.n+1; } } const s=new C(4); console.log(s.get(), s.n);
'''
"param.ts" = '''
class P{ x: number; y: number; constructor(x: number, y: number){ this.x=x; this.y=y; } } function len2(p: P): number { return p.x*p.x+p.y*p.y; } console.log(len2(new P(3,4)));
'''
"return.ts" = '''
class C{ v: number; constructor(v: number){ this.v=v; } } function mk(v: number): C { return new C(v); } const c=mk(7); console.log(c.v);
'''

"update.js" = '''
class C{ constructor(){ this.n=0; } inc(){ this.n++; } get(){ return this.n; } } const s=new C(); s.inc(); s.inc(); console.log(s.get(), s.n);
'''

"compound.js" = '''
class Acc{ total=0; add(x){ this.total += x; return this.total; } } const a=new Acc(); a.add(2); console.log(a.add(5));
'''

"r36.js" = '''
class C{ constructor(){ this.v=3; } } console.log(new C().v);
'''

"this_arrow.js" = '''
class C{ constructor(){ this.n=1; } bump(){ const f = () => { this.n = this.n + 1; }; f(); f(); return this.n; } } const c=new C(); console.log(c.bump());
'''

"capture.js" = '''
class C{ constructor(){ this.n=0; } add(x){ this.n=this.n+x; } } const s=new C(); const f = () => { s.add(4); }; f(); console.log(s.n);
'''

"captured_by_nested_fn.js" = '''
class C{ constructor(){ this.n=0; } add(x){ this.n=this.n+x; } } function main(){ const s=new C(); function g(){ s.add(4); } g(); console.log(s.n); } main();
'''

[[case]]
name = "a_field_write_in_a_method_is_kept"
rationale = """literal-array-mutators followups §14b. node v26.10.0 prints `3`. At `7c4daa9f7` kali printed `0` at exit 0: the constructor never ran and the store in `add` was dropped."""
args = ["run", "field_write_in_method.js"]
exit = "success"
stdout = "3\n"

