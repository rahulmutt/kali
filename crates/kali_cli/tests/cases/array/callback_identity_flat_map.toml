# Migrated from tests/array_callback_identity_flat_map.rs -- all 6
# #[test] functions, as 16 sibling case blocks, matching the original 16
# loop-iteration assertions exactly (same shape as
# `callback_filter_predicate.toml`, migrated from a near-identical source
# file -- see that file's header for the general rationale of this shape):
#
#   - check_js/ts, build_js/ts: `assert_flat_map_identity_succeeds("check"|
#     "build", ext)` for ext in [js, ts] -- success only (stdout checks
#     are gated on `command == "run"`/`"test"`).
#   - run_js/ts: same helper with command "run" -- success plus exact
#     `stdout` equality (`assert_eq!`).
#   - test_js/ts: same helper with command "test" -- success plus
#     `stdout_contains` (`.contains()`).
#   - browser_check_js/ts/jsx/tsx, browser_build_js/ts/jsx/tsx:
#     `assert_flat_map_identity_browser_check_build_succeeds("check"|
#     "build", ext)` for ext in [js, ts, jsx, tsx] -- success only, via
#     `--api browser` (and `--bundle` for build).
#
# No `[matrix]`: the plain group loops js/ts only while the browser group
# loops js/ts/jsx/tsx -- a subset mismatch, so per the two-axis rule this
# stays sibling blocks.
#
# `[constants]` factors the one fixture body (`flat_map_identity_source()`,
# fixed, no command-dependent branching) shared byte-for-byte across all 6
# `[source]` filenames.
#
# No `//` comments existed in the source file to carry into `rationale`.

[constants]
program = '''
function main() {
  for (const item of [1, 2].flatMap((value) => [value])) {
    console.log(item);
  }
}
main();
'''

[source]
"smoke.test.js" = "${program}"
"smoke.test.ts" = "${program}"
"main.js" = "${program}"
"main.ts" = "${program}"
"main.jsx" = "${program}"
"main.tsx" = "${program}"

[[case]]
name = "check_js"
rationale = "`check` accepts the identity `.flatMap()` fixture -- js source."
args = ["check", "smoke.test.js"]
exit = "success"

[[case]]
name = "check_ts"
rationale = "`check` accepts the identity `.flatMap()` fixture -- ts source."
args = ["check", "smoke.test.ts"]
exit = "success"

[[case]]
name = "build_js"
rationale = "`build` accepts the identity `.flatMap()` fixture -- js source."
args = ["build", "smoke.test.js"]
exit = "success"

[[case]]
name = "build_ts"
rationale = "`build` accepts the identity `.flatMap()` fixture -- ts source."
args = ["build", "smoke.test.ts"]
exit = "success"

[[case]]
name = "run_js"
rationale = "`run` accepts the identity `.flatMap()` fixture and prints the flattened elements -- js source."
args = ["run", "smoke.test.js"]
exit = "success"
stdout = "1\n2\n"

[[case]]
name = "run_ts"
rationale = "`run` accepts the identity `.flatMap()` fixture and prints the flattened elements -- ts source."
args = ["run", "smoke.test.ts"]
exit = "success"
stdout = "1\n2\n"

[[case]]
name = "test_js"
rationale = "`test` accepts the identity `.flatMap()` fixture and its stdout includes the flattened elements -- js source."
args = ["test", "smoke.test.js"]
exit = "success"
stdout_contains = ["1\n2\n"]

[[case]]
name = "test_ts"
rationale = "`test` accepts the identity `.flatMap()` fixture and its stdout includes the flattened elements -- ts source."
args = ["test", "smoke.test.ts"]
exit = "success"
stdout_contains = ["1\n2\n"]

[[case]]
name = "browser_check_js"
rationale = "`check --api browser` accepts the identity `.flatMap()` fixture across every supported source class -- js source."
args = ["check", "--api", "browser", "main.js"]
exit = "success"

[[case]]
name = "browser_check_ts"
rationale = "`check --api browser` accepts the identity `.flatMap()` fixture across every supported source class -- ts source."
args = ["check", "--api", "browser", "main.ts"]
exit = "success"

[[case]]
name = "browser_check_jsx"
rationale = "`check --api browser` accepts the identity `.flatMap()` fixture across every supported source class -- jsx source."
args = ["check", "--api", "browser", "main.jsx"]
exit = "success"

[[case]]
name = "browser_check_tsx"
rationale = "`check --api browser` accepts the identity `.flatMap()` fixture across every supported source class -- tsx source."
args = ["check", "--api", "browser", "main.tsx"]
exit = "success"

[[case]]
name = "browser_build_js"
rationale = "`build --bundle --api browser` accepts the identity `.flatMap()` fixture across every supported source class -- js source."
args = ["build", "--bundle", "--api", "browser", "main.js"]
exit = "success"

[[case]]
name = "browser_build_ts"
rationale = "`build --bundle --api browser` accepts the identity `.flatMap()` fixture across every supported source class -- ts source."
args = ["build", "--bundle", "--api", "browser", "main.ts"]
exit = "success"

[[case]]
name = "browser_build_jsx"
rationale = "`build --bundle --api browser` accepts the identity `.flatMap()` fixture across every supported source class -- jsx source."
args = ["build", "--bundle", "--api", "browser", "main.jsx"]
exit = "success"

[[case]]
name = "browser_build_tsx"
rationale = "`build --bundle --api browser` accepts the identity `.flatMap()` fixture across every supported source class -- tsx source."
args = ["build", "--bundle", "--api", "browser", "main.tsx"]
exit = "success"
