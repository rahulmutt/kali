# Migrated from tests/array_callback_reduce.rs -- all 3 #[test]
# functions, as 32 sibling case blocks, matching the original 32
# loop-iteration assertions exactly:
#
#   - `check_build_run_and_test_support_numeric_reduce_slices` loops
#     command in [check, build, run, test] x extension in [js, ts]
#     (non-browser, non-json) -> check_js/ts, build_js/ts, run_js/ts,
#     test_js/ts (8 cases).
#   - `browser_check_and_bundle_support_numeric_reduce_slices` loops
#     command in [check, build] x extension in [js, ts, jsx, tsx]
#     (browser, non-json) -> browser_check_js/ts/jsx/tsx,
#     browser_build_js/ts/jsx/tsx (8 cases).
#   - `browser_harness_run_and_test_support_numeric_reduce_slices` loops
#     command in [run, test] x extension in [js, ts, jsx, tsx], each
#     iteration calling the helper twice (json_output = false, then true)
#     -> browser_run_js/ts/jsx/tsx, browser_test_js/ts/jsx/tsx (8, plain)
#     plus json_browser_run_js/ts/jsx/tsx, json_browser_test_js/ts/jsx/tsx
#     (8, `--output json`) (16 cases).
#
# No `[matrix]`: the first group loops only js/ts while the other two loop
# js/ts/jsx/tsx -- a subset mismatch, so per the two-axis rule this stays
# sibling blocks (one per original loop iteration) rather than a
# file-level extension axis that would either exempt the first group's
# missing jsx/tsx cells incorrectly or fan it out across extensions it
# never actually runs against.
#
# `assert_reduce_succeeds`'s helper always names the file
# "reduce.test.{extension}" regardless of command, but its *content*
# (`reduce_source(command)`) differs: plain for check/build/run, wrapped
# in `Kali.test(...)` only for command == "test" -- a same-filename,
# different-content collision at every extension (see this task's
# instructions on `[source]` collisions). Resolved the same way
# `object/computed_numeric_keys_runtime.toml` resolved its own such
# collision: renamed the plain-content variant to "reduce.${extension}"
# (dropping the ".test." infix, which carries no behavioral meaning for
# check/build/run) and kept "reduce.test.${extension}" for the
# `Kali.test`-wrapped variant actually run via the `test` command.
# `[constants]` factors each body once, referenced by every filename that
# needs it.
#
# `stdout`/`stdout_contains` claims are kept as `.contains()` exactly as
# written in the original (not strengthened to exact equality, even
# though direct runs of the built `kali` binary against every one of
# these fixture/command/browser combinations showed stdout is always
# exactly "6\n-6\n6\n0\n" with nothing else -- `stdout_contains` alone is
# a faithful, unweakened migration of a `.contains()` claim, so
# strengthening it is optional, not required). The one place strengthening
# *is* required rather than optional: `json.stdout` in the JSON cases,
# since `json`/`fields` values only support equality (jsonpath.rs), never
# `.contains()` -- verified via the same real binary runs (`--output json`
# against both plain and `Kali.test`-wrapped fixtures, browser and
# non-browser) that `stdout` is exactly "6\n-6\n6\n0\n" there too, so
# `json.stdout = "6\n-6\n6\n0\n"` is the real, verified value, not a guess.
#
# No `//` comments existed in the source file to carry into `rationale`.

[constants]
plain_body = '''
function reduceSlices() {
  console.log([1, 2, 3].reduce((acc, value) => acc + value, 0));
  console.log([1, 2, 3].reduceRight((acc, value) => acc - value, 0));
  console.log([1, 2, 3].reduce((acc, value) => acc + value));
  console.log([1, 2, 3].reduceRight((acc, value) => acc - value));
}
reduceSlices();
'''
test_body = '''
Kali.test('reduce slices', () => {
function reduceSlices() {
  console.log([1, 2, 3].reduce((acc, value) => acc + value, 0));
  console.log([1, 2, 3].reduceRight((acc, value) => acc - value, 0));
  console.log([1, 2, 3].reduce((acc, value) => acc + value));
  console.log([1, 2, 3].reduceRight((acc, value) => acc - value));
}
reduceSlices();
});
'''

[source]
"reduce.js" = "${plain_body}"
"reduce.ts" = "${plain_body}"
"reduce.jsx" = "${plain_body}"
"reduce.tsx" = "${plain_body}"
"reduce.test.js" = "${test_body}"
"reduce.test.ts" = "${test_body}"
"reduce.test.jsx" = "${test_body}"
"reduce.test.tsx" = "${test_body}"

[[case]]
name = "check_js"
rationale = "`check` accepts the numeric reduce/reduceRight (with and without an initial value) fixture -- js source."
args = ["check", "reduce.js"]
exit = "success"

