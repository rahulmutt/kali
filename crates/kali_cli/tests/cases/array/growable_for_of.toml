[[case]]
name = "a_let_loop_item_over_a_literal_array_is_read_as_the_item"
rationale = "Residual round 5: the static (unrolled) for-of lanes bind the item but never write a `let` variable's local, so a read through it gave `0`: `out.push(x)` stored `0, 0` (silent) and `console.log(z + 1, Math.abs(z))` printed the stale value (on `main` too). While the body is emitted a read of the variable resolves to the item, unless the body assigns it."
args = ["run", "let_item_function.js"]
exit = "success"
stdout = "4 3\n5 4\n1 2 1.5 2.5\n"

