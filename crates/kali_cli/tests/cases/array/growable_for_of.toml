# Growable runtime arrays: for-of over bindings, calls and slices, nested,
# with i64, f64 and string elements; multi-argument console output
# (spec §3.5, A-9, A-10). Every expected stdout is node v26.10.0's for the
# same file, measured 2026-10-07 with `env -u FORCE_COLOR node FILE.js`.

[source]
"nested_module.js" = """
const a = [];
a.push(1); a.push(2);
const b = [];
b.push(10); b.push(20);
let s = 0;
for (const x of a) { for (const y of b) { s += x * y; } }
let t = 0;
for (const x of a) { for (const y of a) { t += x * y; } }
console.log(s, t);
"""
"nested_function.js" = """
function main() {
  const a = []; a.push(1); a.push(2);
  const b = []; b.push(10); b.push(20);
  let s = 0;
  for (const x of a) { for (const y of b) { s += x * y; } }
  let t = 0;
  for (const x of a) { for (const y of a) { t += x * y; } }
  console.log(s, t);
}
main();
"""
"p2_module.js" = """
function build(n) { const out = []; let w = "a"; for (let i = 0; i < n; i++) { out.push(w); w = w + "b"; } return out; }
const ws = build(3);
for (const w of ws) console.log(w);
console.log(ws.length, ws.join(" "));
"""
"p2_function.js" = """
function build(n) { const out = []; let w = "a"; for (let i = 0; i < n; i++) { out.push(w); w = w + "b"; } return out; }
function main() {
  const ws = build(3);
  for (const w of ws) console.log(w);
  console.log(ws.length, ws.join(" "));
}
main();
"""
"p3_module.js" = """
const out = [];
for (let i = 0; i < 4; i++) out.push(i);
let s = 0;
for (const x of out) s += x;
console.log(s, out.length, out.join("|"));
"""
"p3_function.js" = """
function main() { const out = []; for (let i = 0; i < 4; i++) out.push(i); let s = 0; for (const x of out) s += x; console.log(s, out.length, out.join("|")); }
main();
"""
"float_loop.js" = """
const data = [];
for (let i = 1; i <= 5; i++) data.push(i * 1.5);
let t = 0;
for (const v of data) t += v;
console.log(t);
"""
"float_loop_function.js" = """
function main() { const data = []; for (let i = 1; i <= 5; i++) data.push(i * 1.5); let t = 0; for (const v of data) t += v; console.log(t); }
main();
"""
"slice_loop.js" = """
function main() { const a = []; for (let i = 0; i < 4; i++) a.push(i); let s = ""; for (const x of a.slice(1, 3)) s = s + x; console.log(s); }
main();
"""
"slice_loop_module.js" = """
const a = [];
for (let i = 0; i < 4; i++) a.push(i);
let s = "";
for (const x of a.slice(1, 3)) s = s + x;
console.log(s);
"""
"write_in_loop.js" = """
function main() { const a = []; a.push(1); a.push(2); a.push(3); for (const x of a) a[0] = x; console.log(a.join(",")); }
main();
"""
"write_in_loop_module.js" = """
const a = [];
a.push(1); a.push(2); a.push(3);
for (const x of a) a[0] = x;
console.log(a.join(","));
"""
"break_continue.js" = """
function main() { const a = []; for (let i = 0; i < 6; i++) a.push(i); let s = 0; for (const x of a) { if (x === 1) continue; if (x === 4) break; s += x; } console.log(s); }
main();
"""
"break_continue_module.js" = """
const a = [];
for (let i = 0; i < 6; i++) a.push(i);
let s = 0;
for (const x of a) { if (x === 1) continue; if (x === 4) break; s += x; }
console.log(s);
"""
"wrap_module.js" = """
function wrap(words) { const lines = []; for (const w of words) { if (w.length > 1) lines.push(w); } return lines; }
const ws = [];
ws.push("a"); ws.push("bb"); ws.push("ccc");
for (const line of wrap(ws)) console.log(line);
"""
"wrap_function.js" = """
function wrap(words) { const lines = []; for (const w of words) { if (w.length > 1) lines.push(w); } return lines; }
function main() {
  const ws = [];
  ws.push("a"); ws.push("bb"); ws.push("ccc");
  for (const line of wrap(ws)) console.log(line);
}
main();
"""
"mixed_module.js" = """
const ws = [];
ws.push("x"); ws.push("yz");
const fs = [];
fs.push(0.5); fs.push(2.25);
const ns = [];
ns.push(3); ns.push(4);
for (const w of ws) { for (const f of fs) { for (const n of ns) { console.log(w, f * n); } } }
let line = "";
for (const w of ws.slice(1)) { for (const n of ns) line = line + " " + w + n; }
console.log(line);
"""
"mixed_function.js" = """
function main() {
  const ws = []; ws.push("x"); ws.push("yz");
  const fs = []; fs.push(0.5); fs.push(2.25);
  const ns = []; ns.push(3); ns.push(4);
  for (const w of ws) { for (const f of fs) { for (const n of ns) { console.log(w, f * n); } } }
  let line = "";
  for (const w of ws.slice(1)) { for (const n of ns) line = line + " " + w + n; }
  console.log(line);
}
main();
"""
"call_once_module.js" = """
let calls = 0;
function build(n) { calls += 1; const out = []; for (let i = 0; i < n; i++) out.push(i * 2); return out; }
let s = 0;
for (const x of build(3)) { for (const y of build(2)) s += x + y; }
console.log(s, calls);
"""
"call_once_function.js" = """
let calls = 0;
function build(n) { calls += 1; const out = []; for (let i = 0; i < n; i++) out.push(i * 2); return out; }
function main() {
  let s = 0;
  for (const x of build(3)) { for (const y of build(2)) s += x + y; }
  console.log(s, calls);
}
main();
"""
"mixed_loops.js" = """
for (const x of [3, "a"]) { console.log(x); }
for (const x of [1.5, 2.5]) { console.log(x); }
for (const x of [1.5, 2.5]) { console.log(Math.floor(x) % 2); }
"""
"mixed_loops_main.js" = """
function main() {
  for (const x of [3, "a"]) { console.log(x); }
  for (const x of [1.5, 2.5]) { console.log(x); }
  for (const x of [1.5, 2.5]) { console.log(Math.floor(x) % 2); }
}
main();
"""

