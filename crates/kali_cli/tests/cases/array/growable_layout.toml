[[case]]
name = "a_float_index_write_is_refused_under_run_module_scope"
rationale = "Task 9 fix round 1 (I1): a float index on a growable write is refused (E5506) instead of lowering to wasm that fails to load (E4201). node v26.10.0 prints `1` (it sets a `0.5` property). Codegen-only for now: `check` accepts the program (pinned below)."
args = ["run", "float_index_write_module.js"]
exit = "failure"
stderr_contains = ["E5506", "indexing a growable array with a floating-point value"]

[[case]]
name = "a_float_index_write_is_refused_under_run"
