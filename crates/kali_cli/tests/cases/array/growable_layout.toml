# Growable runtime arrays: layout, memory and element access
# (docs/superpowers/specs/2026-10-07-growable-runtime-arrays-design.md §3.1,
# §3.3-§3.5). Every expected stdout is node v26.10.0's for the same file,
# measured 2026-10-07 with `env -u FORCE_COLOR node FILE.js`. Spec §5.2: each
# program is pinned in module scope and inside `function main() { … } main();`.

[source]
"alias_module.js" = """
const a = [];
a.push(5);
const b = a;
b.push(6);
console.log(a.length, a[1], b.length);
"""
"alias_function.js" = """
function main() { const a = []; a.push(5); const b = a; b.push(6); console.log(a.length, a[1], b.length); }
main();
"""
"multi_push_module.js" = """
const a = []; const n = a.push(1, 2, 3); console.log(n, a.length, a.join(""));
"""
"multi_push.js" = """
function main() { const a = []; const n = a.push(1, 2, 3); console.log(n, a.length, a.join("")); }
main();
"""
"seeded_module.js" = """
const a = [1, 2]; a.push(3); console.log(a.length, a.join("+"));
"""
"seeded.js" = """
function main() { const a = [1, 2]; a.push(3); console.log(a.length, a.join("+")); }
main();
"""
"three_index_module.js" = """
function make() { const xs = []; xs.push(1); return xs; }
function addTwo(a) { a.push(2); a.push(3); }
function total(a) { let s = 0; for (let i = 0; i < a.length; i++) s += a[i]; return s; }
const xs = make(); addTwo(xs); console.log(xs.length, total(xs));
"""
"three_index.js" = """
function make() { const xs = []; xs.push(1); return xs; }
function addTwo(a) { a.push(2); a.push(3); }
function total(a) { let s = 0; for (let i = 0; i < a.length; i++) s += a[i]; return s; }
function main() { const xs = make(); addTwo(xs); console.log(xs.length, total(xs)); }
main();
"""
"two_builds.js" = """
function build(n) { const out = []; let w = "a"; for (let i = 0; i < n; i++) { out.push(w); w = w + "b"; } return out; }
const a = build(3);
const b = build(2);
console.log(a[0], a[2], b[1], a.length + b.length);
"""
"two_builds_function.js" = """
function build(n) { const out = []; let w = "a"; for (let i = 0; i < n; i++) { out.push(w); w = w + "b"; } return out; }
function main() { const a = build(3); const b = build(2); console.log(a[0], a[2], b[1], a.length + b.length); }
main();
"""
"f64_rw_module.js" = """
const a = []; a.push(1.5); a.push(2); a[1] = a[1] / 4; console.log(a[0], a[1], a.length);
"""
"f64_rw.js" = """
function main() { const a = []; a.push(1.5); a.push(2); a[1] = a[1] / 4; console.log(a[0], a[1], a.length); }
main();
"""
"arrow_alias_module.js" = """
const mk = () => { const o = []; o.push(1); o.push(2); return o; };
console.log(mk().length);
"""
"arrow_alias_function.js" = """
function main() { const mk = () => { const o = []; o.push(1); o.push(2); return o; }; console.log(mk().length); }
main();
"""

"grow_rhs_module.js" = """
function grow(a) { for (let i = 0; i < 20; i++) a.push(i); return 99; }
const a = []; a.push(1); a[0] = grow(a); console.log(a[0], a.length);
"""
"grow_rhs_function.js" = """
function grow(a) { for (let i = 0; i < 20; i++) a.push(i); return 99; }
function main() { const a = []; a.push(1); a[0] = grow(a); console.log(a[0], a.length); }
main();
"""
"float_index_write_module.js" = """
const a = []; a.push(1); let f = 0.5; a[f] = 9; console.log(a.length);
"""
"float_index_write.js" = """
function main() { const a = []; a.push(1); let f = 0.5; a[f] = 9; console.log(a.length); }
main();
"""
"negz_module.js" = """
const a = []; a.push(-0); a.push(1.5); a.push(-0.0); a.push(-(0)); a.push(-(-0)); a[1] = -0;
const b = [-0, 2.5]; b.push(+(-0));
console.log(1 / a[0], 1 / a[1], 1 / a[2], 1 / a[3], 1 / a[4], 1 / b[0], 1 / b[2], a.length);
"""
"negz.js" = """
function main() {
  const a = []; a.push(-0); a.push(1.5); a.push(-0.0); a.push(-(0)); a.push(-(-0)); a[1] = -0;
  const b = [-0, 2.5]; b.push(+(-0));
  console.log(1 / a[0], 1 / a[1], 1 / a[2], 1 / a[3], 1 / a[4], 1 / b[0], 1 / b[2], a.length);
}
main();
"""
