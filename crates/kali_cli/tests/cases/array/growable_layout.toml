[[case]]
name = "an_index_write_whose_value_grows_the_array_stores_into_the_live_block_module_scope"
rationale = "Task 9 fix round 1 (C1): the value is evaluated before the bounds check and the data pointer are read (`__growable_store`), so a right-hand side that grows the array (moving its data block) stores into the live block. Before the fix kali printed `1 21`."
args = ["run", "grow_rhs_module.js"]
exit = "success"
stdout = "99 21\n"

