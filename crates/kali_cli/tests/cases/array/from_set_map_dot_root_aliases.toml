# `array_from_*` files in this task).
#
# This source file contains two independent scenarios, matching its two
# helper-function groups:
#
#   - Group 1 ("frozen `globalThis.Array.from` aliases", 8 #[test] fns ->
#     17 cases): `frozenDotRootArrayFrom`, `frozenMixedBracketArrayFrom`,
#     `frozenParenthesizedBracketRootArrayFrom`, and six more dot/bracket/
#     single-quote/double-quote/parenthesized alias spellings, run
#     standalone, `--api browser` with a harness command configured, and
#     bundled+harness-verified. Same structure as
#     from_bracketed_root_wrappers.toml: no #[test] here ever exercises
#     the shared helpers' `json_output=true` branch, so this group adds
#     the same three genuinely-verified extra JSON-output siblings
#     (`json_run_browser_requested_js`, `json_test_browser_requested_js`,
#     `json_build_bundle_js`), confirmed against the real built kali
#     binary.
#   - Group 2 ("nullish/logical wrapped `globalThis.Array['from']`
#     aliases", 4 #[test] fns -> 4 cases, 1:1, no loop, no build variant):
#     a much smaller fixture (`nullishMixedBracketArrayFrom`,
#     `andMixedBracketArrayFrom`), run standalone and `--api browser`.
#     Its own helper's `json_output=true` branch is also always called
#     with `false` and is therefore also dead code, but every JSON key it
#     would need (`schemaVersion`, `hostContract`, `threadTopology`, ...)
#     is already covered by group 1's three JSON-output cases above --
#     the audit script tracks literal presence file-wide, not per-helper
#     -- so no separate group-2 JSON case was needed to close the audit;
#     confirmed by running the audit after writing only the 1:1 group-2
#     cases below.
#
# `[source]` filename collision: group 1 and group 2 both use `main.js`/
# `smoke.test.js` in the original `.rs` (for different content). Group
# 2's fixtures are renamed to `mixed-main.js`/`mixed-smoke.test.js` here
# to avoid the collision -- the filename itself carries no literal claim
# (every `.arg(...)` in the source takes a `PathBuf` variable).

