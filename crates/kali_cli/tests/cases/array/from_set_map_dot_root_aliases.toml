[[case]]
name = "json_build_bundle_js"
rationale = "Same browser-bundle `build`, asserting the JSON output envelope's `artifactKind`/`bundleFormat`. Reachable-but-unexercised-by-a-#[test] code -- confirmed against the real built kali binary."
[[case.step]]
args = ["--output", "json", "build", "--bundle", "--api", "browser", "app.js"]
exit = "success"
json.schemaVersion = 1
json.command = "build"
json.success = true
json.exitCode = 0
json.errors = []
json.payload.artifactKind = "bundle"
json.payload.bundleFormat = "esm"
[[case.step]]
kind = "file_json"
path = "app/app.meta.json"
fields.apiSurface = "browser"
fields.artifactKind = "bundle"
[[case.step]]
kind = "browser_bundle_harness"
entry = "app"
body = "const mod = await import(bundleJs.href);\nawait mod.browserArrayFromDotRootAliases();\nconsole.log('browser globalThis.Array.from aliases ok');\n"
exit = "success"
stdout_contains = ["1\n2\n1\n2\n1\n3\n4\n5\n1\n3\n4\n5\n"]

