[[case]]
name = "pop_until_one_element_remains_module_scope"
rationale = "Spec §3.5: `pop` returns and removes the last element (i64 and string), index writes stay in bounds."
args = ["run", "pop_module.js"]
exit = "success"
stdout = "5 1 4\ny 1\n9,8\n"

