function has(a, v) { return a.includes(v); }
const b = has(xs, 5);
console.log(b, has(xs, 6), typeof has(xs, 5), "has=" + has(xs, 5), b === true, b === 1);
let found = false;
for (const v of xs) { if (v > 4) found = xs.includes(v); }
console.log(found, typeof found);
const fs = [];
