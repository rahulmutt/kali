# Growable runtime arrays: pop, indexOf, includes, slice and float join
# (spec §3.5, A-12..A-14). Every expected stdout is node v26.10.0's for the
# same file, measured 2026-10-07 with `env -u FORCE_COLOR node FILE.js`.

[constants]
POP_ARG = "`.pop()` with an argument on the growable array `a`"
SLICE_ARGS = "`.slice()` with more than two arguments on the growable array `a`"
dollar = "$"

[source]
"pop_module.js" = """
const a = [];
a.push(4); a.push(5); a.push(6);
let last = 0;
while (a.length > 1) { last = a.pop(); }
console.log(last, a.length, a[0]);
const s = [];
s.push("x"); s.push("y");
const top = s.pop();
console.log(top, s.length);
a[0] = 9;
a.push(7);
a[a.length - 1] = 8;
console.log(a.join(","));
"""
"pop_function.js" = """
function main() {
  const a = [];
  a.push(4); a.push(5); a.push(6);
  let last = 0;
  while (a.length > 1) { last = a.pop(); }
  console.log(last, a.length, a[0]);
  const s = [];
  s.push("x"); s.push("y");
  const top = s.pop();
  console.log(top, s.length);
  a[0] = 9;
  a.push(7);
  a[a.length - 1] = 8;
  console.log(a.join(","));
}
main();
"""
