# Migrated from tests/array_from_bracketed_root_wrappers.rs -- all 8
# #[test] functions, as 16 case blocks (sibling [[case]] blocks: the ts/
# jsx/tsx loops only apply to some tests, not the whole file, so a
# file-level [matrix] would incorrectly fan the standalone/build cases
# out too -- same reasoning as repeat_static_ascii.toml).
#
#   - `run_standalone`/`test_standalone`: 1:1 with their source tests,
#     the plain (no `--api browser`) path.
#   - `run_browser_requested_js`/`_ts`/`_jsx`/`_tsx`: `run --api browser`
#     with a configured browser harness command
#     (`KALI_BROWSER_BUNDLE_HARNESS_COMMAND=node`) -- a plain `cli` step
#     (env + args), not the `browser_bundle_harness` step kind, since
#     this invokes `kali` directly rather than building a bundle and
#     running a separate harness script. `_js` is its own #[test]; `_ts`/
#     `_jsx`/`_tsx` are one #[test] that loops over the three extensions,
#     expanded to siblings here.
#   - `test_browser_requested_js`/`_ts`/`_jsx`/`_tsx`: same shape for
#     `test --api browser`.
#   - `build_bundle_js`/`_ts`/`_jsx`/`_tsx`: this task's first bulk use of
#     the `browser_bundle_harness` step kind (plan Task 18 Step 2 applies
#     here: no format extension was needed -- the source's own
#     `browser_bundle_harness_script("app", false, body)` call uses
#     `allow_subpaths = false` and `entry = "app"` throughout, exactly
#     what `run_browser_bundle_harness` in steps.rs already hard-codes).
#     Each is a 3-step `[[case.step]]`: (1) `build --bundle --api
#     browser` the fixture, (2) a `file_json` step reading the emitted
#     `app/app.meta.json` for `apiSurface`/`artifactKind`, (3) a
#     `browser_bundle_harness` step (entry "app") that imports the bundle,
#     calls the exported function, and asserts the harness's own stdout.
#
# None of this file's 8 #[test] fns ever call their `json_output=true`
# branch (every call site passes `false`) -- confirmed by reading every
# call site. The JSON-envelope assertion code inside the shared helpers
# is real, reachable code (just never exercised by *this* file's tests),
# so its literal claims (schemaVersion, hostContract, threadTopology,
# ...) are still real text the audit script tracks. Rather than leave
# those claims unaddressed or fabricate values, this file adds one
# additional, genuinely-verified JSON-output sibling per group
# (`json_run_browser_requested_js`, `json_test_browser_requested_js`,
# `json_build_bundle_js`) -- confirmed against the real built `kali`
# binary -- which is honest extra coverage of code this file's own
# helpers already contain, not an invented assertion to silence the
# audit.

