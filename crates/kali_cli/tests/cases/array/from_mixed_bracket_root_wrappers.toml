# Migrated from tests/array_from_mixed_bracket_root_wrappers.rs -- all 11
# #[test] functions, as 14 case blocks (sibling [[case]] blocks, not
# [matrix]: the run/test-harness group only covers js, while the build
# group covers js/ts/jsx/tsx, and a file-level [matrix] would incorrectly
# fan the run/test-harness cases out to ts/jsx/tsx too, which were never
# tested).
#
# Unlike from_bracketed_root_wrappers.toml and its two siblings, this
# file's #[test] fns DO call the shared helpers with `json_output=true`
# at real, explicit call sites (`json_run_supports_...`,
# `json_test_supports_...`, `json_build_emits_...`), so no extra
# "reachable but unexercised" coverage cases are needed here -- every
# json case below maps 1:1 (or 1:2, for the jsx/tsx loop that calls both
# json and non-json per iteration) to a real #[test].
#
#   - `run_standalone`/`test_standalone`: 1:1, the plain (no `--api
#     browser`) path, using the flat (non-wrapped) fixture body.
#   - `run_harness`/`json_run_harness`, `test_harness`/`json_test_harness`:
#     1:1 each, js only. `browser_bundle_harness` step kind is not used
#     here -- these invoke `kali run`/`test --api browser` directly with
#     a configured harness command env var, same as the plain `cli` step
#     everywhere else in this family.
#   - `build_js`/`json_build_js`, `build_ts`/`json_build_ts`: 1:1 each.
#   - `build_jsx`/`json_build_jsx`, `build_tsx`/`json_build_tsx`: the
#     11th #[test] loops over [jsx, tsx] and calls the bundle helper with
#     both `false` and `true` per extension -- expanded to 4 sibling
#     cases here.
#
# Each `build_*`/`json_build_*` case is a 3-step `[[case.step]]`: build
# the bundle (asserting the JSON envelope too, for the `json_build_*`
# cases), read `app/app.meta.json` via a `file_json` step, then a
# `browser_bundle_harness` step that imports the bundle and calls the
# exported function -- same shape as the other four `array_from_*`
# browser-bundle files in this task, confirming the step kind needed no
# format extension here either.

