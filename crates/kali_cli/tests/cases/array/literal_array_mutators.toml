[[case]]
name = "a_let_bound_literal_push_refuses_under_check"
rationale = """At `9dc751cf8` kali printed `1` at exit 0 (the push dropped) and `check` exited 0; node v26.10.0 prints `1` too, but the array is `[1,2,3,4]`. Refused because the call is dropped. RE-PINNED 2026-10-08 by the growable-runtime-arrays project (docs/superpowers/specs/2026-10-07-growable-runtime-arrays-design.md, Task 13), measured at `417b58fb8` against node v26.10.0: `check` now ACCEPTS (exit 0) and the `run` twin prints node's `1`. The literal is a growable array (spec §3.1: a `push`, `pop` or index write makes an array-literal binding a source). A `let` binding is a literal origin like `const` (A-19). Previously pinned as a refusal."""
args = ["check", "t_let_push.js"]
exit = "success"
stdout = "Checked 1 file(s)\n"

