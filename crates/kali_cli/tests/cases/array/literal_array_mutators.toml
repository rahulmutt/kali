# Cases for the literal-array-mutators project (spec
# docs/superpowers/specs/2026-10-03-literal-array-mutators-design.md).
#
# An in-place mutator on a literal array refuses with E5506 under `check` and
# `run` alike, instead of being silently skipped at exit 0; the plain runtime-
# array lane refuses `reverse`/`sort`/`copyWithin` and an optional call too.
# Growable `push` and every non-mutating use keep node's output. Each
# rationale gives kali's `run` output at the baseline `9dc751cf8`
# (tools/array-return-probes/baseline-litmut.tsv) and node v26.10.0's.
#
# `[source]` keys are one file per program, because `[source]` is file-wide.

[constants]
LIT = "on a literal array is unavailable in the current phase"
LIT_LEN = "assigning to `.length` of a literal array is unavailable"
MUT = "on a runtime array is unavailable in the current phase"

[source]
"alias.js" = '''
function main(){ const a=[1,2,3]; const b=a; b.pop(); console.log(a[0]); } main();
'''
"param.js" = '''
function g(x){ x.pop(); } function main(){ const a=[1,2,3]; g(a); console.log(a[0]); } main();
'''
"t_push.js" = '''
const a=[1,2,3]; a.push(4); console.log(a.length);
'''
"t_pop.js" = '''
const a=[1,2,3]; const x=a.pop(); console.log(a.length); console.log(x);
'''
"t_sort.js" = '''
const a=[3,1,2]; a.sort(); console.log(a[0]);
'''
"t_fill.js" = '''
const a=[1,2,3]; a.fill(9); console.log(a[0]);
'''
"t_length.js" = '''
const a=[1,2,3]; a.length = 1; console.log(a.length);
'''
"t_let_push.js" = '''
let a=[1,2,3]; a.push(4); console.log(a[0]);
'''
"f_shift.js" = '''
function main(){ const a=[1,2,3]; a.shift(); console.log(a[0]); } main();
'''
"f_reverse.js" = '''
function main(){ const a=[1,2,3]; a.reverse(); console.log(a[0]); } main();
'''
"f_length_compound.js" = '''
function main(){ const a=[1,2,3]; a.length -= 1; console.log(a.length); } main();
'''
"w_optcall.js" = '''
const a=[1,2,3]; a.push?.(4); console.log(a[0]);
'''
"w_strkey.js" = '''
const a=[1,2,3]; a["pop"](); console.log(a[0]);
'''
"nameless.js" = '''
console.log([1,2].push(3));
'''
"closure.js" = '''
function main(){ const a=[1,2,3]; const f=()=>a.pop(); f(); console.log(a[0]); } main();
'''
"push_pop.js" = '''
function main(){ const a=[1,2]; a.push(3); a.pop(); console.log(a[0]); } main();
'''
"plain_reverse.js" = '''
function main(){ const a=new Array(3).fill(4); a[0]=1; a.reverse(); console.log(a[0]); } main();
'''
"plain_optcall.js" = '''
function main(){ const a=new Array(3).fill(4); a.push?.(1); console.log(a[0]); } main();
'''
"ok_growable_push.js" = '''
function main(){ const a=[1,2,3]; a.push(4); console.log(a.length); console.log(a[3]); } main();
'''
"ok_push_loop.js" = '''
function main(){ const a=[]; for (let i=0;i<3;i++) a.push(i); let s=0; for (const x of a) s+=x; console.log(s); } main();
'''
"ok_plain_fill.js" = '''
function main(){ const a=new Array(3).fill(4); a.fill(5); console.log(a[1]); } main();
'''
"ok_read.js" = '''
const a=[1,2,3]; console.log(a[1]); console.log(a.length);
'''
"w_paren_optcall.js" = '''
const a=[1,2,3]; (a.pop)?.(); console.log(a.length);
'''
"ok_shadow_class_sort.js" = '''
const a=[1,2,3]; class Box { sort(){ return 7; } } function main(){ const a=new Box(); console.log(a.sort()); } main(); console.log(a[0]);
'''
"ok_shadow_class_push.js" = '''
const a=[1,2,3]; class Box { push(v){ return v+1; } } function main(){ const a=new Box(); console.log(a.push(4)); } main(); console.log(a[0]);
'''
"ok_class_push.js" = '''
class S { push(v){ return v+1; } } const s=new S(); console.log(s.push(1));
'''

[[case]]
name = "a_top_level_literal_push_passes_check"
rationale = """At `9dc751cf8` kali printed `3` at exit 0 where node v26.10.0 prints `4`. RE-PINNED 2026-10-08 by the growable-runtime-arrays project (docs/superpowers/specs/2026-10-07-growable-runtime-arrays-design.md, Task 13), measured at `417b58fb8` against node v26.10.0: `check` now ACCEPTS (exit 0) and the `run` twin prints node's `4`. The literal is a growable array (spec §3.1: a `push`, `pop` or index write makes an array-literal binding a source). Previously pinned as a refusal. Renamed 2026-10-08 (final review) from `a_top_level_literal_push_refuses_under_check`, which named the refusal it no longer asserts."""
args = ["check", "t_push.js"]
exit = "success"
stdout = "Checked 1 file(s)\n"

[[case]]
name = "a_top_level_literal_push_matches_node_under_run"
rationale = """At `9dc751cf8` kali printed `3` at exit 0 where node v26.10.0 prints `4`. RE-PINNED 2026-10-08 by the growable-runtime-arrays project (docs/superpowers/specs/2026-10-07-growable-runtime-arrays-design.md, Task 13), measured at `417b58fb8` against node v26.10.0: the program now RUNS and AGREES WITH NODE -- kali and node both print `4` (exit 0). The literal is a growable array (spec §3.1: a `push`, `pop` or index write makes an array-literal binding a source). Previously pinned as a refusal; no longer refused. Renamed 2026-10-08 (final review) from `a_top_level_literal_push_refuses_under_run`, which named the refusal it no longer asserts."""
args = ["run", "t_push.js"]
exit = "success"
stdout = "4\n"

[[case]]
name = "a_top_level_literal_pop_matches_node_under_run"
rationale = """At `9dc751cf8` kali printed `3` then `0` at exit 0 where node v26.10.0 prints `2` then `3`. RE-PINNED 2026-10-08 by the growable-runtime-arrays project (docs/superpowers/specs/2026-10-07-growable-runtime-arrays-design.md, Task 13), measured at `417b58fb8` against node v26.10.0: the program now RUNS and AGREES WITH NODE -- kali and node both print `2
3` (exit 0). The literal is a growable array (spec §3.1: a `push`, `pop` or index write makes an array-literal binding a source). Previously pinned as a refusal; no longer refused. Renamed 2026-10-08 (final review) from `a_top_level_literal_pop_refuses_under_run`, which named the refusal it no longer asserts."""
args = ["run", "t_pop.js"]
exit = "success"
stdout = "2\n3\n"

[[case]]
name = "a_top_level_literal_sort_refuses_under_run"
rationale = """At `9dc751cf8` kali printed `3` at exit 0 where node v26.10.0 prints `1`."""
args = ["run", "t_sort.js"]
exit = "failure"
stderr_contains = ["E5506", "calling `.sort()`", "${LIT}"]

