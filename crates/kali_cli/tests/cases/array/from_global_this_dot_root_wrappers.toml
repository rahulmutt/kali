# Migrated from tests/array_from_global_this_dot_root_wrappers.rs -- all 8
# #[test] functions, as 16 case blocks. Same structure and reasoning as
# from_bracketed_root_wrappers.toml (sibling [[case]] blocks, not
# [matrix]; the `browser_bundle_harness` step kind needed no format
# extension; this file's 8 #[test] fns never exercise the shared
# helpers' `json_output=true` branch, so the same three
# genuinely-verified extra JSON-output siblings are added --
# `json_run_browser_requested_js`, `json_test_browser_requested_js`,
# `json_build_bundle_js`). Like from_bracketed_root_wrappers.toml (and
# unlike from_fully_bracketed_single_quoted_wrappers.toml),
# `assert_standalone` here *does* branch on `command`, so `main.js` and
# `smoke.test.js` get distinct (`Kali.test`-wrapped vs not) bodies.

