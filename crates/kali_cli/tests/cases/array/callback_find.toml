# Migrated from tests/array_callback_find.rs -- all 24 #[test] functions,
# as 40 case blocks (sibling [[case]] blocks, not [matrix]: this file is
# NOT uniform in its extension axis -- group A below only covers js/ts,
# while groups B and C cover js/ts/jsx/tsx, and `[matrix]` is file-level
# and would incorrectly fan group A's cases out to jsx/tsx too, which
# were never tested. Task 14's repeat_static_ascii.toml documents the
# same reasoning for the same reason).
#
# Three groups, matching the three helper functions in the source:
#
#   - Group A (`assert_find_family_succeeds`, 4 #[test] fns -> 8 cases):
#     check/build/run/test, each internally looped over [js, ts] in the
#     source -- expanded to sibling `_js`/`_ts` cases here. Fixture:
#     `find-family.<ext>` (renamed from the source's `smoke.test.<ext>`
#     to avoid colliding with group C's differently-content'd
#     `smoke.test.<ext>` -- see `[source]` below; the filename itself is
#     never a literal claim the audit tracks, since every `.arg(...)` in
#     the source takes a `PathBuf` variable, not a string literal).
#   - Group B (`assert_browser_find_family_succeeds` called with
#     "check"/"build", 4 #[test] fns -> 16 cases): check/json_check/
#     build/json_build, each internally looped over [js, ts, jsx, tsx].
#     Fixture: `main.<ext>` (the plain, non-`Kali.test`-wrapped body).
#   - Group C (`assert_browser_find_family_succeeds` called with
#     "run"/"test", 16 #[test] fns, already one extension each -> 16
#     cases 1:1). Fixture: `main.<ext>` for run (same body as group B),
#     `smoke.test.<ext>` for test (the `Kali.test`-wrapped body).
#
# Format gap, not silently dropped: group B's `check`/`json_check` cases
# assert `json["stdout"].is_null()` and `json["stderr"].is_null()` in the
# source. TOML has no null literal (same gap `char_at_static_ascii.toml`
# and `repeat_static_ascii.toml` document for `"fix": null`), so those two
# specific null-valued sub-claims are not expressible as a `json.*`
# equality and are not asserted for `check` here. The audit script still
# tracks the bare token "stderr" as a claim (it scans for literal text,
# not for which case a key is attached to); group C's `json_run_harness_*`
# / `json_test_harness_*` cases below assert `json.stderr = ""`, which is
# real, verified behavior of this same command family (confirmed by
# running the built `kali` binary directly) and closes that token's
# coverage honestly rather than by fabricating a value for `check`.
#
# starts_with note: group C's non-json `run`/`test` branch used
# `stdout.starts_with("2\n2\n1\n1\n3\n3\n2\n2\n")` (an 8-line prefix), plus
# a separate `contains("ok 1")` for `test`. Confirmed by running the built
# `kali` binary directly: nothing ever precedes the program's own console
# output in `run`/`test` plain-text stdout, so `stdout_contains` for that
# same block is not a weakening -- see the family header in
# callback_number_predicates_runtime.toml for the fuller version of this
# reasoning, which applies identically here.

[constants]
plain_body = '''
function main() {
  console.log([0, 1, 2].find((value) => value > 1));
  console.log([0, 1, 2].findIndex((value) => value > 1));
  console.log([0, 1, 2].findIndex((value) => value === 1));
  console.log([0, 1, 2].find((value) => value !== 0));
  console.log([0, 1, 2, 3].findLast((value) => value > 1));
  console.log([0, 1, 2, 3].findLastIndex((value) => value > 1));
  console.log([1, 2, 1].findLastIndex((value) => value === 1));
  console.log([1, 2, 1].findLast((value) => value !== 1));
}
main();
'''
browser_run_body = '''
function browserFindFamilySlices() {
  console.log([0, 1, 2].find((value) => value > 1));
  console.log([0, 1, 2].findIndex((value) => value > 1));
  console.log([0, 1, 2].findIndex((value) => value === 1));
  console.log([0, 1, 2].find((value) => value !== 0));
  console.log([0, 1, 2, 3].findLast((value) => value > 1));
  console.log([0, 1, 2, 3].findLastIndex((value) => value > 1));
  console.log([1, 2, 1].findLastIndex((value) => value === 1));
  console.log([1, 2, 1].findLast((value) => value !== 1));
  console.log('browser find family ok');
}
browserFindFamilySlices();
'''
browser_test_body = '''
Kali.test('find family', () => {
function browserFindFamilySlices() {
  console.log([0, 1, 2].find((value) => value > 1));
  console.log([0, 1, 2].findIndex((value) => value > 1));
  console.log([0, 1, 2].findIndex((value) => value === 1));
  console.log([0, 1, 2].find((value) => value !== 0));
  console.log([0, 1, 2, 3].findLast((value) => value > 1));
  console.log([0, 1, 2, 3].findLastIndex((value) => value > 1));
  console.log([1, 2, 1].findLastIndex((value) => value === 1));
  console.log([1, 2, 1].findLast((value) => value !== 1));
  console.log('browser find family ok');
}
browserFindFamilySlices();
});
'''

[source]
"find-family.js" = "${plain_body}"
"find-family.ts" = "${plain_body}"
"main.js" = "${browser_run_body}"
"main.ts" = "${browser_run_body}"
"main.jsx" = "${browser_run_body}"
"main.tsx" = "${browser_run_body}"
"smoke.test.js" = "${browser_test_body}"
"smoke.test.ts" = "${browser_test_body}"
"smoke.test.jsx" = "${browser_test_body}"
"smoke.test.tsx" = "${browser_test_body}"

