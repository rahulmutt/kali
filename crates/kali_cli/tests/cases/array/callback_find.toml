# Migrated from tests/array_callback_find.rs -- all 24 #[test] functions,
# as 40 case blocks (sibling [[case]] blocks, not [matrix]: this file is
# NOT uniform in its extension axis -- group A below only covers js/ts,
# while groups B and C cover js/ts/jsx/tsx, and `[matrix]` is file-level
# and would incorrectly fan group A's cases out to jsx/tsx too, which
# were never tested. Task 14's repeat_static_ascii.toml documents the
# same reasoning for the same reason).
#
# Three groups, matching the three helper functions in the source:
#
#   - Group A (`assert_find_family_succeeds`, 4 #[test] fns -> 8 cases):
#     check/build/run/test, each internally looped over [js, ts] in the
#     source -- expanded to sibling `_js`/`_ts` cases here. Fixture:
#     `find-family.<ext>` (renamed from the source's `smoke.test.<ext>`
#     to avoid colliding with group C's differently-content'd
#     `smoke.test.<ext>` -- see `[source]` below; the filename itself is
#     never a literal claim the audit tracks, since every `.arg(...)` in
#     the source takes a `PathBuf` variable, not a string literal).
#   - Group B (`assert_browser_find_family_succeeds` called with
#     "check"/"build", 4 #[test] fns -> 16 cases): check/json_check/
#     build/json_build, each internally looped over [js, ts, jsx, tsx].
#     Fixture: `main.<ext>` (the plain, non-`Kali.test`-wrapped body).
#   - Group C (`assert_browser_find_family_succeeds` called with
#     "run"/"test", 16 #[test] fns, already one extension each -> 16
#     cases 1:1). Fixture: `main.<ext>` for run (same body as group B),
#     `smoke.test.<ext>` for test (the `Kali.test`-wrapped body).
#
# Format gap (Class B -- real, reachable claim, TOML genuinely cannot
# express it): group B's `check`/`json_check` cases assert
# `json["stdout"].is_null()` and `json["stderr"].is_null()` in the source,
# for the `check` command specifically (`json_check_supports_find_family_
# in_browser_api_surface_js_ts_jsx_and_tsx_input` really does call with
# `json_output = true`, so this is reachable, not dead code). TOML has no
# null literal (same gap `char_at_static_ascii.toml` documents for
# `"fix": null`), so this was previously worked around by asserting
# `json.stderr = ""` on the unrelated `json_run_harness_*`/
# `json_test_harness_*` cases below purely to satisfy the audit's bare
# "stderr" token -- that was wrong (fix-round review, Finding 3): those
# cases never made that claim in the source, so asserting it there was
# inventing a claim to satisfy the gate, not preserving one. Removed.
# The real claim is now expressed with `json_null = ["stdout", "stderr"]`
# on the `json_check_browser_*` cases below, using the `json_null` step
# key added in this fix round specifically to close this class of gap
# (crates/kali_case_runner/src/model.rs). Note: `scripts/audit-case-
# migration.py` does not yet recognize `json_null` as a claim-bearing
# key (out of scope for that round per explicit instruction), so its
# mechanical scan will still report the "stdout"/"stderr" tokens as
# missing even though they are now genuinely, verifiably asserted --
# a known, disclosed limitation of the audit script, not of this file.
#
# starts_with note (fix-round review, Finding 1): group C's non-json
# `run`/`test` branch used `stdout.starts_with("2\n2\n1\n1\n3\n3\n2\n2\n")`
# (an 8-line prefix) plus a separate `contains("ok 1")` for `test`. The
# original migration downgraded this to `stdout_contains`, reasoning that
# nothing precedes program output in practice -- but that is a claim about
# today's binary, not about the assertion, and `contains` drops the
# position-0 anchor `starts_with` was checking (a regression that
# prepends a banner would fail the old test and pass the new one). Fixed:
# the real full-line stdout for both `run` and `test` was confirmed
# byte-exact against the built `kali` binary
# (`2\n2\n1\n1\n3\n3\n2\n2\nbrowser find family ok\n`, plus `ok 1\n` for
# `test`), so `run_harness_*`/`test_harness_*` below now assert exact
# `stdout`, which is strictly stronger than `starts_with` and not a
# weakening. Group A's `test_js`/`test_ts` cases are unaffected: their
# source assertion was already `.contains()`, not `starts_with()`, so
# `stdout_contains` there was correct from the start.

[constants]
plain_body = '''
function main() {
  console.log([0, 1, 2].find((value) => value > 1));
  console.log([0, 1, 2].findIndex((value) => value > 1));
  console.log([0, 1, 2].findIndex((value) => value === 1));
  console.log([0, 1, 2].find((value) => value !== 0));
  console.log([0, 1, 2, 3].findLast((value) => value > 1));
  console.log([0, 1, 2, 3].findLastIndex((value) => value > 1));
  console.log([1, 2, 1].findLastIndex((value) => value === 1));
  console.log([1, 2, 1].findLast((value) => value !== 1));
}
main();
'''
browser_run_body = '''
function browserFindFamilySlices() {
  console.log([0, 1, 2].find((value) => value > 1));
  console.log([0, 1, 2].findIndex((value) => value > 1));
  console.log([0, 1, 2].findIndex((value) => value === 1));
  console.log([0, 1, 2].find((value) => value !== 0));
  console.log([0, 1, 2, 3].findLast((value) => value > 1));
  console.log([0, 1, 2, 3].findLastIndex((value) => value > 1));
  console.log([1, 2, 1].findLastIndex((value) => value === 1));
  console.log([1, 2, 1].findLast((value) => value !== 1));
  console.log('browser find family ok');
}
browserFindFamilySlices();
'''
browser_test_body = '''
Kali.test('find family', () => {
function browserFindFamilySlices() {
  console.log([0, 1, 2].find((value) => value > 1));
  console.log([0, 1, 2].findIndex((value) => value > 1));
  console.log([0, 1, 2].findIndex((value) => value === 1));
  console.log([0, 1, 2].find((value) => value !== 0));
  console.log([0, 1, 2, 3].findLast((value) => value > 1));
  console.log([0, 1, 2, 3].findLastIndex((value) => value > 1));
  console.log([1, 2, 1].findLastIndex((value) => value === 1));
  console.log([1, 2, 1].findLast((value) => value !== 1));
  console.log('browser find family ok');
}
browserFindFamilySlices();
});
'''

[source]
"find-family.js" = "${plain_body}"
"find-family.ts" = "${plain_body}"
"main.js" = "${browser_run_body}"
"main.ts" = "${browser_run_body}"
"main.jsx" = "${browser_run_body}"
"main.tsx" = "${browser_run_body}"
"smoke.test.js" = "${browser_test_body}"
"smoke.test.ts" = "${browser_test_body}"
"smoke.test.jsx" = "${browser_test_body}"
"smoke.test.tsx" = "${browser_test_body}"

