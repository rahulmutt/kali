main();
"""
"length_write_m.js" = """
const a = []; a.push(1); a.length = 0; console.log(a.length);
"""
"length_write.js" = """
function main() { const a = []; a.push(1); a.length = 0; console.log(a.length); }
main();
"""
"reverse_m.js" = """
const a = []; a.push(1); a.push(2); a.reverse(); console.log(a[0]);
"""
"reverse.js" = """
function main() { const a = []; a.push(1); a.push(2); a.reverse(); console.log(a[0]); }
main();
"""
"computed_push_m.js" = """
const a = []; a.push(1); a["push"](2); console.log(a.length);
"""
"computed_push.js" = """
function main() { const a = []; a.push(1); a["push"](2); console.log(a.length); }
