"""
"module_read.js" = """
const out = [];
out.push(1);
function size() { return out.length; }
console.log(size());
"""
"capture_m.js" = """
const o = []; o.push(1); const f = () => o.length; console.log(f());
"""
"capture.js" = """
function main() { const o = []; o.push(1); const f = () => o.length; console.log(f()); }
main();
"""
"for_of_push_m.js" = """
const a = []; a.push(1); for (const x of a) { if (x < 3) a.push(x + 1); } console.log(a.length);
"""
"for_of_push.js" = """
function main() { const a = []; a.push(1); for (const x of a) { if (x < 3) a.push(x + 1); } console.log(a.length); }
main();
"""
"for_of_alias_m.js" = """
const a = []; a.push(1); const b = a; for (const x of a) { if (x < 3) b.push(x + 1); } console.log(a.length);
"""
"for_of_alias.js" = """
function main() { const a = []; a.push(1); const b = a; for (const x of a) { if (x < 3) b.push(x + 1); } console.log(a.length); }
