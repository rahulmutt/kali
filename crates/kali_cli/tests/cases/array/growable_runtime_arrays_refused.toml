"""
"print_whole_m.js" = """
const a = []; a.push(1); console.log(a);
"""
"print_whole.js" = """
function main() { const a = []; a.push(1); console.log(a); }
main();
"""
"print_whole_multi_m.js" = """
const a = []; a.push(1); console.log("n", a);
"""
"print_whole_multi.js" = """
function main() { const a = []; a.push(1); console.log("n", a); }
main();
"""
"plain_use_m.js" = """
const a = []; a.push(1); console.log(typeof a);
"""
"plain_use.js" = """
function main() { const a = []; a.push(1); console.log(typeof a); }
main();
"""
"temporary.js" = """
function make() { const o = []; o.push(1); return o; }
console.log(make().pop());
"""
"temporary_f.js" = """
function make() { const o = []; o.push(1); return o; }
function main() { console.log(make().pop()); }
main();
"""

