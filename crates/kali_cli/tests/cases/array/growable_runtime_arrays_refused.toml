# Growable runtime arrays: shapes refused with E5506 in repr inference, so
# `check` and `run` agree (spec §1, §3.6). Task 11b: a closure or nested
# function at module scope that captures a binding a `for-of` over a growable
# array declares read `0` at run time while `check` exited 0. Each program is
# a module-scope repro; the function-scope form is already refused by `run`.
#
# Task 12: one refusal per spec §3.6 message (A-3..A-8, A-18), each under both
# `check` and `run` (exit 1, E5506 and the message on stderr), so the two are
# shown to agree. Every program has a module-scope twin and a `main()` twin
# except the module-read refusal, which is scope-intrinsic (inside `main` the
# same shape is a capture). node's stdout is in each `run` row's rationale.

[constants]
CAPTURE = "the closure or nested function at module scope captures `x`, which a `for-of` loop over a growable array declares"

[source]
"capture_f64_m.js" = """
const a = []; a.push(1.5); a.push(4);
for (const x of a) { const g = () => x; console.log(g()); }
"""
"capture_str_m.js" = """
const a = []; a.push("a"); a.push("b");
for (const x of a) { const g = () => x; console.log(g()); }
"""
"capture_nested_m.js" = """
const a = []; a.push(1); a.push(2);
for (const x of a) { for (const y of a) { const g = () => x * 10 + y; console.log(g()); } }
"""
"capture_call_m.js" = """
function build() { const o = []; o.push(7); o.push(8); return o; }
for (const x of build()) { const g = () => x; console.log(g()); }
"""
"capture_fn_decl_m.js" = """
const a = []; a.push(3); a.push(4);
function show(v) { console.log(v); }
for (const x of a) { function h() { return x + 1; } show(h()); }
"""

"mixed_param.js" = """
function total(a) { let s = 0; for (let i = 0; i < a.length; i++) s += a[i]; return s; }
const xs = []; xs.push(1);
const p = new Array(2); p[0] = 1; p[1] = 2;
console.log(total(xs), total(p));
"""
"mixed_param_f.js" = """
function total(a) { let s = 0; for (let i = 0; i < a.length; i++) s += a[i]; return s; }
function main() { const xs = []; xs.push(1); const p = new Array(2); p[0] = 1; p[1] = 2; console.log(total(xs), total(p)); }
main();
"""
"mixed_binding.js" = """
let a = new Array(3);
const b = []; b.push(1);
a = b;
console.log(a.length);
"""
"mixed_binding_f.js" = """
function main() { let a = new Array(3); const b = []; b.push(1); a = b; console.log(a.length); }
main();
"""
"mixed_conditional_m.js" = """
const c = true;
const xs = []; xs.push(1);
const ys = c ? xs : new Array(2);
console.log(ys.length);
"""
"mixed_conditional.js" = """
function f(c) { const xs = []; xs.push(1); const ys = c ? xs : new Array(2); return ys.length; }
console.log(f(true));
"""
"non_array_write.js" = """
const xs = []; xs.push(1);
let y = xs;
y = 5;
console.log(xs.length);
"""
"non_array_write_f.js" = """
