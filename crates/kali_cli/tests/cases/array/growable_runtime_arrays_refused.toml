"""
"for_of_call_m.js" = """
function add(arr, v) { arr.push(v); }
const a = []; a.push(1); for (const x of a) { if (x < 3) add(a, x + 1); } console.log(a.length);
"""
"for_of_call.js" = """
function add(arr, v) { arr.push(v); }
function main() { const a = []; a.push(1); for (const x of a) { if (x < 3) add(a, x + 1); } console.log(a.length); }
main();
"""
"from_index_m.js" = """
const a = []; a.push(1); a.push(1); console.log(a.indexOf(1, 1));
"""
"from_index.js" = """
