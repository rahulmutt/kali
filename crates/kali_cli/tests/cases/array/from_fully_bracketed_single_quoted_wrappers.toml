"app.jsx" = "${bundle_body}"
"app.tsx" = "${bundle_body}"

[[case]]
name = "run_standalone"
rationale = "Nullish/logical (`??`/`&&`/`||`) fully-bracketed single-quoted `globalThis['Array']['from']` wrappers resolve to the real `Array.from` and iterate a `Set`/`Map` correctly."
args = ["run", "main.js"]
exit = "success"
stdout_contains = ["1\n2\n1\n3\n4\n5\n"]

[[case]]
name = "test_standalone"
rationale = "Same wrappers run via `test` (no `Kali.test()` call in the fixture -- the whole file runs as one implicit test)."
args = ["test", "smoke.test.js"]
exit = "success"
stdout_contains = ["1\n2\n1\n3\n4\n5\n", "ok 1"]

