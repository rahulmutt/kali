# Migrated from tests/array_from_fully_bracketed_single_quoted_wrappers.rs
# -- all 8 #[test] functions, as 16 case blocks. Same structure and same
# reasoning as from_bracketed_root_wrappers.toml (sibling [[case]] blocks,
# not [matrix], for the same non-uniform-extension reason; the
# `browser_bundle_harness` step kind needed no format extension, for the
# same reason; and this file's 8 #[test] fns likewise never exercise the
# shared helpers' `json_output=true` branch, so the same three
# genuinely-verified extra JSON-output siblings are added here too --
# `json_run_browser_requested_js`, `json_test_browser_requested_js`,
# `json_build_bundle_js` -- see that file's header for the full
# reasoning).
#
# One structural difference from from_bracketed_root_wrappers.toml: this
# source's `assert_standalone` does NOT branch on `command` -- both `run`
# and `test` write the *same* un-wrapped `standalone_source()` body
# (`test` on a file with no `Kali.test()` call still runs as one implicit
# test, confirmed by running the built `kali` binary directly). So
# `main.js` and `smoke.test.js` share one `[constants]` body here, unlike
# the run/test split in from_bracketed_root_wrappers.toml.

[constants]
standalone_body = '''
const values = [1, 2, 1]; const mapValues = [[1, 2], [1, 3], [4, 5]]; const nullishFullyBracketedSingleQuotedArrayFrom = Object.freeze((null ?? globalThis['Array']['from'])); const andFullyBracketedSingleQuotedArrayFrom = Object.freeze((true && globalThis['Array']['from'])); const orFullyBracketedSingleQuotedArrayFrom = Object.freeze((false || globalThis['Array']['from'])); for (const value of nullishFullyBracketedSingleQuotedArrayFrom(new Set(values))) { console.log(value); } for (const value of andFullyBracketedSingleQuotedArrayFrom(new Set(values))) { console.log(value); } for (const value of orFullyBracketedSingleQuotedArrayFrom(new Set(values))) { console.log(value); } for (const entry of nullishFullyBracketedSingleQuotedArrayFrom(new Map(mapValues))) { console.log(entry[0]); console.log(entry[1]); } for (const entry of andFullyBracketedSingleQuotedArrayFrom(new Map(mapValues))) { console.log(entry[0]); console.log(entry[1]); } for (const entry of orFullyBracketedSingleQuotedArrayFrom(new Map(mapValues))) { console.log(entry[0]); console.log(entry[1]); }
'''
browser_run_body = '''
async function browserArrayFromFullyBracketedSingleQuotedWrappers() {
  const values = [1, 2, 1];
  const mapValues = [[1, 2], [1, 3], [4, 5]];
  const nullishFullyBracketedSingleQuotedArrayFrom = Object.freeze((null ?? globalThis['Array']['from']));
  const andFullyBracketedSingleQuotedArrayFrom = Object.freeze((true && globalThis['Array']['from']));
  const orFullyBracketedSingleQuotedArrayFrom = Object.freeze((false || globalThis['Array']['from']));
  for (const value of nullishFullyBracketedSingleQuotedArrayFrom(new Set(values))) {
    console.log(value);
  }
  for (const value of andFullyBracketedSingleQuotedArrayFrom(new Set(values))) {
    console.log(value);
  }
  for (const value of orFullyBracketedSingleQuotedArrayFrom(new Set(values))) {
    console.log(value);
  }
  for (const entry of nullishFullyBracketedSingleQuotedArrayFrom(new Map(mapValues))) {
    console.log(entry[0]);
    console.log(entry[1]);
  }
  for (const entry of andFullyBracketedSingleQuotedArrayFrom(new Map(mapValues))) {
    console.log(entry[0]);
    console.log(entry[1]);
  }
  for (const entry of orFullyBracketedSingleQuotedArrayFrom(new Map(mapValues))) {
    console.log(entry[0]);
    console.log(entry[1]);
  }
}

browserArrayFromFullyBracketedSingleQuotedWrappers();
'''
browser_test_body = '''
Kali.test('fully bracketed single-quoted Array.from wrappers', () => {
  async function browserArrayFromFullyBracketedSingleQuotedWrappers() {
    const values = [1, 2, 1];
    const mapValues = [[1, 2], [1, 3], [4, 5]];
    const nullishFullyBracketedSingleQuotedArrayFrom = Object.freeze((null ?? globalThis['Array']['from']));
    const andFullyBracketedSingleQuotedArrayFrom = Object.freeze((true && globalThis['Array']['from']));
    const orFullyBracketedSingleQuotedArrayFrom = Object.freeze((false || globalThis['Array']['from']));
    for (const value of nullishFullyBracketedSingleQuotedArrayFrom(new Set(values))) {
      console.log(value);
    }
    for (const value of andFullyBracketedSingleQuotedArrayFrom(new Set(values))) {
      console.log(value);
    }
    for (const value of orFullyBracketedSingleQuotedArrayFrom(new Set(values))) {
      console.log(value);
    }
    for (const entry of nullishFullyBracketedSingleQuotedArrayFrom(new Map(mapValues))) {
      console.log(entry[0]);
      console.log(entry[1]);
    }
    for (const entry of andFullyBracketedSingleQuotedArrayFrom(new Map(mapValues))) {
      console.log(entry[0]);
      console.log(entry[1]);
    }
    for (const entry of orFullyBracketedSingleQuotedArrayFrom(new Map(mapValues))) {
      console.log(entry[0]);
      console.log(entry[1]);
    }
  }

  return browserArrayFromFullyBracketedSingleQuotedWrappers();
});
'''
bundle_body = '''
// kali-tree-shake: browserArrayFromFullyBracketedSingleQuotedWrappers
export async function browserArrayFromFullyBracketedSingleQuotedWrappers() {
  const values = [1, 2, 1];
  const mapValues = [[1, 2], [1, 3], [4, 5]];
  const nullishFullyBracketedSingleQuotedArrayFrom = Object.freeze((null ?? globalThis['Array']['from']));
  const andFullyBracketedSingleQuotedArrayFrom = Object.freeze((true && globalThis['Array']['from']));
  const orFullyBracketedSingleQuotedArrayFrom = Object.freeze((false || globalThis['Array']['from']));
  for (const value of nullishFullyBracketedSingleQuotedArrayFrom(new Set(values))) {
    console.log(value);
  }
  for (const value of andFullyBracketedSingleQuotedArrayFrom(new Set(values))) {
    console.log(value);
  }
  for (const value of orFullyBracketedSingleQuotedArrayFrom(new Set(values))) {
    console.log(value);
  }
  for (const entry of nullishFullyBracketedSingleQuotedArrayFrom(new Map(mapValues))) {
    console.log(entry[0]);
    console.log(entry[1]);
  }
  for (const entry of andFullyBracketedSingleQuotedArrayFrom(new Map(mapValues))) {
    console.log(entry[0]);
    console.log(entry[1]);
  }
  for (const entry of orFullyBracketedSingleQuotedArrayFrom(new Map(mapValues))) {
    console.log(entry[0]);
    console.log(entry[1]);
  }
}
'''

[source]
