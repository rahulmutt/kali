[package]
name = "kali_cli"
version.workspace = true
edition.workspace = true
license.workspace = true
autobins = false

[[bin]]
name = "kali"
path = "src/bin/kali.rs"

[[test]]
name = "inprocess"
path = "tests/inprocess.rs"

[[test]]
name = "cases"
path = "tests/cases.rs"
harness = false

[dependencies]
clap = { workspace = true }
kali_common = { workspace = true }
kali_error = { workspace = true }
kali_lexer = { workspace = true }
kali_parser = { workspace = true }
kali_ast = { workspace = true }
kali_hir = { workspace = true }
kali_types = { workspace = true }
kali_mir = { workspace = true }
kali_lir = { workspace = true }
kali_codegen = { workspace = true }
kali_optimize = { workspace = true }
kali_fmt = { workspace = true }
kali_lint = { workspace = true }
kali_npm = { workspace = true }
kali_runtime = { workspace = true }
kali_sandbox = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
semver = { workspace = true }
sha2 = { workspace = true }
url = { workspace = true }
ignore = "0.4"
globset = "0.4"
wasm-encoder = { workspace = true }
wasmparser = { workspace = true }
wit-component = { workspace = true }
kali_capi = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
flate2 = { workspace = true }
kali_case_runner = { workspace = true }
kali_runtime_contract = { workspace = true }
tar = { workspace = true }
tempfile = { workspace = true }
tungstenite = { workspace = true, features = ["handshake"] }
